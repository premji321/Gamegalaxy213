<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030616">

<title>Alien Shooter - Space Battle</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #39f5ff;
    --blue: #247bff;
    --purple: #a855f7;
    --dark: #030616;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--dark);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

.game-wrapper {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 12px;
}

.header {
    text-align: center;
    padding: 12px 5px 18px;
}

.header h1 {
    font-size: clamp(25px, 5vw, 42px);
    color: var(--cyan);
    text-shadow: 0 0 20px #00d9ff;
    letter-spacing: 3px;
}

.header p {
    margin-top: 8px;
    color: #b7c9ed;
    font-size: 13px;
    letter-spacing: 2px;
}

.game-panel {
    background: linear-gradient(135deg, #0b1736, #060817);
    border: 1px solid #234b91;
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 0 35px #0066ff22;
}

.hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.hud-box {
    background: #07142b;
    border: 1px solid #244c86;
    border-radius: 9px;
    padding: 10px 5px;
    text-align: center;
    font-size: 12px;
}

.hud-box strong {
    display: block;
    margin-top: 5px;
    color: var(--cyan);
    font-size: 17px;
}

#gameCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 4;
    max-height: 720px;
    background: #020511;
    border: 1px solid #183d70;
    border-radius: 12px;
    touch-action: none;
}

.message {
    text-align: center;
    color: #c3d8ff;
    font-size: 13px;
    line-height: 1.7;
    margin: 12px 0;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 13px 8px;
    font-weight: bold;
    color: white;
    transition: transform .15s, filter .15s;
    touch-action: manipulation;
    user-select: none;
}

button:active {
    transform: scale(.95);
}

.btn-move {
    background: linear-gradient(135deg, #1456c7, #172d79);
    border: 1px solid #4387ff;
}

.btn-fire {
    background: linear-gradient(135deg, #fa315d, #b50d63);
    border: 1px solid #ff76a2;
}

.btn-start {
    background: linear-gradient(135deg, #00c9a7, #087caa);
    border: 1px solid #4dffe2;
}

.btn-pause {
    background: linear-gradient(135deg, #763df0, #3922a1);
    border: 1px solid #ad8bff;
}

.btn-restart {
    background: linear-gradient(135deg, #f08c27, #bd3e13);
    border: 1px solid #ffbd71;
}

.secondary-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 9px;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #8294bd;
    padding: 18px 5px;
}

@media (max-width: 500px) {
    .game-wrapper {
        padding: 7px;
    }

    .game-panel {
        padding: 8px;
    }

    .hud {
        gap: 4px;
    }

    .hud-box {
        padding: 8px 2px;
        font-size: 10px;
    }

    .hud-box strong {
        font-size: 15px;
    }

    button {
        padding: 13px 4px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="game-wrapper">

    <header class="header">
        <h1>👽 ALIEN SHOOTER</h1>
        <p>GALACTIC SPACE BATTLE • SURVIVE THE INVASION</p>
    </header>

    <main class="game-panel">

        <div class="hud">
            <div class="hud-box">
                ⭐ SCORE
                <strong id="score">0</strong>
            </div>

            <div class="hud-box">
                ❤️ LIVES
                <strong id="lives">3</strong>
            </div>

            <div class="hud-box">
                🚀 LEVEL
                <strong id="level">1</strong>
            </div>

            <div class="hud-box">
                🏆 BEST
                <strong id="best">0</strong>
            </div>
        </div>

        <canvas id="gameCanvas" width="480" height="640">
            Your browser does not support HTML5 Canvas.
        </canvas>

        <p class="message" id="message">
            Destroy the aliens and defend the galaxy!<br>
            Use ← → or A/D to move. Press SPACE to shoot.
        </p>

        <div class="controls">

            <button class="btn-move"
                    id="leftBtn"
                    aria-label="Move left">
                ◀ LEFT
            </button>

            <button class="btn-fire"
                    id="fireBtn">
                🔥 FIRE
            </button>

            <button class="btn-move"
                    id="rightBtn"
                    aria-label="Move right">
                RIGHT ▶
            </button>

        </div>

        <div class="secondary-controls">

            <button class="btn-start" id="startBtn">
                🚀 START GAME
            </button>

            <button class="btn-pause" id="pauseBtn">
                ⏸ PAUSE
            </button>

            <button class="btn-restart" id="restartBtn">
                🔄 RESTART
            </button>

            <button class="btn-start" id="soundBtn">
                🔊 SOUND: ON
            </button>

        </div>

    </main>

    <footer class="footer">
        ALIEN SHOOTER © 2026 | DEFEND THE GALAXY 🚀
    </footer>

</div>

<script>
"use strict";

/* ==========================================
   ALIEN SHOOTER
   Complete HTML5 Canvas Game
========================================== */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const levelElement = document.getElementById("level");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");

let score = 0;
let lives = 3;
let level = 1;
let best = 0;

try {
    best = Number(localStorage.getItem("alienShooterBest")) || 0;
} catch (e) {
    best = 0;
}

bestElement.textContent = best;

let running = false;
let gameOver = false;
let paused = false;
let soundOn = true;

let frame = 0;
let animationId = 0;

let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let stars = [];
let powerUps = [];

let enemyDirection = 1;
let enemySpeed = 0.55;
let enemyShootTimer = 0;
let playerInvincible = 0;
let rapidFireTimer = 0;
let shieldTimer = 0;
let fireCooldown = 0;

const keys = {
    left: false,
    right: false,
    fire: false
};

const player = {
    x: W / 2,
    y: H - 70,
    width: 34,
    height: 38,
    speed: 4.3
};

/* ==========================================
   AUDIO
========================================== */

let audioContext = null;

function playSound(frequency = 440, duration = 0.07, type = "sine") {
    if (!soundOn) return;

    try {
        if (!audioContext) {
            audioContext = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
            0.055,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(
            audioContext.currentTime + duration
        );
    } catch (e) {
        // The game still works if audio is unavailable.
    }
}

/* ==========================================
   BACKGROUND STARS
========================================== */

function createStars() {
    stars = [];

    for (let i = 0; i < 115; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            radius: Math.random() * 1.5 + 0.3,
            speed: Math.random() * 1.4 + 0.25,
            alpha: Math.random() * 0.7 + 0.3
        });
    }
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, W, H);

    gradient.addColorStop(0, "#030719");
    gradient.addColorStop(0.5, "#071638");
    gradient.addColorStop(1, "#020512");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Nebula clouds
    const nebula = ctx.createRadialGradient(
        95, 170, 5,
        95, 170, 190
    );

    nebula.addColorStop(0, "rgba(30,70,190,0.23)");
    nebula.addColorStop(1, "rgba(30,70,190,0)");

    ctx.fillStyle = nebula;
    ctx.fillRect(0, 0, W, H);

    const nebula2 = ctx.createRadialGradient(
        390, 390, 5,
        390, 390, 160
    );

    nebula2.addColorStop(0, "rgba(125,20,180,0.12)");
    nebula2.addColorStop(1, "rgba(125,20,180,0)");

    ctx.fillStyle = nebula2;
    ctx.fillRect(0, 0, W, H);

    for (const star of stars) {
        ctx.globalAlpha = star.alpha;

        ctx.fillStyle = "#d9f7ff";
        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.globalAlpha = 1;

        if (running && !paused) {
            star.y += star.speed;

            if (star.y > H) {
                star.y = 0;
                star.x = Math.random() * W;
            }
        }
    }

    // Distant planet
    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#386fff";

    const planet = ctx.createRadialGradient(
        370, 95, 3,
        370, 95, 42
    );

    planet.addColorStop(0, "#8db9ff");
    planet.addColorStop(0.4, "#3456a3");
    planet.addColorStop(1, "#080d2c");

    ctx.fillStyle = planet;

    ctx.beginPath();
    ctx.arc(370, 95, 42, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

/* ==========================================
   PLAYER SPACESHIP
========================================== */

function drawPlayer() {
    if (playerInvincible > 0 && frame % 8 < 4) {
        return;
    }

    ctx.save();

    ctx.translate(player.x, player.y);

    // Engine glow
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00c8ff";

    ctx.fillStyle = "#11bfff";

    ctx.beginPath();
    ctx.moveTo(-8, 13);
    ctx.lineTo(0, 29 + Math.random() * 8);
    ctx.lineTo(8, 13);
    ctx.closePath();
    ctx.fill();

    // Main wings
    ctx.shadowBlur = 12;

    ctx.fillStyle = "#d9f5ff";
    ctx.strokeStyle = "#38d9ff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(24, 17);
    ctx.lineTo(9, 12);
    ctx.lineTo(0, 19);
    ctx.lineTo(-9, 12);
    ctx.lineTo(-24, 17);
    ctx.closePath();

    ctx.fill();
    ctx.stroke();

    // Red wing details
    ctx.fillStyle = "#ff416c";

    ctx.beginPath();
    ctx.moveTo(-18, 12);
    ctx.lineTo(-9, -1);
    ctx.lineTo(-10, 12);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(18, 12);
    ctx.lineTo(9, -1);
    ctx.lineTo(10, 12);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = "#168aff";

    ctx.beginPath();
    ctx.ellipse(0, -6, 5.5, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#bafaff";

    ctx.beginPath();
    ctx.ellipse(-1, -9, 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Shield
    if (shieldTimer > 0) {
        ctx.strokeStyle = "#38f5ff";
        ctx.lineWidth = 2.5;
        ctx.shadowColor = "#38f5ff";
        ctx.shadowBlur = 20;

        ctx.beginPath();
        ctx.ellipse(0, 0, 32, 35, 0, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}

/* ==========================================
   ENEMIES
========================================== */

function createEnemies() {
    enemies = [];

    const columns = Math.min(8, 4 + level);
    const rows = Math.min(5, 2 + Math.ceil(level / 2));

    const spacingX = 43;
    const spacingY = 42;

    const totalWidth = (columns - 1) * spacingX;

    const startX = (W - totalWidth) / 2;

    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {

            const type = row === 0 ? 2 : row === 1 ? 1 : 0;

            enemies.push({
                x: startX + col * spacingX,
                y: 80 + row * spacingY,
                width: 27,
                height: 25,
                type: type,
                hp: type === 2 ? 2 : 1,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    enemySpeed = 0.45 + level * 0.12;
    enemyDirection = 1;
}

function drawEnemy(enemy) {
    ctx.save();

    ctx.translate(
        enemy.x,
        enemy.y + Math.sin(frame * 0.06 + enemy.phase) * 3
    );

    const colors = [
        "#53ff9d",
        "#45c8ff",
        "#ff4e87"
    ];

    const color = colors[enemy.type];

    ctx.shadowBlur = 14;
    ctx.shadowColor = color;

    // Alien body
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    // Antennae
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(-7, -7);
    ctx.lineTo(-11, -14);

    ctx.moveTo(7, -7);
    ctx.lineTo(11, -14);

    ctx.stroke();

    // Eyes
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#07111e";

    ctx.beginPath();
    ctx.ellipse(-5, -1, 3, 4, -0.2, 0, Math.PI * 2);
    ctx.ellipse(5, -1, 3, 4, 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(-5, -3, 1.5, 2);
    ctx.fillRect(4, -3, 1.5, 2);

    // Legs
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(-8, 8);
    ctx.lineTo(-12, 13);

    ctx.moveTo(0, 9);
    ctx.lineTo(0, 14);

    ctx.moveTo(8, 8);
    ctx.lineTo(12, 13);

    ctx.stroke();

    ctx.restore();
}

/* ==========================================
   LASER BULLETS
========================================== */

function shoot() {
    if (!running || paused || gameOver) return;
    if (fireCooldown > 0) return;

    bullets.push({
        x: player.x,
        y: player.y - 22,
        speed: 9,
        damage: 1
    });

    if (rapidFireTimer > 0) {
        bullets.push({
            x: player.x - 12,
            y: player.y - 15,
            speed: 9,
            damage: 1
        });

        bullets.push({
            x: player.x + 12,
            y: player.y - 15,
            speed: 9,
            damage: 1
        });
    }

    fireCooldown = rapidFireTimer > 0 ? 7 : 13;

    playSound(760, 0.045, "square");
}

function drawBullets() {
    for (const bullet of bullets) {
        ctx.save();

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#20efff";

        ctx.fillStyle = "#b9ffff";

        ctx.fillRect(
            bullet.x - 2,
            bullet.y - 10,
            4,
            15
        );

        ctx.fillStyle = "#15aaff";

        ctx.fillRect(
            bullet.x - 4,
            bullet.y - 4,
            8,
            7
        );

        ctx.restore();
    }

    for (const bullet of enemyBullets) {
        ctx.save();

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ff3268";

        ctx.fillStyle = "#ff315f";

        ctx.beginPath();
        ctx.ellipse(
            bullet.x,
            bullet.y,
            3,
            7,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}

/* ==========================================
   PARTICLE EXPLOSIONS
========================================== */

function createExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.8 + 0.5;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 25 + Math.random() * 20,
            maxLife: 45,
            radius: Math.random() * 3 + 1,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life--;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();

        ctx.globalAlpha = Math.max(
            0,
            p.life / p.maxLife
        );

        ctx.fillStyle = p.color;

        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

/* ==========================================
   POWER-UPS
========================================== */

function maybeDropPowerUp(x, y) {
    if (Math.random() > 0.14) return;

    const types = ["rapid", "life", "shield"];

    powerUps.push({
        x: x,
        y: y,
        type: types[Math.floor(Math.random() * types.length)],
        speed: 1.5,
        radius: 11
    });
}

function drawPowerUps() {
    for (const p of powerUps) {
        ctx.save();

        ctx.shadowBlur = 16;

        let color = "#ffdb45";
        let symbol = "⚡";

        if (p.type === "life") {
            color = "#ff4b74";
            symbol = "+";
        }

        if (p.type === "shield") {
            color = "#36e7ff";
            symbol = "◆";
        }

        ctx.shadowColor = color;
        ctx.fillStyle = color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "#071326";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(symbol, p.x, p.y + 1);

        ctx.restore();
    }
}

/* ==========================================
   HUD
========================================== */

function updateHUD() {
    scoreElement.textContent = score;
    livesElement.textContent = lives;
    levelElement.textContent = level;
    bestElement.textContent = best;
}

function addScore(points) {
    score += points;

    if (score > best) {
        best = score;

        try {
            localStorage.setItem(
                "alienShooterBest",
                String(best)
            );
        } catch (e) {
            // Local storage may be unavailable.
        }
    }

    updateHUD();
}

/* ==========================================
   COLLISION DETECTION
========================================== */

function collides(a, b, padding = 0) {
    return (
        Math.abs(a.x - b.x) <
            ((a.width || 0) + (b.width || 0)) / 2 + padding &&
        Math.abs(a.y - b.y) <
            ((a.height || 0) + (b.height || 0)) / 2 + padding
    );
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.y -= bullet.speed;

        if (bullet.y < -20) {
            bullets.splice(i, 1);
            continue;
        }

        let hit = false;

        for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];

            if (
                Math.abs(bullet.x - enemy.x) < 15 &&
                Math.abs(bullet.y - enemy.y) < 15
            ) {
                enemy.hp -= bullet.damage;

                bullets.splice(i, 1);
                hit = true;

                createExplosion(
                    bullet.x,
                    bullet.y,
                    "#38f5ff",
                    4
                );

                if (enemy.hp <= 0) {
                    createExplosion(
                        enemy.x,
                        enemy.y,
                        enemy.type === 2 ? "#ff4e87" : "#56ffb0",
                        18
                    );

                    maybeDropPowerUp(enemy.x, enemy.y);

                    enemies.splice(j, 1);

                    addScore(
                        enemy.type === 2 ? 30 :
                        enemy.type === 1 ? 20 : 10
                    );

                    playSound(210, 0.12, "triangle");
                }

                break;
            }
        }

        if (hit) continue;
    }
}

function updateEnemyBullets() {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];

        bullet.y += bullet.speed;

        if (bullet.y > H + 20) {
            enemyBullets.splice(i, 1);
            continue;
        }

        if (
            Math.abs(bullet.x - player.x) < 20 &&
            Math.abs(bullet.y - player.y) < 22
        ) {
            enemyBullets.splice(i, 1);

            damagePlayer();
        }
    }
}

function updatePowerUps() {
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];

        p.y += p.speed;

        if (p.y > H + 20) {
            powerUps.splice(i, 1);
            continue;
        }

        if (
            Math.abs(p.x - player.x) < 28 &&
            Math.abs(p.y - player.y) < 30
        ) {
            if (p.type === "rapid") {
                rapidFireTimer = 600;
                messageElement.textContent =
                    "⚡ RAPID FIRE ACTIVATED!";
            }

            if (p.type === "shield") {
                shieldTimer = 500;
                messageElement.textContent =
                    "🛡️ SHIELD ACTIVATED!";
            }

            if (p.type === "life") {
                lives = Math.min(5, lives + 1);
                messageElement.textContent =
                    "❤️ EXTRA LIFE COLLECTED!";
            }

            playSound(950, 0.2, "sine");

            powerUps.splice(i, 1);

            updateHUD();
        }
    }
}

/* ==========================================
   PLAYER DAMAGE
========================================== */

function damagePlayer() {
    if (playerInvincible > 0) return;

    if (shieldTimer > 0) {
        shieldTimer = 0;

        createExplosion(
            player.x,
            player.y,
            "#36e7ff",
            18
        );

        playSound(320, 0.15, "triangle");
        return;
    }

    lives--;

    playerInvincible = 100;

    createExplosion(
        player.x,
        player.y,
        "#ff436e",
        25
    );

    playSound(100, 0.3, "sawtooth");

    updateHUD();

    if (lives <= 0) {
        endGame();
    } else {
        messageElement.textContent =
            "⚠️ YOUR SHIP WAS HIT! Keep fighting!";
    }
}

/* ==========================================
   ENEMY MOVEMENT AND ATTACK
========================================== */

function updateEnemies() {
    if (enemies.length === 0) {
        level++;

        bullets = [];
        enemyBullets = [];
        powerUps = [];

        createEnemies();

        messageElement.textContent =
            "🌟 LEVEL " + level + " — THE ALIENS ARE GETTING STRONGER!";

        playSound(600, 0.25, "sine");

        updateHUD();

        return;
    }

    let reachedEdge = false;

    for (const enemy of enemies) {
        enemy.x += enemySpeed * enemyDirection;

        if (enemy.x > W - 22 || enemy.x < 22) {
            reachedEdge = true;
        }

        // Aliens reaching the bottom threaten the player.
        if (enemy.y > player.y - 45) {
            endGame();
            return;
        }
    }

    if (reachedEdge) {
        enemyDirection *= -1;

        for (const enemy of enemies) {
            enemy.y += 10;
        }
    }

    enemyShootTimer++;

    const shootInterval = Math.max(
        22,
        80 - level * 5
    );

    if (enemyShootTimer >= shootInterval) {
        enemyShootTimer = 0;

        const shooter = enemies[
            Math.floor(Math.random() * enemies.length)
        ];

        if (shooter) {
            enemyBullets.push({
                x: shooter.x,
                y: shooter.y + 15,
                speed: 2.4 + level * 0.22,
                width: 6,
                height: 12
            });
        }
    }
}

/* ==========================================
   GAME UPDATE
========================================== */

function update() {
    if (!running || paused || gameOver) return;

    frame++;

    if (playerInvincible > 0) playerInvincible--;
    if (rapidFireTimer > 0) rapidFireTimer--;
    if (shieldTimer > 0) shieldTimer--;
    if (fireCooldown > 0) fireCooldown--;

    if (keys.left) {
        player.x -= player.speed;
    }

    if (keys.right) {
        player.x += player.speed;
    }

    player.x = Math.max(
        25,
        Math.min(W - 25, player.x)
    );

    if (keys.fire) {
        shoot();
    }

    updateEnemies();
    updateBullets();
    updateEnemyBullets();
    updatePowerUps();
    updateParticles();

    if (gameOver) return;
}

/* ==========================================
   DRAWING
========================================== */

function drawOverlay(title, subtitle, color = "#39f5ff") {
    ctx.save();

    ctx.fillStyle = "rgba(0, 3, 15, 0.78)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";

    ctx.shadowBlur = 22;
    ctx.shadowColor = color;

    ctx.fillStyle = color;
    ctx.font = "bold 31px Arial";

    ctx.fillText(title, W / 2, H / 2 - 25);

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ffffff";
    ctx.font = "15px Arial";

    ctx.fillText(subtitle, W / 2, H / 2 + 12);

    ctx.restore();
}

function draw() {
    drawBackground();

    for (const enemy of enemies) {
        drawEnemy(enemy);
    }

    drawBullets();
    drawPowerUps();
    drawParticles();
    drawPlayer();

    if (!running && !gameOver) {
        drawOverlay(
            "ALIEN SHOOTER",
            "Press START GAME to begin"
        );
    }

    if (paused && !gameOver) {
        drawOverlay(
            "GAME PAUSED",
            "Press RESUME to continue",
            "#d3a5ff"
        );
    }

    if (gameOver) {
        drawOverlay(
            "GAME OVER",
            "Final Score: " + score,
            "#ff477e"
        );
    }
}

function gameLoop() {
    update();
    draw();

    animationId = requestAnimationFrame(gameLoop);
}

/* ==========================================
   GAME START / PAUSE / RESTART
========================================== */

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;

    frame = 0;

    running = true;
    paused = false;
    gameOver = false;

    bullets = [];
    enemyBullets = [];
    particles = [];
    powerUps = [];

    player.x = W / 2;
    player.y = H - 70;

    playerInvincible = 0;
    rapidFireTimer = 0;
    shieldTimer = 0;
    fireCooldown = 0;
    enemyShootTimer = 0;

    messageElement.textContent =
        "Destroy the aliens! Collect ⚡ rapid fire, 🛡️ shields and + extra lives.";

    createStars();
    createEnemies();

    updateHUD();

    playSound(520, 0.15, "sine");
}

function endGame() {
    if (gameOver) return;

    gameOver = true;
    running = false;
    paused = false;

    updateHUD();

    messageElement.textContent =
        "Game over! Final score: " + score +
        ". Press RESTART to try again.";

    playSound(90, 0.45, "sawtooth");
}

function togglePause() {
    if (gameOver || !running) return;

    paused = !paused;

    document.getElementById("pauseBtn").textContent =
        paused ? "▶ RESUME" : "⏸ PAUSE";

    messageElement.textContent = paused
        ? "Game paused. Press RESUME to continue."
        : "Destroy the aliens and defend the galaxy!";
}

/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    if (
        ["arrowleft", "arrowright", " ", "arrowup", "arrowdown"]
        .includes(key)
    ) {
        e.preventDefault();
    }

    if (key === "arrowleft" || key === "a") {
        keys.left = true;
    }

    if (key === "arrowright" || key === "d") {
        keys.right = true;
    }

    if (key === " " || key === "arrowup") {
        keys.fire = true;
    }

    if (
        (key === "p" || key === "escape") &&
        !e.repeat
    ) {
        togglePause();
    }

    if (key === "enter" && !running && !gameOver) {
        resetGame();
    }

    if (key === "enter" && gameOver) {
        resetGame();
    }
});

document.addEventListener("keyup", function(e) {
    const key = e.key.toLowerCase();

    if (key === "arrowleft" || key === "a") {
        keys.left = false;
    }

    if (key === "arrowright" || key === "d") {
        keys.right = false;
    }

    if (key === " " || key === "arrowup") {
        keys.fire = false;
    }
});

window.addEventListener("blur", function() {
    keys.left = false;
    keys.right = false;
    keys.fire = false;
});

/* ==========================================
   MOBILE BUTTON CONTROLS
========================================== */

function bindHoldButton(buttonId, keyName) {
    const button = document.getElementById(buttonId);

    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();

        keys[keyName] = true;

        try {
            button.setPointerCapture(e.pointerId);
        } catch (err) {}
    });

    function release() {
        keys[keyName] = false;
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
    button.addEventListener("contextmenu", e => e.preventDefault());
}

bindHoldButton("leftBtn", "left");
bindHoldButton("rightBtn", "right");
bindHoldButton("fireBtn", "fire");

/* ==========================================
   TOUCH / DRAG CONTROL
========================================== */

let dragging = false;

canvas.addEventListener("pointerdown", function(e) {
    if (!running || paused || gameOver) return;

    dragging = true;

    canvas.setPointerCapture(e.pointerId);

    movePlayerToPointer(e);

    keys.fire = true;
});

canvas.addEventListener("pointermove", function(e) {
    if (!dragging) return;

    movePlayerToPointer(e);
});

function movePlayerToPointer(e) {
    const rect = canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) / rect.width * W;

    player.x = Math.max(
        25,
        Math.min(W - 25, x)
    );
}

function stopDragging() {
    dragging = false;
    keys.fire = false;
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);
canvas.addEventListener("lostpointercapture", stopDragging);

/* ==========================================
   BUTTON EVENTS
========================================== */

document.getElementById("startBtn").addEventListener(
    "click",
    function() {
        if (gameOver) {
            resetGame();
        } else if (!running) {
            resetGame();
        } else if (paused) {
            togglePause();
        }
    }
);

document.getElementById("pauseBtn").addEventListener(
    "click",
    togglePause
);

document.getElementById("restartBtn").addEventListener(
    "click",
    resetGame
);

document.getElementById("soundBtn").addEventListener(
    "click",
    function() {
        soundOn = !soundOn;

        this.textContent = soundOn
            ? "🔊 SOUND: ON"
            : "🔇 SOUND: OFF";

        if (soundOn) {
            playSound(600, 0.12);
        }
    }
);

/* ==========================================
   INITIALIZE
========================================== */

createStars();
createEnemies();
updateHUD();
draw();

gameLoop();

</script>

</body>
</html>
