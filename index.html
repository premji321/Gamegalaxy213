<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b3d">
<title>MCQ QUIZ PRO | Smart Test Generator</title>

<style>
:root{
    --navy:#101b3d;
    --navy2:#1b2d5a;
    --blue:#315efb;
    --cyan:#16c7e8;
    --green:#13a66b;
    --red:#e5484d;
    --orange:#f59e0b;
    --bg:#f3f6fc;
    --card:#fff;
    --text:#17213b;
    --muted:#718096;
    --border:#e2e8f0;
    --shadow:0 12px 35px rgba(16,27,61,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}

.topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(120deg,var(--navy),var(--navy2));
    color:white;padding:12px 18px;
    box-shadow:0 4px 18px #101b3d20
}
.topbar-inner{
    max-width:1250px;margin:auto;display:flex;
    justify-content:space-between;align-items:center;gap:12px
}
.brand{display:flex;align-items:center;gap:11px}
.brand-icon{
    width:43px;height:43px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--blue),var(--cyan));
    border-radius:13px;font-size:24px
}
.brand h1{font-size:19px}
.brand p{font-size:11px;color:#cbd8ff;margin-top:4px}
.top-controls{display:flex;align-items:center;gap:10px}
.global-language{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:bold;
    background:#ffffff12;border:1px solid #ffffff35;
    border-radius:10px;padding:6px 8px
}
.global-language select{
    width:auto;min-width:105px;padding:8px 10px;
    border:0;border-radius:7px;color:#17213b;
    background:white;font-size:12px
}
.status{
    font-size:11px;padding:8px 11px;border-radius:30px;
    background:#ffffff18;border:1px solid #ffffff30;white-space:nowrap
}
.container{max-width:1250px;margin:24px auto;padding:0 16px 35px}
.hero{
    background:linear-gradient(120deg,#142450,#315efb);
    color:white;border-radius:22px;padding:30px;margin-bottom:23px;overflow:hidden
}
.hero h2{font-size:clamp(24px,4vw,35px);margin-bottom:12px}
.hero p{max-width:800px;color:#e0e8ff;font-size:13px;line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}
.stat{padding:17px;background:white;border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow)}
.stat .icon{font-size:22px;margin-bottom:8px}
.stat strong{display:block;font-size:23px;margin-bottom:5px}
.stat span{color:var(--muted);font-size:12px}
.card{background:white;border:1px solid var(--border);border-radius:17px;padding:22px;margin-bottom:19px;box-shadow:var(--shadow);min-width:0}
.section-title{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:10px}
.section-number{width:34px;height:34px;border-radius:10px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.description{color:var(--muted);font-size:12px;line-height:1.9;margin-bottom:17px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}
.mode-card{background:white;padding:25px;border:2px solid var(--border);border-radius:20px;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.mode-card:hover{border-color:var(--blue);transform:translateY(-3px)}
.mode-icon{width:65px;height:65px;display:grid;place-items:center;font-size:33px;background:#edf2ff;border-radius:17px;margin-bottom:16px}
.mode-card h3{font-size:22px;margin-bottom:10px}
.mode-card p{color:var(--muted);font-size:13px;line-height:1.9;margin-bottom:17px}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.tags span{padding:7px 10px;border-radius:30px;background:#f0f3f9;font-size:11px}
.primary-btn{width:100%;padding:14px;border-radius:11px;background:linear-gradient(120deg,var(--blue),#2346d6);color:white;font-weight:bold}
.green-btn{background:linear-gradient(120deg,#13a66b,#08794a)}
.secondary-btn{background:#edf2ff;color:#2448d8;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:bold}
.back-btn{padding:10px 13px;background:#e7ecf6;color:#35415a;border-radius:9px;font-size:12px;font-weight:bold;margin-bottom:15px}
.form-group{margin-bottom:20px}
.form-group>label,.field-label{display:block;font-size:13px;font-weight:bold;margin-bottom:9px}
select{width:100%;padding:13px;border:1px solid #d8dfeb;border-radius:10px;background:white;color:var(--text);outline:none}
select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315efb14}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px;align-items:start}
.sidebar{background:white;border:1px solid var(--border);border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.sidebar h3{font-size:14px;margin-bottom:13px}
.sidebar-item{font-size:12px;color:#59657b;padding:10px 0;border-bottom:1px solid var(--border);line-height:1.7}
.sidebar-item:last-child{border-bottom:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar strong{font-size:13px}
.toolbar-buttons{display:flex;gap:7px;flex-wrap:wrap}
.small-btn{padding:8px 10px;background:white;border:1px solid var(--border);border-radius:8px;font-size:11px}
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check-card{display:flex;align-items:flex-start;gap:9px;padding:13px 11px;border:1px solid var(--border);border-radius:11px;cursor:pointer;font-size:12px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.check-card:has(input:checked){background:#edf2ff;border-color:var(--blue)}
.check-card input,.chapter-check input,.difficulty-card input{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;margin-top:2px}
.subject-info{min-width:0}
.subject-count{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.chapter-subject{padding:15px;border:1px solid var(--border);border-radius:12px;margin-bottom:13px}
.chapter-heading{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px;font-size:13px}
.chapter-heading span{color:var(--muted);font-size:11px;font-weight:normal}
.chapter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chapter-check{display:flex;align-items:flex-start;gap:9px;padding:11px;border:1px solid #e5eaf3;border-radius:9px;cursor:pointer;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
.chapter-check:has(input:checked){background:#edf2ff;border-color:var(--blue)}
.empty-state{grid-column:1/-1;padding:23px 13px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:11px;font-size:12px;line-height:1.9}
.difficulty-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.difficulty-card{display:flex;align-items:flex-start;gap:8px;padding:14px 10px;border:1px solid var(--border);border-radius:11px;cursor:pointer;min-width:0}
.difficulty-card:has(input:checked){background:#edf2ff;border-color:var(--blue)}
.difficulty-card strong{display:block;font-size:12px}
.difficulty-card small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.5}
.info-box{padding:13px;background:#fff8e7;border:1px solid #f5dfa1;color:#875d05;font-size:12px;line-height:1.9;border-radius:10px;margin-bottom:15px}
.success-box{padding:12px;background:#e8f9ef;border:1px solid #c2eed4;color:#08794a;font-size:12px;line-height:1.8;border-radius:10px;margin-bottom:14px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:17px}
.badge{background:#edf2ff;color:var(--blue);padding:8px 11px;border-radius:8px;font-size:11px;font-weight:bold}
.timer{background:#fff0f0;color:#c52c37;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:bold}
.progress-track{height:7px;background:#e9edf5;border-radius:10px;overflow:hidden;margin-bottom:22px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.question-text{font-size:18px;line-height:1.9;margin:17px 0 21px;overflow-wrap:anywhere}
.question-meta{font-size:11px;color:var(--muted);line-height:1.8}
.options{display:grid;gap:11px}
.option{display:flex;align-items:flex-start;gap:11px;padding:14px;border:1px solid var(--border);border-radius:11px;cursor:pointer;font-size:13px;line-height:1.8}
.option.selected{background:#edf2ff;border-color:var(--blue)}
.option-letter{width:27px;height:27px;border-radius:7px;background:#edf0f7;display:grid;place-items:center;font-weight:bold;font-size:11px;flex-shrink:0}
.option.selected .option-letter{background:var(--blue);color:white}
.quiz-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}
.quiz-actions button{flex:1;min-width:100px;padding:12px 10px;border-radius:9px;font-size:11px;font-weight:bold}
.btn-light{background:#edf0f7;color:#35415a}.btn-blue{background:var(--blue);color:white}.btn-green{background:var(--green);color:white}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.palette button{aspect-ratio:1;border-radius:7px;background:#edf0f7;color:#526078;font-size:11px;font-weight:bold}
.palette button.answered{background:#d8f7e8;color:#08794a}
.palette button.current{outline:2px solid var(--blue);background:#edf2ff;color:var(--blue)}
.palette button.review{background:#fff0ce;color:#9b6600}
.ex
