<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7719aa">

<title>OneNote Pro — Smart Notes</title>

<style>
:root {
    --primary: #7719aa;
    --primary-light: #f2e8fa;
    --sidebar: #f7f6f9;
    --surface: #ffffff;
    --surface2: #f5f5f7;
    --text: #25232b;
    --muted: #777481;
    --border: #e6e3eb;
    --hover: #eeeaf3;
    --shadow: 0 4px 18px rgba(0,0,0,.06);
}

body.dark {
    --primary: #bd82e8;
    --primary-light: #382447;
    --sidebar: #1e1d23;
    --surface: #29272f;
    --surface2: #323039;
    --text: #f2eff7;
    --muted: #b4afbf;
    --border: #45414d;
    --hover: #3a3742;
    --shadow: 0 4px 18px rgba(0,0,0,.2);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
}

button, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP HEADER */

.topbar {
    height: 58px;
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 5;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 220px;
    font-size: 19px;
    font-weight: 700;
    color: var(--primary);
}

.logo {
    background: var(--primary);
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-weight: 800;
}

.searchbox {
    flex: 1;
    max-width: 540px;
    position: relative;
}

.searchbox input {
    width: 100%;
    height: 36px;
    padding: 0 14px 0 38px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    outline: none;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 9px;
    color: var(--muted);
}

.top-actions {
    display: flex;
    gap: 7px;
    margin-left: auto;
}

.icon-btn {
    border: none;
    background: transparent;
    color: var(--text);
    border-radius: 7px;
    padding: 9px 11px;
}

.icon-btn:hover {
    background: var(--hover);
}

.primary-btn {
    border: none;
    background: var(--primary);
    color: white;
    padding: 9px 13px;
    border-radius: 7px;
    font-weight: 600;
}

.primary-btn:hover {
    filter: brightness(1.1);
}

/* MAIN LAYOUT */

.workspace {
    display: flex;
    flex: 1;
    min-height: 0;
}

.sidebar {
    width: 250px;
    min-width: 210px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-heading {
    padding: 20px 16px 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 10px;
    border-radius: 6px;
    margin-bottom: 3px;
    cursor: pointer;
    color: var(--text);
    min-width: 0;
}

.nav-item:hover {
    background: var(--hover);
}

.nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
}

.nav-item .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nav-item .more {
    opacity: 0;
    border: none;
    background: transparent;
    color: var(--muted);
}

.nav-item:hover .more {
    opacity: 1;
}

.sidebar-footer {
    padding: 13px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}

/* SECTION PANEL */

.section-panel {
    width: 235px;
    min-width: 195px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
}

.panel-title {
    padding: 20px 14px 12px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.section-list {
    overflow-y: auto;
    padding: 4px 9px;
    flex: 1;
}

.section-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
}

.section-item:hover {
    background: var(--hover);
}

.section-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
}

.section-color {
    height: 9px;
    width: 9px;
    border-radius: 3px;
    flex-shrink: 0;
}

.section-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* PAGE PANEL */

.page-panel {
    width: 260px;
    min-width: 220px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
}

.page-list {
    flex: 1;
    overflow-y: auto;
    padding: 5px 10px;
}

.page-card {
    padding: 13px 12px;
    border: 1px solid transparent;
    border-radius: 7px;
    margin-bottom: 7px;
    cursor: pointer;
}

.page-card:hover {
    background: var(--hover);
}

.page-card.active {
    background: var(--primary-light);
    border-color: var(--primary);
}

.page-card-title {
    font-weight: 650;
    font-size: 14px;
    margin-bottom: 6px;
    overflow-wrap: anywhere;
}

.page-preview {
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    max-height: 35px;
    overflow: hidden;
}

.page-date {
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
}

/* EDITOR */

.editor-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
}

.editor-top {
    height: 51px;
    min-height: 51px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
}

.breadcrumb {
    color: var(--muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.save-status {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
}

.editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 60px;
}

.editor-container {
    max-width: 850px;
    margin: 0 auto;
}

.page-title-input {
    display: block;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    overflow: hidden;
    font-size: 32px;
    line-height: 1.3;
    font-weight: 750;
    background: transparent;
    color: var(--text);
    padding: 5px 0 13px;
}

.page-meta {
    color: var(--muted);
    font-size: 12px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 22px;
    position: sticky;
    top: 0;
    z-index: 2;
}

.tool-btn {
    min-width: 31px;
    height: 31px;
    padding: 0 8px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
}

.tool-btn:hover {
    background: var(--hover);
}

.toolbar select {
    height: 30px;
    max-width: 125px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
}

.toolbar input[type="color"] {
    height: 29px;
    width: 34px;
    border: none;
    background: transparent;
    cursor: pointer;
}

.toolbar .separator {
    width: 1px;
    height: 23px;
    background: var(--border);
    margin: 0 4px;
}

.editor {
    min-height: 420px;
    outline: none;
    font-size: 16px;
    line-height: 1.85;
    overflow-wrap: anywhere;
}

.editor:empty::before {
    content: "Start writing your notes here...";
    color: var(--muted);
    pointer-events: none;
}

.editor h1, .editor h2, .editor h3 {
    line-height: 1.4;
}

.editor blockquote {
    border-left: 4px solid var(--primary);
    padding: 8px 15px;
    margin-left: 0;
    background: var(--surface2);
}

.editor table {
    width: 100%;
    border-collapse: collapse;
}

.editor td, .editor th {
    border: 1px solid var(--border);
    padding: 8px;
}

.editor img {
    max-width: 100%;
    height: auto;
}

.editor a {
    color: var(--primary);
}

.empty-state {
    height: 100%;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 25px;
}

.empty-state .big-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.empty-state h2 {
    color: var(--text);
    font-size: 22px;
}

.empty-state p {
    max-width: 360px;
    line-height: 1.7;
}

.statusbar {
    height: 28px;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: var(--sidebar);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
}

/* SEARCH RESULTS */

.search-results {
    position: absolute;
    top: 43px;
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 8px;
    max-height: 350px;
    overflow-y: auto;
    z-index: 20;
    display: none;
}

.search-result {
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
}

.search-result:hover {
    background: var(--hover);
}

.search-result strong {
    display: block;
    margin-bottom: 5px;
}

.search-result small {
    color: var(--muted);
}

/* DIALOGS */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 23px;
    box-shadow: var(--shadow);
}

.modal h2 {
    margin-top: 0;
    font-size: 20px;
}

.modal input,
.modal select {
    width: 100%;
    padding: 11px;
    margin: 8px 0 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
}

.secondary-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 6px;
}

.menu-popup {
    position: fixed;
    z-index: 50;
    display: none;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 5px;
}

.menu-popup button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
}

.menu-popup button:hover {
    background: var(--hover);
}

.toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #26232d;
    color: white;
    padding: 11px 18px;
    border-radius: 7px;
    box-shadow: var(--shadow);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
}

.toast.show {
    opacity: 1;
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media (max-width: 1000px) {
    .sidebar {
        width: 205px;
        min-width: 185px;
    }

    .section-panel {
        width: 195px;
        min-width: 175px;
    }

    .page-panel {
        width: 225px;
        min-width: 195px;
    }

    .editor-scroll {
        padding: 25px;
    }
}

@media (max-width: 760px) {
    body {
        overflow: hidden;
    }

    .topbar {
        padding: 0 10px;
        gap: 7px;
        height: 55px;
        min-height: 55px;
    }

    .brand {
        min-width: auto;
        font-size: 16px;
        gap: 7px;
    }

    .brand .brand-text {
        display: none;
    }

    .logo {
        width: 30px;
        height: 30px;
    }

    .searchbox {
        max-width: none;
    }

    .top-actions {
        gap: 0;
    }

    .top-actions .desktop-only {
        display: none;
    }

    .workspace {
        position: relative;
    }

    .sidebar,
    .section-panel,
    .page-panel {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        min-width: 0;
        border-right: none;
        z-index: 10;
    }

    .sidebar {
        display: none;
    }

    .section-panel {
        display: none;
    }

    .page-panel {
        display: none;
    }

    .workspace.show-notebooks .sidebar {
        display: flex;
    }

    .workspace.show-sections .section-panel {
        display: flex;
    }

    .workspace.show-pages .page-panel {
        display: flex;
    }

    .editor-area {
        width: 100%;
    }

    .editor-scroll {
        padding: 20px 17px 45px;
    }

    .page-title-input {
        font-size: 27px;
    }

    .editor {
        font-size: 15px;
    }

    .toolbar {
        gap: 2px;
    }

    .editor-top {
        padding: 0 12px;
    }

    .mobile-menu {
        display: inline-block;
    }

    .statusbar {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="topbar">

        <button class="icon-btn mobile-menu"
                onclick="showMobileNotebooks()"
                title="Open notebooks">☰</button>

        <div class="brand">
            <div class="logo">N</div>
            <span class="brand-text">OneNote Pro</span>
        </div>

        <div class="searchbox">
            <span class="search-icon">⌕</span>

            <input type="search"
                   id="searchInput"
                   placeholder="Search all your notes..."
                   autocomplete="off">

            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="top-actions">

            <button class="icon-btn desktop-only"
                    onclick="exportBackup()"
                    title="Export all notebooks">⬇</button>

            <button class="icon-btn desktop-only"
                    onclick="document.getElementById('importFile').click()"
                    title="Import backup">⬆</button>

            <button class="icon-btn"
                    onclick="toggleTheme()"
                    title="Toggle dark mode">◐</button>

            <button class="primary-btn"
                    onclick="newNotebook()">+ Notebook</button>

        </div>

    </header>

    <!-- WORKSPACE -->

    <main class="workspace show-notebooks"
          id="workspace">

        <!-- NOTEBOOKS -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-heading">
                NOTEBOOKS

                <button class="icon-btn"
                        onclick="newNotebook()"
                        title="New notebook">＋</button>
            </div>

            <div class="sidebar-scroll" id="notebookList"></div>

            <div class="sidebar-footer">
                <div>OneNote Pro</div>
                <div style="margin-top:5px">
                    Your personal knowledge space
                </div>
            </div>

        </aside>

        <!-- SECTIONS -->

        <aside class="section-panel">

            <div class="panel-title">
                <span id="sectionPanelTitle">Sections</span>

                <button class="icon-btn"
                        onclick="newSection()"
                        title="New section">＋</button>
            </div>

            <div class="section-list" id="sectionList"></div>

        </aside>

        <!-- PAGES -->

        <aside class="page-panel">

            <div class="panel-title">
                <span id="pagePanelTitle">Pages</span>

                <button class="icon-btn"
                        onclick="newPage()"
                        title="New page">＋</button>
            </div>

            <div class="page-list" id="pageList"></div>

        </aside>

        <!-- EDITOR -->

        <section class="editor-area" id="editorArea">

            <div class="editor-top">

                <div class="breadcrumb" id="breadcrumb">
                    My Notebook
                </div>

                <div class="save-status" id="saveStatus">
                    All changes saved
                </div>

            </div>

            <div class="editor-scroll">

                <div class="editor-container" id="editorContainer">

                    <textarea class="page-title-input"
                              id="pageTitle"
                              rows="1"
                              placeholder="Page title"
                              aria-label="Page title"></textarea>

                    <div class="page-meta" id="pageMeta"></div>

                    <!-- RICH TEXT TOOLBAR -->

                    <div class="toolbar" id="toolbar">

                        <button class="tool-btn"
                                title="Undo"
                                onclick="runCommand('undo')">↶</button>

                        <button class="tool-btn"
                                title="Redo"
                                onclick="runCommand('redo')">↷</button>

                        <span class="separator"></span>

                        <select id="formatBlock"
                                aria-label="Text style"
                                onchange="formatBlock(this.value)">
                            <option value="P">Paragraph</option>
                            <option value="H1">Heading 1</option>
                            <option value="H2">Heading 2</option>
                            <option value="H3">Heading 3</option>
                            <option value="BLOCKQUOTE">Quote</option>
                        </select>

                        <select id="fontSize"
                                aria-label="Font size"
                                onchange="setFontSize(this.value)">
                            <option value="">Size</option>
                            <option value="2">Small</option>
                            <option value="3">Normal</option>
                            <option value="4">Large</option>
                            <option value="5">Extra large</option>
                            <option value="6">Huge</option>
                        </select>

                        <span class="separator"></span>

                        <button class="tool-btn"
                                title="Bold"
                                onclick="runCommand('bold')"><b>B</b></button>

                        <button class="tool-btn"
                                title="Italic"
                                onclick="runCommand('italic')"><i>I</i></button>

                        <button class="tool-btn"
                                title="Underline"
                                onclick="runCommand('underline')"><u>U</u></button>

                        <button class="tool-btn"
                                title="Strikethrough"
                                onclick="runCommand('strikeThrough')"><s>S</s></button>

                        <input type="color"
                               id="textColor"
                               title="Text color"
                               value="#7719aa"
                               onchange="runCommand('foreColor', this.value)">

                        <input type="color"
                               id="highlightColor"
                               title="Highlight color"
                               value="#fff176"
                               onchange="runCommand('hiliteColor', this.value)">

                        <span class="separator"></span>

                        <button class="tool-btn"
                                title="Bullet list"
                                onclick="runCommand('insertUnorderedList')">• List</button>

                        <button class="tool-btn"
                                title="Numbered list"
                                onclick="runCommand('insertOrderedList')">1. List</button>

                        <button class="tool-btn"
                                title="Align left"
                                onclick="runCommand('justifyLeft')">☰</button>

                        <button class="tool-btn"
                                title="Align center"
                                onclick="runCommand('justifyCenter')">≡</button>

                        <button class="tool-btn"
                                title="Align right"
                                onclick="runCommand('justifyRight')">☷</button>

                        <span class="separator"></span>

                        <button class="tool-btn"
                                title="Insert link"
                                onclick="insertLink()">🔗</button>

                        <button class="tool-btn"
                                title="Insert table"
                                onclick="insertTable()">▦</button>

                        <button class="tool-btn"
                                title="Insert horizontal line"
                                onclick="runCommand('insertHorizontalRule')">―</button>

                        <button class="tool-btn"
                                title="Insert image from device"
                                onclick="document.getElementById('imageFile').click()">🖼</button>

                        <button class="tool-btn"
                                title="Insert date"
                                onclick="insertDate()">📅</button>

                    </div>

                    <div class="editor"
                         id="editor"
                         contenteditable="true"
                         spellcheck="true"
                         role="textbox"
                         aria-label="Write your notes here"></div>

                </div>

            </div>

            <footer class="statusbar">
                <span id="wordCount">0 words</span>
                <span id="storageStatus">Local storage</span>
            </footer>

        </section>

    </main>

</div>

<!-- IMPORT FILE INPUTS -->

<input type="file"
       id="importFile"
       accept=".json,application/json"
       hidden>

<input type="file"
       id="imageFile"
       accept="image/*"
       hidden>

<!-- CONTEXT MENU -->

<div class="menu-popup" id="contextMenu"></div>

<!-- MODAL -->

<div class="modal-backdrop" id="modalBackdrop">

    <div class="modal">

        <h2 id="modalTitle">Create item</h2>

        <label id="modalLabel" for="modalInput">Name</label>

        <input type="text"
               id="modalInput"
               maxlength="150"
               placeholder="Enter name">

        <div class="modal-actions">

            <button class="secondary-btn"
                    onclick="closeModal()">Cancel</button>

            <button class="primary-btn"
                    id="modalConfirm">Create</button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==========================================
   ONENOTE PRO
   Local notebook, section and page manager
========================================== */

const STORAGE_KEY = "onenote_pro_data_v1";
const THEME_KEY = "onenote_pro_theme_v1";

const SECTION_COLORS = [
    "#7b61ff",
    "#e34d75",
    "#16a085",
    "#f39c12",
    "#3498db",
    "#8e44ad",
    "#d35400"
];

let data;
let activeNotebookId = null;
let activeSectionId = null;
let activePageId = null;

let saveTimer = null;
let modalCallback = null;
let menuTarget = null;
let toastTimer = null;
let editorSelection = null;

/* ==========================================
   HELPERS
========================================== */

function uid() {
    return "id_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 9);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[ch]);
}

function plainText(html) {
    const div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || div.innerText || "").trim();
}

function now() {
    return new Date().toISOString();
}

function formatDate(dateString) {
    if (!dateString) return "";

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function createPage(title = "Untitled page") {
    return {
        id: uid(),
        title,
        content: "",
        createdAt: now(),
        updatedAt: now()
    };
}

function createSection(name = "New Section", color = "#7b61ff") {
    const page = createPage("Welcome");

    page.content =
        "<h2>Welcome to your new section!</h2>" +
        "<p>Start writing your ideas, notes and important information here.</p>";

    return {
        id: uid(),
        name,
        color,
        pages: [page]
    };
}

function createNotebook(name = "My Notebook") {
    const section = createSection("General", SECTION_COLORS[0]);

    return {
        id: uid(),
        name,
        sections: [section]
    };
}

/* ==========================================
   DEFAULT DATA
========================================== */

function defaultData() {
    const notebook = createNotebook("My Notebook");

    notebook.sections[0].pages[0].title = "Welcome to OneNote Pro";

    notebook.sections[0].pages[0].content = `
        <h1>Welcome to OneNote Pro!</h1>
        <p>This is your personal digital notebook.</p>
        <h2>What can you do here?</h2>
        <ul>
            <li>Create multiple notebooks.</li>
            <li>Organize notes into sections.</li>
            <li>Create unlimited pages within your notebooks.</li>
            <li>Format text, add lists and insert tables.</li>
            <li>Search for notes across your notebooks.</li>
            <li>Export your notes for backup.</li>
        </ul>
        <blockquote>
            Knowledge becomes powerful when it is organized,
            revised and applied.
        </blockquote>
        <h2>Suggested notebooks</h2>
        <p>📘 NCERT Study Notes</p>
        <p>📗 BPSC Preparation</p>
        <p>📙 Classroom Notes</p>
        <p>📕 Personal Ideas</p>
        <p><b>Tip:</b> Your changes are saved automatically in this browser.</p>
    `;

    return {
        version: 1,
        notebooks: [notebook]
    };
}

/* ==========================================
   DATA VALIDATION
========================================== */

function validateData(input) {
    if (!input || !Array.isArray(input.notebooks)) {
        throw new Error("Invalid notebook backup.");
    }

    const clean = {
        version: 1,
        notebooks: []
    };

    for (const notebook of input.notebooks) {
        if (!notebook || typeof notebook.name !== "string") continue;

        const safeNotebook = {
            id: typeof notebook.id === "string" ? notebook.id : uid(),
            name: notebook.name.slice(0, 150),
            sections: []
        };

        for (const section of (Array.isArray(notebook.sections)
            ? notebook.sections : [])) {

            if (!section || typeof section.name !== "string") continue;

            const safeSection = {
                id: typeof section.id === "string" ? section.id : uid(),
                name: section.name.slice(0, 150),
                color: SECTION_COLORS.includes(section.color)
                    ? section.color
                    : "#7b61ff",
                pages: []
            };

            for (const page of (Array.isArray(section.pages)
                ? section.pages : [])) {

                if (!page || typeof page.title !== "string") continue;

                safeSection.pages.push({
                    id: typeof page.id === "string" ? page.id : uid(),
                    title: page.title.slice(0, 300),
                    content: typeof page.content === "string"
                        ? page.content
                        : "",
                    createdAt: page.createdAt || now(),
                    updatedAt: page.updatedAt || now()
                });
            }

            safeNotebook.sections.push(safeSection);
        }

        clean.notebooks.push(safeNotebook);
    }

    return clean;
}

/* ==========================================
   LOAD AND SAVE
========================================== */

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            data = validateData(JSON.parse(saved));
        } else {
            data = defaultData();
        }

    } catch (error) {
        console.error("Loading notebook data failed:", error);

        data = defaultData();

        showToast(
            "Could not load saved data. A fresh notebook was opened."
        );
    }

    if (!data.notebooks.length) {
        data = defaultData();
    }

    activeNotebookId = data.notebooks[0].id;
    activeSectionId = data.notebooks[0].sections[0]?.id || null;
    activePageId =
        data.notebooks[0].sections[0]?.pages[0]?.id || null;

    try {
        if (localStorage.getItem(THEME_KEY) === "dark") {
            document.body.classList.add("dark");
        }
    } catch (error) {
        console.warn("Theme preference unavailable.", error);
    }

    renderAll();
    updateEditor();
}

function saveData(showStatus = true) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

        if (showStatus) {
            document.getElementById("saveStatus").textContent =
                "All changes saved";
        }

        document.getElementById("storageStatus").textContent =
            "Saved on this device";

        return true;

    } catch (error) {
        console.error("Saving failed:", error);

        document.getElementById("saveStatus").textContent =
            "Save failed";

        document.getElementById("storageStatus").textContent =
            "Storage full or unavailable";

        showToast(
            "Saving failed. Export a backup or reduce image sizes."
        );

        return false;
    }
}

function scheduleSave() {
    document.getElementById("saveStatus").textContent = "Saving...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveData();
        renderPages();
    }, 350);
}

/* ==========================================
   ACTIVE ITEM HELPERS
========================================== */

function getNotebook() {
    return data.notebooks.find(n => n.id === activeNotebookId) || null;
}

function getSection() {
    const notebook = getNotebook();

    return notebook
        ? notebook.sections.find(s => s.id === activeSectionId) || null
        : null;
}

function getPage() {
    const section = getSection();

    return section
        ? section.pages.find(p => p.id === activePageId) || null
        : null;
}

function ensureSelection() {
    if (!data.notebooks.length) {
        data.notebooks.push(createNotebook());
    }

    let notebook = getNotebook();

    if (!notebook) {
        notebook = data.notebooks[0];
        activeNotebookId = notebook.id;
    }

    if (!notebook.sections.length) {
        notebook.sections.push(createSection());
    }

    let section = notebook.sections.find(
        s => s.id === activeSectionId
    );

    if (!section) {
        section = notebook.sections[0];
        activeSectionId = section.id;
    }

    if (!section.pages.length) {
        section.pages.push(createPage());
    }

    let page = section.pages.find(
        p => p.id === activePageId
    );

    if (!page) {
        page = section.pages[0];
        activePageId = page.id;
    }
}

/* ==========================================
   RENDER NOTEBOOKS
========================================== */

function renderNotebooks() {
    const list = document.getElementById("notebookList");

    list.innerHTML = data.notebooks.map(notebook => `
        <div class="nav-item ${
            notebook.id === activeNotebookId ? "active" : ""
        }"
        data-notebook-id="${escapeHTML(notebook.id)}"
        onclick="selectNotebook('${notebook.id}')">

            <span>📘</span>

            <span class="label">
                ${escapeHTML(notebook.name)}
            </span>

            <button class="more"
                    title="Notebook options"
                    onclick="openMenu(event,'notebook','${notebook.id}')">
                ⋮
            </button>

        </div>
    `).join("");

    if (!data.notebooks.length) {
        list.innerHTML =
            '<p style="padding:12px;color:var(--muted)">No notebooks</p>';
    }
}

/* ==========================================
   RENDER SECTIONS
========================================== */

function renderSections() {
    const notebook = getNotebook();
    const list = document.getElementById("sectionList");

    document.getElementById("sectionPanelTitle").textContent =
        notebook ? notebook.name : "Sections";

    if (!notebook) {
        list.innerHTML = "";
        return;
    }

    list.innerHTML = notebook.sections.map(section => `
        <div class="section-item ${
            section.id === activeSectionId ? "active" : ""
        }"
        onclick="selectSection('${section.id}')">

            <span class="section-color"
                  style="background:${escapeHTML(section.color)}"></span>

            <span class="section-name">
                ${escapeHTML(section.name)}
            </span>

            <button class="icon-btn"
                    style="padding:2px"
                    title="Section options"
                    onclick="openMenu(event,'section','${section.id}')">
                ⋮
            </button>

        </div>
    `).join("");

    if (!notebook.sections.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="big-icon">📂</div>
                <p>Create a section to organize your notes.</p>
                <button class="primary-btn" onclick="newSection()">
                    + Create Section
                </button>
            </div>
        `;
    }
}

/* ==========================================
   RENDER PAGES
========================================== */

function renderPages() {
    const section = getSection();
    const list = document.getElementById("pageList");

    document.getElementById("pagePanelTitle").textContent =
        section ? section.name : "Pages";

    if (!section) {
        list.innerHTML = "";
        return;
    }

    list.innerHTML = section.pages.map(page => {
        const preview = plainText(page.content);

        return `
            <div class="page-card ${
                page.id === activePageId ? "active" : ""
            }"
            onclick="selectPage('${page.id}')">

                <div class="page-card-title">
                    ${escapeHTML(page.title || "Untitled page")}
                </div>

                <div class="page-preview">
                    ${escapeHTML(preview || "Empty page")}
                </div>

                <div class="page-date">
                    ${escapeHTML(formatDate(page.updatedAt))}
                </div>

                <button class="icon-btn"
                        style="padding:3px;margin-top:4px"
                        title="Page options"
                        onclick="openMenu(event,'page','${page.id}')">
                    ⋮ Options
                </button>

            </div>
        `;
    }).join("");

    if (!section.pages.length) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="big-icon">📝</div>
                <p>Create your first page in this section.</p>
                <button class="primary-btn" onclick="newPage()">
                    + Create Page
                </button>
            </div>
        `;
    }
}

function renderAll() {
    ensureSelection();

    renderNotebooks();
    renderSections();
    renderPages();

    updateBreadcrumb();
}

function updateBreadcrumb() {
    const notebook = getNotebook();
    const section = getSection();
    const page = getPage();

    document.getElementById("breadcrumb").textContent = [
        notebook?.name,
        section?.name,
        page?.title
    ].filter(Boolean).join("  ›  ");
}

/* ==========================================
   SELECT ITEMS
========================================== */

function selectNotebook(id) {
    const notebook = data.notebooks.find(n => n.id === id);

    if (!notebook) return;

    activeNotebookId = id;
    activeSectionId = notebook.sections[0]?.id || null;
    activePageId = notebook.sections[0]?.pages[0]?.id || null;

    renderAll();
    updateEditor();

    closeMenu();
    hideMobilePanels();
}

function selectSection(id) {
    const notebook = getNotebook();

    if (!notebook) return;

    const section = notebook.sections.find(s => s.id === id);

    if (!section) return;

    activeSectionId = id;
    activePageId = section.pages[0]?.id || null;

    renderAll();
    updateEditor();

    closeMenu();

    if (window.innerWidth <= 760) {
        showMobilePages();
    }
}

function selectPage(id) {
    const section = getSection();

    if (!section) return;

    const page = section.pages.find(p => p.id === id);

    if (!page) return;

    activePageId = id;

    renderPages();
    updateEditor();

    closeMenu();

    if (window.innerWidth <= 760) {
        hideMobilePanels();
    }
}

/* ==========================================
   NOTEBOOK CRUD
========================================== */

function newNotebook() {
    showModal(
        "Create Notebook",
        "Notebook name",
        "My New Notebook",
        name => {
            if (!name) return;

            const notebook = createNotebook(name);

            data.notebooks.push(notebook);

            activeNotebookId = notebook.id;
            activeSectionId = notebook.sections[0].id;
            activePageId = notebook.sections[0].pages[0].id;

            saveData();
            renderAll();
            updateEditor();

            showToast("Notebook created");
        }
    );
}

function renameNotebook(id) {
    const notebook = data.notebooks.find(n => n.id === id);

    if (!notebook) return;

    showModal(
        "Rename Notebook",
        "Notebook name",
        notebook.name,
        name => {
            if (!name) return;

            notebook.name = name;

            saveData();
            renderAll();

            showToast("Notebook renamed");
        }
    );
}

function deleteNotebook(id) {
    const notebook = data.notebooks.find(n => n.id === id);

    if (!notebook) return;

    if (!confirm(
        `Delete notebook "${notebook.name}" and all its sections and pages?`
    )) return;

    data.notebooks = data.notebooks.filter(n => n.id !== id);

    if (activeNotebookId === id) {
        activeNotebookId = data.notebooks[0]?.id || null;
        activeSectionId = null;
        activePageId = null;
    }

    ensureSelection();
    saveData();
    renderAll();
    updateEditor();

    showToast("Notebook deleted");
}

/* ==========================================
   SECTION CRUD
========================================== */

function newSection() {
    const notebook = getNotebook();

    if (!notebook) {
        showToast("Create a notebook first");
        return;
    }

    showModal(
        "Create Section",
        "Section name",
        "New Section",
        name => {
            if (!name) return;

            const color =
                SECTION_COLORS[
                    notebook.sections.length % SECTION_COLORS.length
                ];

            const section = createSection(name, color);

            notebook.sections.push(section);

            activeSectionId = section.id;
            activePageId = section.pages[0].id;

            saveData();
            renderAll();
            updateEditor();

            showToast("Section created");
        }
    );
}

function renameSection(id) {
    const notebook = getNotebook();

    if (!notebook) return;

    const section = notebook.sections.find(s => s.id === id);

    if (!section) return;

    showModal(
        "Rename Section",
        "Section name",
        section.name,
        name => {
            if (!name) return;

            section.name = name;

            saveData();
            renderAll();

            showToast("Section renamed");
        }
    );
}

function deleteSection(id) {
    const notebook = getNotebook();

    if (!notebook) return;

    const section = notebook.sections.find(s => s.id === id);

    if (!section) return;

    if (!confirm(
        `Delete section "${section.name}" and all its pages?`
    )) return;

    notebook.sections = notebook.sections.filter(s => s.id !== id);

    if (activeSectionId === id) {
        activeSectionId = notebook.sections[0]?.id || null;
        activePageId =
            notebook.sections[0]?.pages[0]?.id || null;
    }

    ensureSelection();
    saveData();
    renderAll();
    updateEditor();

    showToast("Section deleted");
}

/* ==========================================
   PAGE CRUD
========================================== */

function newPage() {
    const section = getSection();

    if (!section) {
        showToast("Create a section first");
        return;
    }

    const page = createPage("Untitled page");

    section.pages.push(page);

    activePageId = page.id;

    saveData();
    renderAll();
    updateEditor();

    document.getElementById("pageTitle").focus();

    if (window.innerWidth <= 760) {
        hideMobilePanels();
    }

    showToast("Page created");
}

function renamePage(id) {
    const section = getSection();

    if (!section) return;

    const page = section.pages.find(p => p.id === id);

    if (!page) return;

    showModal(
        "Rename Page",
        "Page title",
        page.title,
        title => {
            if (!title) return;

            page.title = title;
            page.updatedAt = now();

            saveData();
            renderAll();
            updateEditor();

            showToast("Page renamed");
        }
    );
}

function deletePage(id) {
    const section = getSection();

    if (!section) return;

    const page = section.pages.find(p => p.id === id);

    if (!page) return;

    if (!confirm(`Delete page "${page.title}"?`)) return;

    section.pages = section.pages.filter(p => p.id !== id);

    if (activePageId === id) {
        activePageId = section.pages[0]?.id || null;
    }

    ensureSelection();

    saveData();
    renderAll();
    updateEditor();

    showToast("Page deleted");
}

function duplicatePage(id) {
    const section = getSection();

    if (!section) return;

    const page = section.pages.find(p => p.id === id);

    if (!page) return;

    const copy = {
        ...page,
        id: uid(),
        title: page.title + " (Copy)",
        createdAt: now(),
        updatedAt: now()
    };

    section.pages.push(copy);

    activePageId = copy.id;

    saveData();
    renderAll();
    updateEditor();

    showToast("Page duplicated");
}

/* ==========================================
   EDITOR
========================================== */

function updateEditor() {
    ensureSelection();

    const page = getPage();

    const titleInput = document.getElementById("pageTitle");
    const editor = document.getElementById("editor");

    if (!page) {
        titleInput.value = "";
        editor.innerHTML = "";

        document.getElementById("pageMeta").textContent = "";
        document.getElementById("saveStatus").textContent =
            "No page selected";

        updateBreadcrumb();
        updateWordCount();

        return;
    }

    titleInput.value = page.title;
    editor.innerHTML = page.content || "";

    document.getElementById("pageMeta").textContent =
        "Created " + formatDate(page.createdAt) +
        "  •  Updated " + formatDate(page.updatedAt);

    document.getElementById("saveStatus").textContent =
        "All changes saved";

    updateBreadcrumb();
    updateWordCount();
}

function saveCurrentEditor() {
    const page = getPage();

    if (!page) return;

    page.title =
        document.getElementById("pageTitle").value.trim() ||
        "Untitled page";

    page.content = document.getElementById("editor").innerHTML;
    page.updatedAt = now();

    document.getElementById("pageMeta").textContent =
        "Created " + formatDate(page.createdAt) +
        "  •  Updated " + formatDate(page.updatedAt);

    updateBreadcrumb();
    scheduleSave();
    updateWordCount();
}

document.getElementById("pageTitle").addEventListener(
    "input",
    function() {
        this.style.height = "auto";
        this.style.height = this.scrollHeight + "px";

        saveCurrentEditor();
    }
);

document.getElementById("editor").addEventListener(
    "input",
    function() {
        saveCurrentEditor();
    }
);

function updateWordCount() {
    const editor = document.getElementById("editor");
    const text = plainText(editor.innerHTML);

    const words = text
        ? text.split(/\s+/).filter(Boolean).length
        : 0;

    document.getElementById("wordCount").textContent =
        words + (words === 1 ? " word" : " words");
}

/* ==========================================
   RICH TEXT COMMANDS
========================================== */

function focusEditor() {
    document.getElementById("editor").focus();
}

function runCommand(command, value = null) {
    focusEditor();

    try {
        document.execCommand(command, false, value);
    } catch (error) {
        console.error("Formatting command failed:", error);
    }

    saveCurrentEditor();
}

function formatBlock(tag) {
    focusEditor();

    document.execCommand(
        "formatBlock",
        false,
        "<" + tag.toLowerCase() + ">"
    );

    saveCurrentEditor();
}

function setFontSize(size) {
    if (!size) return;

    focusEditor();

    document.execCommand("fontSize", false, size);

    saveCurrentEditor();

    document.getElementById("fontSize").value = "";
}

function insertLink() {
    const url = prompt("Enter a link URL:");

    if (!url) return;

    try {
        const parsed = new URL(url);

        if (!["http:", "https:", "mailto:"].includes(parsed.protocol)) {
            showToast("Use a valid HTTP, HTTPS or email link");
            return;
        }

        focusEditor();

        document.execCommand("createLink", false, parsed.href);

        saveCurrentEditor();

    } catch (error) {
        showToast("Please enter a valid URL");
    }
}

function insertTable() {
    const rows = Number(prompt("Number of rows (1–15):", "3"));
    const cols = Number(prompt("Number of columns (1–10):", "3"));

    if (
        !Number.isInteger(rows) ||
        !Number.isInteger(cols) ||
        rows < 1 ||
        rows > 15 ||
        cols < 1 ||
        cols > 10
    ) {
        showToast("Enter valid table dimensions");
        return;
    }

    let html = "<table><tbody>";

    for (let r = 0; r < rows; r++) {
        html += "<tr>";

        for (let c = 0; c < cols; c++) {
            html += r === 0
                ? "<th>Heading</th>"
                : "<td>Write here</td>";
        }

        html += "</tr>";
    }

    html += "</tbody></table><p><br></p>";

    focusEditor();

    document.execCommand("insertHTML", false, html);

    saveCurrentEditor();
}

function insertDate() {
    focusEditor();

    const date = new Date().toLocaleDateString(undefined, {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.execCommand("insertText", false, date);

    saveCurrentEditor();
}

/* ==========================================
   IMAGE INSERTION
========================================== */

document.getElementById("imageFile").addEventListener(
    "change",
    function(event) {
        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            showToast("Please select an image");
            event.target.value = "";
            return;
        }

        // Large images can quickly fill browser storage.
        if (file.size > 2 * 1024 * 1024) {
            showToast("Please choose an image smaller than 2 MB");
            event.target.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
            focusEditor();

            const image = document.createElement("img");

            image.src = e.target.result;
            image.alt = file.name;
            image.style.maxWidth = "100%";

            const selection = window.getSelection();

            if (selection && selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);

                if (document.getElementById("editor").contains(
                    range.commonAncestorContainer
                )) {
                    range.deleteContents();
                    range.insertNode(image);

                    const paragraph = document.createElement("p");
                    paragraph.innerHTML = "<br>";

                    image.after(paragraph);
                } else {
                    document.getElementById("editor").appendChild(image);
                }
            } else {
                document.getElementById("editor").appendChild(image);
            }

            saveCurrentEditor();
            showToast("Image inserted");
        };

        reader.readAsDataURL(file);

        event.target.value = "";
    }
);

/* ==========================================
   CONTEXT MENU
========================================== */

function openMenu(event, type, id) {
    event.stopPropagation();

    const menu = document.getElementById("contextMenu");

    menuTarget = { type, id };

    let options = [];

    if (type === "notebook") {
        options = [
            ["Rename notebook", "rename"],
            ["Delete notebook", "delete"]
        ];
    }

    if (type === "section") {
        options = [
            ["Rename section", "rename"],
            ["Delete section", "delete"]
        ];
    }

    if (type === "page") {
        options = [
            ["Rename page", "rename"],
            ["Duplicate page", "duplicate"],
            ["Download as HTML", "downloadHTML"],
            ["Download as TXT", "downloadTXT"],
            ["Delete page", "delete"]
        ];
    }

    menu.innerHTML = options.map(option => `
        <button onclick="menuAction('${option[1]}')">
            ${escapeHTML(option[0])}
        </button>
    `).join("");

    menu.style.display = "block";

    const rect = event.currentTarget.getBoundingClientRect();

    const width = 190;
    const height = options.length * 42 + 10;

    let left = rect.right - width;
    let top = rect.bottom + 4;

    left = Math.max(5, Math.min(left, window.innerWidth - width - 5));

    if (top + height > window.innerHeight) {
        top = rect.top - height;
    }

    top = Math.max(5, top);

    menu.style.left = left + "px";
    menu.style.top = top + "px";
}

function closeMenu() {
    document.getElementById("contextMenu").style.display = "none";
    menuTarget = null;
}

function menuAction(action) {
    if (!menuTarget) return;

    const { type, id } = menuTarget;

    closeMenu();

    if (type === "notebook") {
        if (action === "rename") renameNotebook(id);
        if (action === "delete") deleteNotebook(id);
    }

    if (type === "section") {
        if (action === "rename") renameSection(id);
        if (action === "delete") deleteSection(id);
    }

    if (type === "page") {
        if (action === "rename") renamePage(id);
        if (action === "duplicate") duplicatePage(id);

        if (action === "downloadHTML") {
            downloadPage(id, "html");
        }

        if (action === "downloadTXT") {
            downloadPage(id, "txt");
        }

        if (action === "delete") deletePage(id);
    }
}

document.addEventListener("click", function(event) {
    const menu = document.getElementById("contextMenu");

    if (
        menu.style.display === "block" &&
        !menu.contains(event.target)
    ) {
        closeMenu();
    }

    if (!event.target.closest(".searchbox")) {
        document.getElementById("searchResults").style.display = "none";
    }
});

/* ==========================================
   MODAL
========================================== */

function showModal(title, label, initialValue, callback) {
    modalCallback = callback;

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalLabel").textContent = label;

    const input = document.getElementById("modalInput");

    input.value = initialValue || "";
    input.placeholder = label;

    document.getElementById("modalBackdrop").classList.add("show");

    setTimeout(() => {
        input.focus();
        input.select();
    }, 50);
}

function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
    modalCallback = null;
}

document.getElementById("modalConfirm").addEventListener(
    "click",
    function() {
        const value = document.getElementById("modalInput").value.trim();

        if (!value) {
            showToast("Please enter a name");
            return;
        }

        const callback = modalCallback;

        closeModal();

        if (callback) callback(value);
    }
);

document.getElementById("modalInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById("modalConfirm").click();
        }

        if (event.key === "Escape") {
            closeModal();
        }
    }
);

document.getElementById("modalBackdrop").addEventListener(
    "click",
    function(event) {
        if (event.target === this) closeModal();
    }
);

/* ==========================================
   SEARCH
========================================== */

const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchInput.addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();

    if (!query) {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        return;
    }

    const matches = [];

    for (const notebook of data.notebooks) {
        for (const section of notebook.sections) {
            for (const page of section.pages) {
                const text = plainText(page.content);

                const searchable = [
                    notebook.name,
                    section.name,
                    page.title,
                    text
                ].join(" ").toLowerCase();

                if (searchable.includes(query)) {
                    matches.push({
                        notebook,
                        section,
                        page,
                        text
                    });
                }
            }
        }
    }

    if (!matches.length) {
        searchResults.innerHTML = `
            <div class="search-result">
                No matching notes found.
            </div>
        `;

    } else {
        searchResults.innerHTML = matches.slice(0, 50).map(
            (match, index) => `
                <div class="search-result"
                     onclick="openSearchResult(${index})">

                    <strong>
                        ${escapeHTML(match.page.title)}
                    </strong>

                    <small>
                        ${escapeHTML(match.notebook.name)}
                        › ${escapeHTML(match.section.name)}
                    </small>

                    <div class="page-preview">
                        ${escapeHTML(match.text.slice(0, 140))}
                    </div>

                </div>
            `
        ).join("");
    }

    searchResults.style.display = "block";

    window.currentSearchMatches = matches;
});

function openSearchResult(index) {
    const match = window.currentSearchMatches?.[index];

    if (!match) return;

    activeNotebookId = match.notebook.id;
    activeSectionId = match.section.id;
    activePageId = match.page.id;

    renderAll();
    updateEditor();

    searchInput.value = "";
    searchResults.style.display = "none";

    hideMobilePanels();
}

/* ==========================================
   EXPORT INDIVIDUAL PAGE
========================================== */

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");

    anchor.href = url;
    anchor.download = filename;

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFilename(name) {
    return String(name || "notes")
        .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
        .trim()
        .slice(0, 100) || "notes";
}

function downloadPage(id, format) {
    const section = getSection();

    if (!section) return;

    const page = section.pages.find(p => p.id === id);

    if (!page) return;

    if (format === "txt") {
        const text = plainText(page.content);

        const output =
            page.title + "\n" +
            "=".repeat(Math.min(page.title.length, 80)) +
            "\n\n" + text;

        downloadBlob(
            new Blob([output], { type: "text/plain;charset=utf-8" }),
            safeFilename(page.title) + ".txt"
        );

        showToast("Text file downloaded");
        return;
    }

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHTML(page.title)}</title>
<style>
body {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
    font-family: Arial, sans-serif;
    line-height: 1.8;
}
img { max-width: 100%; height: auto; }
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #ddd; padding: 8px; }
</style>
</head>
<body>
<h1>${escapeHTML(page.title)}</h1>
${page.content}
</body>
</html>`;

    downloadBlob(
        new Blob([html], { type: "text/html;charset=utf-8" }),
        safeFilename(page.title) + ".html"
    );

    showToast("HTML file downloaded");
}

/* ==========================================
   BACKUP AND RESTORE
========================================== */

function exportBackup() {
    saveData(false);

    const backup = JSON.stringify(data, null, 2);

    downloadBlob(
        new Blob([backup], {
            type: "application/json;charset=utf-8"
        }),
        "onenote-pro-backup-" +
        new Date().toISOString().slice(0, 10) +
        ".json"
    );

    showToast("Backup downloaded");
}

document.getElementById("importFile").addEventListener(
    "change",
    async function(event) {
        const file = event.target.files[0];

        if (!file) return;

        try {
            if (file.size > 25 * 1024 * 1024) {
                throw new Error("Backup file is too large.");
            }

            const text = await file.text();
            const imported = validateData(JSON.parse(text));

            if (!confirm(
                "Importing this backup will replace your current notebooks. " +
                "Export a backup of your existing notes first if needed. Continue?"
            )) {
                return;
            }

            data = imported;

            if (!data.notebooks.length) {
                data = defaultData();
            }

            activeNotebookId = data.notebooks[0].id;
            activeSectionId =
                data.notebooks[0].sections[0]?.id || null;
            activePageId =
                data.notebooks[0].sections[0]?.pages[0]?.id || null;

            if (!saveData()) {
                showToast("Import could not be saved");
                return;
            }

            renderAll();
            updateEditor();

            showToast("Backup imported successfully");

        } catch (error) {
            console.error(error);
            showToast("Invalid or unreadable backup file");

        } finally {
            event.target.value = "";
        }
    }
);

/* ==========================================
   THEME
========================================== */

function toggleTheme() {
    document.body.classList.toggle("dark");

    try {
        localStorage.setItem(
            THEME_KEY,
            document.body.classList.contains("dark") ? "dark" : "light"
        );
    } catch (error) {
        console.warn("Theme preference could not be saved.");
    }
}

/* ==========================================
   MOBILE NAVIGATION
========================================== */

const workspace = document.getElementById("workspace");

function showMobileNotebooks() {
    workspace.classList.remove("show-sections", "show-pages");
    workspace.classList.add("show-notebooks");
}

function showMobileSections() {
    workspace.classList.remove("show-notebooks", "show-pages");
    workspace.classList.add("show-sections");
}

function showMobilePages() {
    workspace.classList.remove("show-notebooks", "show-sections");
    workspace.classList.add("show-pages");
}

function hideMobilePanels() {
    workspace.classList.remove(
        "show-notebooks",
        "show-sections",
        "show-pages"
    );
}

/* ==========================================
   TOAST NOTIFICATIONS
========================================== */

function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

/* ==========================================
   KEYBOARD SHORTCUTS
========================================== */

document.addEventListener("keydown", function(event) {
    const isMac = navigator.platform.toUpperCase().includes("MAC");
    const modifier = isMac ? event.metaKey : event.ctrlKey;

    if (!modifier) return;

    const key = event.key.toLowerCase();

    if (key === "s") {
        event.preventDefault();

        saveCurrentEditor();

        clearTimeout(saveTimer);

        saveData();

        showToast("Notes saved");
    }

    if (key === "n" && !event.shiftKey) {
        event.preventDefault();
        newPage();
    }

    if (key === "b") {
        event.preventDefault();
        runCommand("bold");
    }

    if (key === "i") {
        event.preventDefault();
        runCommand("italic");
    }

    if (key === "u") {
        event.preventDefault();
        runCommand("underline");
    }

    if (key === "f") {
        event.preventDefault();
        searchInput.focus();
    }
});

/* ==========================================
   BEFORE PAGE EXIT
========================================== */

window.addEventListener("beforeunload", function() {
    clearTimeout(saveTimer);

    const page = getPage();

    if (page) {
        page.title =
            document.getElementById("pageTitle").value.trim() ||
            "Untitled page";

        page.content = document.getElementById("editor").innerHTML;
        page.updatedAt = now();
    }

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (error) {
        console.warn("Final save failed.");
    }
});

/* ==========================================
   INITIALIZE
========================================== */

loadData();

</script>
