<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7719aa">
<title>OneNote Pro — Infinite Workspace & Mind Maps</title>

<style>
:root {
    --primary: #7719aa;
    --primary-light: #f1e6fa;
    --bg: #ffffff;
    --panel: #f7f6f9;
    --surface: #ffffff;
    --surface2: #f0eef4;
    --text: #25232b;
    --muted: #777481;
    --border: #e4e0e9;
    --hover: #ece8f2;
    --grid: #e9e4f0;
}

body.dark {
    --primary: #c38aee;
    --primary-light: #392647;
    --bg: #201e24;
    --panel: #29272f;
    --surface: #242229;
    --surface2: #34313b;
    --text: #f4eff9;
    --muted: #b6afc1;
    --border: #45414d;
    --hover: #3a3642;
    --grid: #413a49;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
}

button, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* HEADER */

.topbar {
    height: 58px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
    white-space: nowrap;
}

.logo {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    background: var(--primary);
    color: white;
    border-radius: 7px;
}

.search {
    flex: 1;
    max-width: 420px;
    min-width: 60px;
    margin-left: 15px;
}

.search input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel);
    color: var(--text);
}

.header-actions {
    display: flex;
    gap: 5px;
    margin-left: auto;
}

.btn {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    background: var(--surface);
    white-space: nowrap;
}

.btn:hover {
    background: var(--hover);
}

.btn.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.btn.primary:hover {
    filter: brightness(1.1);
}

.btn.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
}

/* APPLICATION LAYOUT */

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.workspace {
    display: flex;
    flex: 1;
    min-height: 0;
}

/* NOTEBOOK SIDEBAR */

.sidebar {
    width: 210px;
    min-width: 180px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
}

.panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 17px 12px 12px;
    font-weight: 750;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
}

.list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
}

.list-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 3px;
    cursor: pointer;
    min-width: 0;
}

.list-item:hover {
    background: var(--hover);
}

.list-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 650;
}

.list-item .name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.small-icon {
    padding: 5px 7px;
    border: none;
    background: transparent;
    color: inherit;
    border-radius: 5px;
}

.small-icon:hover {
    background: var(--hover);
}

.section-panel {
    width: 190px;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
}

.page-panel {
    width: 195px;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
}

.page-item {
    display: block;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.page-item:hover {
    background: var(--hover);
}

.page-item.active {
    background: var(--primary-light);
    border-left: 3px solid var(--primary);
}

.page-item .name {
    font-weight: 650;
    font-size: 13px;
}

.page-item .preview {
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.4;
}

/* EDITOR */

.editor-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
}

.editor-header {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
}

.breadcrumb {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.save-status {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
}

.tabs {
    display: flex;
    gap: 5px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
}

.tab {
    padding: 8px 12px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    white-space: nowrap;
}

.tab.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
    font-weight: 700;
}

.toolstrip {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.toolstrip select,
.toolstrip input[type="color"] {
    height: 31px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    color: var(--text);
}

.toolstrip select {
    max-width: 115px;
}

.toolstrip input[type="color"] {
    width: 35px;
    padding: 2px;
}

.tool-btn {
    min-height: 31px;
    padding: 5px 9px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
}

.tool-btn:hover {
    background: var(--hover);
}

.tool-btn.active {
    background: var(--primary-light);
    color: var(--primary);
}

/* NOTE EDITOR */

.note-scroll {
    flex: 1;
    overflow: auto;
    padding: 28px 35px 60px;
}

.note-container {
    max-width: 900px;
    margin: auto;
}

.page-title {
    display: block;
    width: 100%;
    resize: none;
    overflow: hidden;
    border: none;
    outline: none;
    font-size: 30px;
    font-weight: 750;
    line-height: 1.3;
    padding: 4px 0 14px;
    color: var(--text);
    background: transparent;
}

.page-meta {
    color: var(--muted);
    font-size: 11px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
}

.note-editor {
    min-height: 500px;
    outline: none;
    font-size: 16px;
    line-height: 1.85;
    overflow-wrap: anywhere;
}

.note-editor:empty::before {
    content: "Start writing your notes...";
    color: var(--muted);
}

.note-editor img {
    max-width: 100%;
    height: auto;
}

.note-editor table {
    width: 100%;
    border-collapse: collapse;
}

.note-editor th,
.note-editor td {
    border: 1px solid var(--border);
    padding: 8px;
}

.note-editor blockquote {
    margin-left: 0;
    padding: 8px 15px;
    border-left: 4px solid var(--primary);
    background: var(--panel);
}

/* INFINITE CANVAS */

.canvas-shell {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

.canvas-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 2;
}

.canvas-help {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
}

.canvas-viewport {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
    background-color: var(--bg);
    background-image:
        radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    overscroll-behavior: contain;
}

/*
The canvas is large and expands in both directions.
Its size is persisted with each page.
*/

.canvas-world {
    position: relative;
    width: 5000px;
    height: 5000px;
    transform-origin: top left;
}

.canvas-world.grid-off {
    background-image: none;
}

/* NOTE CARDS ON CANVAS */

.canvas-card {
    position: absolute;
    width: 300px;
    min-height: 155px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    overflow: hidden;
}

.canvas-card.selected {
    outline: 2px solid var(--primary);
}

.canvas-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    cursor: grab;
    user-select: none;
    touch-action: none;
}

.canvas-card-title {
    flex: 1;
    font-size: 12px;
    font-weight: 750;
}

.canvas-card-body {
    padding: 10px;
    min-height: 100px;
    outline: none;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.canvas-card-body:empty::before {
    content: "Write here...";
    color: var(--muted);
}

.canvas-card-body img {
    max-width: 100%;
}

.card-action {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 3px 5px;
    border-radius: 4px;
}

.card-action:hover {
    background: var(--hover);
}

/* MIND MAP */

.mindmap-shell {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.mindmap-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}

.mindmap-viewport {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background-color: var(--bg);
    background-image:
        radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    position: relative;
    touch-action: pan-x pan-y;
}

.mindmap-world {
    position: relative;
    width: 4000px;
    height: 3000px;
    transform-origin: top left;
}

.mindmap-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
}

.mind-node {
    position: absolute;
    width: 170px;
    min-height: 64px;
    padding: 10px 12px;
    border: 2px solid var(--primary);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 3px 14px rgba(0,0,0,.09);
    display: flex;
    align-items: center;
    gap: 7px;
    z-index: 2;
    touch-action: none;
}

.mind-node.root {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.mind-node.selected {
    outline: 3px solid #f4b942;
    outline-offset: 3px;
}

.node-text {
    flex: 1;
    min-width: 0;
    text-align: center;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    cursor: text;
    outline: none;
    max-height: 150px;
    overflow-y: auto;
}

.node-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    flex-shrink: 0;
}

.root .node-dot {
    background: white;
}

.mindmap-status {
    font-size: 11px;
    color: var(--muted);
    padding: 6px 10px;
    border-top: 1px solid var(--border);
}

/* EMPTY STATE */

.empty-state {
    margin: auto;
    padding: 25px;
    text-align: center;
    max-width: 400px;
    color: var(--muted);
}

.empty-state h2 {
    color: var(--text);
}

/* FOOTER */

.footer {
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 10px;
}

/* MODAL */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.48);
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    color: var(--text);
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 12px 50px rgba(0,0,0,.2);
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea,
.modal select {
    display: block;
    width: 100%;
    padding: 10px;
    margin: 10px 0 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    background: #29242f;
    color: white;
    padding: 10px 16px;
    border-radius: 7px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: 90vw;
    text-align: center;
}

.toast.show {
    opacity: 1;
}

/* MOBILE */

.mobile-only {
    display: none;
}

@media(max-width: 950px) {
    .sidebar {
        width: 170px;
        min-width: 145px;
    }

    .section-panel,
    .page-panel {
        width: 155px;
        min-width: 135px;
    }

    .note-scroll {
        padding: 22px 20px 40px;
    }
}

@media(max-width: 700px) {
    .topbar {
        height: 53px;
        padding: 0 7px;
        gap: 6px;
    }

    .brand {
        font-size: 14px;
    }

    .brand .brand-text {
        display: none;
    }

    .search {
        margin-left: 0;
    }

    .header-actions .desktop-only {
        display: none;
    }

    .header-actions .btn {
        padding: 7px 8px;
    }

    .mobile-only {
        display: inline-block;
    }

    .workspace {
        position: relative;
    }

    .sidebar,
    .section-panel,
    .page-panel {
        display: none;
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
        min-width: 0;
        z-index: 20;
        background: var(--surface);
    }

    .workspace.show-notebooks .sidebar {
        display: flex;
    }

    .workspace.show-sections .section-panel {
        display: flex;
    }

    .workspace.show-pages .page-panel {
        display: flex;
    }

    .editor-header {
        padding: 6px 8px;
    }

    .note-scroll {
        padding: 17px 14px 35px;
    }

    .page-title {
        font-size: 25px;
    }

    .canvas-help {
        margin-left: 0;
        width: 100%;
    }

    .toolstrip {
        max-height: 125px;
        overflow-y: auto;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <button class="btn mobile-only"
            onclick="showPanel('notebooks')">☰</button>

    <div class="brand">
        <div class="logo">N</div>
        <span class="brand-text">OneNote Pro</span>
    </div>

    <div class="search">
        <input id="searchInput"
               placeholder="Search notes, pages, mind maps..."
               autocomplete="off">
    </div>

    <div class="header-actions">
        <button class="btn desktop-only" onclick="exportBackup()">Export</button>
        <button class="btn desktop-only"
                onclick="document.getElementById('importInput').click()">
            Import
        </button>
        <button class="btn" onclick="toggleTheme()">◐</button>
        <button class="btn primary" onclick="newNotebook()">+ Notebook</button>
    </div>

</header>

<main class="workspace show-notebooks" id="workspace">

    <aside class="sidebar">

        <div class="panel-heading">
            Notebooks
            <button class="small-icon" onclick="newNotebook()">＋</button>
        </div>

        <div class="list" id="notebookList"></div>

    </aside>

    <aside class="section-panel">

        <div class="panel-heading">
            Sections
            <button class="small-icon" onclick="newSection()">＋</button>
        </div>

        <div class="list" id="sectionList"></div>

    </aside>

    <aside class="page-panel">

        <div class="panel-heading">
            Pages
            <button class="small-icon" onclick="newPage()">＋</button>
        </div>

        <div class="list" id="pageList"></div>

    </aside>

    <section class="editor-area">

        <div class="editor-header">
            <div class="breadcrumb" id="breadcrumb">My Notebook</div>
            <div class="save-status" id="saveStatus">Ready</div>
        </div>

        <!-- MODE TABS -->

        <div class="tabs">

            <button class="tab active"
                    data-mode="note"
                    onclick="switchMode('note')">
                📝 Notes
            </button>

            <button class="tab"
                    data-mode="canvas"
                    onclick="switchMode('canvas')">
                ▦ Infinite Workspace
            </button>

            <button class="tab"
                    data-mode="mindmap"
                    onclick="switchMode('mindmap')">
                🧠 Mind Map
            </button>

        </div>

        <!-- RICH TEXT TOOLBAR -->

        <div class="toolstrip" id="noteToolbar">

            <button class="tool-btn" onclick="format('undo')">↶</button>
            <button class="tool-btn" onclick="format('redo')">↷</button>

            <select onchange="formatBlock(this.value)">
                <option value="P">Paragraph</option>
                <option value="H1">Heading 1</option>
                <option value="H2">Heading 2</option>
                <option value="H3">Heading 3</option>
                <option value="BLOCKQUOTE">Quote</option>
            </select>

            <button class="tool-btn" onclick="format('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="format('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="format('underline')"><u>U</u></button>

            <button class="tool-btn"
                    onclick="format('insertUnorderedList')">• List</button>

            <button class="tool-btn"
                    onclick="format('insertOrderedList')">1. List</button>

            <input type="color"
                   value="#7719aa"
                   title="Text color"
                   onchange="format('foreColor',this.value)">

            <input type="color"
                   value="#fff176"
                   title="Highlight"
                   onchange="format('hiliteColor',this.value)">

            <button class="tool-btn" onclick="insertNoteTable()">▦ Table</button>

            <button class="tool-btn" onclick="insertNoteLink()">🔗 Link</button>

        </div>

        <!-- NOTES VIEW -->

        <div class="note-scroll" id="noteView">

            <div class="note-container">

                <textarea id="pageTitle"
                          class="page-title"
                          rows="1"
                          placeholder="Page name"></textarea>

                <div class="page-meta" id="pageMeta"></div>

                <div id="noteEditor"
                     class="note-editor"
                     contenteditable="true"
                     spellcheck="true"></div>

            </div>

        </div>

        <!-- INFINITE WORKSPACE VIEW -->

        <div class="canvas-shell" id="canvasView">

            <div class="canvas-toolbar">

                <button class="btn primary" onclick="addCanvasCard()">
                    + Add Note
                </button>

                <button class="btn" onclick="expandCanvas()">
                    Expand Workspace
                </button>

                <button class="btn" onclick="centerCanvas()">
                    Go to Origin
                </button>

                <button class="btn" onclick="toggleGrid()">
                    Toggle Grid
                </button>

                <button class="btn" onclick="clearCanvasSelection()">
                    Deselect
                </button>

                <span class="canvas-help">
                    Drag card headers • Scroll horizontally and vertically
                </span>

            </div>

            <div class="canvas-viewport" id="canvasViewport">

                <div class="canvas-world" id="canvasWorld"></div>

            </div>

        </div>

        <!-- MIND MAP VIEW -->

        <div class="mindmap-shell" id="mindmapView">

            <div class="mindmap-toolbar">

                <button class="btn primary" onclick="addMindNode()">
                    + Add Node
                </button>

                <button class="btn" onclick="addChildNode()">
                    + Child Node
                </button>

                <button class="btn" onclick="editMindNode()">
                    Edit Node
                </button>

                <button class="btn" onclick="deleteMindNode()">
                    Delete Node
                </button>

                <button class="btn" onclick="connectMindNodes()">
                    Connect Nodes
                </button>

                <button class="btn" onclick="disconnectMindNodes()">
                    Disconnect
                </button>

                <button class="btn" onclick="centerMindMap()">
                    Center
                </button>

                <button class="btn" onclick="resetMindMap()">
                    Reset Map
                </button>

            </div>

            <div class="mindmap-viewport" id="mindmapViewport">

                <div class="mindmap-world" id="mindmapWorld">

                    <svg class="mindmap-lines"
                         id="mindmapLines"
                         xmlns="http://www.w3.org/2000/svg"></svg>

                    <div id="mindNodes"></div>

                </div>

            </div>

            <div class="mindmap-status" id="mindmapStatus">
                Select a node to edit it.
            </div>

        </div>

        <footer class="footer">
            <span id="wordCount">0 words</span>
            <span>Local browser storage • Offline capable</span>
        </footer>

    </section>

</main>

</div>

<input type="file"
       id="importInput"
       accept=".json,application/json"
       hidden>

<div class="modal-bg" id="modalBg">

    <div class="modal">

        <h2 id="modalTitle">Create</h2>

        <label id="modalLabel">Name</label>

        <input id="modalInput"
               maxlength="200"
               placeholder="Enter name">

        <div class="modal-actions">

            <button class="btn" onclick="closeModal()">Cancel</button>

            <button class="btn primary"
                    id="modalSubmit">Continue</button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================
   STORAGE AND STATE
============================================ */

const STORAGE_KEY = "onenote_pro_infinite_v2";
const THEME_KEY = "onenote_pro_theme";

let db;
let notebookId = null;
let sectionId = null;
let pageId = null;
let currentMode = "note";

let saveTimer = null;
let toastTimer = null;
let modalCallback = null;

let selectedCanvasCard = null;
let selectedMindNode = null;
let pendingConnection = null;

let mindDrag = null;
let cardDrag = null;

const colors = [
    "#7b61ff",
    "#e34d75",
    "#16a085",
    "#f39c12",
    "#3498db",
    "#8e44ad",
    "#d35400"
];

function uid() {
    return "id_" + Date.now().toString(36) +
        Math.random().toString(36).slice(2, 8);
}

function escapeHTML(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[ch]);
}

function safeId(s) {
    return /^[a-zA-Z0-9_-]+$/.test(s || "") ? s : "";
}

function plainText(html) {
    const div = document.createElement("div");
    div.innerHTML = html || "";
    return (div.textContent || "").trim();
}

function timestamp() {
    return new Date().toISOString();
}

function createPage(name = "New Page") {
    return {
        id: uid(),
        name,
        content: "",
        createdAt: timestamp(),
        updatedAt: timestamp(),

        // Infinite workspace cards and dimensions
        canvas: {
            width: 5000,
            height: 5000,
            grid: true,
            cards: []
        },

        // Mind map nodes and edges
        mindmap: {
            width: 4000,
            height: 3000,
            nodes: [],
            edges: []
        }
    };
}

function createSection(name = "General") {
    const p = createPage("Welcome");

    return {
        id: uid(),
        name,
        color: colors[0],
        pages: [p]
    };
}

function createNotebook(name = "My Notebook") {
    return {
        id: uid(),
        name,
        sections: [createSection()]
    };
}

function initialData() {
    const n = createNotebook("My Notebook");
    const s = n.sections[0];
    const p = s.pages[0];

    p.name = "Welcome to OneNote Pro";

    p.content = `
        <h1>Welcome to OneNote Pro</h1>
        <p>Your notes, infinite workspace and mind maps are all in one place.</p>
        <h2>Getting started</h2>
        <ul>
            <li>Use Notes for traditional documents.</li>
            <li>Use Infinite Workspace to arrange separate note cards.</li>
            <li>Use Mind Map to connect ideas visually.</li>
        </ul>
        <blockquote>Ideas become clearer when you organize them.</blockquote>
    `;

    p.mindmap.nodes = [{
        id: uid(),
        text: "My Ideas",
        x: 1750,
        y: 1300,
        root: true
    }];

    return {
        version: 2,
        notebooks: [n]
    };
}

/* ============================================
   VALIDATE IMPORTED DATA
============================================ */

function validateData(input) {
    if (!input || !Array.isArray(input.notebooks)) {
        throw new Error("Invalid backup");
    }

    const result = { version: 2, notebooks: [] };

    for (const n of input.notebooks) {
        if (!n || typeof n.name !== "string") continue;

        const nn = {
            id: safeId(n.id) || uid(),
            name: n.name.slice(0, 200),
            sections: []
        };

        for (const s of (Array.isArray(n.sections) ? n.sections : [])) {
            if (!s || typeof s.name !== "string") continue;

            const ss = {
                id: safeId(s.id) || uid(),
                name: s.name.slice(0, 200),
                color: colors.includes(s.color) ? s.color : colors[0],
                pages: []
            };

            for (const p of (Array.isArray(s.pages) ? s.pages : [])) {
                if (!p || typeof p.name !== "string") continue;

                const pp = createPage(p.name.slice(0, 300));

                pp.id = safeId(p.id) || uid();
                pp.content = typeof p.content === "string" ? p.content : "";
                pp.createdAt = p.createdAt || timestamp();
                pp.updatedAt = p.updatedAt || timestamp();

                if (p.canvas && typeof p.canvas === "object") {
                    pp.canvas.width = Math.max(
                        2000, Math.min(50000, Number(p.canvas.width) || 5000)
                    );

                    pp.canvas.height = Math.max(
                        2000, Math.min(50000, Number(p.canvas.height) || 5000)
                    );

                    pp.canvas.grid = p.canvas.grid !== false;

                    pp.canvas.cards = Array.isArray(p.canvas.cards)
                        ? p.canvas.cards
                            .filter(c => c && typeof c.content === "string")
                            .map(c => ({
                                id: safeId(c.id) || uid(),
                                title: String(c.title || "Note").slice(0, 200),
                                content: c.content.slice(0, 200000),
                                x: Math.max(-100000, Math.min(100000, Number(c.x) || 0)),
                                y: Math.max(-100000, Math.min(100000, Number(c.y) || 0))
                            }))
                        : [];
                }

                if (p.mindmap && typeof p.mindmap === "object") {
                    pp.mindmap.width = Math.max(
                        2000, Math.min(50000, Number(p.mindmap.width) || 4000)
                    );

                    pp.mindmap.height = Math.max(
                        2000, Math.min(50000, Number(p.mindmap.height) || 3000)
                    );

                    pp.mindmap.nodes = Array.isArray(p.mindmap.nodes)
                        ? p.mindmap.nodes
                            .filter(node => node && typeof node.text === "string")
                            .map(node => ({
                                id: safeId(node.id) || uid(),
                                text: node.text.slice(0, 2000),
                                x: Math.max(-100000, Math.min(100000, Number(node.x) || 0)),
                                y: Math.max(-100000, Math.min(100000, Number(node.y) || 0)),
                                root: !!node.root
                            }))
                        : [];

                    const validNodeIds = new Set(
                        pp.mindmap.nodes.map(node => node.id)
                    );

                    pp.mindmap.edges = Array.isArray(p.mindmap.edges)
                        ? p.mindmap.edges
                            .filter(edge =>
                                edge &&
                                validNodeIds.has(edge.from) &&
                                validNodeIds.has(edge.to) &&
                                edge.from !== edge.to
                            )
                            .map(edge => ({
                                from: edge.from,
                                to: edge.to
                            }))
                        : [];
                }

                ss.pages.push(pp);
            }

            nn.sections.push(ss);
        }

        result.notebooks.push(nn);
    }

    return result;
}

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        db = saved ? validateData(JSON.parse(saved)) : initialData();
    } catch (error) {
        console.error(error);
        db = initialData();
        notify("Could not load old data. A new workspace was opened.");
    }

    if (!db.notebooks.length) db = initialData();

    notebookId = db.notebooks[0].id;
    sectionId = db.notebooks[0].sections[0]?.id || null;
    pageId = db.notebooks[0].sections[0]?.pages[0]?.id || null;

    if (localStorage.getItem(THEME_KEY) === "dark") {
        document.body.classList.add("dark");
    }

    renderAll();
    updateEditor();
}

/* ============================================
   ACTIVE OBJECTS
============================================ */

function getNotebook() {
    return db.notebooks.find(n => n.id === notebookId) || null;
}

function getSection() {
    const n = getNotebook();
    return n?.sections.find(s => s.id === sectionId) || null;
}

function getPage() {
    const s = getSection();
    return s?.pages.find(p => p.id === pageId) || null;
}

function ensureSelection() {
    if (!db.notebooks.length) db.notebooks.push(createNotebook());

    let n = getNotebook();

    if (!n) {
        n = db.notebooks[0];
        notebookId = n.id;
    }

    if (!n.sections.length) n.sections.push(createSection());

    let s = n.sections.find(x => x.id === sectionId);

    if (!s) {
        s = n.sections[0];
        sectionId = s.id;
    }

    if (!s.pages.length) s.pages.push(createPage());

    let p = s.pages.find(x => x.id === pageId);

    if (!p) {
        p = s.pages[0];
        pageId = p.id;
    }
}

/* ============================================
   SAVE
============================================ */

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

        document.getElementById("saveStatus").textContent =
            "Saved " + new Date().toLocaleTimeString();

        return true;

    } catch (error) {
        console.error(error);

        document.getElementById("saveStatus").textContent =
            "Storage full";

        notify("Saving failed. Export your backup and reduce stored images.");

        return false;
    }
}

function scheduleSave() {
    document.getElementById("saveStatus").textContent = "Saving...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveData();
        renderPages();
    }, 350);
}

/* ============================================
   RENDER LISTS
============================================ */

function renderNotebooks() {
    document.getElementById("notebookList").innerHTML =
        db.notebooks.map(n => `
            <div class="list-item ${n.id === notebookId ? "active" : ""}"
                 onclick="selectNotebook('${n.id}')">

                <span>📘</span>

                <span class="name">${escapeHTML(n.name)}</span>

                <button class="small-icon"
                        title="Rename notebook"
                        onclick="event.stopPropagation();renameNotebook('${n.id}')">
                    ⋮
                </button>

            </div>
        `).join("");
}

function renderSections() {
    const n = getNotebook();

    document.getElementById("sectionList").innerHTML =
        (n?.sections || []).map(s => `
            <div class="list-item ${s.id === sectionId ? "active" : ""}"
                 onclick="selectSection('${s.id}')">

                <span style="color:${escapeHTML(s.color)}">●</span>

                <span class="name">${escapeHTML(s.name)}</span>

                <button class="small-icon"
                        title="Rename section"
                        onclick="event.stopPropagation();renameSection('${s.id}')">
                    ⋮
                </button>

            </div>
        `).join("");
}

function renderPages() {
    const s = getSection();

    document.getElementById("pageList").innerHTML =
        (s?.pages || []).map(p => `
            <div class="page-item ${p.id === pageId ? "active" : ""}"
                 onclick="selectPage('${p.id}')">

                <div class="name">${escapeHTML(p.name)}</div>

                <div class="preview">
                    ${escapeHTML(plainText(p.content).slice(0, 65))}
                </div>

                <button class="small-icon"
                        title="Rename page"
                        onclick="event.stopPropagation();renamePage('${p.id}')">
                    Rename
                </button>

            </div>
        `).join("");
}

function renderAll() {
    ensureSelection();

    renderNotebooks();
    renderSections();
    renderPages();

    updateBreadcrumb();
}

function updateBreadcrumb() {
    const n = getNotebook();
    const s = getSection();
    const p = getPage();

    document.getElementById("breadcrumb").textContent =
        [n?.name, s?.name, p?.name].filter(Boolean).join("  ›  ");
}

/* ============================================
   SELECT ITEMS
============================================ */

function selectNotebook(id) {
    notebookId = id;

    const n = getNotebook();

    sectionId = n?.sections[0]?.id || null;
    pageId = n?.sections[0]?.pages[0]?.id || null;

    renderAll();
    updateEditor();
    showPanel("");
}

function selectSection(id) {
    sectionId = id;

    const s = getSection();

    pageId = s?.pages[0]?.id || null;

    renderAll();
    updateEditor();

    if (innerWidth <= 700) showPanel("pages");
}

function selectPage(id) {
    pageId = id;

    renderPages();
    updateEditor();

    if (innerWidth <= 700) showPanel("");
}

/* ============================================
   CREATE, RENAME AND DELETE
============================================ */

function showModal(title, label, initial, callback) {
    modalCallback = callback;

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalLabel").textContent = label;
    document.getElementById("modalInput").value = initial || "";

    document.getElementById("modalBg").classList.add("show");

    setTimeout(() => document.getElementById("modalInput").focus(), 50);
}

function closeModal() {
    document.getElementById("modalBg").classList.remove("show");
    modalCallback = null;
}

document.getElementById("modalSubmit").onclick = () => {
    const value = document.getElementById("modalInput").value.trim();

    if (!value) {
        notify("Enter a name first");
        return;
    }

    const callback = modalCallback;

    closeModal();

    if (callback) callback(value);
};

document.getElementById("modalInput").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("modalSubmit").click();
    if (e.key === "Escape") closeModal();
});

function newNotebook() {
    showModal("Create Notebook", "Notebook name", "My Notebook", name => {
        const n = createNotebook(name);

        db.notebooks.push(n);

        notebookId = n.id;
        sectionId = n.sections[0].id;
        pageId = n.sections[0].pages[0].id;

        saveData();
        renderAll();
        updateEditor();
    });
}

function renameNotebook(id) {
    const n = db.notebooks.find(x => x.id === id);
    if (!n) return;

    showModal("Rename Notebook", "Notebook name", n.name, name => {
        n.name = name;
        saveData();
        renderAll();
    });
}

function deleteNotebook(id) {
    const n = db.notebooks.find(x => x.id === id);
    if (!n) return;

    if (!confirm("Delete notebook and all its contents?")) return;

    db.notebooks = db.notebooks.filter(x => x.id !== id);

    notebookId = db.notebooks[0]?.id || null;
    sectionId = null;
    pageId = null;

    ensureSelection();
    saveData();
    renderAll();
    updateEditor();
}

function newSection() {
    const n = getNotebook();
    if (!n) return;

    showModal("Create Section", "Section name", "New Section", name => {
        const s = createSection(name);
        s.color = colors[n.sections.length % colors.length];

        n.sections.push(s);

        sectionId = s.id;
        pageId = s.pages[0].id;

        saveData();
        renderAll();
        updateEditor();
    });
}

function renameSection(id) {
    const n = getNotebook();
    const s = n?.sections.find(x => x.id === id);
    if (!s) return;

    showModal("Rename Section", "Section name", s.name, name => {
        s.name = name;
        saveData();
        renderAll();
    });
}

function deleteSection(id) {
    const n = getNotebook();
    const s = n?.sections.find(x => x.id === id);

    if (!n || !s) return;

    if (!confirm("Delete this section and all its pages?")) return;

    n.sections = n.sections.filter(x => x.id !== id);

    sectionId = n.sections[0]?.id || null;
    pageId = n.sections[0]?.pages[0]?.id || null;

    ensureSelection();
    saveData();
    renderAll();
    updateEditor();
}

function newPage() {
    const s = getSection();
    if (!s) return;

    const p = createPage("New Page");

    s.pages.push(p);
    pageId = p.id;

    saveData();
    renderAll();
    updateEditor();
}

function renamePage(id) {
    const s = getSection();
    const p = s?.pages.find(x => x.id === id);

    if (!p) return;

    showModal("Rename Page", "Page name", p.name, name => {
        p.name = name;
        p.updatedAt = timestamp();

        saveData();
        renderAll();
        updateBreadcrumb();
    });
}

/* ============================================
   NOTES EDITOR
============================================ */

function updateEditor() {
    ensureSelection();

    const p = getPage();

    if (!p) return;

    document.getElementById("pageTitle").value = p.name;
    document.getElementById("noteEditor").innerHTML = p.content || "";

    document.getElementById("pageMeta").textContent =
        "Created: " + new Date(p.createdAt).toLocaleString() +
        " | Updated: " + new Date(p.updatedAt).toLocaleString();

    updateBreadcrumb();
    updateWordCount();

    renderCanvas();
    renderMindMap();
}

function saveNote() {
    const p = getPage();
    if (!p) return;

    p.name =
        document.getElementById("pageTitle").value.trim() || "New Page";

    p.content = document.getElementById("noteEditor").innerHTML;
    p.updatedAt = timestamp();

    document.getElementById("pageTitle").style.height = "auto";
    document.getElementById("pageTitle").style.height =
        document.getElementById("pageTitle").scrollHeight + "px";

    document.getElementById("pageMeta").textContent =
        "Created: " + new Date(p.createdAt).toLocaleString() +
        " | Updated: " + new Date(p.updatedAt).toLocaleString();

    updateBreadcrumb();
    updateWordCount();
    scheduleSave();
}

document.getElementById("pageTitle").addEventListener("input", saveNote);
document.getElementById("noteEditor").addEventListener("input", saveNote);

function updateWordCount() {
    const text = plainText(document.getElementById("noteEditor").innerHTML);

    const words = text ? text.split(/\s+/).filter(Boolean).length : 0;

    document.getElementById("wordCount").textContent = words + " words";
}

function format(command, value = null) {
    document.getElementById("noteEditor").focus();

    document.execCommand(command, false, value);

    saveNote();
}

function formatBlock(tag) {
    document.getElementById("noteEditor").focus();

    document.execCommand("formatBlock", false, "<" + tag.toLowerCase() + ">");

    saveNote();
}

function insertNoteTable() {
    const rows = Number(prompt("Rows (1–15):", "3"));
    const cols = Number(prompt("Columns (1–10):", "3"));

    if (
        !Number.isInteger(rows) || rows < 1 || rows > 15 ||
        !Number.isInteger(cols) || cols < 1 || cols > 10
    ) {
        notify("Invalid table size");
        return;
    }

    let html = "<table><tbody>";

    for (let r = 0; r < rows; r++) {
        html += "<tr>";

        for (let c = 0; c < cols; c++) {
            html += r === 0 ? "<th>Heading</th>" : "<td>Text</td>";
        }

        html += "</tr>";
    }

    html += "</tbody></table><p><br></p>";

    document.getElementById("noteEditor").focus();
    document.execCommand("insertHTML", false, html);

    saveNote();
}

function insertNoteLink() {
    const raw = prompt("Enter HTTP or HTTPS URL:");
    if (!raw) return;

    try {
        const url = new URL(raw);

        if (!["http:", "https:"].includes(url.protocol)) {
            throw new Error("Unsupported protocol");
        }

        format("createLink", url.href);

    } catch {
        notify("Enter a valid HTTP or HTTPS URL");
    }
}

/* ============================================
   VIEW SWITCHING
============================================ */

function switchMode(mode) {
    currentMode = mode;

    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.mode === mode);
    });

    document.getElementById("noteToolbar").style.display =
        mode === "note" ? "flex" : "none";

    document.getElementById("noteView").style.display =
        mode === "note" ? "block" : "none";

    document.getElementById("canvasView").style.display =
        mode === "canvas" ? "flex" : "none";

    document.getElementById("mindmapView").style.display =
        mode === "mindmap" ? "flex" : "none";

    if (mode === "canvas") renderCanvas();
    if (mode === "mindmap") renderMindMap();

    if (innerWidth <= 700) showPanel("");
}

/* ============================================
   INFINITE WORKSPACE
============================================ */

function getCanvas() {
    const p = getPage();

    if (!p.canvas) {
        p.canvas = {
            width: 5000,
            height: 5000,
            grid: true,
            cards: []
        };
    }

    return p.canvas;
}

function expandCanvas() {
    const c = getCanvas();

    c.width = Math.min(50000, c.width + 3000);
    c.height = Math.min(50000, c.height + 3000);

    renderCanvas();
    scheduleSave();

    notify("Workspace expanded to " + c.width + " × " + c.height);
}

function toggleGrid() {
    const c = getCanvas();

    c.grid = !c.grid;

    renderCanvas();
    scheduleSave();
}

function centerCanvas() {
    const viewport = document.getElementById("canvasViewport");

    viewport.scrollLeft = 0;
    viewport.scrollTop = 0;
}

function addCanvasCard() {
    const c = getCanvas();

    const x = Math.max(20, document.getElementById("canvasViewport").scrollLeft + 80);
    const y = Math.max(20, document.getElementById("canvasViewport").scrollTop + 80);

    const card = {
        id: uid(),
        title: "New Note",
        content: "",
        x,
        y
    };

    c.cards.push(card);

    selectedCanvasCard = card.id;

    renderCanvas();
    scheduleSave();
}

function renderCanvas() {
    const c = getCanvas();
    const world = document.getElementById("canvasWorld");

    world.style.width = c.width + "px";
    world.style.height = c.height + "px";

    world.style.backgroundImage = c.grid
        ? "radial-gradient(var(--grid) 1px, transparent 1px)"
        : "none";

    world.style.backgroundSize = "22px 22px";

    world.innerHTML = "";

    c.cards.forEach(card => {
        const element = document.createElement("div");

        element.className =
            "canvas-card" +
            (card.id === selectedCanvasCard ? " selected" : "");

        element.dataset.id = card.id;

        element.style.left = card.x + "px";
        element.style.top = card.y + "px";

        const header = document.createElement("div");
        header.className = "canvas-card-header";

        const title = document.createElement("input");

        title.className = "canvas-card-title";
        title.value = card.title;
        title.setAttribute("aria-label", "Note card title");

        title.style.border = "none";
        title.style.background = "transparent";
        title.style.color = "var(--text)";
        title.style.minWidth = "0";
        title.style.outline = "none";

        title.addEventListener("input", () => {
            card.title = title.value;
            scheduleSave();
        });

        const remove = document.createElement("button");
        remove.className = "card-action";
        remove.textContent = "×";
        remove.title = "Delete note card";

        remove.onclick = () => {
            if (!confirm("Delete this workspace note?")) return;

            c.cards = c.cards.filter(x => x.id !== card.id);

            if (selectedCanvasCard === card.id) selectedCanvasCard = null;

            renderCanvas();
            scheduleSave();
        };

        header.append(title, remove);

        const body = document.createElement("div");
        body.className = "canvas-card-body";
        body.contentEditable = "true";
        body.spellcheck = true;
        body.innerHTML = card.content;

        body.addEventListener("input", () => {
            card.content = body.innerHTML;
            scheduleSave();
        });

        element.append(header, body);

        element.addEventListener("pointerdown", () => {
            selectedCanvasCard = card.id;
        });

        header.addEventListener("pointerdown", event => {
            if (event.target.closest("button") ||
                event.target.closest("input")) return;

            event.preventDefault();

            const startX = event.clientX;
            const startY = event.clientY;
            const originalX = card.x;
            const originalY = card.y;

            header.setPointerCapture(event.pointerId);

            const move = e => {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                card.x = Math.max(-100000, Math.min(100000, originalX + dx));
                card.y = Math.max(-100000, Math.min(100000, originalY + dy));

                element.style.left = card.x + "px";
                element.style.top = card.y + "px";
            };

            const stop = () => {
                header.removeEventListener("pointermove", move);
                header.removeEventListener("pointerup", stop);
                header.removeEventListener("pointercancel", stop);

                scheduleSave();
            };

            header.addEventListener("pointermove", move);
            header.addEventListener("pointerup", stop);
            header.addEventListener("pointercancel", stop);
        });

        world.appendChild(element);
    });
}

function clearCanvasSelection() {
    selectedCanvasCard = null;
    renderCanvas();
}

/* ============================================
   MIND MAP DATA
============================================ */

function getMindMap() {
    const p = getPage();

    if (!p.mindmap) {
        p.mindmap = {
            width: 4000,
            height: 3000,
            nodes: [],
            edges: []
        };
    }

    if (!p.mindmap.nodes.length) {
        p.mindmap.nodes.push({
            id: uid(),
            text: p.name || "Main Idea",
            x: 1750,
            y: 1300,
            root: true
        });
    }

    return p.mindmap;
}

function getNode(id) {
    return getMindMap().nodes.find(node => node.id === id) || null;
}

/* ============================================
   MIND MAP NODE OPERATIONS
============================================ */

function addMindNode() {
    const m = getMindMap();

    const node = {
        id: uid(),
        text: "New Idea",
        x: 1750 + Math.round(Math.random() * 500 - 250),
        y: 1500 + Math.round(Math.random() * 500 - 250),
        root: false
    };

    m.nodes.push(node);

    selectedMindNode = node.id;

    renderMindMap();
    scheduleSave();

    notify("Node created");
}

function addChildNode() {
    const m = getMindMap();

    let parent = getNode(selectedMindNode);

    if (!parent) {
        parent = m.nodes.find(node => node.root) || m.nodes[0];
    }

    if (!parent) {
        addMindNode();
        return;
    }

    const siblings = m.edges.filter(edge => edge.from === parent.id).length;

    const node = {
        id: uid(),
        text: "Child Idea",
        x: parent.x + 280,
        y: parent.y + siblings * 115 - 35,
        root: false
    };

    m.nodes.push(node);

    m.edges.push({
        from: parent.id,
        to: node.id
    });

    selectedMindNode = node.id;

    renderMindMap();
    scheduleSave();

    notify("Child node added");
}

function editMindNode() {
    const node = getNode(selectedMindNode);

    if (!node) {
        notify("Select a node first");
        return;
    }

    showModal("Edit Mind Map Node", "Node text", node.text, text => {
        node.text = text;

        renderMindMap();
        scheduleSave();
    });
}

function deleteMindNode() {
    const m = getMindMap();

    const node = getNode(selectedMindNode);

    if (!node) {
        notify("Select a node first");
        return;
    }

    if (node.root) {
        if (!confirm(
            "Delete the central node? This will remove all connections to it."
        )) return;
    }

    m.nodes = m.nodes.filter(x => x.id !== node.id);

    m.edges = m.edges.filter(
        edge => edge.from !== node.id && edge.to !== node.id
    );

    selectedMindNode = null;

    renderMindMap();
    scheduleSave();
}

function connectMindNodes() {
    if (!selectedMindNode) {
        notify("Select the first node");
        return;
    }

    if (!pendingConnection) {
        pendingConnection = selectedMindNode;

        document.getElementById("mindmapStatus").textContent =
            "Now select another node to connect it.";

        notify("Select the second node");

        return;
    }

    const first = pendingConnection;
    const second = selectedMindNode;

    pendingConnection = null;

    if (first === second) {
        notify("Choose two different nodes");
        return;
    }

    const m = getMindMap();

    const exists = m.edges.some(edge =>
        (edge.from === first && edge.to === second) ||
        (edge.from === second && edge.to === first)
    );

    if (!exists) {
        m.edges.push({ from: first, to: second });
    }

    renderMindMap();
    scheduleSave();

    document.getElementById("mindmapStatus").textContent =
        "Connection created.";
}

function disconnectMindNodes() {
    const m = getMindMap();

    if (!selectedMindNode) {
        notify("Select a node first");
        return;
    }

    const connected = m.edges.filter(edge =>
        edge.from === selectedMindNode ||
        edge.to === selectedMindNode
    );

    if (!connected.length) {
        notify("This node has no connections");
        return;
    }

    const otherIds = new Set();

    connected.forEach(edge => {
        otherIds.add(
            edge.from === selectedMindNode ? edge.to : edge.from
        );
    });

    const target = prompt(
        "Enter the number of the connection to remove:\n" +
        [...otherIds].map((id, i) => {
            const node = getNode(id);
            return `${i + 1}. ${node?.text || "Node"}`;
        }).join("\n")
    );

    if (!target) return;

    const index = Number(target) - 1;
    const otherId = [...otherIds][index];

    if (!otherId) {
        notify("Invalid selection");
        return;
    }

    m.edges = m.edges.filter(edge =>
        !(
            (edge.from === selectedMindNode && edge.to === otherId) ||
            (edge.from === otherId && edge.to === selectedMindNode)
        )
    );

    renderMindMap();
    scheduleSave();

    notify("Connection removed");
}

/* ============================================
   MIND MAP RENDERING
============================================ */

function renderMindMap() {
    const m = getMindMap();

    const world = document.getElementById("mindmapWorld");
    const nodeContainer = document.getElementById("mindNodes");
    const svg = document.getElementById("mindmapLines");

    world.style.width = m.width + "px";
    world.style.height = m.height + "px";

    svg.setAttribute("width", m.width);
    svg.setAttribute("height", m.height);
    svg.setAttribute("viewBox", `0 0 ${m.width} ${m.height}`);

    nodeContainer.innerHTML = "";
    svg.innerHTML = "";

    /*
    Each connection is drawn from the center of one node
    to the center of the other node.
    */

    m.edges.forEach(edge => {
        const a = getNode(edge.from);
        const b = getNode(edge.to);

        if (!a || !b) return;

        const line = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

        line.setAttribute("x1", a.x + 85);
        line.setAttribute("y1", a.y + 32);
        line.setAttribute("x2", b.x + 85);
        line.setAttribute("y2", b.y + 32);
        line.setAttribute("stroke", "#a98bc5");
        line.setAttribute("stroke-width", "3");
        line.setAttribute("stroke-linecap", "round");

        svg.appendChild(line);
    });

    m.nodes.forEach(node => {
        const element = document.createElement("div");

        element.className =
            "mind-node" +
            (node.root ? " root" : "") +
            (node.id === selectedMindNode ? " selected" : "");

        element.dataset.id = node.id;

        element.style.left = node.x + "px";
        element.style.top = node.y + "px";

        const dot = document.createElement("span");
        dot.className = "node-dot";

        const text = document.createElement("div");
        text.className = "node-text";
        text.textContent = node.text;

        const edit = document.createElement("button");
        edit.className = "card-action";
        edit.textContent = "✎";
        edit.title = "Edit node";

        edit.onclick = event => {
            event.stopPropagation();
            selectedMindNode = node.id;
            editMindNode();
        };

        element.append(dot, text, edit);

        element.addEventListener("pointerdown", event => {
            if (event.target.closest("button")) return;

            selectedMindNode = node.id;

            if (pendingConnection && pendingConnection !== node.id) {
                renderMindMap();
                return;
            }

            renderMindMap();

            if (event.target.closest(".node-text")) {
                return;
            }

            event.preventDefault();

            const startX = event.clientX;
            const startY = event.clientY;
            const originalX = node.x;
            const originalY = node.y;

            element.setPointerCapture(event.pointerId);

            const move = e => {
                node.x = Math.max(
                    -100000,
                    Math.min(100000, originalX + e.clientX - startX)
                );

                node.y = Math.max(
                    -100000,
                    Math.min(100000, originalY + e.clientY - startY)
                );

                element.style.left = node.x + "px";
                element.style.top = node.y + "px";

                redrawMindMapLines();
            };

            const stop = () => {
                element.removeEventListener("pointermove", move);
                element.removeEventListener("pointerup", stop);
                element.removeEventListener("pointercancel", stop);

                scheduleSave();
                renderMindMap();
            };

            element.addEventListener("pointermove", move);
            element.addEventListener("pointerup", stop);
            element.addEventListener("pointercancel", stop);
        });

        text.addEventListener("dblclick", () => {
            selectedMindNode = node.id;
            editMindNode();
        });

        nodeContainer.appendChild(element);
    });

    document.getElementById("mindmapStatus").textContent =
        `${m.nodes.length} nodes • ${m.edges.length} connections` +
        (selectedMindNode ? " • Node selected" : "");
}

function redrawMindMapLines() {
    const m = getMindMap();
    const svg = document.getElementById("mindmapLines");

    svg.innerHTML = "";

    m.edges.forEach(edge => {
        const a = getNode(edge.from);
        const b = getNode(edge.to);

        if (!a || !b) return;

        const line = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

        line.setAttribute("x1", a.x + 85);
        line.setAttribute("y1", a.y + 32);
        line.setAttribute("x2", b.x + 85);
        line.setAttribute("y2", b.y + 32);
        line.setAttribute("stroke", "#a98bc5");
        line.setAttribute("stroke-width", "3");

        svg.appendChild(line);
    });
}

function centerMindMap() {
    const viewport = document.getElementById("mindmapViewport");
    const m = getMindMap();

    const root = m.nodes.find(node => node.root) || m.nodes[0];

    if (root) {
        viewport.scrollLeft = Math.max(0, root.x - viewport.clientWidth / 2);
        viewport.scrollTop = Math.max(0, root.y - viewport.clientHeight / 2);
    }
}

function resetMindMap() {
    if (!confirm("Reset this page's mind map?")) return;

    const p = getPage();

    p.mindmap = {
        width: 4000,
        height: 3000,
        nodes: [{
            id: uid(),
            text: p.name || "Main Idea",
            x: 1750,
            y: 1300,
            root: true
        }],
        edges: []
    };

    selectedMindNode = null;
    pendingConnection = null;

    renderMindMap();
    scheduleSave();
}

/* ============================================
   SEARCH
============================================ */

document.getElementById("searchInput").addEventListener("input", function() {
    const q = this.value.trim().toLowerCase();

    if (!q) {
        renderAll();
        return;
    }

    const matches = [];

    for (const n of db.notebooks) {
        for (const s of n.sections) {
            for (const p of s.pages) {
                const content = plainText(p.content);

                const canvasText = (p.canvas?.cards || [])
                    .map(c => c.title + " " + plainText(c.content))
                    .join(" ");

                const mapText = (p.mindmap?.nodes || [])
                    .map(node => node.text)
                    .join(" ");

                const all = [
                    n.name, s.name, p.name,
                    content, canvasText, mapText
                ].join(" ").toLowerCase();

                if (all.includes(q)) matches.push({ n, s, p });
            }
        }
    }

    document.getElementById("notebookList").innerHTML =
        matches.map(m => `
            <div class="list-item"
                 onclick="openSearchMatch('${m.n.id}','${m.s.id}','${m.p.id}')">
                🔎 <span class="name">${escapeHTML(m.p.name)}</span>
            </div>
        `).join("") || '<p style="padding:10px;color:var(--muted)">No results</p>';
});

function openSearchMatch(n, s, p) {
    notebookId = n;
    sectionId = s;
    pageId = p;

    renderAll();
    updateEditor();
    document.getElementById("searchInput").value = "";
    showPanel("");
}

/* ============================================
   IMPORT / EXPORT
============================================ */

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportBackup() {
    if (!saveData()) return;

    downloadFile(
        JSON.stringify(db, null, 2),
        "onenote-pro-backup.json",
        "application/json"
    );

    notify("Backup exported");
}

document.getElementById("importInput").addEventListener("change", async e => {
    const file = e.target.files[0];

    if (!file) return;

    try {
        if (file.size > 25 * 1024 * 1024) {
            throw new Error("File too large");
        }

        const imported = validateData(JSON.parse(await file.text()));

        if (!confirm("Replace all current notebooks with this backup?")) return;

        db = imported;

        ensureSelection();

        if (!saveData()) return;

        notebookId = db.notebooks[0].id;
        sectionId = db.notebooks[0].sections[0]?.id || null;
        pageId = db.notebooks[0].sections[0]?.pages[0]?.id || null;

        renderAll();
        updateEditor();

        notify("Backup imported");

    } catch (error) {
        console.error(error);
        notify("Invalid backup file");
    } finally {
        e.target.value = "";
    }
});

/* ============================================
   THEME AND MOBILE PANELS
============================================ */

function toggleTheme() {
    document.body.classList.toggle("dark");

    localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains("dark") ? "dark" : "light"
    );
}

function showPanel(panel) {
    const workspace = document.getElementById("workspace");

    workspace.classList.remove(
        "show-notebooks",
        "show-sections",
        "show-pages"
    );

    if (panel === "notebooks") workspace.classList.add("show-notebooks");
    if (panel === "sections") workspace.classList.add("show-sections");
    if (panel === "pages") workspace.classList.add("show-pages");
}

/* ============================================
   TOAST
============================================ */

function notify(message) {
    const el = document.getElementById("toast");

    el.textContent = message;
    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

/* ============================================
   KEYBOARD SHORTCUTS
============================================ */

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeModal();
        pendingConnection = null;
    }

    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();

        saveData();

        notify("Saved");
    }

    if ((event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "n") {
        event.preventDefault();

        if (currentMode === "canvas") addCanvasCard();
        else if (currentMode === "mindmap") addMindNode();
        else newPage();
    }
});

/* ============================================
   BEFORE EXIT
============================================ */

window.addEventListener("beforeunload", () => {
    clearTimeout(saveTimer);

    const p = getPage();

    if (p) {
        p.name =
            document.getElementById("pageTitle").value.trim() || "New Page";

        p.content = document.getElementById("noteEditor").innerHTML;
        p.updatedAt = timestamp();
    }

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    } catch (error) {
        console.warn("Could not save final state", error);
    }
});

/* ============================================
   INITIALIZATION
============================================ */

loadData();

</script>
