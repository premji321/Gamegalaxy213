
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text To Speech Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #1c293b;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: #35d6c0;
}

.subtitle {
    text-align: center;
    color: #aebbd0;
}

textarea {
    width: 100%;
    height: 180px;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #42536c;
    background: #111c2d;
    color: white;
    font-size: 17px;
    resize: vertical;
}

label {
    display: block;
    margin: 18px 0 8px;
    font-weight: bold;
}

select, input[type=range] {
    width: 100%;
}

select {
    padding: 12px;
    border-radius: 8px;
    background: #111c2d;
    color: white;
    border: 1px solid #42536c;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

button {
    padding: 13px 8px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.play { background: #16c79a; color: #071b19; }
.pause { background: #f5b942; color: #222; }
.stop { background: #e74c3c; color: white; }
.record { background: #e84393; color: white; }
.download { background: #287be0; color: white; }
.neutral { background: #40536d; color: white; }

button:disabled {
    opacity: 0.4;
}

.value {
    color: #35d6c0;
    float: right;
}

.status {
    margin-top: 20px;
    padding: 13px;
    background: #111c2d;
    border-radius: 8px;
    color: #35d6c0;
    text-align: center;
}

.note {
    font-size: 13px;
    color: #aebbd0;
    line-height: 1.6;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙 Text To Speech Studio</h1>

<p class="subtitle">
Convert Your Text Into Voice
</p>

<label>अपना टेक्स्ट लिखें:</label>

<textarea id="text" placeholder="यहाँ अपनी कहानी या कोई भी टेक्स्ट लिखें..."></textarea>

<label>Voice Select करें:</label>

<select id="voice">
    <option value="">Voice Loading...</option>
</select>

<label>
Speech Speed
<span class="value" id="speedValue">1</span>
</label>

<input type="range" id="speed"
min="0.5" max="2" step="0.1" value="1">

<label>
Voice Pitch
<span class="value" id="pitchValue">1</span>
</label>

<input type="range" id="pitch"
min="0.5" max="2" step="0.1" value="1">

<label>
Volume
<span class="value" id="volumeValue">100%</span>
</label>

<input type="range" id="volume"
min="0" max="1" step="0.1" value="1">

<div class="controls">

<button class="play" onclick="speakText()">
▶ Play Voice
</button>

<button class="pause" onclick="pauseVoice()">
⏸ Pause
</button>

<button class="neutral" onclick="resumeVoice()">
▶ Resume
</button>

<button class="stop" onclick="stopVoice()">
■ Stop
</button>

<button class="record" onclick="startRecording()" id="recordBtn">
● Record Audio
</button>

<button class="stop" onclick="stopRecording()" id="stopRecordBtn" disabled>
■ Stop Recording
</button>

<button class="download" onclick="downloadAudio()" id="downloadBtn" disabled>
⬇ Download Audio
</button>

<button class="neutral" onclick="clearText()">
Clear Text
</button>

</div>

<div class="status" id="status">
Ready - अपना टेक्स्ट लिखें
</div>

<p class="note">
ध्यान दें: ऑडियो रिकॉर्डिंग के लिए माइक्रोफोन की अनुमति दें।
मोबाइल का स्पीकर चालू रखें और हेडफोन न लगाएं।
डाउनलोड फाइल WebM फॉर्मेट में होगी।
</p>

</div>

<script>

const textBox = document.getElementById("text");
const voiceSelect = document.getElementById("voice");
const statusBox = document.getElementById("status");

let voices = [];
let recorder = null;
let audioChunks = [];
let audioBlob = null;
let micStream = null;

let recording = false;

function loadVoices() {

    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    if (voices.length === 0) {
        voiceSelect.innerHTML =
        '<option value="">No voices available</option>';
        return;
    }

    voices.forEach((voice, index) => {

        const option = document.createElement("option");

        option.value = index;

        option.textContent =
        voice.name + " (" + voice.lang + ")";

        voiceSelect.appendChild(option);

    });

    const hindiVoice = voices.findIndex(v =>
        v.lang.toLowerCase().startsWith("hi")
    );

    if (hindiVoice >= 0) {
        voiceSelect.value = hindiVoice;
    }

}

speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();

document.getElementById("speed").oninput = function() {
    document.getElementById("speedValue").textContent = this.value;
};

document.getElementById("pitch").oninput = function() {
    document.getElementById("pitchValue").textContent = this.value;
};

document.getElementById("volume").oninput = function() {
    document.getElementById("volumeValue").textContent =
    Math.round(this.value * 100) + "%";
};

function speakText() {

    const text = textBox.value.trim();

    if (!text) {
        alert("कृपया पहले टेक्स्ट लिखें!");
        return;
    }

    if (!("speechSynthesis" in window)) {
        alert("आपका ब्राउजर Text To Speech सपोर्ट नहीं करता।");
        return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    const selectedVoice = voiceSelect.value;

    if (voices[selectedVoice]) {
        utterance.voice = voices[selectedVoice];
    }

    utterance.rate = Number(document.getElementById("speed").value);
    utterance.pitch = Number(document.getElementById("pitch").value);
    utterance.volume = Number(document.getElementById("volume").value);

    utterance.onstart = function() {
        statusBox.textContent = "🔊 Voice Playing...";
    };

    utterance.onend = function() {
        statusBox.textContent = "Voice Completed";
    };

    utterance.onerror = function(event) {
        statusBox.textContent = "Voice Error: " + event.error;
    };

    speechSynthesis.speak(utterance);

}

function pauseVoice() {

    if (speechSynthesis.speaking) {
        speechSynthesis.pause();
        statusBox.textContent = "Voice Paused";
    }

}

function resumeVoice() {

    if (speechSynthesis.paused) {
        speechSynthesis.resume();
        statusBox.textContent = "Voice Resumed";
    }

}

function stopVoice() {

    speechSynthesis.cancel();
    statusBox.textContent = "Voice Stopped";

}

async function startRecording() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        alert("इस ब्राउजर में माइक्रोफोन रिकॉर्डिंग उपलब्ध नहीं है।");
        return;

    }

    try {

        audioChunks = [];
        audioBlob = null;

        document.getElementById("downloadBtn").disabled = true;

        micStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        let options = {};

        if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
            options.mimeType = "audio/webm;codecs=opus";
        }

        recorder = new MediaRecorder(micStream, options);

        recorder.ondataavailable = function(event) {

            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }

        };

        recorder.onstop = function() {

            audioBlob = new Blob(audioChunks, {
                type: recorder.mimeType || "audio/webm"
            });

            document.getElementById("downloadBtn").disabled = false;

            statusBox.textContent = "Recording Complete! Download Ready.";

            micStream.getTracks().forEach(track => track.stop());

            micStream = null;

        };

        recorder.start();

        recording = true;

        document.getElementById("recordBtn").disabled = true;
        document.getElementById("stopRecordBtn").disabled = false;

        statusBox.textContent = "🔴 Recording... अब Play Voice दबाएं।";

    }

    catch(error) {

        alert("Microphone Error: " + error.message);

    }

}

function stopRecording() {

    if (recorder && recorder.state === "recording") {

        recorder.stop();

        recording = false;

        document.getElementById("recordBtn").disabled = false;
        document.getElementById("stopRecordBtn").disabled = true;

    }

}

function downloadAudio() {

    if (!audioBlob) {
        alert("पहले ऑडियो रिकॉर्ड करें!");
        return;
    }

    const url = URL.createObjectURL(audioBlob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "My-Voice-Recording.webm";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

}

function clearText() {

    textBox.value = "";

    speechSynthesis.cancel();

    statusBox.textContent = "Text Cleared";

}

</script>

</body>
</html>
