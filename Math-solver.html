
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text To Speech Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #1d293b;
    padding: 20px;
    border-radius: 15px;
}

h1 {
    text-align: center;
    color: #38bdf8;
}

textarea {
    width: 100%;
    height: 200px;
    background: #101827;
    color: white;
    border: 1px solid #475569;
    padding: 15px;
    border-radius: 10px;
    font-size: 17px;
    resize: vertical;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    color: #bae6fd;
}

select, input[type=range] {
    width: 100%;
}

select {
    padding: 12px;
    border-radius: 8px;
    background: #101827;
    color: white;
    border: 1px solid #475569;
}

button {
    border: none;
    padding: 13px;
    border-radius: 8px;
    margin: 5px 2px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.play { background: #16a34a; color: white; }
.pause { background: #eab308; color: black; }
.stop { background: #dc2626; color: white; }
.download { background: #0284c7; color: white; }
.reset { background: #475569; color: white; }

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
}

.status {
    background: #101827;
    padding: 12px;
    border-radius: 8px;
    margin-top: 18px;
    color: #38bdf8;
    text-align: center;
}

.note {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🎙 Text To Speech Studio</h1>

<p>अपना टेक्स्ट लिखें और उसे आवाज में बदलें।</p>

<textarea id="text" placeholder="यहाँ अपना टेक्स्ट लिखें..."></textarea>

<label>Select Voice</label>
<select id="voice">
<option value="">Loading Voices...</option>
</select>

<label>Speech Speed: <span id="speedValue">1</span></label>
<input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

<label>Pitch: <span id="pitchValue">1</span></label>
<input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">

<label>Volume: <span id="volumeValue">100%</span></label>
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">

<div class="controls">
<button class="play" onclick="speakText()">▶ Play</button>
<button class="pause" onclick="pauseSpeech()">⏸ Pause</button>
<button class="play" onclick="resumeSpeech()">▶ Resume</button>
<button class="stop" onclick="stopSpeech()">■ Stop</button>
</div>

<div class="controls">
<button class="download" onclick="downloadMP3()">⬇ Download MP3</button>
<button class="reset" onclick="resetAll()">Reset</button>
</div>

<div class="status" id="status">
Ready to Speak
</div>

<p class="note">
नोट: आवाज आपके ब्राउज़र में उपलब्ध Voice Engine पर निर्भर करती है।
MP3 बनाने के लिए ब्राउज़र की Media Recording सुविधा आवश्यक है।
</p>

</div>

<script>

const textBox = document.getElementById("text");
const voiceSelect = document.getElementById("voice");
const speed = document.getElementById("speed");
const pitch = document.getElementById("pitch");
const volume = document.getElementById("volume");
const statusBox = document.getElementById("status");

let voices = [];

function loadVoices() {
    voices = speechSynthesis.getVoices();

    voiceSelect.innerHTML = "";

    voices.forEach((voice, index) => {
        let option = document.createElement("option");

        option.value = index;
        option.textContent =
            voice.name + " (" + voice.lang + ")";

        voiceSelect.appendChild(option);
    });

    let hindiIndex = voices.findIndex(v =>
        v.lang.toLowerCase().startsWith("hi")
    );

    if (hindiIndex >= 0) {
        voiceSelect.value = hindiIndex;
    }
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

speed.oninput = () => {
    document.getElementById("speedValue").textContent = speed.value;
};

pitch.oninput = () => {
    document.getElementById("pitchValue").textContent = pitch.value;
};

volume.oninput = () => {
    document.getElementById("volumeValue").textContent =
        Math.round(volume.value * 100) + "%";
};

function speakText() {

    let text = textBox.value.trim();

    if (!text) {
        alert("पहले कुछ टेक्स्ट लिखें!");
        return;
    }

    speechSynthesis.cancel();

    let utterance = new SpeechSynthesisUtterance(text);

    let selectedVoice = voices[voiceSelect.value];

    if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
    }

    utterance.rate = Number(speed.value);
    utterance.pitch = Number(pitch.value);
    utterance.volume = Number(volume.value);

    utterance.onstart = () => {
        statusBox.textContent = "🔊 Speaking...";
    };

    utterance.onend = () => {
        statusBox.textContent = "Speech Completed";
    };

    utterance.onerror = () => {
        statusBox.textContent = "Speech Error";
    };

    speechSynthesis.speak(utterance);
}

function pauseSpeech() {
    speechSynthesis.pause();
    statusBox.textContent = "Speech Paused";
}

function resumeSpeech() {
    speechSynthesis.resume();
    statusBox.textContent = "Speech Resumed";
}

function stopSpeech() {
    speechSynthesis.cancel();
    statusBox.textContent = "Speech Stopped";
}

function resetAll() {
    stopSpeech();
    textBox.value = "";
    speed.value = 1;
    pitch.value = 1;
    volume.value = 1;

    speed.oninput();
    pitch.oninput();
    volume.oninput();
}

// MP3 Export
// SpeechSynthesis का audio stream सीधे उपलब्ध नहीं होता.
// इसलिए वास्तविक MP3 export के लिए Web Audio input चाहिए.

async function downloadMP3() {

    let text = textBox.value.trim();

    if (!text) {
        alert("पहले टेक्स्ट लिखें!");
        return;
    }

    if (!window.AudioContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        alert("आपके ब्राउज़र में जरूरी Audio Recording सुविधा उपलब्ध नहीं है।");
        return;
    }

    alert(
      "ध्यान दें: Chrome SpeechSynthesis का audio सीधे रिकॉर्ड नहीं कर सकता। " +
      "यह बटन वास्तविक TTS MP3 बनाने के लिए अभी उपलब्ध नहीं है।"
    );
}

</script>

</body>
</html>
