<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#07111d">

<title>Extreme Moto Racing</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #07111d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
}

#gameCanvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    background: #87ceeb;
}

#hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 5px;
    pointer-events: none;
}

.stat {
    min-width: 65px;
    padding: 8px;
    background: rgba(0,0,0,.72);
    border: 1px solid #506171;
    border-radius: 10px;
    text-align: center;
}

.stat small {
    font-size: 9px;
    color: #bdc9d6;
    display: block;
}

.stat strong {
    display: block;
    margin-top: 3px;
    font-size: 18px;
}

#speedValue {
    color: #00ffab;
}

#nitroContainer {
    width: 65px;
    height: 6px;
    background: #444;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 6px;
}

#nitroFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#00d9ff,#00ff73);
}

#pauseBtn {
    position: fixed;
    right: 10px;
    top: 83px;
    padding: 9px 12px;
    border: 1px solid white;
    border-radius: 10px;
    color: white;
    background: rgba(0,0,0,.75);
    font-weight: bold;
    z-index: 3;
}

#controls {
    position: fixed;
    bottom: max(15px, env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 13px;
    pointer-events: none;
}

.group {
    display: flex;
    gap: 9px;
    pointer-events: auto;
}

.control {
    width: 62px;
    height: 62px;
    border: 2px solid #b7c9dc;
    border-radius: 18px;
    color: white;
    background: rgba(8,19,35,.88);
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
    touch-action: none;
}

.control:active {
    background: #087aff;
    transform: scale(.95);
}

#brakeBtn {
    font-size: 12px;
    background: #333b47;
}

#nitroBtn {
    font-size: 15px;
    background: linear-gradient(135deg,#ff9b00,#ff3500);
}

#message {
    position: fixed;
    top: 30%;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    text-shadow: 0 3px 10px #000;
    pointer-events: none;
}

#tiltInfo {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 10px;
    background: rgba(0,0,0,.5);
    border-radius: 20px;
    font-size: 10px;
    white-space: nowrap;
}

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: linear-gradient(
        180deg,
        rgba(3,12,27,.85),
        rgba(2,8,18,.97)
    );
}

.card {
    width: 100%;
    max-width: 410px;
    padding: 25px 20px;
    border-radius: 24px;
    text-align: center;
    background: #122239;
    border: 1px solid #536d89;
    box-shadow: 0 0 35px rgba(0,140,255,.18);
}

.logo {
    font-size: 52px;
}

.card h1 {
    font-size: 30px;
    margin: 10px 0;
    line-height: 1.15;
}

.card h1 span {
    color: #00ffab;
}

.card p {
    color: #c7d5e5;
    font-size: 13px;
    line-height: 1.8;
    margin: 15px 0 20px;
}

.action {
    width: 100%;
    padding: 15px;
    margin-top: 9px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 900;
    color: #00140d;
    background: linear-gradient(90deg,#00ffab,#00c8ff);
}

.action.secondary {
    background: #263d58;
    color: white;
    border: 1px solid #60758c;
}

#diagnostic {
    position: fixed;
    left: 10px;
    bottom: 100px;
    color: #fff;
    font-size: 10px;
    max-width: 80%;
    pointer-events: none;
}

@media(max-height:600px) {
    .card {
        padding: 12px;
    }

    .logo {
        font-size: 35px;
    }

    .card h1 {
        font-size: 24px;
    }

    .card p {
        margin: 8px 0;
        line-height: 1.5;
    }

    .action {
        padding: 10px;
    }

    .control {
        width: 54px;
        height: 54px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">

    <div class="stat">
        <small>SPEED</small>
        <strong id="speedValue">0</strong>
        <small>KM/H</small>
    </div>

    <div class="stat">
        <small>POSITION</small>
        <strong id="rankValue">1/8</strong>
    </div>

    <div class="stat">
        <small>DISTANCE</small>
        <strong id="distanceValue">0</strong>
        <small>METERS</small>
    </div>

    <div class="stat">
        <small>NITRO ⚡</small>
        <div id="nitroContainer">
            <div id="nitroFill"></div>
        </div>
    </div>

</div>

<button id="pauseBtn">Ⅱ PAUSE</button>

<div id="message"></div>

<div id="tiltInfo">🎮 BUTTON CONTROL ACTIVE</div>

<div id="diagnostic"></div>

<div id="controls">

    <div class="group">
        <button class="control" id="leftBtn">◀</button>
        <button class="control" id="rightBtn">▶</button>
    </div>

    <div class="group">
        <button class="control" id="brakeBtn">BRAKE</button>
        <button class="control" id="nitroBtn">⚡ NITRO</button>
    </div>

</div>

<div id="startScreen">

    <div class="card">

        <div class="logo">🏍️</div>

        <h1>EXTREME <span>MOTO</span><br>RACING</h1>

        <p>
            HIGH SPEED MOTORCYCLE RACING<br><br>
            🏍️ दूसरी बाइकों से रेस लगाएँ।<br>
            🛣️ हाईवे पर ट्रैफिक से बचें।<br>
            ⚡ नाइट्रो से स्पीड बढ़ाएँ।<br>
            📱 मोबाइल झुकाकर या बटन से बाइक चलाएँ।
        </p>

        <button class="action" id="startBtn">
            🏁 START RACE
        </button>

        <button class="action secondary" id="tiltBtn">
            📱 ENABLE TILT CONTROL
        </button>

    </div>

</div>

<script>
"use strict";

/* ===================================
   EXTREME MOTO RACING
   Canvas-only game engine
   No external libraries required
=================================== */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let W = 0;
let H = 0;
let DPR = 1;

let running = false;
let paused = false;
let crashed = 0;

let speed = 0;
let distance = 0;
let score = 0;
let nitro = 100;

let playerX = 0;
let steer = 0;
let lean = 0;

let left = false;
let right = false;
let brake = false;
let nitroHeld = false;

let tiltEnabled = false;
let tiltValue = 0;
let tiltZero = null;

let lastTime = 0;
let gameTime = 0;
let roadOffset = 0;
let spawnClock = 0;
let shake = 0;

let opponents = [];
let particles = [];
let roadside = [];

const COLORS = [
    "#ff3030",
    "#ffc928",
    "#167aff",
    "#f5f5f5",
    "#a72cff",
    "#161616",
    "#00d7a2"
];

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize", resize);
resize();

/* Road perspective */

function horizon() {
    return H * 0.34;
}

function roadHalfWidth(y) {
    const t = clamp((y-horizon())/(H-horizon()),0,1);
    return W * (0.045 + t*0.48);
}

function roadCenter(y) {
    const t = clamp((y-horizon())/(H-horizon()),0,1);

    return W*0.5
        + Math.sin(gameTime*0.12 + t*1.7)*W*0.055*t
        + Math.sin(gameTime*0.035)*W*0.025*t;
}

function roadX(y,lane) {
    return roadCenter(y)+roadHalfWidth(y)*lane;
}

/* Drawing helpers */

function polygon(points,color) {
    ctx.fillStyle=color;
    ctx.beginPath();

    points.forEach((p,i)=>{
        if(i===0) ctx.moveTo(p[0],p[1]);
        else ctx.lineTo(p[0],p[1]);
    });

    ctx.closePath();
    ctx.fill();
}

function roundedRect(x,y,w,h,r,color) {
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    ctx.fill();
}

function drawSky() {

    const sky=ctx.createLinearGradient(0,0,0,horizon());

    sky.addColorStop(0,"#1686cf");
    sky.addColorStop(.6,"#80d8fa");
    sky.addColorStop(1,"#e5f8ff");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    // Sun
    const sunX=W*.80;
    const sunY=H*.12;

    const glow=ctx.createRadialGradient(
        sunX,sunY,5,sunX,sunY,W*.14
    );

    glow.addColorStop(0,"rgba(255,248,190,.95)");
    glow.addColorStop(1,"rgba(255,245,180,0)");

    ctx.fillStyle=glow;
    ctx.fillRect(
        sunX-W*.15,sunY-W*.15,W*.30,W*.30
    );

    // Clouds
    for(let i=0;i<5;i++) {

        const x=(
            i*W*.27 + gameTime*3
        )%(W+180)-80;

        const y=H*(.08+(i%3)*.055);

        ctx.fillStyle="rgba(255,255,255,.65)";

        ctx.beginPath();
        ctx.ellipse(x,y,34,12,0,0,Math.PI*2);
        ctx.ellipse(x+25,y-7,24,15,0,0,Math.PI*2);
        ctx.ellipse(x+48,y,34,12,0,0,Math.PI*2);
        ctx.fill();
    }
}

function drawMountains() {

    const hy=horizon();

    polygon([
        [0,hy+10],
        [W*.10,hy-65],
        [W*.20,hy+4],
        [W*.34,hy-95],
        [W*.47,hy+5],
        [W*.60,hy-75],
        [W*.74,hy+2],
        [W*.88,hy-90],
        [W,hy+5],
        [W,H],
        [0,H]
    ],"#718d92");

    polygon([
        [0,hy+35],
        [W*.15,hy-20],
        [W*.28,hy+30],
        [W*.46,hy-35],
        [W*.65,hy+25],
        [W*.82,hy-32],
        [W,hy+30],
        [W,H],
        [0,H]
    ],"#4d7e52");

    ctx.fillStyle="#72a65b";
    ctx.fillRect(0,hy+5,W,H-hy);
}

function drawRoad() {

    const hy=horizon();

    // Roadside ground
    ctx.fillStyle="#518744";
    ctx.fillRect(0,hy,W,H-hy);

    // Asphalt
    polygon([
        [W*.49,hy],
        [W*.51,hy],
        [W*1.08,H],
        [-W*.08,H]
    ],"#34383e");

    // Road shoulder
    polygon([
        [W*.485,hy],
        [W*.49,hy],
        [W*.00,H],
        [-W*.08,H]
    ],"#e7e7e7");

    polygon([
        [W*.51,hy],
        [W*.515,hy],
        [W*1.08,H],
        [W,H]
    ],"#e7e7e7");

    // Red/white roadside blocks
    const blocks=22;

    for(let i=0;i<blocks;i++) {

        const f=(i/blocks+roadOffset*.012)%1;
        const t=f*f;

        const y=hy+t*(H-hy);
        const hw=roadHalfWidth(y);

        const y2=hy+Math.min(1,t+.018)*(H-hy);

        const c=i%2===0?"#f9f9f9":"#e92b2b";

        polygon([
            [roadCenter(y)-hw,y],
            [roadCenter(y)-hw-5-t*8,y],
            [roadCenter(y2)-roadHalfWidth(y2)-5-t*8,y2],
            [roadCenter(y2)-roadHalfWidth(y2),y2]
        ],c);

        polygon([
            [roadCenter(y)+hw,y],
            [roadCenter(y)+hw+5+t*8,y],
            [roadCenter(y2)+roadHalfWidth(y2)+5+t*8,y2],
            [roadCenter(y2)+roadHalfWidth(y2),y2]
        ],c);
    }

    // Lane markings
    for(let lane=-1;lane<=1;lane++) {

        if(lane===0) continue;

        for(let i=0;i<14;i++) {

            const f=(i/14+roadOffset*.018)%1;
            const t=f*f;

            const y=hy+t*(H-hy);
            const y2=hy+Math.min(1,t+.028)*(H-hy);

            const x1=roadX(y,lane);
            const x2=roadX(y2,lane);

            const width=1+t*4;

            polygon([
                [x1-width,y],
                [x1+width,y],
                [x2+width*1.3,y2],
                [x2-width*1.3,y2]
            ],"#f1f1f1");
        }
    }
}

/* Perspective trees */

function drawTree(x,y,size) {

    if(y<horizon()) return;

    const s=size;

    // Trunk
    ctx.fillStyle="#67442b";
    ctx.fillRect(x-s*.12,y-s*.5,s*.24,s*.55);

    // Tree foliage
    polygon([
        [x,y-s*1.7],
        [x-s*.62,y-s*.65],
        [x+s*.62,y-s*.65]
    ],"#1e6030");

    polygon([
        [x,y-s*1.35],
        [x-s*.52,y-s*.35],
        [x+s*.52,y-s*.35]
    ],"#2c843c");

    polygon([
        [x,y-s*1.0],
        [x-s*.4,y],
        [x+s*.4,y]
    ],"#43a84d");
}

function drawRoadside() {

    for(let i=0;i<26;i++) {

        const f=(i/26+roadOffset*.013)%1;
        const t=f*f;

        const y=horizon()+t*(H-horizon());

        const size=8+t*65;

        const leftX=roadCenter(y)-roadHalfWidth(y)-size*.8;
        const rightX=roadCenter(y)+roadHalfWidth(y)+size*.8;

        drawTree(leftX,y,size);
        drawTree(rightX,y,size*.95);
    }
}

/* Motorcycle drawing */

function drawMotorcycle(x,y,size,color,isPlayer=false,angle=0) {

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    const s=size;

    // Shadow
    ctx.fillStyle="rgba(0,0,0,.30)";
    ctx.beginPath();
    ctx.ellipse(0,s*.07,s*.43,s*.15,0,0,Math.PI*2);
    ctx.fill();

    // Wheels
    ctx.fillStyle="#11151b";

    ctx.beginPath();
    ctx.ellipse(0,s*.12,s*.15,s*.30,0,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0,-s*.45,s*.13,s*.24,0,0,Math.PI*2);
    ctx.fill();

    // Wheel rims
    ctx.strokeStyle="#a7b2bc";
    ctx.lineWidth=Math.max(1,s*.035);

    ctx.beginPath();
    ctx.ellipse(0,s*.12,s*.09,s*.21,0,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(0,-s*.45,s*.08,s*.16,0,0,Math.PI*2);
    ctx.stroke();

    // Exhaust
    ctx.fillStyle="#9daab6";
    ctx.fillRect(s*.16,-s*.02,s*.13,s*.32);

    // Bike frame
    polygon([
        [-s*.12,s*.20],
        [s*.12,s*.20],
        [s*.19,-s*.27],
        [-s*.17,-s*.28]
    ],"#222a33");

    // Fuel tank
    polygon([
        [-s*.22,-s*.05],
        [-s*.20,-s*.29],
        [-s*.08,-s*.38],
        [s*.18,-s*.27],
        [s*.17,-s*.08],
        [s*.05,s*.02]
    ],color);

    // Front fairing
    polygon([
        [-s*.19,-s*.28],
        [-s*.14,-s*.53],
        [0,-s*.66],
        [s*.15,-s*.50],
        [s*.18,-s*.27],
        [0,-s*.19]
    ],color);

    // Headlight
    ctx.fillStyle="#fff6bf";
    ctx.fillRect(-s*.075,-s*.58,s*.15,s*.07);

    // Rider legs
    polygon([
        [-s*.16,-s*.04],
        [-s*.25,s*.12],
        [-s*.10,s*.22],
        [0,s*.05]
    ],"#151c26");

    polygon([
        [s*.10,-s*.03],
        [s*.24,s*.10],
        [s*.10,s*.22],
        [-s*.02,s*.05]
    ],"#151c26");

    // Body
    polygon([
        [-s*.17,-s*.35],
        [-s*.20,-s*.69],
        [-s*.10,-s*.85],
        [s*.10,-s*.85],
        [s*.20,-s*.63],
        [s*.13,-s*.34]
    ],isPlayer?"#08a9e5":"#242e3b");

    // Arms
    ctx.strokeStyle=isPlayer?"#08a9e5":color;
    ctx.lineWidth=Math.max(2,s*.085);
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.moveTo(-s*.12,-s*.67);
    ctx.lineTo(-s*.30,-s*.46);
    ctx.lineTo(-s*.17,-s*.40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(s*.12,-s*.67);
    ctx.lineTo(s*.30,-s*.46);
    ctx.lineTo(s*.17,-s*.40);
    ctx.stroke();

    // Helmet
    ctx.fillStyle=isPlayer?"#f4f7fb":"#e7eaf0";

    ctx.beginPath();
    ctx.ellipse(0,-s*.91,s*.17,s*.18,0,0,Math.PI*2);
    ctx.fill();

    // Visor
    ctx.fillStyle="#142b42";
    ctx.fillRect(-s*.13,-s*.94,s*.26,s*.09);

    // Player tail light
    ctx.fillStyle="#ff3030";
    ctx.fillRect(-s*.09,s*.17,s*.18,s*.06);

    ctx.restore();
}

/* Opponents */

function spawnOpponent() {

    if(opponents.length>=9) return;

    const lane=randomLane();

    opponents.push({
        lane,
        depth:0.02,
        speed:Math.random()*0.25+0.45,
        color:COLORS[
            Math.floor(Math.random()*COLORS.length)
        ],
        phase:Math.random()*6.28
    });
}

function randomLane() {
    return [-0.68,-0.22,0.22,0.68][
        Math.floor(Math.random()*4)
    ];
}

function drawOpponents() {

    const sorted=[...opponents].sort(
        (a,b)=>a.depth-b.depth
    );

    for(const o of sorted) {

        const t=clamp(o.depth,0,1);

        const y=horizon()+t*(H-horizon());

        const lane=o.lane+Math.sin(o.phase)*.025;

        const x=roadX(y,lane)-playerX*roadHalfWidth(y)*.45;

        const size=8+t*Math.min(W,H)*.19;

        drawMotorcycle(
            x,y,
            size,
            o.color,
            false,
            Math.sin(o.phase)*.04
        );
    }
}

/* Player motorcycle */

function drawPlayer() {

    const y=H*.80;

    const x=W*.5+playerX*W*.29;

    const size=Math.min(W,H)*.31;

    drawMotorcycle(
        x,y,size,
        "#00baff",
        true,
        -lean*.15
    );

    // Speed lines during nitro
    if(nitroHeld && nitro>0 && speed>100) {

        ctx.strokeStyle="rgba(180,240,255,.55)";
        ctx.lineWidth=2;

        for(let i=0;i<9;i++) {

            const xx=Math.random()*W;
            const yy=H*.45+Math.random()*H*.4;

            ctx.beginPath();
            ctx.moveTo(xx,yy);
            ctx.lineTo(xx,yy+20+Math.random()*55);
            ctx.stroke();
        }
    }
}

function random(a,b) {
    return a+Math.random()*(b-a);
}

/* Particles */

function addCrashParticles() {

    for(let i=0;i<22;i++) {

        particles.push({
            x:W*.5+playerX*W*.29,
            y:H*.80,
            vx:random(-150,150),
            vy:random(-180,80),
            life:random(.2,.8),
            color:Math.random()<.5?"#ff8a00":"#ffe36b"
        });
    }
}

function drawParticles(dt) {

    for(let i=particles.length-1;i>=0;i--) {

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vy+=180*dt;
        p.life-=dt;

        ctx.globalAlpha=clamp(p.life*2,0,1);
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x,p.y,5,5);

        if(p.life<=0) particles.splice(i,1);
    }

    ctx.globalAlpha=1;
}

/* Update logic */

function update(dt) {

    if(!running || paused) return;

    gameTime+=dt;

    if(crashed>0) crashed-=dt;

    const buttonSteer=(right?1:0)-(left?1:0);

    steer=clamp(buttonSteer+(tiltEnabled?tiltValue:0),-1,1);

    playerX+=steer*dt*(0.95+speed/115);

    playerX=clamp(playerX,-1.05,1.05);

    lean+=(steer-lean)*Math.min(1,dt*7);

    let target=170;

    if(brake) target=35;

    if(nitroHeld && nitro>0 && !brake) {

        target=235;
        nitro=Math.max(0,nitro-dt*30);

    } else {

        nitro=Math.min(100,nitro+dt*5);
    }

    if(speed<target) {
        speed+=dt*45;
    } else {
        speed-=dt*(brake?100:20);
    }

    speed=clamp(speed,0,235);

    roadOffset+=speed*dt*.055;

    distance+=speed*dt*.10;
    score+=Math.floor(speed*dt*.12);

    spawnClock-=dt;

    if(spawnClock<=0) {

        spawnOpponent();

        spawnClock=random(.6,1.35);
    }

    for(let i=opponents.length-1;i>=0;i--) {

        const o=opponents[i];

        o.depth+=(speed/170-o.speed)*dt*.22;
        o.phase+=dt;

        // Crash when the rival is close
        if(
            o.depth>.83 &&
            o.depth<.97 &&
            Math.abs(o.lane-playerX*.85)<.20 &&
            crashed<=0
        ) {

            speed*=.40;

            crashed=.9;

            shake=.35;

            addCrashParticles();

            $("message").textContent="💥 CRASH!";

            setTimeout(()=>{
                if($("message").textContent==="💥 CRASH!") {
                    $("message").textContent="";
                }
            },650);

            o.depth=.99;
        }

        // Passed opponent
        if(o.depth>=1.05) {

            score+=100;

            opponents.splice(i,1);

            continue;
        }

        if(o.depth<-.1) {
            opponents.splice(i,1);
        }
    }

    if(Math.abs(playerX)>.88) {
        speed=Math.max(30,speed-dt*65);
    }

    if(shake>0) shake-=dt;

    $("speedValue").textContent=Math.round(speed);
    $("distanceValue").textContent=Math.floor(distance);
    $("nitroFill").style.width=nitro+"%";

    const rank=1+opponents.filter(o=>o.depth>.7).length;

    $("rankValue").textContent=Math.min(rank,8)+"/8";

    if(Math.abs(playerX)>.88) {
        $("message").textContent="⚠️ OFF ROAD!";
    } else if(crashed<=0 && $("message").textContent==="⚠️ OFF ROAD!") {
        $("message").textContent="";
    }
}

/* Main rendering */

function render(dt) {

    ctx.save();

    if(shake>0) {

        ctx.translate(
            random(-5,5)*shake*4,
            random(-5,5)*shake*4
        );
    }

    drawSky();
    drawMountains();
    drawRoad();
    drawRoadside();
    drawOpponents();
    drawPlayer();
    drawParticles(dt);

    // Slight vignette
    const vignette=ctx.createRadialGradient(
        W*.5,H*.5,H*.15,
        W*.5,H*.5,H*.8
    );

    vignette.addColorStop(0,"rgba(0,0,0,0)");
    vignette.addColorStop(1,"rgba(0,0,0,.20)");

    ctx.fillStyle=vignette;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
}

function loop(now) {

    requestAnimationFrame(loop);

    let dt=(now-lastTime)/1000;

    lastTime=now;

    dt=clamp(dt||0,0,.04);

    try {

        update(dt);
        render(dt);

    } catch(error) {

        $("diagnostic").textContent=
            "Game error: "+error.message;

        running=false;
    }
}

requestAnimationFrame(loop);

/* Game controls */

function bindHold(id,down,up) {

    const el=$(id);

    el.addEventListener("pointerdown",e=>{
        e.preventDefault();

        down();

        try {
            el.setPointerCapture(e.pointerId);
        } catch(err) {}
    });

    function release(e) {
        up();
    }

    el.addEventListener("pointerup",release);
    el.addEventListener("pointercancel",release);
    el.addEventListener("lostpointercapture",release);
}

bindHold("leftBtn",()=>left=true,()=>left=false);
bindHold("rightBtn",()=>right=true,()=>right=false);
bindHold("brakeBtn",()=>brake=true,()=>brake=false);
bindHold("nitroBtn",()=>nitroHeld=true,()=>nitroHeld=false);

window.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a") left=true;
    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d") right=true;
    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s") brake=true;
    if(e.key==="ArrowUp" || e.key.toLowerCase()==="w") speed=Math.min(235,speed+5);
    if(e.code==="Space") nitroHeld=true;
});

window.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a") left=false;
    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d") right=false;
    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s") brake=false;
    if(e.code==="Space") nitroHeld=false;
});

/* Tilt support */

async function enableTilt() {

    try {

        if(
            typeof DeviceOrientationEvent!=="undefined" &&
            typeof DeviceOrientationEvent.requestPermission==="function"
        ) {

            const permission=
                await DeviceOrientationEvent.requestPermission();

            if(permission!=="granted") {
                alert("Motion permission nahi mili. Buttons use karein.");
                return;
            }
        }

        tiltEnabled=true;
        tiltZero=null;

        $("tiltInfo").textContent="📱 TILT CONTROL ENABLED";

        window.addEventListener(
            "deviceorientation",
            e=>{

                if(e.gamma===null) return;

                if(tiltZero===null) {
                    tiltZero=e.gamma;
                }

                tiltValue=clamp(
                    (e.gamma-tiltZero)/24,
                    -1,1
                );
            },
            true
        );

        alert("Tilt control enabled! Phone ko dheere se jhukayein.");

    } catch(error) {

        alert("Tilt control available nahi hai. Buttons use karein.");
    }
}

$("tiltBtn").addEventListener("click",enableTilt);

/* Start / restart */

$("startBtn").addEventListener("click",()=>{

    speed=0;
    distance=0;
    score=0;
    nitro=100;

    playerX=0;
    lean=0;
    crashed=0;

    gameTime=0;
    roadOffset=0;
    spawnClock=0;

    opponents=[];
    particles=[];

    for(let i=0;i<4;i++) {

        opponents.push({
            lane:randomLane(),
            depth:.12+i*.17,
            speed:random(.5,.8),
            color:COLORS[i],
            phase:Math.random()*6.28
        });
    }

    running=true;
    paused=false;

    $("pauseBtn").textContent="Ⅱ PAUSE";
    $("message").textContent="";
    $("startScreen").style.display="none";
    $("diagnostic").textContent="";
});

$("pauseBtn").addEventListener("click",()=>{

    if(!running) return;

    paused=!paused;

    $("pauseBtn").textContent=
        paused?"▶ RESUME":"Ⅱ PAUSE";

    $("message").textContent=
        paused?"PAUSED":"";
});

/* Prevent page scrolling */

document.addEventListener("touchmove",e=>{
    e.preventDefault();
},{passive:false});

/* Initial screen render is always active.
   Game drawing starts before START RACE. */

$("diagnostic").textContent=
    "Canvas engine ready • No external libraries";

</script>
