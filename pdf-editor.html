<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Extreme Moto Racing 3D</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
    touch-action: none;
    user-select: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

.topbar {
    display: flex;
    justify-content: space-between;
    padding: 15px;
    gap: 8px;
}

.panel {
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 9px 13px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
    text-align: center;
    min-width: 75px;
}

.label {
    color: #b8c8d8;
    font-size: 10px;
    letter-spacing: 1px;
}

.value {
    font-size: 21px;
    font-weight: 900;
    margin-top: 3px;
}

#speed {
    color: #00ffae;
}

#nitroBar {
    height: 7px;
    width: 100px;
    background: #555;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

#nitroFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#00d9ff,#00ff6a);
}

#message {
    position: absolute;
    top: 24%;
    width: 100%;
    text-align: center;
    font-size: 30px;
    font-weight: 1000;
    text-shadow: 0 3px 10px black;
}

#controls {
    position: fixed;
    bottom: 22px;
    left: 0;
    right: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
}

.control-group {
    display: flex;
    gap: 12px;
    pointer-events: auto;
}

.btn {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    border: 2px solid rgba(255,255,255,0.6);
    background: rgba(10,20,35,0.78);
    color: white;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    touch-action: none;
}

.btn:active {
    transform: scale(0.93);
    background: #087dff;
}

#nitroButton {
    background: linear-gradient(135deg,#ff9d00,#ff3500);
    font-size: 16px;
}

#brakeButton {
    background: linear-gradient(135deg,#555,#171717);
    font-size: 15px;
}

#startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        rgba(3,10,22,0.72),
        rgba(3,10,22,0.92)
    );
    color: white;
    z-index: 10;
    padding: 20px;
}

.startCard {
    max-width: 440px;
    width: 100%;
    text-align: center;
    padding: 28px 22px;
    border-radius: 24px;
    background: rgba(18,30,49,0.96);
    border: 1px solid #4b627d;
    box-shadow: 0 0 60px rgba(0,140,255,0.2);
}

.logo {
    font-size: 52px;
}

.startCard h1 {
    font-size: 32px;
    line-height: 1.15;
    margin: 12px 0;
}

.startCard h1 span {
    color: #00ffae;
}

.startCard p {
    color: #c6d2df;
    font-size: 14px;
    line-height: 1.7;
    margin: 12px 0 20px;
}

.mainBtn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 13px;
    color: #00150e;
    font-weight: 1000;
    font-size: 18px;
    background: linear-gradient(90deg,#00ffae,#00c8ff);
}

.secondaryBtn {
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #61758d;
    border-radius: 12px;
    color: white;
    background: #182940;
    width: 100%;
}

#pauseButton {
    position: fixed;
    top: 85px;
    right: 15px;
    pointer-events: auto;
    background: rgba(0,0,0,.7);
    color: white;
    border: 1px solid #aaa;
    padding: 10px 14px;
    border-radius: 10px;
}

#tiltStatus {
    position: fixed;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    font-size: 11px;
    color: white;
    background: rgba(0,0,0,.55);
    padding: 7px 12px;
    border-radius: 20px;
    white-space: nowrap;
}

#damage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-size: 40px;
    color: red;
    display: none;
    font-weight: 1000;
    text-shadow: 0 0 15px black;
}

@media(max-width:420px) {
    .panel {
        padding: 7px 9px;
        min-width: 65px;
    }

    .value {
        font-size: 17px;
    }

    .btn {
        width: 62px;
        height: 62px;
        border-radius: 18px;
    }

    .topbar {
        padding: 9px;
    }

    #nitroBar {
        width: 75px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div class="topbar">

        <div class="panel">
            <div class="label">SPEED</div>
            <div class="value" id="speed">0</div>
            <div style="font-size:10px">KM/H</div>
        </div>

        <div class="panel">
            <div class="label">POSITION</div>
            <div class="value" id="position">1/8</div>
        </div>

        <div class="panel">
            <div class="label">DISTANCE</div>
            <div class="value" id="distance">0</div>
            <div style="font-size:10px">METERS</div>
        </div>

        <div class="panel">
            <div class="label">NITRO ⚡</div>
            <div id="nitroBar">
                <div id="nitroFill"></div>
            </div>
        </div>

    </div>

    <button id="pauseButton">Ⅱ PAUSE</button>

    <div id="message"></div>

    <div id="damage">CRASH!</div>

    <div id="tiltStatus">
        🎮 BUTTON CONTROL ACTIVE
    </div>

</div>

<div id="controls">

    <div class="control-group">
        <button class="btn" id="leftButton">◀</button>
        <button class="btn" id="rightButton">▶</button>
    </div>

    <div class="control-group">
        <button class="btn" id="brakeButton">BRAKE</button>
        <button class="btn" id="nitroButton">⚡ NITRO</button>
    </div>

</div>

<div id="startScreen">

    <div class="startCard">

        <div class="logo">🏍️</div>

        <h1>EXTREME <span>MOTO</span><br>RACING 3D</h1>

        <p>
            तैयार हो जाइए हाई-स्पीड बाइक रेसिंग के लिए!<br>
            दूसरी बाइकों को पीछे छोड़िए और रेस जीतिए।<br><br>
            📱 मोबाइल झुकाकर बाइक मोड़ें।<br>
            🎮 या LEFT / RIGHT बटन का उपयोग करें।<br>
            ⚡ नाइट्रो से स्पीड बढ़ाएँ।
        </p>

        <button class="mainBtn" id="startButton">
            🏁 START RACE
        </button>

        <button class="secondaryBtn" id="tiltButton">
            📱 ENABLE TILT CONTROL
        </button>

        <button class="secondaryBtn" id="restartButton">
            ↻ RESTART GAME
        </button>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

let scene, camera, renderer;
let player, playerBike;
let roadSegments = [];
let rivals = [];
let decorations = [];
let clock;

let running = false;
let paused = false;
let gameOver = false;

let speed = 0;
let maxSpeed = 190;
let distance = 0;
let score = 0;
let nitro = 100;
let nitroActive = false;

let steer = 0;
let playerX = 0;
let playerLean = 0;
let crashTimer = 0;
let invincible = 0;

let tiltEnabled = false;
let tiltValue = 0;
let tiltZero = 0;

let leftPressed = false;
let rightPressed = false;
let brakePressed = false;
let nitroPressed = false;

let lastTime = 0;
let roadCurve = 0;
let roadCurveTarget = 0;
let curveTimer = 0;
let spawnTimer = 0;
let lastRank = 1;

const ROAD_WIDTH = 13;
const ROAD_LENGTH = 220;
const SEGMENT_COUNT = 7;

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const random = (a,b) => a + Math.random()*(b-a);

function material(color, roughness=0.85, metalness=0) {
    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}

function box(w,h,d,mat,x=0,y=0,z=0) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),mat
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

function cylinder(rt,rb,h,mat,segments=16) {
    return new THREE.Mesh(
        new THREE.CylinderGeometry(rt,rb,h,segments),
        mat
    );
}

function createBike(color=0xff2020, isPlayer=false) {

    const root = new THREE.Group();

    const paint = material(color,0.28,0.55);
    const dark = material(0x151923,0.45,0.3);
    const rubber = material(0x101115,0.95);
    const metal = material(0x8b9aa7,0.28,0.8);
    const visor = material(0x142c43,0.18,0.65);
    const suit = material(color,0.6,0.05);
    const skin = material(0xc99169);

    // Wheels
    function wheel(z) {

        const group = new THREE.Group();

        const tire = cylinder(
            0.48,0.48,0.22,rubber,24
        );

        tire.rotation.z = Math.PI/2;
        group.add(tire);

        const rim = cylinder(
            0.29,0.29,0.235,metal,16
        );

        rim.rotation.z = Math.PI/2;
        group.add(rim);

        const inner = cylinder(
            0.11,0.11,0.25,dark,12
        );

        inner.rotation.z = Math.PI/2;
        group.add(inner);

        for(let i=0;i<8;i++) {
            const angle=i*Math.PI/4;

            const spoke=box(
                0.035,0.47,0.035,metal
            );

            spoke.position.y=Math.sin(angle)*0.21;
            spoke.position.z=Math.cos(angle)*0.21;

            group.add(spoke);
        }

        group.position.set(0,0.5,z);
        group.rotation.z=0;

        root.add(group);

        return group;
    }

    const rearWheel=wheel(0.95);
    const frontWheel=wheel(-1.05);

    // Frame
    root.add(box(
        0.18,0.20,1.65,dark,0,0.9,0
    ));

    root.add(box(
        0.50,0.55,0.75,paint,0,1.05,0.05
    ));

    root.add(box(
        0.36,0.20,0.5,dark,0,1.38,0.18
    ));

    // Fuel tank
    const tank = new THREE.Mesh(
        new THREE.SphereGeometry(0.38,16,12),
        paint
    );

    tank.scale.set(0.75,0.75,1.15);
    tank.position.set(0,1.48,-0.12);
    root.add(tank);

    // Seat
    const seat=box(
        0.38,0.14,0.63,dark,0,1.48,0.63
    );

    root.add(seat);

    // Front fairing
    const fairing = new THREE.Mesh(
        new THREE.SphereGeometry(0.42,16,12),
        paint
    );

    fairing.scale.set(0.72,1.0,0.95);
    fairing.position.set(0,1.42,-0.85);
    root.add(fairing);

    // Headlight
    const headlight=box(
        0.30,0.18,0.05,
        material(0xeaf8ff,0.2,0.2),
        0,1.42,-1.24
    );

    root.add(headlight);

    // Forks
    const fork1=cylinder(
        0.055,0.055,1.1,metal,10
    );

    fork1.position.set(-0.16,0.92,-0.82);
    fork1.rotation.x=-0.23;
    root.add(fork1);

    const fork2=fork1.clone();
    fork2.position.x=0.16;
    root.add(fork2);

    // Handlebars
    root.add(box(
        0.95,0.07,0.08,metal,0,1.83,-0.78
    ));

    // Rider body
    const torso = new THREE.Mesh(
        new THREE.SphereGeometry(0.34,16,12),
        suit
    );

    torso.scale.set(0.95,1.3,0.78);
    torso.position.set(0,2.05,0.18);
    torso.rotation.x=-0.3;
    root.add(torso);

    // Rider neck
    const neck=cylinder(
        0.11,0.11,0.2,skin,10
    );

    neck.position.set(0,2.43,-0.13);
    root.add(neck);

    // Helmet
    const helmet=new THREE.Mesh(
        new THREE.SphereGeometry(0.30,20,16),
        material(isPlayer?0xeeeeee:color,0.25,0.3)
    );

    helmet.scale.set(0.94,1.08,1.0);
    helmet.position.set(0,2.70,-0.19);
    root.add(helmet);

    // Visor
    const visorMesh=new THREE.Mesh(
        new THREE.SphereGeometry(0.23,16,10),
        visor
    );

    visorMesh.scale.set(1,0.62,0.5);
    visorMesh.position.set(0,2.73,-0.43);
    root.add(visorMesh);

    // Arms
    function makeArm(side) {

        const arm=new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.105,0.13,0.78,10
            ),
            suit
        );

        arm.position.set(side*0.33,1.99,-0.48);
        arm.rotation.x=-0.82;
        arm.rotation.z=side*0.30;
        root.add(arm);

        const glove=box(
            0.17,0.12,0.16,dark,
            side*0.49,1.80,-0.78
        );

        root.add(glove);
    }

    makeArm(-1);
    makeArm(1);

    // Legs
    for(const side of [-1,1]) {

        const leg=new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.12,0.16,0.85,10
            ),
            suit
        );

        leg.position.set(side*0.25,1.12,0.42);
        leg.rotation.x=-0.40;
        leg.rotation.z=side*0.15;

        root.add(leg);

        root.add(box(
            0.18,0.14,0.34,dark,
            side*0.28,0.76,0.38
        ));
    }

    // Exhaust
    const exhaust=cylinder(
        0.10,0.15,0.75,metal,12
    );

    exhaust.rotation.x=Math.PI/2;
    exhaust.position.set(0.28,0.80,0.87);
    root.add(exhaust);

    // Tail light
    root.add(box(
        0.25,0.12,0.06,
        material(0xff1717,0.25),
        0,1.42,0.95
    ));

    // Rear view mirrors
    for(const side of [-1,1]) {

        const stem=cylinder(
            0.025,0.025,0.35,metal,8
        );

        stem.position.set(side*0.42,1.95,-0.67);
        stem.rotation.z=side*0.45;

        root.add(stem);

        const mirror=box(
            0.16,0.12,0.06,dark,
            side*0.51,2.10,-0.68
        );

        root.add(mirror);
    }

    root.userData.frontWheel=frontWheel;
    root.userData.rearWheel=rearWheel;
    root.userData.isPlayer=isPlayer;

    return root;
}

function createRoadSegment(z) {

    const group=new THREE.Group();

    // Ground
    group.add(box(
        180,0.2,ROAD_LENGTH,
        material(0x5c913e),
        0,-0.18,0
    ));

    // Asphalt
    group.add(box(
        ROAD_WIDTH,0.12,ROAD_LENGTH,
        material(0x353940),
        0,0,-0
    ));

    // Road edges
    for(const side of [-1,1]) {

        group.add(box(
            0.22,0.15,ROAD_LENGTH,
            material(0xf3f3f3),
            side*(ROAD_WIDTH/2+0.02),
            0.06,0
        ));

        // Red and white curb blocks
        for(let i=0;i<10;i++) {

            const curb=box(
                0.30,0.10,8,
                material(i%2?0xffffff:0xff2020),
                side*(ROAD_WIDTH/2+0.17),
                0.10,
                -ROAD_LENGTH/2+i*22
            );

            group.add(curb);
        }

        // Guard rails
        group.add(box(
            0.15,0.35,ROAD_LENGTH,
            material(0xb7c1c9,0.35,0.5),
            side*8.0,0.65,0
        ));

        // Guard rail supports
        for(let i=0;i<10;i++) {

            group.add(box(
                0.12,0.65,0.16,
                material(0x737d85),
                side*8.0,0.3,
                -ROAD_LENGTH/2+i*22
            ));
        }
    }

    // Lane markings
    for(const laneX of [-ROAD_WIDTH/6,ROAD_WIDTH/6]) {

        for(let i=0;i<9;i++) {

            group.add(box(
                0.12,0.025,10,
                material(0xececec),
                laneX,0.075,
                -ROAD_LENGTH/2+i*25
            ));
        }
    }

    group.position.z=z;
    scene.add(group);

    roadSegments.push(group);
}

function createTree() {

    const tree=new THREE.Group();

    const trunk=cylinder(
        0.18,0.27,2.3,
        material(0x704425),10
    );

    trunk.position.y=1.1;
    tree.add(trunk);

    const green1=new THREE.Mesh(
        new THREE.ConeGeometry(1.15,2.3,8),
        material(0x247638)
    );

    green1.position.y=2.6;
    tree.add(green1);

    const green2=new THREE.Mesh(
        new THREE.ConeGeometry(0.85,1.8,8),
        material(0x359544)
    );

    green2.position.y=3.5;
    tree.add(green2);

    const green3=new THREE.Mesh(
        new THREE.ConeGeometry(0.52,1.2,8),
        material(0x4eae4b)
    );

    green3.position.y=4.25;
    tree.add(green3);

    return tree;
}

function createRock() {

    const rock=new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            random(1,2.5),0
        ),
        material(0x737e84)
    );

    rock.position.y=0.8;
    rock.scale.y=random(0.6,1.4);

    return rock;
}

function createEnvironment() {

    // Sky
    scene.background=new THREE.Color(0x8bd6ff);

    scene.fog=new THREE.Fog(0x8bd6ff,65,260);

    // Sun
    const sun=new THREE.Mesh(
        new THREE.SphereGeometry(10,16,16),
        material(0xfff1b5,1,0)
    );

    sun.position.set(-90,80,-170);
    scene.add(sun);

    // Mountains
    for(let i=0;i<24;i++) {

        const mountain=new THREE.Mesh(
            new THREE.ConeGeometry(
                random(14,28),
                random(22,50),
                5
            ),
            material(
                [0x718d99,0x869f9c,0x617b83][i%3]
            )
        );

        mountain.position.set(
            -150+i*13,
            random(10,20),
            -220-random(0,60)
        );

        scene.add(mountain);
    }

    // Roadside trees and rocks
    for(let i=0;i<55;i++) {

        const side=Math.random()<0.5?-1:1;

        const object=Math.random()<0.75
            ?createTree()
            :createRock();

        object.position.set(
            side*random(11,35),
            0,
            -i*17-random(0,10)
        );

        scene.add(object);
        decorations.push(object);
    }
}

function createRivals() {

    const colors=[
        0xff2222,
        0xffbb00,
        0x176cff,
        0xeeeeee,
        0x9922ff,
        0x111111,
        0x00cfa0
    ];

    for(let i=0;i<7;i++) {

        const bike=createBike(colors[i],false);

        bike.position.set(
            random(-4.4,4.4),
            0,
            -random(25,190)
        );

        bike.scale.setScalar(random(0.82,0.98));

        scene.add(bike);

        rivals.push({
            mesh:bike,
            x:bike.position.x,
            z:bike.position.z,
            speed:random(85,160),
            lane:random(-4.4,4.4),
            phase:random(0,Math.PI*2),
            passed:false,
            color:colors[i]
        });
    }
}

function init() {

    if(typeof THREE==="undefined") {
        $("message").textContent=
            "Three.js load nahi hua. Internet check karein.";
        return false;
    }

    scene=new THREE.Scene();

    camera=new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        0.1,
        1000
    );

    camera.position.set(0,5.2,10.5);
    camera.lookAt(0,1,-15);

    renderer=new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.7)
    );

    renderer.setSize(innerWidth,innerHeight);

    renderer.shadowMap.enabled=false;

    renderer.outputEncoding=THREE.sRGBEncoding;

    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.15;

    $("game").appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.HemisphereLight(
        0xdff4ff,0x526044,2.1
    ));

    const sunlight=new THREE.DirectionalLight(
        0xffffff,2.0
    );

    sunlight.position.set(-30,50,25);
    scene.add(sunlight);

    // Player
    player=new THREE.Group();

    playerBike=createBike(0x00d9ff,true);

    player.add(playerBike);
    player.position.set(0,0,0);

    scene.add(player);

    // Road segments
    for(let i=0;i<SEGMENT_COUNT;i++) {
        createRoadSegment(-i*ROAD_LENGTH);
    }

    createEnvironment();
    createRivals();

    clock=new THREE.Clock();

    window.addEventListener("resize",onResize);

    return true;
}

function onResize() {

    if(!camera || !renderer) return;

    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth,innerHeight);
}

function resetGame() {

    speed=0;
    distance=0;
    score=0;
    nitro=100;

    playerX=0;
    playerLean=0;

    crashTimer=0;
    invincible=0;

    roadCurve=0;
    roadCurveTarget=0;
    curveTimer=0;
    spawnTimer=0;

    gameOver=false;
    paused=false;

    for(let i=0;i<rivals.length;i++) {

        const r=rivals[i];

        r.x=random(-4.3,4.3);
        r.z=-random(35,210);
        r.speed=random(85,155);
        r.lane=random(-4.3,4.3);
        r.passed=false;

        r.mesh.position.set(r.x,0,r.z);
        r.mesh.rotation.set(0,0,0);
    }

    $("speed").textContent="0";
    $("distance").textContent="0";
    $("position").textContent="1/8";
    $("nitroFill").style.width="100%";

    $("message").textContent="";
    $("damage").style.display="none";

    $("startScreen").style.display="none";

    running=true;
    clock.getDelta();

    lastTime=performance.now();
}

function moveRivals(dt) {

    for(const r of rivals) {

        // Rival speed varies to create competition
        r.speed += random(-4,4)*dt;

        r.speed=clamp(r.speed,70,170);

        // Relative movement
        r.z += (speed-r.speed)*dt*0.10;

        // Lane changes
        r.phase+=dt*0.65;

        r.x += (
            (r.lane+Math.sin(r.phase)*0.75-r.x)
            *dt*0.38
        );

        r.x=clamp(r.x,-4.7,4.7);

        r.mesh.position.x=r.x;
        r.mesh.position.z=r.z;

        // Slight rider/bike movement
        r.mesh.rotation.z=
            Math.sin(r.phase)*0.035;

        const frontWheel=r.mesh.userData.frontWheel;
        const rearWheel=r.mesh.userData.rearWheel;

        frontWheel.rotation.x-=dt*speed*0.1;
        rearWheel.rotation.x-=dt*speed*0.1;

        // Rival goes ahead and reappears behind
        if(r.z>20) {

            r.z=-random(90,230);
            r.x=random(-4.5,4.5);
            r.lane=random(-4.5,4.5);
            r.speed=random(90,175);
            r.passed=false;
        }

        if(r.z<-250) {
            r.z=-random(100,210);
        }

        // Collision detection
        if(
            Math.abs(r.z)<2.5 &&
            Math.abs(r.x-playerX)<1.35 &&
            crashTimer<=0 &&
            invincible<=0
        ) {

            crashTimer=0.9;
            invincible=1.5;

            speed*=0.43;

            nitro=Math.max(0,nitro-10);

            $("damage").style.display="block";

            $("message").textContent="💥 CRASH!";

            setTimeout(()=>{
                if($("damage")) {
                    $("damage").style.display="none";
                }
            },500);
        }
    }
}

function moveRoad(dt) {

    const travel=speed*dt*0.15;

    for(const segment of roadSegments) {

        segment.position.z+=travel;

        if(segment.position.z>ROAD_LENGTH) {
            segment.position.z-=ROAD_LENGTH*SEGMENT_COUNT;
        }
    }

    // Roadside environment scroll
    for(const obj of decorations) {

        obj.position.z+=travel;

        if(obj.position.z>25) {
            obj.position.z=-random(250,600);
        }
    }
}

function updateCurve(dt) {

    curveTimer-=dt;

    if(curveTimer<=0) {

        curveTimer=random(4,9);

        roadCurveTarget=random(-0.24,0.24);
    }

    roadCurve += (
        roadCurveTarget-roadCurve
    )*dt*0.20;

    // Curve changes the apparent riding direction
    playerX-=roadCurve*speed*dt*0.10;

    playerX=clamp(playerX,-5.6,5.6);
}

function updatePlayer(dt) {

    const keyboardSteer=
        (rightPressed?1:0)-(leftPressed?1:0);

    const tiltSteer=tiltEnabled?tiltValue:0;

    steer=clamp(
        keyboardSteer+tiltSteer,
        -1,1
    );

    const targetLean=-steer*0.42;

    playerLean += (
        targetLean-playerLean
    )*Math.min(1,dt*7);

    playerX += steer*dt*5.5*(0.55+speed/190);

    playerX=clamp(playerX,-5.8,5.8);

    player.position.x=playerX;

    playerBike.rotation.z=playerLean;
    playerBike.rotation.y=-steer*0.06;

    // Acceleration and braking
    let targetSpeed=maxSpeed;

    if(brakePressed) {
        targetSpeed=20;
    }

    if(nitroPressed && nitro>0 && !brakePressed) {

        nitroActive=true;
        targetSpeed=235;

        nitro=Math.max(0,nitro-dt*27);

    } else {

        nitroActive=false;

        nitro=Math.min(100,nitro+dt*5.5);
    }

    if(!running || paused) targetSpeed=0;

    if(speed<targetSpeed) {
        speed+=dt*(nitroActive?80:30);
    } else {
        speed-=dt*(brakePressed?110:18);
    }

    speed=clamp(speed,0,235);

    // Off-road slowdown
    if(Math.abs(playerX)>4.8) {
        speed=Math.max(35,speed-dt*65);
    }

    // Wheels spin
    playerBike.userData.frontWheel.rotation.x-=
        dt*speed*0.10;

    playerBike.userData.rearWheel.rotation.x-=
        dt*speed*0.10;

    if(crashTimer>0) crashTimer-=dt;
    if(invincible>0) invincible-=dt;

    if(crashTimer<=0) {
        $("message").textContent="";
    }
}

function updateCamera(dt) {

    const targetX=playerX*0.42;

    camera.position.x += (
        targetX-camera.position.x
    )*dt*3;

    camera.position.y=5.2+Math.sin(distance*0.02)*0.06;

    camera.position.z=10.5;

    camera.lookAt(
        playerX*0.22,
        1.25,
        -13
    );

    // Slight camera vibration at high speed
    if(speed>150) {

        camera.position.y +=
            Math.sin(performance.now()*0.04)*0.035;
    }

    // Motion of the landscape simulates forward travel
    scene.fog.near=65;
    scene.fog.far=260;
}

function calculateRank() {

    let rank=1;

    for(const r of rivals) {

        if(r.z>0) {
            rank++;
        }
    }

    return clamp(rank,1,8);
}

function updateHUD(dt) {

    $("speed").textContent=Math.round(speed);

    $("distance").textContent=Math.floor(distance);

    const rank=calculateRank();

    $("position").textContent=rank+"/8";

    $("nitroFill").style.width=nitro+"%";

    if(nitroActive) {
        $("nitroFill").style.background=
            "linear-gradient(90deg,#ff5c00,#fff000)";
    } else {
        $("nitroFill").style.background=
            "linear-gradient(90deg,#00d9ff,#00ff6a)";
    }

    if(Math.abs(playerX)>4.8) {
        $("message").textContent="⚠️ OFF ROAD!";
    }
}

function animate() {

    requestAnimationFrame(animate);

    if(!renderer || !scene) return;

    const dt=Math.min(clock.getDelta(),0.05);

    if(running && !paused && !gameOver) {

        updatePlayer(dt);

        moveRoad(dt);

        updateCurve(dt);

        moveRivals(dt);

        updateCamera(dt);

        distance+=speed*dt*0.15;

        score+=Math.round(speed*dt);

        updateHUD(dt);
    }

    renderer.render(scene,camera);
}

// Button helpers
function holdButton(id,down,up) {

    const button=$(id);

    button.addEventListener("pointerdown",e=>{
        e.preventDefault();

        down();

        try {
            button.setPointerCapture(e.pointerId);
        } catch(err) {}
    });

    const release=e=>{
        up();
    };

    button.addEventListener("pointerup",release);
    button.addEventListener("pointercancel",release);
    button.addEventListener("lostpointercapture",release);
}

holdButton(
    "leftButton",
    ()=>leftPressed=true,
    ()=>leftPressed=false
);

holdButton(
    "rightButton",
    ()=>rightPressed=true,
    ()=>rightPressed=false
);

holdButton(
    "brakeButton",
    ()=>brakePressed=true,
    ()=>brakePressed=false
);

holdButton(
    "nitroButton",
    ()=>nitroPressed=true,
    ()=>nitroPressed=false
);

// Keyboard support
window.addEventListener("keydown",e=>{

    if([
        "ArrowLeft","ArrowRight",
        "ArrowUp","ArrowDown"," "
    ].includes(e.key)) {
        e.preventDefault();
    }

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        leftPressed=true;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        rightPressed=true;

    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s")
        brakePressed=true;

    if(e.key==="ArrowUp" || e.key.toLowerCase()==="w")
        speed=Math.min(235,speed+2);

    if(e.code==="Space")
        nitroPressed=true;
});

window.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        leftPressed=false;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        rightPressed=false;

    if(e.key==="ArrowDown" || e.key.toLowerCase()==="s")
        brakePressed=false;

    if(e.code==="Space")
        nitroPressed=false;
});

// Mobile tilt control
async function enableTilt() {

    try {

        if(typeof DeviceOrientationEvent!=="undefined" &&
           typeof DeviceOrientationEvent.requestPermission==="function") {

            const permission=
                await DeviceOrientationEvent.requestPermission();

            if(permission!=="granted") {
                alert("Motion permission allow nahi hui.");
                return;
            }
        }

        tiltEnabled=true;

        $("tiltStatus").textContent=
            "📱 TILT CONTROL ENABLED";

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        alert(
            "Tilt control enabled! Phone ko dheere se daayein-baayein jhukayein."
        );

    } catch(error) {

        alert(
            "Tilt control is device/browser par available nahi hai. Buttons use karein."
        );
    }
}

function handleOrientation(event) {

    if(event.gamma===null) return;

    // Calibrate first stable reading
    if(tiltZero===null) {
        tiltZero=event.gamma;
    }

    const raw=event.gamma-tiltZero;

    tiltValue=clamp(raw/22,-1,1);
}

$("tiltButton").addEventListener(
    "click",
    enableTilt
);

$("startButton").addEventListener("click",()=>{

    if(!scene) {

        const success=init();

        if(!success) return;
    }

    resetGame();
});

$("restartButton").addEventListener("click",()=>{

    if(!scene) {

        const success=init();

        if(!success) return;
    }

    resetGame();
});

$("pauseButton").addEventListener("click",()=>{

    if(!running) return;

    paused=!paused;

    $("pauseButton").textContent=
        paused?"▶ RESUME":"Ⅱ PAUSE";

    if(paused) {
        $("message").textContent="PAUSED";
    } else {
        $("message").textContent="";
        clock.getDelta();
    }
});

// Prevent mobile browser scrolling
document.addEventListener("touchmove",e=>{
    e.preventDefault();
},{passive:false});

})();
</script>
