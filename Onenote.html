<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>OneNote Infinity Pro</title>

<style>
:root {
  --accent: #7654c9;
  --border: #dedede;
  --hover: #f1edfb;
  --text: #252525;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, "Noto Sans Devanagari", sans-serif;
  color: var(--text);
  background: white;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 9px;
  min-height: 48px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.brand {
  font-weight: bold;
  font-size: 16px;
  white-space: nowrap;
}

.brand span {
  color: var(--accent);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
}

.btn {
  border: 1px solid var(--border);
  border-radius: 5px;
  background: white;
  padding: 7px 9px;
  font-size: 12px;
}

.btn.primary {
  background: var(--accent);
  color: white;
}

.btn:hover,
.tool:hover {
  background: var(--hover);
}

.main {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

.sidebar {
  width: 250px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--border);
  transition: width .15s;
}

.sidebar.collapsed {
  width: 0;
  overflow: hidden;
  border: 0;
}

.side-head {
  padding: 9px;
  border-bottom: 1px solid #eee;
}

.side-head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: bold;
}

.side-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.small-btn {
  font-size: 11px;
  padding: 6px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 4px;
}

.tree {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 5px;
}

.tree-row {
  display: flex;
  align-items: center;
  gap: 2px;
  min-height: 30px;
  padding: 2px;
  border-radius: 4px;
  font-size: 12px;
}

.tree-row:hover {
  background: #f6f6f6;
}

.tree-row.active {
  background: #eee8ff;
  color: #51349b;
}

.tree-toggle,
.tree-menu {
  flex-shrink: 0;
  width: 25px;
  height: 27px;
  border: 0;
  border-radius: 4px;
  background: transparent;
}

.tree-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.tree-children {
  margin-left: 10px;
  padding-left: 5px;
  border-left: 1px solid #eee;
}

.side-footer {
  padding: 8px;
  border-top: 1px solid #eee;
  color: #777;
  font-size: 10px;
}

.editor {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.page-head {
  padding: 7px 12px 4px;
  flex-shrink: 0;
}

#pageTitle {
  width: 100%;
  border: 0;
  outline: none;
  padding: 5px 0;
  font-size: 22px;
  font-weight: bold;
}

.status {
  min-height: 13px;
  font-size: 10px;
  color: #777;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 6px;
  border-top: 1px solid #eee;
  border-bottom: 1px solid #ddd;
  flex-shrink: 0;
}

.group {
  display: flex;
  align-items: center;
  gap: 3px;
  padding-right: 5px;
  margin-right: 2px;
  border-right: 1px solid #eee;
}

.tool {
  min-height: 30px;
  min-width: 29px;
  padding: 4px 7px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: white;
  font-size: 12px;
}

.tool-select {
  height: 30px;
  max-width: 130px;
  padding: 3px;
  border: 1px solid #ddd;
  border-radius: 4px;
  background: white;
  font-size: 11px;
}

.color-input {
  width: 30px;
  height: 30px;
  padding: 2px;
  border: 1px solid #ddd;
  border-radius: 4px;
}

.workspace-scroll {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: white;
  overscroll-behavior: contain;
}

.workspace {
  position: relative;
  min-width: 100%;
  min-height: 100%;
  width: 1400px;
  height: 1000px;
  background: white;
}

.main-writing {
  position: absolute;
  left: 20px;
  top: 15px;
  width: 794px;
  min-height: 500px;
  border: 1px solid transparent;
  background: white;
}

.main-writing.has-content {
  border-color: #e3e3e3;
}

.writing-body {
  min-height: 480px;
  padding: 24px 28px;
  outline: none;
  overflow-wrap: anywhere;
  line-height: 1.65;
  font-size: 15px;
}

.writing-body:empty::before {
  content: "यहाँ क्लिक करके लिखें...";
  color: #aaa;
  pointer-events: none;
}

.writing-body img,
.text-body img {
  display: inline-block;
  max-width: 100%;
  height: auto;
  vertical-align: middle;
  cursor: grab;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-drag: none;
}

.writing-body img.image-selected,
.text-body img.image-selected {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
  box-shadow: 0 0 0 5px #7654c933;
}

.writing-body table,
.text-body table {
  border-collapse: collapse;
  max-width: 100%;
}

.writing-body td,
.writing-body th,
.text-body td,
.text-body th {
  border: 1px solid #aaa;
  padding: 5px;
}

/* Floating panels */

.object {
  position: absolute;
  left: 100px;
  top: 100px;
  background: white;
  border: 1px solid transparent;
}

.object.has-content {
  border-color: #d9d9d9;
}

.object-head {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 27px;
  padding: 3px 6px;
  background: white;
  border-bottom: 1px solid transparent;
  cursor: move;
  user-select: none;
  touch-action: none;
}

.object-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: #777;
}

.object-close {
  border: 0;
  background: transparent;
  font-size: 17px;
  color: #666;
}

.object-body {
  background: white;
}

.text-object {
  width: 240px;
  min-width: 100px;
  min-height: 32px;
  resize: both;
  overflow: hidden;
}

.text-body {
  min-height: 24px;
  padding: 4px 7px;
  outline: none;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.image-object {
  width: 330px;
  min-width: 120px;
  resize: both;
  overflow: hidden;
  border: 1px solid #ddd;
}

.image-object img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  cursor: default;
}

.pdf-object {
  width: 794px;
  min-width: 260px;
  border: 1px solid #ddd;
}

.pdf-pages {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pdf-page {
  position: relative;
  width: 100%;
  overflow: hidden;
  border: 1px solid #eee;
  background: white;
  line-height: normal;
}

.pdf-canvas {
  display: block;
  width: 100%;
  height: auto;
}

.pdf-text-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  user-select: text;
  -webkit-user-select: text;
  line-height: 1;
}

.pdf-text-layer span {
  position: absolute;
  white-space: pre;
  transform-origin: 0 0;
  color: transparent;
  cursor: text;
}

.pdf-text-layer ::selection {
  background: rgba(60,120,255,.35);
}

.pdf-highlight-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  touch-action: none;
}

.pdf-page.highlight-mode .pdf-highlight-layer {
  pointer-events: auto;
  cursor: crosshair;
}

.pdf-placeholder {
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  color: #777;
  padding: 10px;
}

.pdf-message {
  padding: 12px;
  font-size: 12px;
  color: #666;
}

.mindmap {
  position: absolute;
  left: 900px;
  top: 30px;
  width: 320px;
  padding: 10px;
  border: 1px solid #ddd;
  background: white;
}

.mindmap h3 {
  font-size: 14px;
  margin: 0 0 8px;
}

.mindmap input {
  width: 100%;
  padding: 7px;
  border: 1px solid #ddd;
}

.mind-node {
  padding: 7px;
  margin-top: 5px;
  border: 1px solid #ddd;
  font-size: 12px;
}

.backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 500;
  background: #0005;
  padding: 15px;
}

.dialog {
  width: min(420px,100%);
  padding: 18px;
  border-radius: 8px;
  background: white;
}

.dialog input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

#pdfModeHint {
  font-size: 11px;
  color: var(--accent);
}

@media(max-width:700px) {
  .topbar {gap:4px;padding:5px}
  .brand {font-size:12px}
  .top-actions {gap:3px}
  .top-actions .btn {padding:6px;font-size:10px}
  .sidebar {width:150px}
  .side-head {padding:6px}
  .small-btn {font-size:10px;padding:5px}
  .tree-row {font-size:11px}
  #pageTitle {font-size:19px}
  .toolbar {gap:3px;padding:4px}
  .group {padding-right:3px}
  .tool {padding:3px 5px;min-width:26px}
  .tool-select {max-width:105px}
  .main-writing {width:794px;left:12px;top:12px}
  .writing-body {padding:18px}
}
@media(max-width:420px) {
  .sidebar {width:125px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <button class="btn" id="sidebarToggle">☰</button>
  <div class="brand">OneNote <span>Infinity Pro</span></div>
  <div class="top-actions">
    <button class="btn" id="saveBtn">Save</button>
    <button class="btn" id="backupBtn">Backup</button>
    <button class="btn" id="restoreBtn">Restore</button>
  </div>
</header>

<div class="main">
<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <div class="side-head-row"><span>📚 Notebooks</span><button class="small-btn" id="sidebarMinBtn">−</button></div>
    <div class="side-actions">
      <button class="small-btn" id="newNotebook">＋ Notebook</button>
      <button class="small-btn" id="newSection">＋ Section</button>
      <button class="small-btn" id="newPage">＋ Page</button>
    </div>
  </div>
  <div class="tree" id="tree"></div>
  <div class="side-footer">Auto Save · Local Storage + IndexedDB</div>
</aside>

<section class="editor">
  <div class="page-head">
    <input id="pageTitle" placeholder="Page title">
    <div class="status" id="status">Ready</div>
  </div>

  <div class="toolbar">
    <div class="group"><button class="tool" data-cmd="undo">↶</button><button class="tool" data-cmd="redo">↷</button></div>
    <div class="group">
      <select class="tool-select" id="blockFormat"><option value="P">Paragraph</option><option value="H1">Heading 1</option><option value="H2">Heading 2</option><option value="H3">Heading 3</option><option value="BLOCKQUOTE">Quote</option></select>
      <select class="tool-select" id="fontFamily"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Verdana">Verdana</option><option value="Tahoma">Tahoma</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option><option value="Noto Sans Devanagari">Noto Sans Devanagari</option></select>
      <select class="tool-select" id="fontSize"><option value="1">8</option><option value="2">10</option><option value="3" selected>12</option><option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option></select>
    </div>
    <div class="group"><button class="tool" data-cmd="bold"><b>B</b></button><button class="tool" data-cmd="italic"><i>I</i></button><button class="tool" data-cmd="underline"><u>U</u></button><button class="tool" data-cmd="strikeThrough"><s>S</s></button></div>
    <div class="group"><label title="Font Color"><input class="color-input" type="color" id="fontColor" value="#222222"></label><label title="Highlight Color"><input class="color-input" type="color" id="highlightColor" value="#fff176"></label></div>
    <div class="group"><button class="tool" data-cmd="justifyLeft">⇤</button><button class="tool" data-cmd="justifyCenter">≡</button><button class="tool" data-cmd="justifyRight">⇥</button><button class="tool" data-cmd="justifyFull">☷</button></div>
    <div class="group"><button class="tool" data-cmd="insertUnorderedList">• List</button><button class="tool" data-cmd="insertOrderedList">1. List</button><button class="tool" data-cmd="indent">→</button><button class="tool" data-cmd="outdent">←</button></div>
    <div class="group"><button class="tool" id="linkBtn">🔗 Link</button><button class="tool" id="tableBtn">▦ Table</button><button class="tool" id="clearFormat">Tx</button></div>
    <div class="group"><button class="tool" id="addText">＋ Text</button><button class="tool" id="insertImage">🖼 Image</button><button class="tool" id="insertFile">📎 File</button><button class="tool" id="insertPDF">＋ PDF</button><button class="tool" id="addMindMap">Mind Map</button></div>
    <div class="group"><button class="tool" id="pdfSelectMode">PDF: Select Text</button><button class="tool" id="pdfHighlightMode">🖍 PDF Highlighter</button><button class="tool" id="clearPDFHighlights">Clear PDF Highlights</button></div>
    <span id="pdfModeHint">PDF mode: Select Text</span>
  </div>

  <div class="workspace-scroll" id="workspaceScroll">
    <div class="workspace" id="workspace">
      <div class="main-writing" id="mainWriting"><div class="writing-body" id="writingBody" contenteditable="true" spellcheck="true"></div></div>
    </div>
  </div>
</section>
</div>
</div>

<input type="file" id="imageInput" accept="image/*" multiple hidden>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="pdfInput" accept=".pdf,application/pdf" multiple hidden>
<input type="file" id="restoreInput" accept=".json,application/json" hidden>

<div class="backdrop" id="backdrop"><div class="dialog">
  <h3 id="dialogTitle">Create</h3><input id="dialogInput" placeholder="Enter name">
  <div class="dialog-actions"><button class="btn" id="cancelDialog">Cancel</button><button class="btn primary" id="confirmDialog">Create</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";

const KEY="onenoteInfinityV4", DBNAME="onenoteInfinityAssetsV4", STORE="assets";
const $=id=>document.getElementById(id);
let state, activePageId, assetDB, saveTimer, dialogAction=null;
let lastEditor=$("writingBody"), lastRange=null, pendingEmptyPanel=null, menuElement=null;
const objectUrls=new Set(), pdfTasks=new Map();
let pdfMode="select";

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* IndexedDB asset storage */
function openDB(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)) return reject(Error("IndexedDB उपलब्ध नहीं है"));
    const req=indexedDB.open(DBNAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"})};
    req.onsuccess=()=>{assetDB=req.result;resolve(assetDB)};
    req.onerror=()=>reject(req.error);
  });
}
async function putAsset(id,blob,name,type){
  if(!assetDB)await openDB();
  return new Promise((resolve,reject)=>{
    const tx=assetDB.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put({id,blob,name,type,updatedAt:Date.now()});
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });
}
async function getAsset(id){
  if(!assetDB)await openDB();
  return new Promise((resolve,reject)=>{
    const tx=assetDB.transaction(STORE,"readonly"),req=tx.objectStore(STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
  });
}
function makeObjectURL(blob){const u=URL.createObjectURL(blob);objectUrls.add(u);return u}
function revokeObjectURL(u){if(u&&objectUrls.has(u)){URL.revokeObjectURL(u);objectUrls.delete(u)}}

/* Data model */
function uid(){return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9)}
function makePage(title="New Page"){return{id:uid(),type:"page",title,content:"",objects:[],mindmap:[],updatedAt:Date.now()}}
function makeSection(title="New Section"){return{id:uid(),type:"section",title,expanded:true,children:[makePage("Page 1")]}}
function makeNotebook(title="My Notebook"){return{id:uid(),type:"notebook",title,expanded:true,children:[makeSection("General")]}}
function defaults(){const n=makeNotebook();return{version:4,notebooks:[n],lastPageId:n.children[0].children[0].id}}
function walk(n,cb){cb(n);(n.children||[]).forEach(c=>walk(c,cb))}
function allPages(){const a=[];(state.notebooks||[]).forEach(n=>walk(n,x=>{if(x.type==="page")a.push(x)}));return a}
function findParent(id){let f=null;(state.notebooks||[]).forEach(n=>walk(n,x=>{if((x.children||[]).some(c=>c.id===id))f=x}));return f}
function activePage(){return allPages().find(p=>p.id===activePageId)||null}
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.notebooks))state=x}}catch(e){console.warn(e)}
  if(!state||!state.notebooks.length||!allPages().length)state=defaults();
  const pages=allPages();activePageId=pages.some(p=>p.id===state.lastPageId)?state.lastPageId:pages[0].id;
}
function setStatus(t){$("status").textContent=t}
function saveCurrentPage(){
  const p=activePage();if(!p)return;
  p.title=$("pageTitle").value.trim()||"Untitled Page";p.content=$("writingBody").innerHTML;p.objects=p.objects||[];
  $("workspace").querySelectorAll(".object").forEach(el=>{
    const o=p.objects.find(x=>x.id===el.dataset.objectId);if(!o)return;
    o.x=parseFloat(el.style.left)||0;o.y=parseFloat(el.style.top)||0;o.w=el.offsetWidth||o.w||240;o.h=el.offsetHeight||o.h||32;
    if(o.type==="text"){const b=el.querySelector(".text-body");if(b)o.html=b.innerHTML;o.userWidth=el.dataset.userWidth==="1";o.userHeight=el.dataset.userHeight==="1"}
  });
}
function saveNow(){
  clearTimeout(saveTimer);saveCurrentPage();
  try{state.lastPageId=activePageId;localStorage.setItem(KEY,JSON.stringify(state));setStatus("✓ Saved");return true}
  catch(e){console.error(e);setStatus("Save error");alert("नोट्स सेव नहीं हो सके। Backup बनाएँ या जगह खाली करें।");return false}
}
function scheduleSave(){setStatus("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,600)}
$("saveBtn").onclick=saveNow;
window.addEventListener("beforeunload",()=>{try{saveCurrentPage();state.lastPageId=activePageId;localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}});

/* Dialog */
function showDialog(title,placeholder,fn){$("dialogTitle").textContent=title;$("dialogInput").value="";$("dialogInput").placeholder=placeholder||"Name";dialogAction=fn;$("backdrop").style.display="flex";setTimeout(()=>$("dialogInput").focus(),50)}
function closeDialog(){$("backdrop").style.display="none";dialogAction=null}
$("cancelDialog").onclick=closeDialog;
$("confirmDialog").onclick=()=>{const v=$("dialogInput").value.trim();if(!v)return alert("नाम लिखें।");const fn=dialogAction;closeDialog();if(fn)fn(v)};
$("dialogInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("confirmDialog").click()});
$("backdrop").addEventListener("click",e=>{if(e.target===$("backdrop"))closeDialog()});

/* Notebook tree */
function renderTree(){$("tree").innerHTML="";state.notebooks.forEach(n=>$("tree").appendChild(renderNode(n)))}
function renderNode(node){
  const wrap=document.createElement("div"),row=document.createElement("div");row.className="tree-row";if(node.id===activePageId)row.classList.add("active");
  const has=(node.children||[]).length>0,t=document.createElement("button");t.className="tree-toggle";t.textContent=has?(node.expanded===false?"▸":"▾"):"";
  const label=document.createElement("span");label.className="tree-label";label.textContent=(node.type==="notebook"?"📚 ":node.type==="section"?"📁 ":"📄 ")+node.title;
  const menu=document.createElement("button");menu.className="tree-menu";menu.textContent="⋮";row.append(t,label,menu);wrap.append(row);
  t.onclick=e=>{e.stopPropagation();if(has){node.expanded=node.expanded===false;renderTree();scheduleSave()}};
  label.onclick=()=>{if(node.type==="page")openPage(node.id);else{node.expanded=node.expanded===false;renderTree();scheduleSave()}};
  menu.onclick=e=>{e.stopPropagation();showNodeDropdown(menu,node)};
  if(has&&node.expanded!==false){const ch=document.createElement("div");ch.className="tree-children";node.children.forEach(c=>ch.appendChild(renderNode(c)));wrap.append(ch)}
  return wrap;
}

  const up=()=>{if(drawing){drawing=false;last=null;scheduleSave()}};c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
}
function drawSavedHighlights(o,item){if(!item.hi)return;const c=item.hi,ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.globalAlpha=.34;for(const h of o.highlights||[]){ctx.strokeStyle=h.color||"#fff176";ctx.lineWidth=Math.max(10,(h.width||.015)*c.width);ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(h.x1*c.width,h.y1*c.height);ctx.lineTo(h.x2*c.width,h.y2*c.height);ctx.stroke()}ctx.restore()}
$("pdfSelectMode").onclick=()=>{pdfMode="select";updatePDFMode()};
$("pdfHighlightMode").onclick=()=>{pdfMode="highlight";updatePDFMode()};
function updatePDFMode(){$("pdfModeHint").textContent="PDF mode: "+(pdfMode==="select"?"Select Text":"Highlighter — उंगली से ड्रैग करें");document.querySelectorAll(".pdf-page").forEach(p=>p.classList.toggle("highlight-mode",pdfMode==="highlight"))}
$("clearPDFHighlights").onclick=()=>{const p=activePage();if(!p)return;p.objects.filter(o=>o.type==="pdf").forEach(o=>{o.highlights=[];const t=pdfTasks.get(o.id);if(t)t.items.forEach(i=>drawSavedHighlights(o,i))});scheduleSave();setStatus("PDF highlights cleared")};
function enablePDFResize(el,o){if(!("ResizeObserver"in window))return;let last=el.clientWidth,timer;new ResizeObserver(()=>{const w=el.clientWidth;if(!w||Math.abs(w-last)<24)return;last=w;clearTimeout(timer);timer=setTimeout(()=>{const c=el.querySelector(".pdf-pages");if(c)loadPDF(o,el,c)},800)}).observe(el)}

/* Render page objects */
function renderObjects(p){$("workspace").querySelectorAll(".object,.mindmap").forEach(el=>{if(el.classList.contains("pdf-object"))cancelPDFTask(el.dataset.objectId);el.remove()});p.objects=p.objects||[];p.objects.filter(o=>["text","image","pdf"].includes(o.type)).forEach(o=>$("workspace").append(createObject(o)));renderMindMap(p);requestAnimationFrame(()=>{autoGrowMain();updateWorkspaceSize();updatePDFMode()})}
function renderMindMap(p){const old=$("workspace").querySelector(".mindmap");if(old)old.remove();if(!p.mindmap||!p.mindmap.length)return;const box=document.createElement("div");box.className="mindmap";const h=document.createElement("h3");h.textContent="Mind Map";const input=document.createElement("input");input.placeholder="New idea — Enter दबाएँ";const list=document.createElement("div");function refresh(){list.innerHTML="";p.mindmap.forEach((v,i)=>{const n=document.createElement("div");n.className="mind-node";n.textContent=v;n.onclick=()=>{if(confirm("इस आइडिया को हटाएँ?")){p.mindmap.splice(i,1);refresh();scheduleSave()}};list.append(n)});updateWorkspaceSize()}input.onkeydown=e=>{if(e.key==="Enter"&&input.value.trim()){p.mindmap.push(input.value.trim());input.value="";refresh();scheduleSave()}};box.append(h,input,list);$("workspace").append(box);refresh()}
$("addMindMap").onclick=()=>{const p=activePage();if(!p)return;p.mindmap=p.mindmap||[];if(!p.mindmap.length)p.mindmap.push("Main Idea");renderMindMap(p);scheduleSave()};

/* Backup and restore */
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function base64ToBlob(b,t){const x=atob(b),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return new Blob([a],{type:t||"application/octet-stream"})}
$("backupBtn").onclick=async()=>{saveNow();try{if(!assetDB)await openDB();const data={app:"OneNote Infinity Pro",version:4,state,assets:[]},ids=new Set();allPages().forEach(p=>{(p.objects||[]).forEach(o=>{if(o.assetId)ids.add(o.assetId)});const t=document.createElement("div");t.innerHTML=p.content||"";t.querySelectorAll("[data-asset-id]").forEach(x=>ids.add(x.dataset.assetId))});for(const id of ids){const r=await getAsset(id);if(r&&r.blob)data.assets.push({id:r.id,name:r.name,type:r.type,base64:await blobToBase64(r.blob)})}const u=makeObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="onenote-infinity-backup.json";a.click();setTimeout(()=>revokeObjectURL(u),3000);setStatus("Backup downloaded")}catch(e){console.error(e);alert("Backup नहीं बन पाया")}};
$("restoreBtn").onclick=()=>$("restoreInput").click();
$("restoreInput").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||!confirm("Restore से मौजूदा डेटा बदल सकता है। जारी रखें?"))return;try{if(!assetDB)await openDB();const d=JSON.parse(await f.text());if(!d.state||!Array.isArray(d.state.notebooks))throw Error("Invalid backup");for(const a of d.assets||[])await putAsset(a.id,base64ToBlob(a.base64,a.type),a.name,a.type);state=d.state;if(!allPages().length)state=defaults();activePageId=allPages().some(p=>p.id===state.lastPageId)?state.lastPageId:allPages()[0].id;saveNow();renderTree();openPage(activePageId);alert("Backup Restore हो गया")}catch(err){console.error(err);alert("Restore नहीं हो पाया। सही Backup JSON चुनें।")}});

/* Start */
async function start(){try{await openDB()}catch(e){console.warn(e);setStatus("फ़ाइल स्टोरेज उपलब्ध नहीं है")}loadState();renderTree();openPage(activePageId);setStatus("Ready")}
window.addEventListener("resize",updateWorkspaceSize);
start();
</script>
</body>
