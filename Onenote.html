<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>OneNote Infinity Pro</title>

<style>
:root {
    --accent: #7654c9;
    --border: #dedede;
    --hover: #f1edfb;
    --text: #252525;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    color: var(--text);
    background: #fff;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* TOP BAR */

.topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 9px;
    min-height: 48px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.brand {
    font-weight: bold;
    font-size: 16px;
    white-space: nowrap;
}

.brand span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
}

.btn {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #fff;
    padding: 7px 9px;
    font-size: 12px;
}

.btn.primary {
    background: var(--accent);
    color: #fff;
}

.btn:hover, .tool:hover {
    background: var(--hover);
}

/* MAIN LAYOUT */

.main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--border);
    transition: width .15s;
}

.sidebar.collapsed {
    width: 0;
    overflow: hidden;
    border: 0;
}

.side-head {
    padding: 9px;
    border-bottom: 1px solid #eee;
}

.side-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: bold;
}

.side-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.small-btn {
    font-size: 11px;
    padding: 6px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 4px;
}

.tree {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 5px;
}

.tree-row {
    display: flex;
    align-items: center;
    gap: 2px;
    min-height: 30px;
    padding: 2px;
    border-radius: 4px;
    font-size: 12px;
}

.tree-row:hover {
    background: #f6f6f6;
}

.tree-row.active {
    background: #eee8ff;
    color: #51349b;
}

.tree-toggle, .tree-menu {
    flex-shrink: 0;
    width: 25px;
    height: 27px;
    border: 0;
    border-radius: 4px;
    background: transparent;
}

.tree-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
}

.tree-children {
    margin-left: 10px;
    padding-left: 5px;
    border-left: 1px solid #eee;
}

.side-footer {
    padding: 8px;
    border-top: 1px solid #eee;
    color: #777;
    font-size: 10px;
}

/* EDITOR */

.editor {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.page-head {
    padding: 7px 12px 4px;
    flex-shrink: 0;
}

#pageTitle {
    width: 100%;
    border: 0;
    outline: none;
    padding: 5px 0;
    font-size: 22px;
    font-weight: bold;
}

.status {
    min-height: 13px;
    font-size: 10px;
    color: #777;
}

/* TOOLBAR */

.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 6px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
}

.group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding-right: 5px;
    margin-right: 2px;
    border-right: 1px solid #eee;
}

.tool {
    min-height: 30px;
    min-width: 29px;
    padding: 4px 7px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: #fff;
    font-size: 12px;
}

.tool-select {
    height: 30px;
    max-width: 130px;
    padding: 3px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    font-size: 11px;
}

.color-input {
    width: 30px;
    height: 30px;
    padding: 2px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

/* WORKSPACE */

.workspace-scroll {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: #fff;
    overscroll-behavior: contain;
}

.workspace {
    position: relative;
    min-width: 100%;
    min-height: 100%;
    width: 1400px;
    height: 1000px;
    background: #fff;
}

/* MAIN WRITING AREA */

.main-writing {
    position: absolute;
    left: 20px;
    top: 15px;
    width: 794px;
    min-height: 500px;
    border: 1px solid transparent;
    background: #fff;
}

.main-writing.has-content {
    border-color: #e3e3e3;
}

.writing-body {
    min-height: 480px;
    padding: 24px 28px;
    outline: none;
    overflow-wrap: anywhere;
    line-height: 1.65;
    font-size: 15px;
}

.writing-body:empty:before {
    content: "यहाँ क्लिक करके लिखें...";
    color: #aaa;
    pointer-events: none;
}

/* TABLES */

.writing-body table,
.text-body table {
    border-collapse: collapse;
    max-width: 100%;
}

.writing-body td,
.writing-body th,
.text-body td,
.text-body th {
    border: 1px solid #aaa;
    padding: 5px;
}

/* INLINE IMAGES */

.writing-body img,
.text-body img {
    max-width: 100%;
    height: auto;
    vertical-align: middle;
}

/* FLOATING OBJECTS */

.object {
    position: absolute;
    left: 100px;
    top: 100px;
    background: #fff;
    border: 1px solid transparent;
}

.object.has-content {
    border-color: #d9d9d9;
}

.object-head {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 27px;
    padding: 3px 6px;
    background: #fff;
    border-bottom: 1px solid transparent;
    cursor: move;
    user-select: none;
    touch-action: none;
}

.object-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    color: #777;
}

.object-close {
    border: 0;
    background: transparent;
    font-size: 17px;
    color: #666;
}

/* TEXT OBJECT */

.object-body {
    background: #fff;
}

.text-object {
    width: 240px;
    min-width: 100px;
    min-height: 32px;
    resize: both;
    overflow: auto;
}

.text-body {
    min-height: 24px;
    padding: 4px 7px;
    outline: none;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

/* IMAGE OBJECT */

.image-object {
    width: 330px;
    min-width: 120px;
    resize: both;
    overflow: hidden;
    border: 1px solid #ddd;
}

.image-object img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* PDF OBJECT */

.pdf-object {
    width: 794px;
    min-width: 260px;
    border: 1px solid #ddd;
}

.pdf-pages {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.pdf-page {
    position: relative;
    width: 100%;
    overflow: hidden;
    border: 1px solid #eee;
    background: #fff;
    line-height: normal;
}

.pdf-canvas {
    display: block;
    width: 100%;
    height: auto;
}

.pdf-placeholder {
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    color: #777;
    padding: 10px;
}

.pdf-message {
    padding: 12px;
    font-size: 12px;
    color: #666;
}

/* MIND MAP */

.mindmap {
    position: absolute;
    left: 900px;
    top: 30px;
    width: 320px;
    padding: 10px;
    border: 1px solid #ddd;
    background: #fff;
}

.mindmap h3 {
    font-size: 14px;
    margin: 0 0 8px;
}

.mindmap input {
    width: 100%;
    padding: 7px;
    border: 1px solid #ddd;
}

.mind-node {
    padding: 7px;
    margin-top: 5px;
    border: 1px solid #ddd;
    font-size: 12px;
}

/* DIALOG */

.backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    background: #0005;
    padding: 15px;
}

.dialog {
    width: min(420px, 100%);
    padding: 18px;
    border-radius: 8px;
    background: #fff;
}

.dialog input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
}

#pdfModeHint {
    font-size: 11px;
    color: var(--accent);
}

/* UPDATED INLINE PHOTO EDITOR */

.inline-image-wrap {
    position: relative;
    display: inline-block;
    vertical-align: middle;
    max-width: 100%;
    margin: 12px 8px;
    line-height: 0;
    user-select: none;
    -webkit-user-select: none;
}

.inline-image-wrap img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

/* SELECTED IMAGE BORDER */

.inline-image-wrap.selected {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    box-shadow: 0 0 0 4px #7654c933;
}

/* DRAG HANDLE */

.inline-image-drag {
    position: absolute;
    top: -29px;
    left: 0;
    width: 100%;
    height: 27px;
    display: none;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: #fff;
    border-radius: 5px 5px 0 0;
    font-size: 12px;
    font-weight: bold;
    cursor: grab;
    touch-action: none;
    z-index: 100;
    line-height: 1;
}

.inline-image-wrap.selected .inline-image-drag {
    display: flex;
}

/* RESIZE HANDLE */

.inline-image-resize {
    position: absolute;
    width: 30px;
    height: 30px;
    right: -12px;
    bottom: -12px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: nwse-resize;
    touch-action: none;
    z-index: 101;
    padding: 0;
}

.inline-image-wrap.selected .inline-image-resize {
    display: flex;
}

.inline-image-resize:active,
.inline-image-drag:active {
    background: #51349b;
}

/* MOBILE DESIGN */

@media(max-width:700px) {

    .topbar {
        gap: 4px;
        padding: 5px;
    }

    .brand {
        font-size: 12px;
    }

    .top-actions {
        gap: 3px;
    }

    .top-actions .btn {
        padding: 6px;
        font-size: 10px;
    }

    .sidebar {
        width: 150px;
    }

    .side-head {
        padding: 6px;
    }

    .small-btn {
        font-size: 10px;
        padding: 5px;
    }

    .tree-row {
        font-size: 11px;
    }

    #pageTitle {
        font-size: 19px;
    }

    .toolbar {
        gap: 3px;
        padding: 4px;
    }

    .group {
        padding-right: 3px;
    }

    .tool {
        padding: 3px 5px;
        min-width: 26px;
    }

    .tool-select {
        max-width: 105px;
    }

    .main-writing {
        width: 794px;
        left: 12px;
        top: 12px;
    }

    .writing-body {
        padding: 18px;
    }

    .inline-image-drag {
        height: 30px;
        top: -32px;
    }

    .inline-image-resize {
        width: 34px;
        height: 34px;
        right: -13px;
        bottom: -13px;
    }
}

@media(max-width:420px) {
    .sidebar {
        width: 125px;
    }
}
</style>
</head>


<body>

</div>
</div>

<script>
"use strict";

/* BASIC SETTINGS */

const KEY = "onenoteInfinityV6";
const DBNAME = "onenoteInfinityAssetsV6";
const STORE = "assets";

const $ = id => document.getElementById(id);

let state;
let activePageId;
let assetDB;
let saveTimer;

let lastEditor = $("writingBody");
let lastRange = null;

let pendingEmptyPanel = null;
let menuElement = null;

let selectedInlineImage = null;
let pdfMode = "select";

const objectUrls = new Set();
const pdfTasks = new Map();

if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* INDEXED DB */

function openDB() {

    return new Promise((resolve, reject) => {

        if (!("indexedDB" in window)) {
            return reject(Error("IndexedDB उपलब्ध नहीं है"));
        }

        const req = indexedDB.open(DBNAME, 1);

        req.onupgradeneeded = () => {

            if (!req.result.objectStoreNames.contains(STORE)) {
                req.result.createObjectStore(STORE, {
                    keyPath: "id"
                });
            }

        };

        req.onsuccess = () => {
            assetDB = req.result;
            resolve(assetDB);
        };

        req.onerror = () => reject(req.error);

    });

}

async function putAsset(id, blob, name, type) {

    if (!assetDB) await openDB();

    return new Promise((resolve, reject) => {

        const tx = assetDB.transaction(STORE, "readwrite");

        tx.objectStore(STORE).put({
            id,
            blob,
            name,
            type,
            updatedAt: Date.now()
        });

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);

    });

}

async function getAsset(id) {

    if (!assetDB) await openDB();

    return new Promise((resolve, reject) => {

        const tx = assetDB.transaction(STORE, "readonly");

        const req = tx.objectStore(STORE).get(id);

        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);

    });

}

function makeObjectURL(blob) {

    const url = URL.createObjectURL(blob);

    objectUrls.add(url);

    return url;

}

function revokeObjectURL(url) {

    if (url && objectUrls.has(url)) {

        URL.revokeObjectURL(url);

        objectUrls.delete(url);

    }

}

/* DATA MODEL */

function uid() {

    return "id_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2, 9);

}

function makePage(title = "New Page") {

    return {
        id: uid(),
        type: "page",
        title,
        content: "",
        objects: [],
        mindmap: [],
        updatedAt: Date.now()
    };

}

function makeSection(title = "New Section") {

    return {
        id: uid(),
        type: "section",
        title,
        expanded: true,
        children: [
            makePage("Page 1")
        ]
    };

}

function makeNotebook(title = "My Notebook") {

    return {
        id: uid(),
        type: "notebook",
        title,
        expanded: true,
        children: [
            makeSection("General")
        ]
    };

}

function defaults() {

    const notebook = makeNotebook();

    return {
        version: 6,
        notebooks: [notebook],
        lastPageId: notebook.children[0].children[0].id
    };

}

function walk(node, callback) {

    callback(node);

    (node.children || []).forEach(child => {
        walk(child, callback);
    });

}

function allPages() {

    const pages = [];

    (state.notebooks || []).forEach(notebook => {

        walk(notebook, node => {

            if (node.type === "page") {
                pages.push(node);
            }

        });

    });

    return pages;

}

function findParent(id) {

    let found = null;

    (state.notebooks || []).forEach(notebook => {

        walk(notebook, node => {

            if ((node.children || []).some(child => child.id === id)) {
                found = node;
            }

        });

    });

    return found;

}

function activePage() {

    return allPages().find(page => page.id === activePageId) || null;

}

/* LOAD STATE */

function loadState() {

    try {

        const raw = localStorage.getItem(KEY);

        if (raw) {

            const saved = JSON.parse(raw);

            if (saved && Array.isArray(saved.notebooks)) {
                state = saved;
            }

        }

    } catch (e) {
        console.warn(e);
    }

    if (!state || !state.notebooks.length || !allPages().length) {
        state = defaults();
    }

    const pages = allPages();

    activePageId = pages.some(page => page.id === state.lastPageId)
        ? state.lastPageId
        : pages[0].id;

}

/* SAVE */

function setStatus(message) {
    $("status").textContent = message;
}

function saveCurrentPage() {

    const page = activePage();

    if (!page) return;

    page.title = $("pageTitle").value.trim() || "Untitled Page";

    page.content = $("writingBody").innerHTML;

    page.objects = page.objects || [];

    $("workspace").querySelectorAll(".object").forEach(el => {

        const obj = page.objects.find(
            item => item.id === el.dataset.objectId
        );

        if (!obj) return;

        obj.x = parseFloat(el.style.left) || 0;
        obj.y = parseFloat(el.style.top) || 0;

        obj.w = el.offsetWidth || obj.w || 240;
        obj.h = el.offsetHeight || obj.h || 32;

        if (obj.type === "text") {

            const body = el.querySelector(".text-body");

            if (body) obj.html = body.innerHTML;

            obj.userWidth = el.dataset.userWidth === "1";
            obj.userHeight = el.dataset.userHeight === "1";

        }

    });

}

function saveNow() {

    clearTimeout(saveTimer);

    saveCurrentPage();

    try {

        state.lastPageId = activePageId;

        localStorage.setItem(KEY, JSON.stringify(state));

        setStatus("✓ Saved");

        return true;

    } catch (e) {

        console.error(e);

        setStatus("Save error");

        alert("नोट्स सेव नहीं हो सके। Backup बनाएँ या जगह खाली करें।");

        return false;

    }

}

function scheduleSave() {

    setStatus("Saving…");

    clearTimeout(saveTimer);

    saveTimer = setTimeout(saveNow, 600);

}

$("saveBtn").onclick = saveNow;

window.addEventListener("beforeunload", () => {

    try {

        saveCurrentPage();

        state.lastPageId = activePageId;

        localStorage.setItem(KEY, JSON.stringify(state));

    } catch (e) {}

});

/* NOTEBOOK TREE */

function renderTree() {

    $("tree").innerHTML = "";

    state.notebooks.forEach(notebook => {

        $("tree").appendChild(renderNode(notebook));

    });

}

function renderNode(node) {

    const wrap = document.createElement("div");

    const row = document.createElement("div");

    row.className = "tree-row";

    if (node.id === activePageId) {
        row.classList.add("active");
    }

    const hasChildren = (node.children || []).length > 0;

    const toggle = document.createElement("button");

    toggle.className = "tree-toggle";

    toggle.textContent = hasChildren
        ? (node.expanded === false ? "▸" : "▾")
        : "";

    const label = document.createElement("span");

    label.className = "tree-label";

    label.textContent =
        (node.type === "notebook" ? "📚 " :
         node.type === "section" ? "📁 " : "📄 ") +
        node.title;

    const menu = document.createElement("button");

    menu.className = "tree-menu";

    menu.textContent = "⋮";

    row.append(toggle, label, menu);

    wrap.append(row);

    toggle.onclick = e => {

        e.stopPropagation();

        if (hasChildren) {

            node.expanded = node.expanded === false;

            renderTree();

            scheduleSave();

        }

    };

    label.onclick = () => {

        if (node.type === "page") {

            openPage(node.id);

        } else {

            node.expanded = node.expanded === false;

            renderTree();

            scheduleSave();

        }

    };

    menu.onclick = e => {

        e.stopPropagation();

        showNodeDropdown(menu, node);

    };

    if (hasChildren && node.expanded !== false) {

        const children = document.createElement("div");

        children.className = "tree-children";

        node.children.forEach(child => {
            children.appendChild(renderNode(child));
        });

        wrap.append(children);

    }

    return wrap;

}

function closeNodeDropdown() {

    if (menuElement) {

        menuElement.remove();

        menuElement = null;

    }

}

document.addEventListener("click", e => {

    if (menuElement && !menuElement.contains(e.target)) {
        closeNodeDropdown();
    }

});

function showNodeDropdown(button, node) {

    closeNodeDropdown();

    const menu = document.createElement("div");

    menu.style.cssText =
        "position:fixed;z-index:200;min-width:155px;" +
        "background:white;border:1px solid #ddd;" +
        "border-radius:6px;box-shadow:0 5px 20px #0002;padding:4px";

    let actions = [];

    if (node.type === "notebook") {

        actions = [
            ["＋ Create Section", () => createChild(node, "section")],
            ["✎ Rename", () => renameNode(node)],
            ["🗑 Delete", () => deleteNode(node)]
        ];

    } else if (node.type === "section") {

        actions = [
            ["＋ Create Subsection", () => createChild(node, "section")],
            ["＋ Create Page", () => createChild(node, "page")],
            ["✎ Rename", () => renameNode(node)],
            ["🗑 Delete", () => deleteNode(node)]
        ];

    } else {

        actions = [
            ["✎ Rename", () => renameNode(node)],
            ["🗑 Delete", () => deleteNode(node)]
        ];

    }

    actions.forEach(([text, callback]) => {

        const button = document.createElement("button");

        button.textContent = text;

        button.style.cssText =
            "display:block;width:100%;text-align:left;" +
            "border:0;background:white;padding:9px;font-size:12px";

        if (text.includes("Delete")) {
            button.style.color = "#c62828";
        }

        button.onclick = e => {

            e.stopPropagation();

            closeNodeDropdown();

            callback();

        };

        menu.append(button);

    });

    document.body.append(menu);

    menuElement = menu;

    const rect = button.getBoundingClientRect();

    menu.style.left =
        Math.max(4, Math.min(rect.left, innerWidth - 170)) + "px";

    menu.style.top =
        Math.max(4, Math.min(rect.bottom, innerHeight - 220)) + "px";

}

function createChild(parent, type) {

    showDialog(
        type === "page" ? "Create Page" : "Create Section",
        type === "page" ? "Page name" : "Section name",
        name => {

            const child = type === "page"
                ? makePage(name)
                : makeSection(name);

            parent.children = parent.children || [];

            parent.children.push(child);

            parent.expanded = true;

            renderTree();

            openPage(
                type === "page"
                    ? child.id
                    : child.children[0].id
            );

            saveNow();

        }
    );

}

function renameNode(node) {

    showDialog("Rename", "New name", name => {

        node.title = name;

        if (node.id === activePageId) {
            $("pageTitle").value = name;
        }

        renderTree();

        saveNow();

    });

}

function deleteNode(node) {

    if (!confirm('"' + node.title + '" को Delete करना चाहते हैं?')) {
        return;
    }

    if (node.type === "notebook") {

        state.notebooks = state.notebooks.filter(
            item => item.id !== node.id
        );

    } else {

        const parent = findParent(node.id);

        if (parent) {
            parent.children = parent.children.filter(
                item => item.id !== node.id
            );
        }

    }

    if (!state.notebooks.length || !allPages().length) {
        state = defaults();
    }

    if (!allPages().some(page => page.id === activePageId)) {
        activePageId = allPages()[0].id;
    }

    renderTree();

    openPage(activePageId);

    saveNow();

}

/* EDITOR SELECTION */

function rememberEditor(editor) {

    lastEditor = editor;

    const selection = window.getSelection();

    if (selection && selection.rangeCount) {
        lastRange = selection.getRangeAt(0).cloneRange();
    }

}

function rememberCurrentSelection() {

    const selection = window.getSelection();

    if (!selection || !selection.rangeCount) return;

    let node = selection.getRangeAt(0).commonAncestorContainer;

    if (node.nodeType === 3) {
        node = node.parentElement;
    }

    const editor = node.closest &&
        node.closest("#writingBody,.text-body");

    if (editor) {

        lastEditor = editor;

        lastRange = selection.getRangeAt(0).cloneRange();

    }

}

document.addEventListener("selectionchange", () => {

    const selection = window.getSelection();

    if (!selection || !selection.rangeCount) return;

    let node = selection.anchorNode;

    if (node && node.nodeType === 3) {
        node = node.parentElement;
    }

    if (!node || !node.closest) return;

    const editor = node.closest("#writingBody,.text-body");

    if (editor) {
        rememberEditor(editor);
    }

});

function restoreEditorSelection() {

    if (!lastEditor || !document.contains(lastEditor)) {
        lastEditor = $("writingBody");
    }

    lastEditor.focus();

    if (lastRange) {

        try {

            const selection = window.getSelection();

            selection.removeAllRanges();

            selection.addRange(lastRange);

        } catch (e) {}

    }

}

function insertAtSavedRange(node) {

    if (!lastEditor || !document.contains(lastEditor)) {
        lastEditor = $("writingBody");
    }

    lastEditor.focus();

    const selection = window.getSelection();

    if (lastRange) {

        try {

            selection.removeAllRanges();

            selection.addRange(lastRange);

        } catch (e) {}

    }

    let range = selection.rangeCount
        ? selection.getRangeAt(0)
        : document.createRange();

    if (!lastEditor.contains(range.commonAncestorContainer)) {

        range = document.createRange();

        range.selectNodeContents(lastEditor);

        range.collapse(false);

    }

    range.deleteContents();

    range.insertNode(node);

    const spacer = document.createTextNode(" ");

    node.parentNode.insertBefore(spacer, node.nextSibling);

    range.setStartAfter(spacer);

    range.collapse(true);

    selection.removeAllRanges();

    selection.addRange(range);

    lastRange = range.cloneRange();

    if (lastEditor === $("writingBody")) {

        updateMainBorder();

        autoGrowMain();

    } else {

        const box = lastEditor.closest(".text-object");

        if (box) autoGrowText(box);

    }

    scheduleSave();

}

/* OPEN PAGE */

function openPage(id) {

    const page = allPages().find(item => item.id === id);

    if (!page) return;

    activePageId = id;

    state.lastPageId = id;

    $("pageTitle").value = page.title || "";

    $("writingBody").innerHTML = page.content || "";

    migrateLegacyImages($("writingBody"));

    updateMainBorder();

    renderObjects(page);

    renderTree();

    autoGrowMain();

    rehydrateAssets($("writingBody"));

    setStatus("Ready");

}

/* WORKSPACE */

function updateWorkspaceSize() {

    const scroll = $("workspaceScroll");

    let right = scroll.clientWidth || 1200;
    let bottom = scroll.clientHeight || 800;

    $("workspace").querySelectorAll(
        ".object,.main-writing,.mindmap"
    ).forEach(el => {

        right = Math.max(
            right,
            (parseFloat(el.style.left) || 0) +
            el.offsetWidth + 320
        );

        bottom = Math.max(
            bottom,
            (parseFloat(el.style.top) || 0) +
            el.offsetHeight + 150
        );

    });

    $("workspace").style.width =
        Math.max(right + 300, scroll.clientWidth) + "px";

    $("workspace").style.height =
        Math.max(bottom, scroll.clientHeight) + "px";

}

function panelHasContent(el) {

    const body = el.querySelector(".text-body");

    return !!body && (
        body.textContent.trim().length > 0 ||
        !!body.querySelector("img,table,video,iframe,a")
    );

}

function updateTextBorder(el) {

    el.classList.toggle(
        "has-content",
        panelHasContent(el)
    );

}

function autoGrowText(el) {

    const body = el.querySelector(".text-body");

    if (!body) return;

    if (panelHasContent(el) && !el.dataset.userWidth) {
        el.style.width = "794px";
    }

    if (!el.dataset.userHeight) {

        body.style.height = "auto";

        body.style.height =
            Math.max(24, body.scrollHeight + 8) + "px";

        el.style.height = "auto";

    }

    updateTextBorder(el);

    updateWorkspaceSize();

}

function removeIfEmpty(el) {

    if (
        el &&
        el.isConnected &&
        el.classList.contains("text-object") &&
        !panelHasContent(el)
    ) {

        const page = activePage();

        if (page) {
            page.objects = page.objects.filter(
                obj => obj.id !== el.dataset.objectId
            );
        }

        el.remove();

        if (pendingEmptyPanel === el) {
            pendingEmptyPanel = null;
        }

        scheduleSave();

        updateWorkspaceSize();

    }

}

function addTextPanel(x, y, focus = true) {

    const page = activePage();

    if (!page) return null;

    const obj = {
        id: uid(),
        type: "text",
        title: "Text",
        x: Math.max(0, x),
        y: Math.max(0, y),
        w: 240,
        h: 32,
        html: ""
    };

    page.objects.push(obj);

    const el = createObject(obj);

    $("workspace").append(el);

    pendingEmptyPanel = el;

    const body = el.querySelector(".text-body");

    if (focus && body) {

        body.focus();

        const range = document.createRange();

        range.selectNodeContents(body);

        range.collapse(false);

        const selection = window.getSelection();

        selection.removeAllRanges();

        selection.addRange(range);

        rememberEditor(body);

    }

    scheduleSave();

    updateWorkspaceSize();

    return el;

}

$("workspace").addEventListener("click", e => {

    if (
        e.target.closest(
            ".object,.main-writing,.mindmap,.pdf-page"
        )
    ) return;

    if (
        pendingEmptyPanel &&
        !panelHasContent(pendingEmptyPanel)
    ) {
        removeIfEmpty(pendingEmptyPanel);
    }

    const rect = $("workspace").getBoundingClientRect();

    addTextPanel(
        e.clientX - rect.left,
        e.clientY - rect.top,
        true
    );

});

$("addText").onclick = () => {

    );

/* FLOATING OBJECTS */

function createObject(obj) {

    const el = document.createElement("div");

    el.className = "object " + obj.type + "-object";

    el.dataset.objectId = obj.id;

    el.style.left = (obj.x || 0) + "px";

    el.style.top = (obj.y || 0) + "px";

    if (obj.w) {
        el.style.width = obj.w + "px";
    }

    if (obj.type === "image" && obj.h) {
        el.style.height = obj.h + "px";
    }

    if (obj.userWidth) {
        el.dataset.userWidth = "1";
    }

    if (obj.userHeight) {
        el.dataset.userHeight = "1";
    }

    const head = document.createElement("div");

    head.className = "object-head";

    const title = document.createElement("span");

    title.className = "object-title";

    title.textContent =
        obj.type === "text"
            ? "Text"
            : obj.name ||
              (obj.type === "pdf" ? "PDF" : "Image");

    const close = document.createElement("button");

    close.className = "object-close";

    close.textContent = "×";

    head.append(title, close);

    el.append(head);

    const body = document.createElement("div");

    body.className = "object-body";

    el.append(body);

    if (obj.type === "text") {

        const textBody = document.createElement("div");

        textBody.className = "text-body";

        textBody.contentEditable = "true";

        textBody.spellcheck = true;

        textBody.innerHTML = obj.html || "";

        migrateLegacyImages(textBody);

        body.append(textBody);

        updateTextBorder(el);

        textBody.addEventListener("focus", () => {
            rememberEditor(textBody);
        });

        textBody.addEventListener("input", () => {

            updateTextBorder(el);

            autoGrowText(el);

            rememberEditor(textBody);

            scheduleSave();

        });

        textBody.addEventListener("blur", () => {

            setTimeout(() => removeIfEmpty(el), 180);

        });

        requestAnimationFrame(() => autoGrowText(el));

    } else if (obj.type === "image") {

        const img = document.createElement("img");

        img.alt = obj.name || "Image";

        body.append(img);

        loadImage(obj, img);

    } else if (obj.type === "pdf") {

        const pages = document.createElement("div");

        pages.className = "pdf-pages";

        body.append(pages);

        loadPDF(obj, el, pages);

    }

    close.onclick = () => {

        if (!confirm("इस पैनल को हटाएँ?")) return;

        if (obj.type === "pdf") {
            cancelPDFTask(obj.id);
        }

        const page = activePage();

        if (page) {
            page.objects = page.objects.filter(
                item => item.id !== obj.id
            );
        }

        el.remove();

        scheduleSave();

        updateWorkspaceSize();

    };

    makeDraggable(el, head);

    if (obj.type === "text" || obj.type === "image") {
        enableResize(el);
    }

    if (obj.type === "pdf") {
        enablePDFResize(el, obj);
    }

    return el;

}

/* FLOATING OBJECT DRAG */

function makeDraggable(el, handle) {

    let moving = false;

    let startX = 0;
    let startY = 0;

    let originalX = 0;
    let originalY = 0;

    handle.addEventListener("pointerdown", e => {

        if (e.target.closest(".object-close")) return;

        const rect = el.getBoundingClientRect();

        if (
            rect.right - e.clientX < 18 &&
            rect.bottom - e.clientY < 18
        ) return;

        moving = true;

        startX = e.clientX;
        startY = e.clientY;

        originalX = parseFloat(el.style.left) || 0;
        originalY = parseFloat(el.style.top) || 0;

        try {
            handle.setPointerCapture(e.pointerId);
        } catch (_) {}

        e.preventDefault();

    });

    handle.addEventListener("pointermove", e => {

        if (!moving) return;

        el.style.left =
            Math.max(0, originalX + e.clientX - startX) + "px";

        el.style.top =
            Math.max(0, originalY + e.clientY - startY) + "px";

        updateWorkspaceSize();

    });

    const stop = () => {

        if (!moving) return;

        moving = false;

        scheduleSave();

        updateWorkspaceSize();

    };

    handle.addEventListener("pointerup", stop);

    handle.addEventListener("pointercancel", stop);

}

/* FLOATING OBJECT RESIZE */

function enableResize(el) {

    let oldWidth = el.offsetWidth;
    let oldHeight = el.offsetHeight;

    if ("ResizeObserver" in window) {

        new ResizeObserver(() => {

            const width = el.offsetWidth;
            const height = el.offsetHeight;

            if (el.dataset.userResizing === "1") {

                if (width !== oldWidth) {
                    el.dataset.userWidth = "1";
                }

                if (height !== oldHeight) {
                    el.dataset.userHeight = "1";
                }

            }

            oldWidth = width;
            oldHeight = height;

        }).observe(el);

    }

    el.addEventListener("pointerdown", e => {

        const rect = el.getBoundingClientRect();

        if (
            rect.right - e.clientX < 22 &&
            rect.bottom - e.clientY < 22
        ) {
            el.dataset.userResizing = "1";
        }

    });

    el.addEventListener("pointerup", () => {

        if (el.dataset.userResizing) {

            delete el.dataset.userResizing;

            scheduleSave();

        }

    });

}

/* UPDATED INLINE PHOTO EDITOR */

let selectedImageWrapper = null;
let activeImageAction = null;

/* GET EDITOR */

function getEditorFor(el) {

    return el.closest("#writingBody,.text-body");

}

/* SELECT IMAGE */

function clearImageSelection() {

    document.querySelectorAll(
        ".inline-image-wrap.selected"
    ).forEach(el => {

        el.classList.remove("selected");

    });

    selectedImageWrapper = null;

}

function selectImage(wrapper) {

    clearImageSelection();

    wrapper.classList.add("selected");

    selectedImageWrapper = wrapper;

}

/* SAVE AFTER IMAGE CHANGE */

function updateEditorAfterImageChange(editor) {

    if (!editor) return;

    if (editor === $("writingBody")) {

        autoGrowMain();

        updateMainBorder();

    } else {

        const panel = editor.closest(".text-object");

        if (panel) {
            autoGrowText(panel);
        }

    }

    scheduleSave();

}

/* CREATE INLINE IMAGE */

function createInlineImage(file, assetId, storedWidth = null) {

    const wrap = document.createElement("span");

    wrap.className = "inline-image-wrap";

    wrap.contentEditable = "false";

    wrap.dataset.assetId = assetId;

    const img = document.createElement("img");

    img.alt = file.name || "Image";

    img.dataset.assetId = assetId;

    img.draggable = false;

    const drag = document.createElement("span");

    drag.className = "inline-image-drag";

    drag.textContent = "⠿  MOVE IMAGE";

    drag.title = "Drag image within this text panel";

    const resize = document.createElement("button");

    resize.className = "inline-image-resize";

    resize.type = "button";

    resize.textContent = "↘";

    resize.title = "Resize image";

    wrap.append(img, drag, resize);

    img.src = makeObjectURL(file);

    img.addEventListener("load", () => {

        if (storedWidth) {

            wrap.style.width = storedWidth + "px";

        } else {

            const editor = getEditorFor(wrap);

            const maxWidth = editor
                ? Math.max(100, editor.clientWidth - 35)
                : 500;

            wrap.style.width =
                Math.min(img.naturalWidth || 400, maxWidth) + "px";

        }

        img.style.width = "100%";

        img.style.height = "auto";

    });

    /*
       IMPORTANT:
       Image par pointer-events:none hai.
       Isliye selection wrapper par lagaya gaya hai.
    */

    wrap.addEventListener("pointerdown", e => {

        if (e.target.closest(".inline-image-drag")) return;

        if (e.target.closest(".inline-image-resize")) return;

        e.stopPropagation();

        selectImage(wrap);

    });

    /* IMAGE RESIZE */

    resize.addEventListener("pointerdown", e => {

        e.preventDefault();

        e.stopPropagation();

        selectImage(wrap);

        const editor = getEditorFor(wrap);

        if (!editor) return;

        const startX = e.clientX;

        const startWidth = wrap.getBoundingClientRect().width;

        const ratio =
            (img.naturalWidth || 1) /
            (img.naturalHeight || 1);

        const maxWidth = Math.max(
            80,
            Math.min(editor.clientWidth - 12, 1200)
        );

        activeImageAction = {
            type: "resize",
            wrapper: wrap,
            editor,
            startX,
            startWidth,
            ratio,
            maxWidth,
            pointerId: e.pointerId
        };

        try {
            resize.setPointerCapture(e.pointerId);
        } catch (_) {}

    });

    enableInlineImageDrag(wrap, drag);

    return wrap;

}

/* IMAGE RESIZE MOVEMENT */

function moveImageResize(e) {

    if (
        !activeImageAction ||
        activeImageAction.type !== "resize"
    ) return;

    const action = activeImageAction;

    const dx = e.clientX - action.startX;

    const newWidth = Math.max(
        60,
        Math.min(
            action.maxWidth,
            action.startWidth + dx
        )
    );

    action.wrapper.style.width = newWidth + "px";

    const img = action.wrapper.querySelector("img");

    img.style.width = "100%";

    img.style.height = "auto";

    updateEditorAfterImageChange(action.editor);

}

document.addEventListener("pointermove", moveImageResize);

document.addEventListener("pointerup", e => {

    if (
        activeImageAction &&
        activeImageAction.type === "resize"
    ) {

        activeImageAction = null;

        scheduleSave();

    }

});

document.addEventListener("pointercancel", e => {

    if (
        activeImageAction &&
        activeImageAction.type === "resize"
    ) {

        activeImageAction = null;

        scheduleSave();

    }

});

/* DRAG IMAGE INSIDE ITS TEXT PANEL */

function enableInlineImageDrag(wrap, handle) {

    handle.addEventListener("pointerdown", e => {

        e.preventDefault();

        e.stopPropagation();

        const editor = getEditorFor(wrap);

        if (!editor) return;

        selectImage(wrap);

        const rect = wrap.getBoundingClientRect();

        const placeholder = document.createElement("span");

        placeholder.className = "inline-image-placeholder";

        placeholder.style.cssText = `
            display:inline-block;
            width:${rect.width}px;
            height:${rect.height}px;
            vertical-align:middle;
        `;

        const originalWidth = wrap.style.width;

        /* Original position par placeholder */

        wrap.parentNode.insertBefore(placeholder, wrap);

        /* Temporary floating movement */

        wrap.style.position = "fixed";

        wrap.style.left = rect.left + "px";

        wrap.style.top = rect.top + "px";

        wrap.style.width = rect.width + "px";

        wrap.style.zIndex = "99999";

        wrap.style.pointerEvents = "none";

        document.body.appendChild(wrap);

        const startX = e.clientX;

        const startY = e.clientY;

        activeImageAction = {
            type: "move",
            wrapper: wrap,
            editor,
            placeholder,
            originalWidth,
            rect,
            startX,
            startY
        };

        function move(ev) {

            if (
                !activeImageAction ||
                activeImageAction.wrapper !== wrap
            ) return;

            wrap.style.left =
                rect.left + ev.clientX - startX + "px";

            wrap.style.top =
                rect.top + ev.clientY - startY + "px";

        }

        function stop(ev) {

            if (
                !activeImageAction ||
                activeImageAction.wrapper !== wrap
            ) return;

            document.removeEventListener("pointermove", move);

            document.removeEventListener("pointerup", stop);

            document.removeEventListener("pointercancel", stop);

            const x = ev.clientX;

            const y = ev.clientY;

            /* Restore normal inline style */

            wrap.style.position = "";

            wrap.style.left = "";

            wrap.style.top = "";

            wrap.style.width =
                originalWidth || placeholder.style.width;

            wrap.style.zIndex = "";

            wrap.style.pointerEvents = "";

            let range = null;

            if (document.caretRangeFromPoint) {

                range = document.caretRangeFromPoint(x, y);

            } else if (document.caretPositionFromPoint) {

                const pos = document.caretPositionFromPoint(x, y);

                if (pos) {

                    range = document.createRange();

                    range.setStart(pos.offsetNode, pos.offset);

                    range.collapse(true);

                }

            }

            /*
              Drop location must belong to the same editor.
              Otherwise image returns to its original location.
            */

            if (
                range &&
                editor.contains(range.startContainer)
            ) {

                const node = range.startContainer.nodeType === 1
                    ? range.startContainer
                    : range.startContainer.parentElement;

                const targetImage = node && node.closest
                    ? node.closest(".inline-image-wrap")
                    : null;

                if (
                    targetImage &&
                    targetImage !== wrap &&
                    editor.contains(targetImage)
                ) {

                    const newRange = document.createRange();

                    newRange.setStartBefore(targetImage);

                    newRange.collapse(true);

                    newRange.insertNode(wrap);

                } else {

                    range.insertNode(wrap);

                }

                placeholder.remove();

            } else {

                placeholder.parentNode.insertBefore(
                    wrap,
                    placeholder
                );

                placeholder.remove();

            }

            activeImageAction = null;

            selectImage(wrap);

            updateEditorAfterImageChange(editor);

        }

        document.addEventListener("pointermove", move);

        document.addEventListener("pointerup", stop);

        document.addEventListener("pointercancel", stop);

    });

}

/* PDF TASK MANAGEMENT */

function cancelPDFTask(id) {

    const task = pdfTasks.get(id);

    if (!task) return;

    task.cancelled = true;

    if (task.observer) {
        task.observer.disconnect();
    }

    for (const rendering of task.rendering.values()) {

        try {
            rendering.cancel();
        } catch (e) {}

    }

    try {
        if (task.pdf) task.pdf.destroy();
    } catch (e) {}

    try {
        if (task.loadingTask) task.loadingTask.destroy();
    } catch (e) {}

    pdfTasks.delete(id);

}

/* LOAD PDF */

async function loadPDF(obj, el, container) {

    cancelPDFTask(obj.id);

    container.innerHTML =
        '<div class="pdf-message">PDF तैयार हो रही है...</div>';

    let taskInfo = null;

    try {

        if (!window.pdfjsLib) {
            throw Error("PDF.js लोड नहीं हुई");
        }

        const record = await getAsset(obj.assetId);

        if (!record || !record.blob) {
            throw Error("सेव PDF नहीं मिली");
        }

        const loadingTask = pdfjsLib.getDocument({
            data: new Uint8Array(
                await record.blob.arrayBuffer()
            ),
            isEvalSupported: false
        });

        taskInfo = {
            loadingTask,
            pdf: null,
            observer: null,
            cancelled: false,
            rendering: new Map(),
            items: []
        };

        pdfTasks.set(obj.id, taskInfo);

        const pdf = await loadingTask.promise;

        if (
            taskInfo.cancelled ||
            pdfTasks.get(obj.id) !== taskInfo
        ) return;

        taskInfo.pdf = pdf;

        container.innerHTML = "";

        for (let number = 1; number <= pdf.numPages; number++) {

            const box = document.createElement("div");

            box.className = "pdf-page";

            box.dataset.pageNumber = number;

            const placeholder = document.createElement("div");

            placeholder.className = "pdf-placeholder";

            placeholder.textContent =
                "PDF पेज " + number + " — लोड हो रहा है";

            box.append(placeholder);

            container.append(box);

            taskInfo.items.push({
                number,
                box,
                rendered: false,
                rendering: false
            });

        }

        /* RENDER INDIVIDUAL PAGE */

        async function renderPDFPage(item) {

            if (
                taskInfo.cancelled ||
                item.rendered ||
                item.rendering
            ) return;

            item.rendering = true;

            try {

                const page = await pdf.getPage(item.number);

                if (taskInfo.cancelled) return;

                const baseViewport = page.getViewport({
                    scale: 1
                });

                const width = Math.max(
                    260,
                    Math.min(1100, el.clientWidth - 2)
                );

                const scale = width / baseViewport.width;

                const dpr = Math.min(
                    window.devicePixelRatio || 1,
                    1.25
                );

                const viewport = page.getViewport({
                    scale
                });

                const canvas = document.createElement("canvas");

                canvas.className = "pdf-canvas";

                canvas.width = Math.floor(viewport.width * dpr);

                canvas.height = Math.floor(viewport.height * dpr);

                canvas.style.width = "100%";

                const highlightCanvas =
                    document.createElement("canvas");

                highlightCanvas.className = "pdf-highlight-layer";

                highlightCanvas.width = canvas.width;

                highlightCanvas.height = canvas.height;

                highlightCanvas.style.cssText =
                    "position:absolute;left:0;top:0;" +
                    "width:100%;height:100%;pointer-events:none";

                item.box.replaceChildren(
                    canvas,
                    highlightCanvas
                );

                item.canvas = canvas;

                item.hi = highlightCanvas;

                const renderTask = page.render({

                    canvasContext: canvas.getContext(
                        "2d",
                        { alpha: false }
                    ),

                    viewport,

                    transform: dpr !== 1
                        ? [dpr, 0, 0, dpr, 0, 0]
                        : null

                });

                taskInfo.rendering.set(
                    item.number,
                    renderTask
                );

                await renderTask.promise;

                taskInfo.rendering.delete(item.number);

                /* PDF TEXT LAYER */

                const textContent = await page.getTextContent();

                const textLayer = document.createElement("div");

                textLayer.className = "pdf-text-layer";

                textLayer.style.cssText =
                    "position:absolute;inset:0;overflow:hidden;" +
                    "user-select:text;line-height:1;" +
                    "width:" + viewport.width + "px;" +
                    "height:" + viewport.height + "px";

                for (const textItem of textContent.items) {

                    if (!textItem.str) continue;

                    const span = document.createElement("span");

                    span.textContent = textItem.str;

                    const transform = pdfjsLib.Util.transform(
                        viewport.transform,
                        textItem.transform
                    );

                    const fontHeight = Math.hypot(
                        transform[2],
                        transform[3]
                    );

                    span.style.cssText =
                        "position:absolute;white-space:pre;" +
                        "transform-origin:0 0;color:transparent;" +
                        "cursor:text;left:" + transform[4] + "px;" +
                        "top:" + (transform[5] - fontHeight) + "px;" +
                        "font-size:" + fontHeight + "px;" +
                        "height:" + fontHeight + "px";

                    textLayer.append(span);

                }

                textLayer.style.transformOrigin = "top left";

                textLayer.style.transform =
                    "scale(" +
                    (canvas.clientWidth / viewport.width) +
                    ")";

                item.box.insertBefore(textLayer, highlightCanvas);

                item.rendered = true;

                setupPDFHighlight(
                    obj,
                    item,
                    viewport,
                    dpr
                );

                drawSavedHighlights(obj, item);

                page.cleanup();

            } catch (err) {

                taskInfo.rendering.delete(item.number);

                if (!taskInfo.cancelled) {

                    console.warn(err);

                    const message =
                        document.createElement("div");

                    message.className = "pdf-message";

                    message.textContent =
                        "पेज " + item.number +
                        " रेंडर नहीं हुआ: " + err.message;

                    item.box.replaceChildren(message);

                }

            } finally {

                item.rendering = false;

                updateWorkspaceSize();

            }

        }

        /* LAZY RENDERING */

        if ("IntersectionObserver" in window) {

            taskInfo.observer = new IntersectionObserver(
                entries => {

                    entries.forEach(entry => {

                        const item = taskInfo.items.find(
                            x => x.box === entry.target
                        );

                        if (item && entry.isIntersecting) {
                            renderPDFPage(item);
                        }

                    });

                },
                {
                    root: $("workspaceScroll"),
                    rootMargin: "700px 0px"
                }
            );

            taskInfo.items.forEach(item => {
                taskInfo.observer.observe(item.box);
            });

        } else {

            taskInfo.items.forEach(renderPDFPage);

        }

        updateWorkspaceSize();

        updatePDFMode();

    } catch (err) {

        console.error(err);

        if (
            taskInfo &&
            pdfTasks.get(obj.id) === taskInfo
        ) {
            cancelPDFTask(obj.id);
        }

        container.innerHTML = "";

        const message = document.createElement("div");

        message.className = "pdf-message";

        message.textContent =
            "PDF लोड नहीं हुई: " + err.message;

        container.append(message);

    }

}

/* PDF HIGHLIGHTER */

function setupPDFHighlight(obj, item, viewport, dpr) {

    const canvas = item.hi;

    const ctx = canvas.getContext("2d");

    let drawing = false;

    let last = null;

    function getPosition(e) {

        const rect = canvas.getBoundingClientRect();

        return {

            x: (e.clientX - rect.left) / rect.width * canvas.width,

            y: (e.clientY - rect.top) / rect.height * canvas.height

        };

    }

    canvas.addEventListener("pointerdown", e => {

        if (pdfMode !== "highlight") return;

        drawing = true;

        last = getPosition(e);

        try {
            canvas.setPointerCapture(e.pointerId);
        } catch (_) {}

        e.preventDefault();

        e.stopPropagation();

    });

    canvas.addEventListener("pointermove", e => {

        if (!drawing || pdfMode !== "highlight") return;

        const position = getPosition(e);

        const color = $("highlightColor").value;

        ctx.save();

        ctx.globalAlpha = 0.34;

        ctx.strokeStyle = color;

        ctx.lineWidth = Math.max(
            10,
            viewport.scale * 13 * dpr
        );

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.beginPath();

        ctx.moveTo(last.x, last.y);

        ctx.lineTo(position.x, position.y);

        ctx.stroke();

        ctx.restore();

        obj.highlights = obj.highlights || [];

        obj.highlights.push({

            x1: last.x / canvas.width,

            y1: last.y / canvas.height,

            x2: position.x / canvas.width,

            y2: position.y / canvas.height,

            color,

            width: ctx.lineWidth / canvas.width

        });

        last = position;

    });

    const stop = () => {

        if (drawing) {

            drawing = false;

            last = null;

            scheduleSave();

        }

    };

    canvas.addEventListener("pointerup", stop);

    canvas.addEventListener("pointercancel", stop);

}

/* REDRAW SAVED HIGHLIGHTS */

function drawSavedHighlights(obj, item) {

    if (!item.hi) return;

    const canvas = item.hi;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.save();

    ctx.globalAlpha = 0.34;

    for (const highlight of obj.highlights || []) {

        ctx.strokeStyle = highlight.color || "#fff176";

        ctx.lineWidth = Math.max(
            10,
            (highlight.width || 0.015) * canvas.width
        );

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.beginPath();

        ctx.moveTo(
            highlight.x1 * canvas.width,
            highlight.y1 * canvas.height
        );

        ctx.lineTo(
            highlight.x2 * canvas.width,
            highlight.y2 * canvas.height
        );

        ctx.stroke();

    }

    ctx.restore();

}

/* PDF MODE BUTTONS */

$("pdfSelectMode").onclick = () => {

    pdfMode = "select";

    updatePDFMode();

};

$("pdfHighlightMode").onclick = () => {

    pdfMode = "highlight";

    updatePDFMode();

};

function updatePDFMode() {

    $("pdfModeHint").textContent =
        "PDF mode: " +
        (
            pdfMode === "select"
                ? "Select Text"
                : "Highlighter — उंगली से ड्रैग करें"
        );

    document.querySelectorAll(".pdf-page").forEach(page => {

        const canvas = page.querySelector(
            ".pdf-highlight-layer"
        );

        if (canvas) {

            canvas.style.pointerEvents =
                pdfMode === "highlight" ? "auto" : "none";

        }

        page.style.cursor =
            pdfMode === "highlight" ? "crosshair" : "text";

    });

}

/* CLEAR PDF HIGHLIGHTS */

$("clearPDFHighlights").onclick = () => {

    const page = activePage();

    if (!page) return;

    page.objects
        .filter(obj => obj.type === "pdf")
        .forEach(obj => {

            obj.highlights = [];

            const task = pdfTasks.get(obj.id);

            if (task) {

                task.items.forEach(item => {
                    drawSavedHighlights(obj, item);
                });

            }

        });

    scheduleSave();

    setStatus("PDF highlights cleared");

};

/* PDF RESIZE */

function enablePDFResize(el, obj) {

    if (!("ResizeObserver" in window)) return;

    let lastWidth = el.clientWidth;

    let timer;

    new ResizeObserver(() => {

        const width = el.clientWidth;

        if (!width || Math.abs(width - lastWidth) < 24) {
            return;
        }

        lastWidth = width;

        clearTimeout(timer);

        timer = setTimeout(() => {

            const container = el.querySelector(".pdf-pages");

            if (container) {
                loadPDF(obj, el, container);
            }

        }, 800);

    }).observe(el);

}

/* RENDER OBJECTS */

function renderObjects(page) {

    $("workspace").querySelectorAll(
        ".object,.mindmap"
    ).forEach(el => {

        if (el.classList.contains("pdf-object")) {

            cancelPDFTask(el.dataset.objectId);

        }

        el.remove();

    });

    page.objects = page.objects || [];

    page.objects
        .filter(obj =>
            ["text", "image", "pdf"].includes(obj.type)
        )
        .forEach(obj => {

            $("workspace").append(createObject(obj));

        });

    renderMindMap(page);

    requestAnimationFrame(() => {

        autoGrowMain();

        updateWorkspaceSize();

        updatePDFMode();

    });

}

/* MIND MAP */

function renderMindMap(page) {

    const old = $("workspace").querySelector(".mindmap");

    if (old) old.remove();

    if (!page.mindmap || !page.mindmap.length) return;

    const box = document.createElement("div");

    box.className = "mindmap";

    const heading = document.createElement("h3");

    heading.textContent = "Mind Map";

    const input = document.createElement("input");

    input.placeholder = "New idea — Enter दबाएँ";

    const list = document.createElement("div");

    function refresh() {

        list.innerHTML = "";

        page.mindmap.forEach((value, index) => {

            const node = document.createElement("div");

            node.className = "mind-node";

            node.textContent = value;

            node.onclick = () => {

                if (confirm("इस आइडिया को हटाएँ?")) {

                    page.mindmap.splice(index, 1);

                    refresh();

                    scheduleSave();

                }

            };

            list.append(node);

        });

        updateWorkspaceSize();

    }

    input.onkeydown = e => {

        if (
            e.key === "Enter" &&
            input.value.trim()
        ) {

            page.mindmap.push(input.value.trim());

            input.value = "";

            refresh();

            scheduleSave();

        }

    };

    box.append(heading, input, list);

    $("workspace").append(box);

    refresh();

}

$("addMindMap").onclick = () => {

    const page = activePage();

    if (!page) return;

    page.mindmap = page.mindmap || [];

    if (!page.mindmap.length) {
        page.mindmap.push("Main Idea");
    }

    renderMindMap(page);

    scheduleSave();

};

/* BACKUP HELPERS */

function blobToBase64(blob) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {

            resolve(
                String(reader.result).split(",")[1]
            );

        };

        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(blob);

    });

}

function base64ToBlob(base64, type) {

    const binary = atob(base64);

    const array = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {

        array[i] = binary.charCodeAt(i);

    }

    return new Blob(
        [array],
        { type: type || "application/octet-stream" }
    );

}

/* BACKUP */

$("backupBtn").onclick = async () => {

    saveNow();

    try {

        if (!assetDB) {
            await openDB();
        }

        const data = {

            app: "OneNote Infinity Pro",

            version: 6,

            state,

            assets: []

        };

        const ids = new Set();

        allPages().forEach(page => {

            (page.objects || []).forEach(obj => {

                if (obj.assetId) {
                    ids.add(obj.assetId);
                }

            });

            const temp = document.createElement("div");

            temp.innerHTML = page.content || "";

            temp.querySelectorAll("[data-asset-id]").forEach(el => {

                ids.add(el.dataset.assetId);

            });

        });

        for (const id of ids) {

            const record = await getAsset(id);

            if (record && record.blob) {

                data.assets.push({

                    id: record.id,

                    name: record.name,

                    type: record.type,

                    base64: await blobToBase64(record.blob)

                });

            }

        }

        const blob = new Blob(
            [JSON.stringify(data)],
            { type: "application/json" }
        );

        const url = makeObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = "onenote-infinity-backup.json";

        link.click();

        setTimeout(() => {
            revokeObjectURL(url);
        }, 3000);

        setStatus("Backup downloaded");

    } catch (err) {

        console.error(err);

        alert("Backup नहीं बन पाया।");

    }

};

/* RESTORE BUTTON */

$("restoreBtn").onclick = () => {

    $("restoreInput").click();

};

/* RESTORE BACKUP */

$("restoreInput").addEventListener("change", async e => {

    const file = e.target.files[0];

    e.target.value = "";

    if (!file) return;

    if (
        !confirm(
            "Restore से मौजूदा डेटा बदल सकता है। जारी रखें?"
        )
    ) return;

    try {

        if (!assetDB) {
            await openDB();
        }

        const data = JSON.parse(await file.text());

        if (
            !data.state ||
            !Array.isArray(data.state.notebooks)
        ) {

            throw Error("Invalid backup");

        }

        for (const asset of data.assets || []) {

            await putAsset(
                asset.id,
                base64ToBlob(asset.base64, asset.type),
                asset.name,
                asset.type
            );

        }

        state = data.state;

        if (!allPages().length) {
            state = defaults();
        }

        activePageId = allPages().some(
            page => page.id === state.lastPageId
        )
            ? state.lastPageId
            : allPages()[0].id;

        saveNow();

        renderTree();

        openPage(activePageId);

        alert("Backup Restore हो गया।");

    } catch (err) {

        console.error(err);

        alert(
            "Restore नहीं हो पाया। सही Backup JSON चुनें।"
        );

    }

});

/* APPLICATION START */

async function start() {

    try {

        await openDB();

    } catch (e) {

        console.warn(e);

        setStatus("फ़ाइल स्टोरेज उपलब्ध नहीं है");

    }

    loadState();

    renderTree();

    openPage(activePageId);

    setStatus("Ready");

}

window.addEventListener("resize", updateWorkspaceSize);

start();
