<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>OneNote Infinity Pro</title>

<style>
:root {
    --bg: #ffffff;
    --panel: #ffffff;
    --text: #242424;
    --muted: #666666;
    --border: #dddddd;
    --accent: #7252cc;
    --hover: #f3f0fb;
    --toolbar: #fafafa;
    --shadow: 0 2px 10px rgba(0,0,0,.09);
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    color: var(--text);
    background: #fff;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
}

/* TOP BAR */

.topbar {
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
}

.brand {
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
}

.brand span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
    align-items: center;
}

.btn {
    padding: 8px 11px;
    border: 1px solid var(--border);
    background: #fff;
    color: #333;
    border-radius: 5px;
}

.btn:hover {
    background: var(--hover);
}

.btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.icon-btn {
    min-width: 36px;
    min-height: 35px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    font-size: 19px;
}

.icon-btn:hover {
    background: var(--hover);
}

/* MAIN LAYOUT */

.main-layout {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 255px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-right: 1px solid var(--border);
    min-height: 0;
}

.sidebar-head {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.sidebar-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
}

.sidebar-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.small-btn {
    padding: 7px 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 12px;
}

.small-btn:hover {
    background: var(--hover);
}

.tree {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px;
}

.tree-item {
    margin: 2px 0;
}

.tree-row {
    display: flex;
    align-items: center;
    gap: 5px;
    border-radius: 5px;
    padding: 7px 5px;
    cursor: pointer;
    font-size: 13px;
}

.tree-row:hover {
    background: #f5f5f5;
}

.tree-row.active {
    background: #eee8ff;
    color: #4d319c;
    font-weight: 600;
}

.tree-toggle {
    width: 18px;
    flex-shrink: 0;
    text-align: center;
    color: #777;
}

.tree-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
}

.tree-menu {
    border: 0;
    background: transparent;
    color: #777;
    font-size: 18px;
    padding: 0 5px;
}

.tree-children {
    margin-left: 15px;
    border-left: 1px solid #eee;
    padding-left: 5px;
}

.sidebar-footer {
    border-top: 1px solid #eee;
    padding: 9px;
    color: #777;
    font-size: 11px;
}

/* EDITOR */

.editor {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
}

.editor-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: #fff;
}

.editor-top button {
    padding: 7px 10px;
    border: 1px solid #e1e1e1;
    background: #fff;
    border-radius: 5px;
    font-size: 13px;
}

.editor-top button:hover {
    background: var(--hover);
}

.editor-title-wrap {
    padding: 12px 18px 5px;
    background: #fff;
    flex-shrink: 0;
}

.page-title {
    width: 100%;
    border: 0;
    outline: none;
    font-size: 23px;
    font-weight: 700;
    color: #252525;
    padding: 5px 0;
    background: transparent;
}

.page-title::placeholder {
    color: #aaa;
}

.save-status {
    font-size: 11px;
    color: #777;
    margin-top: 3px;
}

/* WORKSPACE: COMPLETELY BLANK */

.workspace-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
    background: #fff !important;
    background-image: none !important;
    overscroll-behavior: contain;
}

.workspace {
    position: relative;
    min-width: 100%;
    min-height: 100%;
    width: 1400px;
    height: 1000px;

    /* No dots, grid or repeating pattern */
    background: #fff !important;
    background-image: none !important;
}

/* MAIN WRITING AREA */

.main-writing {
    position: absolute;
    left: 24px;
    top: 20px;
    width: 794px;
    min-height: 500px;
    height: auto;
    background: #fff !important;
    background-image: none !important;
    border: 1px solid #f0f0f0;
    border-radius: 0;
    box-shadow: none;
}

.main-writing .writing-body {
    min-height: 480px;
    padding: 24px 28px;
    outline: none;
    overflow-wrap: anywhere;
    line-height: 1.65;
    font-size: 15px;
    background: #fff !important;
    background-image: none !important;
}

.writing-body:empty::before {
    content: "यहाँ लिखना शुरू करें...";
    color: #aaa;
    pointer-events: none;
}

.writing-body img {
    max-width: 100%;
    height: auto;
}

.writing-body table {
    border-collapse: collapse;
    max-width: 100%;
}

.writing-body td,
.writing-body th {
    border: 1px solid #ccc;
    padding: 5px;
}

.writing-body pre {
    white-space: pre-wrap;
}

/* FLOATING OBJECTS */

.object {
    position: absolute;
    left: 100px;
    top: 100px;
    background: #fff !important;
    background-image: none !important;
    border: 1px solid #dedede;
    box-shadow: var(--shadow);
    border-radius: 4px;
    overflow: visible;
}

.object-header {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    cursor: move;
    user-select: none;
    touch-action: none;
    border-radius: 4px 4px 0 0;
}

.object-title {
    font-size: 12px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
}

.object-close {
    border: 0;
    background: transparent;
    font-size: 18px;
    color: #666;
    padding: 0 4px;
}

.object-body {
    background: #fff !important;
    background-image: none !important;
    min-height: 60px;
    overflow: visible;
}

/* TEXT OBJECT */

.text-object {
    width: 240px;
    height: 140px;
    min-width: 150px;
    min-height: 80px;
    resize: both;
    overflow: hidden;
}

.text-object .object-body {
    height: calc(100% - 34px);
    min-height: 40px;
}

.text-body {
    height: 100%;
    min-height: 45px;
    padding: 12px;
    overflow: auto;
    outline: none;
    overflow-wrap: anywhere;
    line-height: 1.6;
    background: #fff !important;
    background-image: none !important;
}

.text-body img {
    max-width: 100%;
    height: auto;
}

/* IMAGE OBJECT */

.image-object {
    width: 340px;
    min-width: 150px;
    resize: both;
    overflow: hidden;
}

.image-object .object-body {
    padding: 5px;
}

.image-object img {
    display: block;
    max-width: 100%;
    width: 100%;
    height: auto;
    object-fit: contain;
}

/* PDF OBJECT
   All pages are visible in the workspace.
   The PDF object itself grows to the height of all pages.
   No internal vertical scroll box. */

.pdf-object {
    width: 794px;
    min-width: 280px;
    max-width: none;
    height: auto;
    min-height: 150px;
    resize: horizontal;
    overflow: visible !important;
    background: #fff !important;
}

.pdf-object .object-body {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    padding: 0;
    background: #fff !important;
}

.pdf-pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: auto !important;
    overflow: visible !important;
    background: #fff !important;
    gap: 12px;
}

.pdf-page {
    position: relative;
    display: block;
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    overflow: visible;
    background: #fff;
    border: 1px solid #e7e7e7;
}

.pdf-page canvas.pdf-canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
}

.pdf-page canvas.mark-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.pdf-message {
    padding: 20px;
    font-size: 13px;
    color: #666;
}

/* MIND MAP */

.mindmap {
    position: absolute;
    left: 900px;
    top: 30px;
    width: 420px;
    min-height: 300px;
    border: 1px solid #ddd;
    background: #fff;
    padding: 12px;
    box-shadow: var(--shadow);
}

.mindmap h3 {
    margin: 0 0 10px;
    font-size: 15px;
}

.mindmap input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.mindmap-list {
    margin-top: 10px;
}

.mind-node {
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 8px;
    margin: 5px 0;
    background: #fff;
    font-size: 13px;
    overflow-wrap: anywhere;
}

/* DIALOG */

.dialog-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.35);
}

.dialog {
    width: min(430px, 100%);
    padding: 20px;
    background: #fff;
    border-radius: 9px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.dialog h3 {
    margin-top: 0;
}

.dialog input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin: 10px 0;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

/* MOBILE */

@media (max-width: 700px) {
    .topbar {
        gap: 5px;
        padding: 6px;
    }

    .brand {
        font-size: 14px;
    }

    .top-actions {
        gap: 3px;
    }

    .top-actions .btn {
        font-size: 11px;
        padding: 7px;
    }

    .sidebar {
        width: 155px;
    }

    .sidebar-head {
        padding: 7px;
    }

    .sidebar-title {
        font-size: 12px;
    }

    .small-btn {
        font-size: 10px;
        padding: 6px;
    }

    .tree {
        padding: 4px;
    }

    .tree-row {
        font-size: 11px;
        padding: 7px 3px;
    }

    .editor-title-wrap {
        padding: 9px 12px 4px;
    }

    .page-title {
        font-size: 19px;
    }

    .editor-top {
        padding: 5px;
        gap: 4px;
    }

    .editor-top button {
        font-size: 11px;
        padding: 7px;
    }

    .main-writing {
        left: 12px;
        top: 12px;
        width: 794px;
    }

    .main-writing .writing-body {
        padding: 18px;
    }

    .pdf-object {
        width: 794px;
    }
}

@media (max-width: 420px) {
    .brand {
        font-size: 12px;
    }

    .top-actions .hide-mobile {
        display: none;
    }

    .sidebar {
        width: 125px;
    }
}
</style>
</head>

<body>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";

/* =========================================================
   ONENOTE INFINITY PRO
   Blank workspace + auto-growing text + complete PDF pages
   ========================================================= */

const DB_NAME = "OneNoteInfinityProDB";
const DB_VERSION = 1;
const STORE_NAME = "assets";
const META_KEY = "oneNoteInfinityProDataV1";

const treeEl = document.getElementById("tree");
const workspace = document.getElementById("workspace");
const workspaceScroll = document.getElementById("workspaceScroll");
const mainWritingArea = document.getElementById("mainWritingArea");
const mainWritingBody = document.getElementById("mainWritingBody");
const pageTitle = document.getElementById("pageTitle");
const saveStatus = document.getElementById("saveStatus");

let state = null;
let activePageId = null;
let dialogCallback = null;
let saveTimer = null;
let assetDB = null;
let selectedTreeId = null;

/* PDF.js worker */

if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* =========================================================
   HELPERS
   ========================================================= */

function uid() {
    return "id_" + Date.now().toString(36) +
        "_" + Math.random().toString(36).slice(2, 9);
}

function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[ch]);
}

function setStatus(message) {
    saveStatus.textContent = message;
}

function showDialog(title, placeholder, callback) {
    document.getElementById("dialogTitle").textContent = title;

    const input = document.getElementById("dialogInput");
    input.value = "";
    input.placeholder = placeholder || "Enter name";

    dialogCallback = callback;

    document.getElementById("dialogBackdrop").style.display = "flex";

    setTimeout(() => input.focus(), 50);
}

function closeDialog() {
    document.getElementById("dialogBackdrop").style.display = "none";
    dialogCallback = null;
}

document.getElementById("dialogCancel").onclick = closeDialog;

document.getElementById("dialogConfirm").onclick = () => {
    const value = document.getElementById("dialogInput").value.trim();

    if (!value) {
        alert("कृपया नाम लिखें।");
        return;
    }

    const callback = dialogCallback;
    closeDialog();

    if (callback) callback(value);
};

document.getElementById("dialogInput").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        document.getElementById("dialogConfirm").click();
    }
});

document.getElementById("dialogBackdrop").addEventListener("click", e => {
    if (e.target.id === "dialogBackdrop") closeDialog();
});

/* =========================================================
   INDEXEDDB FOR PDF AND IMAGE FILES
   ========================================================= */

function openAssetDB() {
    return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB is not supported"));
            return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: "id" });
            }
        };

        request.onsuccess = () => {
            assetDB = request.result;
            resolve(assetDB);
        };

        request.onerror = () => reject(request.error);
    });
}

async function putAsset(id, blob, name, type) {
    if (!assetDB) await openAssetDB();

    return new Promise((resolve, reject) => {
        const tx = assetDB.transaction(STORE_NAME, "readwrite");

        tx.objectStore(STORE_NAME).put({
            id,
            blob,
            name: name || "file",
            type: type || blob.type || "application/octet-stream",
            updatedAt: Date.now()
        });

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function getAsset(id) {
    if (!assetDB) await openAssetDB();

    return new Promise((resolve, reject) => {
        const tx = assetDB.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(id);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
    });
}

async function deleteAsset(id) {
    if (!assetDB) await openAssetDB();

    return new Promise((resolve, reject) => {
        const tx = assetDB.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete(id);

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

/* =========================================================
   DATA MODEL
   ========================================================= */

function createPage(title = "New Page") {
    return {
        id: uid(),
        type: "page",
        title,
        content: "",
        objects: [],
        mindmap: [],
        updatedAt: Date.now()
    };
}

function createSection(title = "New Section") {
    return {
        id: uid(),
        type: "section",
        title,
        children: [createPage("Page 1")],
        expanded: true
    };
}

function createNotebook(title = "My Notebook") {
    return {
        id: uid(),
        type: "notebook",
        title,
        children: [createSection("General")],
        expanded: true
    };
}

function defaultState() {
    const notebook = createNotebook("My Notebook");

    return {
        version: 1,
        notebooks: [notebook],
        lastPageId: notebook.children[0].children[0].id,
        updatedAt: Date.now()
    };
}

function allPages() {
    const result = [];

    for (const notebook of state.notebooks) {
        for (const section of notebook.children || []) {
            for (const page of section.children || []) {
                result.push(page);
            }
        }
    }

    return result;
}

function findNode(id) {
    for (const notebook of state.notebooks) {
        if (notebook.id === id) return notebook;

        for (const section of notebook.children || []) {
            if (section.id === id) return section;

            for (const page of section.children || []) {
                if (page.id === id) return page;
            }
        }
    }

    return null;
}

function getParentSection(pageId) {
    for (const notebook of state.notebooks) {
        for (const section of notebook.children || []) {
            if ((section.children || []).some(page => page.id === pageId)) {
                return section;
            }
        }
    }

    return null;
}

function activePage() {
    return allPages().find(page => page.id === activePageId) || null;
}

/* =========================================================
   SAVE AND LOAD
   ========================================================= */

function loadState() {
    try {
        const raw = localStorage.getItem(META_KEY);

        if (raw) {
            const parsed = JSON.parse(raw);

            if (parsed && Array.isArray(parsed.notebooks)) {
                state = parsed;
            }
        }
    } catch (error) {
        console.warn("Could not read saved data:", error);
    }

    if (!state || !state.notebooks.length) {
        state = defaultState();
    }

    const pages = allPages();

    if (!pages.length) {
        state = defaultState();
    }

    const requestedPage = allPages().find(
        page => page.id === state.lastPageId
    );

    activePageId = requestedPage
        ? requestedPage.id
        : allPages()[0].id;
}

function persistState() {
    state.updatedAt = Date.now();

    try {
        localStorage.setItem(META_KEY, JSON.stringify(state));
        setStatus("✓ Saved automatically");
    } catch (error) {
        console.error(error);

        setStatus("Save failed");

        alert(
            "ब्राउज़र में स्टोरेज की जगह कम हो सकती है। " +
            "PDF और इमेज IndexedDB में रखे जाते हैं, " +
            "लेकिन बहुत अधिक टेक्स्ट होने पर बैकअप लेना उचित है।"
        );
    }
}

function scheduleSave() {
    setStatus("Saving…");

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveCurrentPage();
        persistState();
    }, 450);
}

function saveCurrentPage() {
    const page = activePage();

    if (!page) return;

    page.title = pageTitle.value.trim() || "Untitled Page";
    page.content = mainWritingBody.innerHTML;

    const objects = [];

    workspace.querySelectorAll(".object").forEach(el => {
        const id = el.dataset.objectId;
        const original = page.objects.find(obj => obj.id === id);

        if (!original) return;

        original.x = parseFloat(el.style.left) || 0;
        original.y = parseFloat(el.style.top) || 0;

        if (original.type === "text") {
            const body = el.querySelector(".text-body");

            if (body) {
                original.html = body.innerHTML;

                original.userWidth = el.dataset.userWidth === "1";
                original.userHeight = el.dataset.userHeight === "1";

                original.w = el.offsetWidth;
                original.h = el.offsetHeight;
            }
        } else if (original.type === "image") {
            original.w = el.offsetWidth;
            original.h = el.offsetHeight;
        } else if (original.type === "pdf") {
            original.w = el.offsetWidth;
            original.h = el.offsetHeight;
        }
    });

    page.updatedAt = Date.now();
    state.lastPageId = page.id;
}

function saveNow() {
    clearTimeout(saveTimer);
    saveCurrentPage();
    persistState();
}

document.getElementById("saveBtn").onclick = saveNow;

/* =========================================================
   TREE RENDERING
   ========================================================= */

function renderTree() {
    treeEl.innerHTML = "";

    for (const notebook of state.notebooks) {
        treeEl.appendChild(renderTreeNode(notebook, 0));
    }
}

function renderTreeNode(node, depth) {
    const wrapper = document.createElement("div");
    wrapper.className = "tree-item";

    const row = document.createElement("div");
    row.className = "tree-row";

    if (node.id === activePageId) {
        row.classList.add("active");
    }

    const hasChildren = Array.isArray(node.children) &&
        node.children.length > 0;

    const toggle = document.createElement("span");
    toggle.className = "tree-toggle";
    toggle.textContent = hasChildren
        ? (node.expanded === false ? "▸" : "▾")
        : "•";

    const label = document.createElement("span");
    label.className = "tree-label";

    const icon = node.type === "notebook"
        ? "📚 "
        : node.type === "section"
            ? "📁 "
            : "📄 ";

    label.textContent = icon + node.title;
    label.title = node.title;

    const menu = document.createElement("button");
    menu.className = "tree-menu";
    menu.textContent = "⋯";
    menu.title = "Options";

    row.append(toggle, label, menu);
    wrapper.appendChild(row);

    row.addEventListener("click", e => {
        if (e.target === menu) return;

        if (hasChildren && e.target === toggle) {
            node.expanded = node.expanded === false;
            renderTree();
            scheduleSave();
            return;
        }

        if (node.type === "page") {
            openPage(node.id);
        } else {
            node.expanded = node.expanded === false;
            renderTree();
            scheduleSave();
        }
    });

    menu.addEventListener("click", e => {
        e.stopPropagation();
        showNodeMenu(node);
    });

    if (hasChildren && node.expanded !== false) {
        const children = document.createElement("div");
        children.className = "tree-children";

        for (const child of node.children) {
            children.appendChild(renderTreeNode(child, depth + 1));
        }

        wrapper.appendChild(children);
    }

    return wrapper;
}

function showNodeMenu(node) {
    const options = node.type === "notebook"
        ? ["Add Section", "Rename", "Delete"]
        : node.type === "section"
            ? ["Add Page", "Rename", "Delete"]
            : ["Rename", "Delete"];

    const choice = prompt(
        node.title + "\n\n" +
        options.map((option, i) => `${i + 1}. ${option}`).join("\n") +
        "\n\nविकल्प का नंबर लिखें:"
    );

    if (!choice) return;

    const index = Number(choice) - 1;

    if (!Number.isInteger(index) || index < 0 || index >= options.length) {
        return;
    }

    const action = options[index];

    if (action === "Add Section") addSectionTo(node.id);
    if (action === "Add Page") addPageTo(node.id);
    if (action === "Rename") renameNode(node);
    if (action === "Delete") deleteNode(node);
}

/* =========================================================
   NOTEBOOK / SECTION / PAGE ACTIONS
   ========================================================= */

function addNotebook() {
    showDialog("New Notebook", "Notebook name", name => {
        const notebook = createNotebook(name);

        state.notebooks.push(notebook);

        renderTree();
        openPage(notebook.children[0].children[0].id);
        saveNow();
    });
}

function addSectionTo(notebookId) {
    const notebook = findNode(notebookId);

    if (!notebook || notebook.type !== "notebook") return;

    showDialog("New Section", "Section name", name => {
        const section = createSection(name);

        notebook.children.push(section);
        notebook.expanded = true;

        renderTree();
        openPage(section.children[0].id);
        saveNow();
    });
}

function addPageTo(sectionId) {
    const section = findNode(sectionId);

    if (!section || section.type !== "section") return;

    showDialog("New Page", "Page name", name => {
        const page = createPage(name);

        section.children.push(page);
        section.expanded = true;

        renderTree();
        openPage(page.id);
        saveNow();
    });
}

function renameNode(node) {
    showDialog("Rename", "New name", name => {
        node.title = name;

        if (node.id === activePageId) {
            pageTitle.value = name;
        }

        renderTree();
        saveNow();
    });
}

function deleteNode(node) {
    if (!confirm(`"${node.title}" को हटाना चाहते हैं?`)) return;

    if (node.type === "notebook") {
        state.notebooks = state.notebooks.filter(
            item => item.id !== node.id
        );
    } else if (node.type === "section") {
        for (const notebook of state.notebooks) {
            notebook.children = notebook.children.filter(
                item => item.id !== node.id
            );
        }
    } else {
        const section = getParentSection(node.id);

        if (section) {
            section.children = section.children.filter(
                item => item.id !== node.id
            );
        }
    }

    if (!allPages().length) {
        state = defaultState();
    }

    if (!allPages().some(page => page.id === activePageId)) {
        activePageId = allPages()[0].id;
    }

    renderTree();
    openPage(activePageId);
    saveNow();
}

document.getElementById("newNotebookBtn").onclick = addNotebook;
document.getElementById("addNotebookBtn").onclick = addNotebook;

document.getElementById("newSectionBtn").onclick = () => {
    const page = activePage();
    const section = page ? getParentSection(page.id) : null;

    let notebook = null;

    if (section) {
        notebook = state.notebooks.find(item =>
            item.children.some(child => child.id === section.id)
        );
    }

    if (!notebook) {
        notebook = state.notebooks[0];
    }

    if (notebook) addSectionTo(notebook.id);
};

document.getElementById("newPageBtn").onclick = () => {
    const page = activePage();
    const section = page ? getParentSection(page.id) : null;

    if (section) {
        addPageTo(section.id);
    } else {
        const notebook = state.notebooks[0];

        if (!notebook) return;

        const newSection = createSection("General");
        notebook.children.push(newSection);

        addPageTo(newSection.id);
    }
};

/* =========================================================
   OPEN PAGE
   ========================================================= */

function openPage(pageId) {
    saveCurrentPage();

    const page = allPages().find(item => item.id === pageId);

    if (!page) return;

    activePageId = pageId;
    state.lastPageId = pageId;

    pageTitle.value = page.title || "";
    mainWritingBody.innerHTML = page.content || "";

    renderObjects(page);
    renderTree();

    setStatus("Ready");
    updateWorkspaceSize();
}

pageTitle.addEventListener("input", () => {

    if (page) page.title = pageTitle.value;

    renderTree();
    scheduleSave();
});

mainWritingBody.addEventListener("input", () => {
    autoGrowMainWriting();
    scheduleSave();
});

mainWritingBody.addEventListener("paste", () => {
    setTimeout(() => {
        autoGrowMainWriting();
        scheduleSave();

});

function autoGrowMainWriting() {
    mainWritingBody.style.height = "auto";

    const contentHeight = Math.max(
        480,
        mainWritingBody.scrollHeight + 10
    );

/* =========================================================
   WORKSPACE SIZE
   ========================================================= */

function updateWorkspaceSize() {
    let maxRight = workspaceScroll.clientWidth || 1200;
    let maxBottom = workspaceScroll.clientHeight || 800;

    workspace.querySelectorAll(".object, .main-writing, .mindmap")
        .forEach(el => {
            const left = parseFloat(el.style.left) || 0;
            const top = parseFloat(el.style.top) || 0;

            maxRight = Math.max(maxRight, left + el.offsetWidth + 100);
            maxBottom = Math.max(maxBottom, top + el.offsetHeight + 100);
        });

    workspace.style.width = Math.max(
        maxRight,
        workspaceScroll.clientWidth
    ) + "px";

    workspace.style.height = Math.max(
        maxBottom,
        workspaceScroll.clientHeight
    ) + "px";
}

/* =========================================================
   OBJECT CREATION
   ========================================================= */

function createObjectElement(obj) {
    const el = document.createElement("div");

    el.className = "object " + obj.type + "-object";
    el.dataset.objectId = obj.id;

    el.style.left = (obj.x || 100) + "px";
    el.style.top = (obj.y || 100) + "px";

    if (obj.w) el.style.width = obj.w + "px";

    if (obj.type === "text" && obj.h) {
        el.style.height = obj.h + "px";
    }

    if (obj.type === "image" && obj.h) {
        el.style.height = obj.h + "px";
    }

    if (obj.type === "pdf") {
        el.style.height = "auto";
    }

    const header = document.createElement("div");
    header.className = "object-header";

    const title = document.createElement("span");
    title.className = "object-title";

    title.textContent = obj.type === "text"
        ? "Text Panel"
        : obj.type === "image"
            ? (obj.name || "Image")
            : (obj.name || "PDF Document");

    const close = document.createElement("button");
    close.className = "object-close";
    close.type = "button";
    close.textContent = "×";
    close.title = "Remove object";

    header.append(title, close);
    el.appendChild(header);

    const body = document.createElement("div");
    body.className = "object-body";

    el.appendChild(body);

    if (obj.type === "text") {
        const textBody = document.createElement("div");

        textBody.className = "text-body";
        textBody.contentEditable = "true";
        textBody.spellcheck = true;
        textBody.innerHTML = obj.html || "";

        body.appendChild(textBody);

        if (obj.userWidth) {
            el.dataset.userWidth = "1";
        }

        if (obj.userHeight) {
            el.dataset.userHeight = "1";
        }

        textBody.addEventListener("input", () => {
            growTextObject(el, false);
            scheduleSave();
        });

        textBody.addEventListener("paste", () => {
            setTimeout(() => {
                growTextObject(el, false);
                scheduleSave();
            }, 100);
        });

        textBody.addEventListener("keydown", e => {
            if (e.key === "Escape") textBody.blur();
        });

        requestAnimationFrame(() => growTextObject(el, true));

    } else if (obj.type === "image") {
        const img = document.createElement("img");

        img.alt = obj.name || "Uploaded image";
        img.src = "";

        body.appendChild(img);

        loadImageObject(obj, img);

    } else if (obj.type === "pdf") {
        const pages = document.createElement("div");
        pages.className = "pdf-pages";

        body.appendChild(pages);

        loadPdfObject(obj, el, pages);
    }

    close.addEventListener("click", async () => {
        if (!confirm("इस पैनल को हटाना चाहते हैं?")) return;

        const page = activePage();

        if (page) {
            page.objects = page.objects.filter(item => item.id !== obj.id);
        }

        el.remove();
        scheduleSave();
        updateWorkspaceSize();
    });

    makeDraggable(el, header);

    if (obj.type !== "pdf") {
        makeResizable(el);
    } else {
        makePdfResizable(el, obj);
    }

    return el;
}

/* =========================================================
   TEXT PANEL: AUTO-GROW TO A4 WIDTH
   ========================================================= */

function growTextObject(el, initial) {
    const body = el.querySelector(".text-body");

    if (!body) return;

    const hasContent = body.textContent.trim().length > 0 ||
        body.querySelector("img, table, video, iframe");

    /*
      Start small.
      When user writes/pastes content, expand to A4-like width.
      If the user manually resizes the panel, preserve their choice.
    */

    if (hasContent && el.dataset.userWidth !== "1") {
        el.style.width = "794px";
    }

    if (!hasContent && initial && !el.dataset.userWidth) {
        el.style.width = "240px";
    }

    if (el.dataset.userHeight !== "1") {
        body.style.height = "auto";

        const headerHeight = 34;
        const bodyHeight = Math.max(65, body.scrollHeight + 25);

        el.style.height = (headerHeight + bodyHeight) + "px";

        body.style.height = "calc(100% - 34px)";
    }

    updateWorkspaceSize();
}

function makeResizable(el) {
    let oldWidth = el.offsetWidth;
    let oldHeight = el.offsetHeight;

    if (typeof ResizeObserver !== "undefined") {
        const observer = new ResizeObserver(() => {
            const width = el.offsetWidth;
            const height = el.offsetHeight;

            /*
              ResizeObserver can run during initial layout.
              Only mark a manual resize when a resize is detected
              while the user is actively resizing.
            */

            if (el.dataset.userResizing === "1") {
                if (width !== oldWidth) {
                    el.dataset.userWidth = "1";
                }

                if (height !== oldHeight) {
                    el.dataset.userHeight = "1";
                }
            }

            oldWidth = width;
            oldHeight = height;
        });

        observer.observe(el);
    }

    el.addEventListener("pointerdown", e => {
        const rect = el.getBoundingClientRect();

        const nearRight = rect.right - e.clientX < 25;
        const nearBottom = rect.bottom - e.clientY < 25;

        if (nearRight || nearBottom) {
            el.dataset.userResizing = "1";
        }
    });

    window.addEventListener("pointerup", () => {
        if (el.dataset.userResizing === "1") {
            delete el.dataset.userResizing;
            scheduleSave();
        }
    });
}

/* =========================================================
   DRAG OBJECTS
   ========================================================= */

function makeDraggable(el, handle) {
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let originalLeft = 0;
    let originalTop = 0;

    handle.addEventListener("pointerdown", e => {
        if (e.target.closest(".object-close")) return;

        /*
          Do not start dragging if the pointer is near the resize
          edge of a resizable panel.
        */

        const rect = el.getBoundingClientRect();

        if (
            e.clientX > rect.right - 18 ||
            e.clientY > rect.bottom - 18
        ) {
            return;
        }

        dragging = true;

        startX = e.clientX;
        startY = e.clientY;

        originalLeft = parseFloat(el.style.left) || 0;
        originalTop = parseFloat(el.style.top) || 0;

        handle.setPointerCapture(e.pointerId);

        e.preventDefault();
    });

    handle.addEventListener("pointermove", e => {
        if (!dragging) return;

        const scale = 1;

        const dx = (e.clientX - startX) / scale;
        const dy = (e.clientY - startY) / scale;

        el.style.left = Math.max(0, originalLeft + dx) + "px";
        el.style.top = Math.max(0, originalTop + dy) + "px";

        updateWorkspaceSize();
    });

    const stopDragging = () => {
        if (!dragging) return;

        dragging = false;

        scheduleSave();
        updateWorkspaceSize();
    };

    handle.addEventListener("pointerup", stopDragging);
    handle.addEventListener("pointercancel", stopDragging);
}

/* =========================================================
   IMAGE OBJECT
   ========================================================= */

async function loadImageObject(obj, img) {
    try {
        const record = await getAsset(obj.assetId);

        if (!record || !record.blob) {
            img.alt = "Image file not found. Restore your backup.";
            return;
        }

        const url = URL.createObjectURL(record.blob);

        img.src = url;

        img.onload = () => {
            updateWorkspaceSize();
        };

    } catch (error) {
        console.error("Image load error:", error);
    }
}

/* =========================================================
   PDF OBJECT: RENDER EVERY PAGE
   ========================================================= */

async function loadPdfObject(obj, el, pagesContainer) {
    pagesContainer.innerHTML =
        '<div class="pdf-message">PDF लोड हो रहा है…</div>';

    try {
        if (!window.pdfjsLib) {
            throw new Error("PDF.js library could not load");
        }

        const record = await getAsset(obj.assetId);

        if (!record || !record.blob) {
            throw new Error("PDF file not found");
        }

        const buffer = await record.blob.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(buffer)
        }).promise;

        pagesContainer.innerHTML = "";

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            const pdfPage = await pdf.getPage(pageNumber);

            /*
              Fit page to the PDF object's available width.
              Do not create an internal scrolling panel.
            */

            const originalViewport = pdfPage.getViewport({ scale: 1 });

            const targetWidth = Math.max(
                240,
                el.clientWidth - 2
            );

            const scale = targetWidth / originalViewport.width;

            const viewport = pdfPage.getViewport({ scale });

            const canvas = document.createElement("canvas");
            canvas.className = "pdf-canvas";

            const ctx = canvas.getContext("2d", {
                alpha: false
            });

            const outputScale = Math.min(
                window.devicePixelRatio || 1,
                2
            );

            canvas.width = Math.floor(
                viewport.width * outputScale
            );

            canvas.height = Math.floor(
                viewport.height * outputScale
            );

            canvas.style.width = "100%";
            canvas.style.height = "auto";

            const pageWrap = document.createElement("div");
            pageWrap.className = "pdf-page";

            pageWrap.appendChild(canvas);
            pagesContainer.appendChild(pageWrap);

            ctx.setTransform(
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
            );

            await pdfPage.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;

            /*
              Page number indicator
            */

            const number = document.createElement("div");

            number.style.cssText = [
                "position:absolute",
                "right:8px",
                "bottom:8px",
                "font-size:10px",
                "color:#666",
                "background:rgba(255,255,255,.9)",
                "padding:3px 5px",
                "border-radius:3px"
            ].join(";");

            number.textContent =
                pageNumber + " / " + pdf.numPages;

            pageWrap.appendChild(number);
        }

        /*
          Let the object grow to the combined height of all pages.
          The workspace itself provides normal page scrolling.
        */

        el.style.height = "auto";

        pagesContainer.style.height = "auto";
        pagesContainer.style.overflow = "visible";

        updateWorkspaceSize();
        scheduleSave();

    } catch (error) {
        console.error("PDF rendering error:", error);

        pagesContainer.innerHTML = "";

        const message = document.createElement("div");
        message.className = "pdf-message";

        message.textContent =
            "PDF लोड नहीं हो पाया। फ़ाइल दोबारा अपलोड करके देखें। " +
            "(" + error.message + ")";

        pagesContainer.appendChild(message);
    }
}

/*
  PDF panel width changes:
  Re-render all pages so they match the new width.
*/

function makePdfResizable(el, obj) {
    let resizeTimer = null;
    let lastWidth = 0;

    const observer = new ResizeObserver(() => {
        const width = el.clientWidth;

        if (!width || Math.abs(width - lastWidth) < 8) return;

        if (lastWidth === 0) {
            lastWidth = width;
            return;
        }

        lastWidth = width;

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(() => {
            const container = el.querySelector(".pdf-pages");

            if (container) {
                loadPdfObject(obj, el, container);
            }
        }, 500);
    });

    observer.observe(el);
}

/* =========================================================
   RENDER PAGE OBJECTS
   ========================================================= */

function renderObjects(page) {
    workspace.querySelectorAll(".object, .mindmap").forEach(el => el.remove());

    page.objects = page.objects || [];

    for (const obj of page.objects) {
        const el = createObjectElement(obj);
        workspace.appendChild(el);
    }

    renderMindMap(page);

    requestAnimationFrame(() => {
        autoGrowMainWriting();
        updateWorkspaceSize();
    });
}

        );
    }
});

/* =========================================================
   MIND MAP
   ========================================================= */

function renderMindMap(page) {
    const old = workspace.querySelector(".mindmap");

    if (old) old.remove();

    if (!page || !page.mindmap || !page.mindmap.length) return;

    const box = document.createElement("div");

    box.className = "mindmap";
    box.style.left = "900px";
    box.style.top = "30px";

    const heading = document.createElement("h3");
    heading.textContent = "Mind Map";

    const input = document.createElement("input");
    input.placeholder = "Type a new idea and press Enter";

    const list = document.createElement("div");
    list.className = "mindmap-list";

    function refresh() {
        list.innerHTML = "";

        page.mindmap.forEach((text, index) => {
            const node = document.createElement("div");

            node.className = "mind-node";
            node.textContent = text;
            node.title = "Tap to delete";

            node.onclick = () => {
                if (!confirm("इस Mind Map आइडिया को हटाएँ?")) return;

                page.mindmap.splice(index, 1);

                if (!page.mindmap.length) {
                    box.remove();
                } else {
                    refresh();
                }

                scheduleSave();
            };

            list.appendChild(node);
        });

        updateWorkspaceSize();
    }

    input.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;

        const value = input.value.trim();

        if (!value) return;

        page.mindmap.push(value);

        input.value = "";

        refresh();
        scheduleSave();
    });

    box.append(heading, input, list);

    workspace.appendChild(box);

    refresh();
}

document.getElementById("addMindBtn").onclick = () => {
    const page = activePage();

    if (!page) return;

    if (!page.mindmap) page.mindmap = [];

    const existing = workspace.querySelector(".mindmap");

    if (existing) {
        existing.remove();
        scheduleSave();
        return;
    }

    if (!page.mindmap.length) {
        page.mindmap.push("Main Idea");
    }

    renderMindMap(page);
    scheduleSave();
};

/* =========================================================
   BACKUP
   ========================================================= */

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
            const result = String(reader.result);
            resolve(result.split(",")[1]);
        };

        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(blob);
    });
}

function base64ToBlob(base64, type) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new Blob([bytes], {
        type: type || "application/octet-stream"
    });
}

async function exportBackup() {
    saveNow();

    try {
        const backup = {
            app: "OneNote Infinity Pro",
            version: 1,
            exportedAt: new Date().toISOString(),
            state,
            assets: []
        };

        const ids = new Set();

        for (const page of allPages()) {
            for (const obj of page.objects || []) {
                if (obj.assetId) ids.add(obj.assetId);
            }
        }

        for (const id of ids) {
            const record = await getAsset(id);

            if (!record || !record.blob) continue;

            backup.assets.push({
                id: record.id,
                name: record.name,
                type: record.type,
                base64: await blobToBase64(record.blob)
            });
        }

        const blob = new Blob(
            [JSON.stringify(backup)],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download =
            "onenote-infinity-backup-" +
            new Date().toISOString().slice(0, 10) +
            ".json";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1500);

        setStatus("Backup downloaded");

    } catch (error) {
        console.error(error);

        alert(
            "Backup नहीं बन पाया। बड़ी PDF फ़ाइलों के लिए पर्याप्त स्टोरेज जाँचें।"
        );
    }
}

document.getElementById("backupBtn").onclick = exportBackup;

/* =========================================================
   RESTORE
   ========================================================= */

document.getElementById("restoreBtn").onclick = () => {
    document.getElementById("restoreInput").click();
};

document.getElementById("restoreInput").addEventListener("change", async e => {
    const file = e.target.files[0];

    e.target.value = "";

    if (!file) return;

    if (!confirm(
        "Restore करने पर वर्तमान नोटबुक डेटा बदल सकता है। " +
        "क्या आपने वर्तमान डेटा का बैकअप ले लिया है?"
    )) {
        return;
    }

    try {
        const backup = JSON.parse(await file.text());

        if (
            !backup ||
            !backup.state ||
            !Array.isArray(backup.state.notebooks)
        ) {
            throw new Error("Invalid backup file");
        }

        for (const asset of backup.assets || []) {
            const blob = base64ToBlob(asset.base64, asset.type);

            await putAsset(
                asset.id,
                blob,
                asset.name,
                asset.type
            );
        }

        state = backup.state;

        if (!allPages().length) {
            state = defaultState();
        }

        activePageId = allPages().some(
            page => page.id === state.lastPageId
        )
            ? state.lastPageId
            : allPages()[0].id;

        persistState();
        renderTree();
        openPage(activePageId);

        alert("Backup सफलतापूर्वक Restore हो गया।");

    } catch (error) {
        console.error(error);

        alert(
            "Backup Restore नहीं हो सका। कृपया सही JSON backup file चुनें।"
        );
    }
});

async function startApp() {
    try {
        await openAssetDB();
    } catch (error) {

            "IndexedDB unavailable. Text notes may still work.",
            error
        );
    }

    loadState();

    renderTree();

    setStatus("Ready");
}
