<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>OneNote Infinity Pro</title>

<style>
:root {
    --accent: #7654c9;
    --border: #dddddd;
    --text: #242424;
    --muted: #6b6b6b;
    --toolbar: #fafafa;
    --hover: #f2edff;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: #fff;
    color: var(--text);
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
}

/* TOP BAR */

.topbar {
    min-height: 52px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: #fff;
}

.brand {
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
}

.brand span {
    color: var(--accent);
}

.top-actions {
    display: flex;
    gap: 5px;
    align-items: center;
    margin-left: auto;
}

.btn {
    padding: 7px 10px;
    border: 1px solid var(--border);
    background: #fff;
    color: #333;
    border-radius: 5px;
}

.btn:hover,
.icon-btn:hover {
    background: var(--hover);
}

.btn.primary {
    color: white;
    background: var(--accent);
    border-color: var(--accent);
}

.icon-btn {
    border: 0;
    border-radius: 4px;
    background: transparent;
    min-width: 32px;
    min-height: 30px;
    font-size: 18px;
}

/* MAIN LAYOUT */

.main-layout {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: #fff;
    min-height: 0;
    transition: width .18s ease;
}

.sidebar.collapsed {
    width: 0;
    overflow: hidden;
    border: 0;
}

.sidebar-head {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.sidebar-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    margin-bottom: 9px;
}

.sidebar-heading strong {
    font-size: 14px;
}

.sidebar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.small-btn {
    font-size: 11px;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
}

.tree {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px;
}

.tree-item {
    margin: 2px 0;
}

.tree-row {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 5px 3px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
}

.tree-row:hover {
    background: #f6f6f6;
}

.tree-row.active {
    background: #eee8ff;
    color: #4e3299;
    font-weight: 600;
}

.tree-toggle,
.tree-expand {
    flex-shrink: 0;
    width: 23px;
    height: 25px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #555;
}

.tree-toggle:hover,
.tree-expand:hover {
    background: #eaeaea;
}

.tree-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.tree-menu {
    border: 0;
    background: transparent;
    color: #777;
    font-size: 17px;
    padding: 0 4px;
}

.tree-children {
    margin-left: 12px;
    padding-left: 5px;
    border-left: 1px solid #eee;
}

.sidebar-footer {
    padding: 8px;
    border-top: 1px solid #eee;
    font-size: 10px;
    color: #777;
}

/* EDITOR */

.editor {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
}

.editor-title-wrap {
    padding: 8px 14px 5px;
    flex-shrink: 0;
    background: #fff;
}

.page-title {
    width: 100%;
    padding: 5px 0;
    font-size: 23px;
    font-weight: 700;
    border: 0;
    outline: none;
    background: transparent;
    color: #252525;
}

.page-title::placeholder {
    color: #aaa;
}

.save-status {
    font-size: 10px;
    color: #777;
    min-height: 14px;
}

/* FORMATTING TOOLBAR */

.format-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 7px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding-right: 5px;
    margin-right: 2px;
    border-right: 1px solid #e5e5e5;
}

.tool-btn {
    min-width: 31px;
    height: 30px;
    padding: 4px 7px;
    border: 1px solid transparent;
    background: #fff;
    color: #333;
    border-radius: 4px;
    font-size: 13px;
}

.tool-btn:hover {
    background: var(--hover);
    border-color: #e4dcff;
}

.tool-btn:active {
    background: #e9e0ff;
}

.tool-select {
    height: 30px;
    max-width: 135px;
    padding: 3px 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    font-size: 12px;
}

.font-size-select {
    width: 58px;
}

.color-control {
    width: 31px;
    height: 30px;
    padding: 2px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
}

/* BLANK WORKSPACE */

.workspace-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
    background: #fff !important;
    background-image: none !important;
    overscroll-behavior: contain;
}

.workspace {
    position: relative;
    min-width: 100%;
    min-height: 100%;
    width: 1400px;
    height: 1000px;
    background: #fff !important;
    background-image: none !important;
}

/* MAIN WRITING AREA */

.main-writing {
    position: absolute;
    left: 20px;
    top: 15px;
    width: 794px;
    min-height: 500px;
    background: #fff !important;
    background-image: none !important;
    border: 1px solid transparent;
    transition: border-color .12s ease;
}

.main-writing.has-content {
    border-color: #e4e4e4;
}

.writing-body {
    min-height: 480px;
    padding: 24px 28px;
    outline: none;
    overflow-wrap: anywhere;
    font-size: 15px;
    line-height: 1.65;
    background: #fff !important;
    background-image: none !important;
}

.writing-body:empty::before {
    content: "यहाँ क्लिक करके लिखें...";
    color: #aaa;
    pointer-events: none;
}

.writing-body img,
.text-body img {
    max-width: 100%;
    height: auto;
}

.writing-body table,
.text-body table {
    border-collapse: collapse;
    max-width: 100%;
}

.writing-body td,
.writing-body th,
.text-body td,
.text-body th {
    border: 1px solid #bbb;
    padding: 5px;
}

/* FLOATING TEXT / IMAGE / PDF OBJECTS */

.object {
    position: absolute;
    left: 100px;
    top: 100px;
    background: #fff !important;
    background-image: none !important;
    border: 1px solid transparent;
    overflow: visible;
}

.object.has-content {
    border-color: #dedede;
}

.object-header {
    height: 29px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    background: #fff;
    border-bottom: 1px solid transparent;
    cursor: move;
    user-select: none;
    touch-action: none;
}

.object.has-content .object-header {
    border-bottom-color: #eee;
}

.object-title {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    color: #666;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.object-close {
    border: 0;
    background: transparent;
    color: #666;
    font-size: 18px;
    padding: 0 4px;
}

.object-body {
    background: #fff !important;
    background-image: none !important;
}

/* TEXT PANEL */

.text-object {
    width: 240px;
    min-width: 120px;
    min-height: 50px;
    height: auto;
    resize: both;
    overflow: hidden;
}

.text-body {
    min-height: 24px;
    padding: 5px 7px;
    outline: none;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.6;
    background: #fff !important;
    background-image: none !important;
}

/*
  Empty text panels have no visible frame.
  A thin frame appears only after text is entered.
*/

.text-object:not(.has-content) {
    border-color: transparent;
}

.text-object:not(.has-content) .object-header {
    border-bottom-color: transparent;
}

.text-object.has-content {
    border: 1px solid #d7d7d7;
}

.text-object.has-content .object-header {
    border-bottom: 1px solid #ededed;
}

/* IMAGE */

.image-object {
    width: 340px;
    min-width: 150px;
    resize: both;
    overflow: hidden;
    border: 1px solid #ddd;
}

.image-object .object-body {
    padding: 5px;
}

.image-object img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
}

/* PDF: NO INTERNAL VERTICAL SCROLL */

.pdf-object {
    width: 794px;
    min-width: 280px;
    height: auto !important;
    resize: horizontal;
    overflow: visible !important;
    border: 1px solid #ddd;
    background: #fff !important;
}

.pdf-object .object-body {
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    padding: 0;
}

.pdf-pages {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    width: 100%;
    height: auto !important;
    overflow: visible !important;
}

.pdf-page {
    position: relative;
    width: 100%;
    background: #fff;
    border: 1px solid #eee;
}

.pdf-canvas {
    display: block;
    width: 100%;
    height: auto;
}

.pdf-message {
    padding: 15px;
    font-size: 12px;
    color: #666;
}

/* MIND MAP */

.mindmap {
    position: absolute;
    left: 900px;
    top: 30px;
    width: 320px;
    min-height: 100px;
    padding: 10px;
    border: 1px solid #ddd;
    background: #fff;
}

.mindmap h3 {
    margin: 0 0 8px;
    font-size: 14px;
}

.mindmap input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
}

.mind-node {
    margin-top: 6px;
    padding: 7px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 12px;
    overflow-wrap: anywhere;
}

/* DIALOG */

.dialog-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,.35);
}

.dialog {
    width: min(420px, 100%);
    padding: 20px;
    border-radius: 8px;
    background: #fff;
    box-shadow: 0 10px 40px #0002;
}

.dialog h3 {
    margin-top: 0;
}

.dialog input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
}

/* MOBILE */

@media(max-width:700px) {
    .topbar {
        gap: 5px;
        padding: 5px;
    }

    .brand {
        font-size: 13px;
    }

    .top-actions {
        gap: 3px;
    }

    .top-actions .btn {
        padding: 6px;
        font-size: 11px;
    }

    .sidebar {
        width: 155px;
    }

    .sidebar-head {
        padding: 6px;
    }

    .sidebar-heading strong {
        font-size: 12px;
    }

    .small-btn {
        font-size: 10px;
        padding: 5px;
    }

    .tree-row {
        font-size: 11px;
    }

    .page-title {
        font-size: 19px;
    }

    .format-toolbar {
        gap: 3px;
        padding: 5px;
    }

    .tool-group {
        padding-right: 3px;
        margin-right: 0;
    }

    .tool-btn {
        min-width: 28px;
        height: 29px;
        padding: 3px 5px;
    }

    .tool-select {
        max-width: 105px;
        height: 29px;
    }

    .main-writing {
        width: 794px;
        left: 12px;
        top: 12px;
    }

    .writing-body {
        padding: 18px;
    }
}

@media(max-width:420px) {
    .sidebar {
        width: 125px;
    }

    .brand {
        font-size: 11px;
    }
}
</style>
</head>

<body>
<div class="app">

    <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" title="Show/Hide Notebook panel">☰</button>

        <div class="brand">OneNote <span>Infinity Pro</span></div>

        <div class="top-actions">
            <button class="btn" id="saveBtn">Save</button>
            <button class="btn" id="backupBtn">Backup</button>
            <button class="btn" id="restoreBtn">Restore</button>
        </div>
    </header>

    <main class="main-layout">

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-head">

                <div class="sidebar-heading">
                    <strong>📚 Notebooks</strong>

                    <button class="icon-btn"
                        id="collapseSidebarBtn"
                        title="Minimize notebook panel">−</button>
                </div>

                <div class="sidebar-actions">
                    <button class="small-btn" id="newNotebookBtn">＋ Notebook</button>
                    <button class="small-btn" id="newSectionBtn">＋ Section</button>
                    <button class="small-btn" id="newPageBtn">＋ Page</button>
                </div>

            </div>

            <div class="tree" id="tree"></div>

            <div class="sidebar-footer">
                Auto-save · Local storage

        </aside>

        <section class="editor">

            <div class="editor-title-wrap">
                <input
                    id="pageTitle"
                    class="page-title"

                    autocomplete="off"
                >
                <div class="save-status" id="saveStatus">Ready</div>
            </div>

            <!-- ADVANCED FORMATTING TOOLBAR -->

            <div class="format-toolbar">

                <div class="tool-group">
                    <button class="tool-btn" id="undoBtn" title="Undo">↶</button>
                    <button class="tool-btn" id="redoBtn" title="Redo">↷</button>

                    <select class="tool-select" id="fontFamily" title="Font family">

                        <option value="Tahoma">Tahoma</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                        <option value="Noto Sans Devanagari">Noto Sans Devanagari</option>
                    </select>

                    <select class="tool-select font-size-select" id="fontSize" title="Font size">
                        <option value="1">8</option>
                        <option value="2">10</option>

                    </select>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" data-command="bold" title="Bold"><b>B</b></button>
                    <button class="tool-btn" data-command="italic" title="Italic"><i>I</i></button>
                    <button class="tool-btn" data-command="underline" title="Underline"><u>U</u></button>
                    <button class="tool-btn" data-command="strikeThrough" title="Strikethrough"><s>S</s></button>
                </div>

                <div class="tool-group">
                    <label title="Font color">
                        <input type="color" class="color-control" id="fontColor" value="#242424" aria-label="Font color">
                    </label>

                    <label title="Highlight / background color">
                        <input type="color" class="color-control" id="highlightColor" value="#fff176" aria-label="Highlight color">
                    </label>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" data-command="justifyLeft" title="Align left">⇤</button>
                    <button class="tool-btn" data-command="justifyCenter" title="Align center">≡</button>
                    <button class="tool-btn" data-command="justifyRight" title="Align right">⇥</button>
                    <button class="tool-btn" data-command="justifyFull" title="Justify">☷</button>

                <div class="tool-group">
                    <button class="tool-btn" data-command="insertUnorderedList" title="Bullets">• List</button>
                    <button class="tool-btn" data-command="insertOrderedList" title="Numbering">1. List</button>

                </div>

                <div class="tool-group">

                    <button class="tool-btn" id="tableBtn" title="Insert table">▦</button>
                    <button class="tool-btn" id="clearFormatBtn" title="Clear formatting">Tx</button>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" id="addTextBtn" title="New text panel">＋ Text</button>
                    <button class="tool-btn" id="addImageBtn" title="Upload image">＋ Image</button>
                    <button class="tool-btn" id="addPdfBtn" title="Upload PDF">＋ PDF</button>

                </div>

            </div>

            <div class="workspace-scroll" id="workspaceScroll">
                <div class="workspace" id="workspace">

                    <div class="main-writing" id="mainWritingArea">
                        <div class="writing-body"
                            id="mainWritingBody"
                            contenteditable="true"
                            spellcheck="true"></div>
                    </div>

                </div>
            </div>

        </section>
    </main>
</div>

<input type="file" id="imageInput" accept="image/*" hidden>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="restoreInput" accept=".json,application/json" hidden>

<div class="dialog-backdrop" id="dialogBackdrop">
    <div class="dialog">
        <h3 id="dialogTitle">Create</h3>
        <input id="dialogInput" placeholder="Name">

        <div class="dialog-actions">
            <button class="btn" id="dialogCancel">Cancel</button>
            <button class="btn primary" id="dialogConfirm">Create</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";

/* =====================================================
   CORE SETTINGS AND HELPERS
   ===================================================== */

const META_KEY = "oneNoteInfinityProAdvancedV2";
const DB_NAME = "OneNoteInfinityProAdvancedAssets";
const STORE_NAME = "assets";

const treeEl = document.getElementById("tree");
const sidebar = document.getElementById("sidebar");
const workspace = document.getElementById("workspace");
const workspaceScroll = document.getElementById("workspaceScroll");
const mainWritingArea = document.getElementById("mainWritingArea");
const mainWritingBody = document.getElementById("mainWritingBody");
const pageTitle = document.getElementById("pageTitle");
const saveStatus = document.getElementById("saveStatus");

let state;
let activePageId = null;
let assetDB = null;
let saveTimer = null;
let dialogCallback = null;

/* Configure PDF.js worker */

if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function uid() {
    return "id_" + Date.now().toString(36) +
        "_" + Math.random().toString(36).slice(2, 9);
}

function setStatus(text) {
    saveStatus.textContent = text;
}

/* =====================================================
   DIALOG
   ===================================================== */

function showDialog(title, placeholder, callback) {
    document.getElementById("dialogTitle").textContent = title;

    const input = document.getElementById("dialogInput");
    input.value = "";
    input.placeholder = placeholder || "Name";

    dialogCallback = callback;

    document.getElementById("dialogBackdrop").style.display = "flex";

    setTimeout(() => input.focus(), 50);
}

function closeDialog() {
    document.getElementById("dialogBackdrop").style.display = "none";
    dialogCallback = null;
}

document.getElementById("dialogCancel").onclick = closeDialog;

document.getElementById("dialogConfirm").onclick = () => {
    const value = document.getElementById("dialogInput").value.trim();

    if (!value) {
        alert("कृपया नाम लिखें।");
        return;
    }

    const callback = dialogCallback;

    closeDialog();

    if (callback) callback(value);
};

document.getElementById("dialogInput").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        document.getElementById("dialogConfirm").click();
    }
});

document.getElementById("dialogBackdrop").addEventListener("click", e => {
    if (e.target.id === "dialogBackdrop") closeDialog();
});

/* =====================================================
   INDEXEDDB ASSETS
   ===================================================== */

function openAssetDB() {
    return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB unavailable"));
            return;
        }

        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(STORE_NAME)) {
                request.result.createObjectStore(STORE_NAME, {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = () => {
            assetDB = request.result;
            resolve(assetDB);
        };

        request.onerror = () => reject(request.error);
    });
}

async function putAsset(id, blob, name, type) {
    if (!assetDB) await openAssetDB();

    return new Promise((resolve, reject) => {
        const tx = assetDB.transaction(STORE_NAME, "readwrite");

        tx.objectStore(STORE_NAME).put({
            id,
            blob,
            name,
            type,
            updatedAt: Date.now()
        });

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function getAsset(id) {
    if (!assetDB) await openAssetDB();

    return new Promise((resolve, reject) => {
        const tx = assetDB.transaction(STORE_NAME, "readonly");
        const request = tx.objectStore(STORE_NAME).get(id);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
    });
}

/* =====================================================
   NOTEBOOK DATA MODEL
   ===================================================== */

function makePage(title = "New Page") {
    return {
        id: uid(),
        type: "page",
        title,
        content: "",
        objects: [],
        mindmap: [],
        updatedAt: Date.now()
    };
}

function makeSection(title = "New Section") {
    return {
        id: uid(),
        type: "section",
        title,
        expanded: true,
        children: [makePage("Page 1")]
    };
}

function makeNotebook(title = "My Notebook") {
    return {
        id: uid(),
        type: "notebook",
        title,
        expanded: true,
        children: [makeSection("General")]
    };
}

function defaultState() {
    const notebook = makeNotebook("My Notebook");

    return {
        version: 2,
        notebooks: [notebook],
        lastPageId: notebook.children[0].children[0].id
    };
}

function allPages() {
    const result = [];

    for (const notebook of state.notebooks || []) {
        for (const section of notebook.children || []) {
            for (const page of section.children || []) {
                result.push(page);
            }
        }
    }

    return result;
}

function findNode(id) {
    for (const notebook of state.notebooks) {
        if (notebook.id === id) return notebook;

        for (const section of notebook.children || []) {
            if (section.id === id) return section;

            for (const page of section.children || []) {
                if (page.id === id) return page;
            }
        }
    }

    return null;
}

function parentSection(pageId) {
    for (const notebook of state.notebooks) {
        for (const section of notebook.children || []) {
            if ((section.children || []).some(page => page.id === pageId)) {
                return section;
            }
        }
    }

    return null;
}

function activePage() {
    return allPages().find(page => page.id === activePageId) || null;
}

/* =====================================================
   LOAD / SAVE
   ===================================================== */

function loadState() {
    try {
        const raw = localStorage.getItem(META_KEY);

        if (raw) {
            const parsed = JSON.parse(raw);

            if (parsed && Array.isArray(parsed.notebooks)) {
                state = parsed;
            }
        }
    } catch (error) {
        console.warn(error);
    }

    if (!state || !state.notebooks.length) {
        state = defaultState();
    }

    if (!allPages().length) {
        state = defaultState();
    }

    activePageId = allPages().some(
        page => page.id === state.lastPageId
    )
        ? state.lastPageId
        : allPages()[0].id;
}

function saveCurrentPage() {
    const page = activePage();

    if (!page) return;

    page.title = pageTitle.value.trim() || "Untitled Page";
    page.content = mainWritingBody.innerHTML;

    workspace.querySelectorAll(".object").forEach(el => {
        const obj = page.objects.find(
            item => item.id === el.dataset.objectId
        );

        if (!obj) return;

        obj.x = parseFloat(el.style.left) || 0;
        obj.y = parseFloat(el.style.top) || 0;

        if (obj.type === "text") {
            const body = el.querySelector(".text-body");

            if (body) obj.html = body.innerHTML;

            obj.w = el.offsetWidth;
            obj.h = el.offsetHeight;

            obj.userWidth = el.dataset.userWidth === "1";
            obj.userHeight = el.dataset.userHeight === "1";
        } else {
            obj.w = el.offsetWidth;
            obj.h = el.offsetHeight;
        }
    });

    page.updatedAt = Date.now();
    state.lastPageId = page.id;
}

function saveNow() {
    clearTimeout(saveTimer);

    saveCurrentPage();

    try {
        localStorage.setItem(META_KEY, JSON.stringify(state));
        setStatus("✓ Saved");
    } catch (error) {
        setStatus("Save error");
        console.error(error);

        alert(
            "सेव करने में समस्या हुई। कृपया Backup डाउनलोड करें " +
            "और ब्राउज़र स्टोरेज की जाँच करें।"
        );
    }
}

function scheduleSave() {
    setStatus("Saving…");

    clearTimeout(saveTimer);

    saveTimer = setTimeout(saveNow, 400);
}

document.getElementById("saveBtn").onclick = saveNow;

window.addEventListener("beforeunload", () => {
    try {
        saveCurrentPage();
        localStorage.setItem(META_KEY, JSON.stringify(state));
    } catch (error) {
        console.warn(error);
    }
});

/* =====================================================
   NOTEBOOK / SECTION TREE
   ===================================================== */

function renderTree() {
    treeEl.innerHTML = "";

    state.notebooks.forEach(notebook => {
        treeEl.appendChild(renderNode(notebook));
    });
}

function renderNode(node) {
    const wrapper = document.createElement("div");
    wrapper.className = "tree-item";

    const row = document.createElement("div");
    row.className = "tree-row";

    if (node.id === activePageId) {
        row.classList.add("active");
    }

    const hasChildren = Array.isArray(node.children) &&
        node.children.length > 0;

    /*
      The arrow button independently expands/collapses the tree node.
      It does not open the page.
    */

    const toggle = document.createElement("button");
    toggle.className = "tree-toggle";
    toggle.textContent = hasChildren
        ? (node.expanded === false ? "▸" : "▾")
        : "•";

    toggle.title = node.expanded === false
        ? "Maximize / Expand"
        : "Minimize / Collapse";

    const label = document.createElement("span");
    label.className = "tree-label";

    const icon = node.type === "notebook"
        ? "📚 "
        : node.type === "section"
            ? "📁 "
            : "📄 ";

    label.textContent = icon + node.title;

    const menu = document.createElement("button");
    menu.className = "tree-menu";
    menu.textContent = "⋯";
    menu.title = "Options";

    row.append(toggle, label, menu);
    wrapper.appendChild(row);

    toggle.onclick = e => {
        e.stopPropagation();

        if (!hasChildren) return;

        node.expanded = node.expanded === false;

        renderTree();
        scheduleSave();
    };

    row.onclick = e => {
        if (e.target.closest("button")) return;

        if (node.type === "page") {
            openPage(node.id);
        } else {
            node.expanded = node.expanded === false;

            renderTree();
            scheduleSave();
        }
    };

    menu.onclick = e => {
        e.stopPropagation();
        nodeMenu(node);
    };

    if (hasChildren && node.expanded !== false) {
        const children = document.createElement("div");
        children.className = "tree-children";

        node.children.forEach(child => {
            children.appendChild(renderNode(child));
        });

        wrapper.appendChild(children);
    }

    return wrapper;
}

function nodeMenu(node) {
    let choices;

    if (node.type === "notebook") {
        choices = ["Add Section", "Rename", "Delete"];
    } else if (node.type === "section") {
        choices = ["Add Page", "Rename", "Delete"];
    } else {
        choices = ["Rename", "Delete"];
    }

    const answer = prompt(
        node.title + "\n\n" +
        choices.map((item, i) => `${i + 1}. ${item}`).join("\n") +
        "\n\nविकल्प का नंबर लिखें:"
    );

    if (!answer) return;

    const index = Number(answer) - 1;

    if (!Number.isInteger(index) || !choices[index]) return;

    const action = choices[index];

    if (action === "Add Section") addSection(node.id);
    if (action === "Add Page") addPage(node.id);
    if (action === "Rename") renameNode(node);
    if (action === "Delete") deleteNode(node);
}

/* =====================================================
   CREATE / RENAME / DELETE
   ===================================================== */

function addNotebook() {
    showDialog("New Notebook", "Notebook name", name => {
        const notebook = makeNotebook(name);

        state.notebooks.push(notebook);

        renderTree();
        openPage(notebook.children[0].children[0].id);
        saveNow();
    });
}

function addSection(notebookId) {
    const notebook = findNode(notebookId);

    if (!notebook || notebook.type !== "notebook") return;

    showDialog("New Section", "Section name", name => {
        const section = makeSection(name);

        notebook.children.push(section);
        notebook.expanded = true;

        renderTree();
        openPage(section.children[0].id);
        saveNow();
    });
}

function addPage(sectionId) {
    const section = findNode(sectionId);

    if (!section || section.type !== "section") return;

    showDialog("New Page", "Page name", name => {
        const page = makePage(name);

        section.children.push(page);
        section.expanded = true;

        renderTree();
        openPage(page.id);
        saveNow();
    });
}

function renameNode(node) {
    showDialog("Rename", "New name", name => {
        node.title = name;

        if (node.id === activePageId) {
            pageTitle.value = name;
        }

        renderTree();
        saveNow();
    });
}

function deleteNode(node) {
    if (!confirm(`"${node.title}" को हटाना चाहते हैं?`)) return;

    if (node.type === "notebook") {
        state.notebooks = state.notebooks.filter(
            item => item.id !== node.id
        );
    } else if (node.type === "section") {
        state.notebooks.forEach(notebook => {
            notebook.children = notebook.children.filter(
                item => item.id !== node.id
            );
        });
    } else {
        const section = parentSection(node.id);

        if (section) {
            section.children = section.children.filter(
                item => item.id !== node.id
            );
        }
    }

    if (!allPages().length) {
        state = defaultState();
    }

    if (!allPages().some(page => page.id === activePageId)) {
        activePageId = allPages()[0].id;
    }

    renderTree();
    openPage(activePageId);
    saveNow();
}

document.getElementById("newNotebookBtn").onclick = addNotebook;

document.getElementById("newSectionBtn").onclick = () => {
    const section = parentSection(activePageId);

    let notebook = state.notebooks.find(item =>
        item.children.some(s => s.id === section?.id)
    );

    if (!notebook) notebook = state.notebooks[0];

    if (notebook) addSection(notebook.id);
};

document.getElementById("newPageBtn").onclick = () => {
    const section = parentSection(activePageId);

    if (section) {
        addPage(section.id);
    } else if (state.notebooks[0]) {
        const newSection = makeSection("General");

        state.notebooks[0].children.push(newSection);

        addPage(newSection.id);
    }
};

function updateWorkspaceSize() {
    let right = workspaceScroll.clientWidth || 1200;
    let bottom = workspaceScroll.clientHeight || 800;

    workspace.querySelectorAll(
        ".object, .main-writing, .mindmap"
    ).forEach(el => {
        const x = parseFloat(el.style.left) || 0;
        const y = parseFloat(el.style.top) || 0;

        right = Math.max(right, x + el.offsetWidth + 100);
        bottom = Math.max(bottom, y + el.offsetHeight + 100);
    });

    workspace.style.width = right + "px";
    workspace.style.height = bottom + "px";
}

   ===================================================== */

function addTextPanel(x, y, focusNow = true) {
    const page = activePage();

    if (!page) return;

    const obj = {
        id: uid(),
        type: "text",
        title: "Text",
        x: Math.max(0, x),
        y: Math.max(0, y),
        w: 240,
        h: 35,
        html: "",
        userWidth: false,
        userHeight: false
    };

    page.objects.push(obj);

    const el = createObject(obj);

    workspace.appendChild(el);

    if (focusNow) {
        const body = el.querySelector(".text-body");

        if (body) {
            body.focus();

            const range = document.createRange();
            range.selectNodeContents(body);
            range.collapse(false);

            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }
    }

    scheduleSave();
    updateWorkspaceSize();

    return el;
}

document.getElementById("addTextBtn").onclick = () => {

    addTextPanel(
        workspaceScroll.scrollLeft + 80,

    );

/*
  Click on a blank area to start typing at that location.
  Clicking an existing object or the main writing area will not
  create another panel.
*/

let lastTapTime = 0;

workspace.addEventListener("click", e => {
    if (e.detail > 1) return;

    if (e.target.closest(".object, .main-writing, .mindmap")) return;

    /*
      On desktop, a click creates the panel.
      On mobile, the click event from a tap works too.

/* =====================================================
   OBJECT CREATION
   ===================================================== */

function createObject(obj) {
    const el = document.createElement("div");

    el.className = "object " + obj.type + "-object";
    el.dataset.objectId = obj.id;

    el.style.left = (obj.x || 0) + "px";
    el.style.top = (obj.y || 0) + "px";

    if (obj.w) el.style.width = obj.w + "px";

    if (obj.type === "text" && obj.h) {
        el.style.height = "auto";
        el.style.minHeight = "35px";
    }

    if (obj.type === "image" && obj.h) {
        el.style.height = obj.h + "px";
    }

    const header = document.createElement("div");
    header.className = "object-header";

    const title = document.createElement("span");
    title.className = "object-title";

    title.textContent = obj.type === "text"
        ? "Text"
        : obj.type === "image"
            ? obj.name || "Image"
            : obj.name || "PDF";

    const close = document.createElement("button");
    close.className = "object-close";
    close.type = "button";
    close.textContent = "×";
    close.title = "Delete panel";

    header.append(title, close);
    el.appendChild(header);

    const body = document.createElement("div");
    body.className = "object-body";

    el.appendChild(body);

    if (obj.type === "text") {
        const textBody = document.createElement("div");

        textBody.className = "text-body";
        textBody.contentEditable = "true";
        textBody.spellcheck = true;
        textBody.innerHTML = obj.html || "";

        body.appendChild(textBody);

        if (obj.userWidth) el.dataset.userWidth = "1";
        if (obj.userHeight) el.dataset.userHeight = "1";

        updateTextPanelBorder(el);

        textBody.addEventListener("input", () => {
            updateTextPanelBorder(el);
            autoGrowTextPanel(el);
            scheduleSave();
        });

        textBody.addEventListener("paste", () => {
            setTimeout(() => {
                updateTextPanelBorder(el);
                autoGrowTextPanel(el);
                scheduleSave();
            }, 100);
        });

        requestAnimationFrame(() => autoGrowTextPanel(el));

    } else if (obj.type === "image") {
        const img = document.createElement("img");

        img.alt = obj.name || "Image";
        body.appendChild(img);

        loadImage(obj, img);

    } else if (obj.type === "pdf") {
        const pages = document.createElement("div");
        pages.className = "pdf-pages";

        body.appendChild(pages);

        loadPdf(obj, el, pages);
    }

    close.onclick = async () => {
        if (!confirm("इस पैनल को हटाना चाहते हैं?")) return;

        const page = activePage();

        if (page) {
            page.objects = page.objects.filter(
                item => item.id !== obj.id
            );
        }

        el.remove();
        scheduleSave();
        updateWorkspaceSize();
    };

    makeDraggable(el, header);

    if (obj.type === "text" || obj.type === "image") {
        enableResize(el, obj);
    }

    if (obj.type === "pdf") {
        enablePdfResize(el, obj);
    }

    return el;
}

function updateTextPanelBorder(el) {
    const body = el.querySelector(".text-body");

    if (!body) return;

    const hasContent =
        body.textContent.trim().length > 0 ||
        !!body.querySelector("img, table, video");

    el.classList.toggle("has-content", hasContent);
}

function autoGrowTextPanel(el) {
    const body = el.querySelector(".text-body");

    if (!body) return;

    const hasContent =
        body.textContent.trim().length > 0 ||
        !!body.querySelector("img, table, video");

    /*
      A newly created panel begins small.
      Once text is entered, it grows to A4-like width.
      If manually resized, preserve the user's width.
    */

    if (hasContent && el.dataset.userWidth !== "1") {
        el.style.width = "794px";
    }

    if (el.dataset.userHeight !== "1") {
        body.style.height = "auto";

        const desiredHeight = Math.max(
            24,
            body.scrollHeight + 8
        );

        body.style.height = desiredHeight + "px";
        el.style.height = "auto";
    }

    updateWorkspaceSize();
}

/* =====================================================
   DRAG AND RESIZE
   ===================================================== */

function makeDraggable(el, handle) {
    let active = false;
    let startX = 0;
    let startY = 0;
    let originX = 0;
    let originY = 0;

    handle.addEventListener("pointerdown", e => {
        if (e.target.closest(".object-close")) return;

        const rect = el.getBoundingClientRect();

        /*
          Ignore pointer presses near the resize edge.
        */

        if (
            rect.right - e.clientX < 18 ||
            rect.bottom - e.clientY < 18
        ) {
            return;
        }

        active = true;

        startX = e.clientX;
        startY = e.clientY;

        originX = parseFloat(el.style.left) || 0;
        originY = parseFloat(el.style.top) || 0;

        try {
            handle.setPointerCapture(e.pointerId);
        } catch (_) {}

        e.preventDefault();
    });

    handle.addEventListener("pointermove", e => {
        if (!active) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        el.style.left = Math.max(0, originX + dx) + "px";
        el.style.top = Math.max(0, originY + dy) + "px";

        updateWorkspaceSize();
    });

    const stop = () => {
        if (!active) return;

        active = false;

        scheduleSave();
        updateWorkspaceSize();
    };

    handle.addEventListener("pointerup", stop);
    handle.addEventListener("pointercancel", stop);
}

function enableResize(el, obj) {
    let startW = el.offsetWidth;
    let startH = el.offsetHeight;

    let lastW = startW;
    let lastH = startH;

    const observer = new ResizeObserver(() => {
        const w = el.offsetWidth;
        const h = el.offsetHeight;

        if (el.dataset.resizing === "1") {
            if (w !== lastW) el.dataset.userWidth = "1";
            if (h !== lastH) el.dataset.userHeight = "1";
        }

        lastW = w;
        lastH = h;
    });

    observer.observe(el);

    el.addEventListener("pointerdown", e => {
        const rect = el.getBoundingClientRect();

        if (
            rect.right - e.clientX < 22 ||
            rect.bottom - e.clientY < 22
        ) {
            el.dataset.resizing = "1";
        }
    });

    window.addEventListener("pointerup", () => {
        if (el.dataset.resizing === "1") {
            delete el.dataset.resizing;
            scheduleSave();
        }
    });
}

async function loadImage(obj, img) {
    try {
        const record = await getAsset(obj.assetId);

        if (!record || !record.blob) {
            img.alt = "Image missing";
            return;
        }

        img.src = URL.createObjectURL(record.blob);

        img.onload = updateWorkspaceSize;

    } catch (error) {
        console.error(error);
    }
}

async function loadPdf(obj, el, container) {
    container.innerHTML =
        '<div class="pdf-message">PDF लोड हो रही है...</div>';

    try {
        if (!window.pdfjsLib) {
            throw new Error("PDF.js unavailable");
        }

        const record = await getAsset(obj.assetId);

        if (!record || !record.blob) {
            throw new Error("PDF file not found");
        }

        const buffer = await record.blob.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(buffer)
        }).promise;

        container.innerHTML = "";

        for (let i = 1; i <= pdf.numPages; i++) {
            const pdfPage = await pdf.getPage(i);

            const original = pdfPage.getViewport({ scale: 1 });

            const width = Math.max(250, el.clientWidth - 2);
            const scale = width / original.width;

            const viewport = pdfPage.getViewport({ scale });

            const canvas = document.createElement("canvas");
            canvas.className = "pdf-canvas";

            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = Math.floor(viewport.width * dpr);
            canvas.height = Math.floor(viewport.height * dpr);

            canvas.style.width = "100%";
            canvas.style.height = "auto";

            const pageBox = document.createElement("div");
            pageBox.className = "pdf-page";

            pageBox.appendChild(canvas);
            container.appendChild(pageBox);

            const ctx = canvas.getContext("2d", {
                alpha: false
            });

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            await pdfPage.render({
                canvasContext: ctx,
                viewport
            }).promise;

            const label = document.createElement("div");

            label.style.cssText =
                "position:absolute;right:6px;bottom:6px;" +
                "font-size:10px;color:#555;" +
                "background:#ffffffdd;padding:3px 5px;";

            label.textContent = `${i} / ${pdf.numPages}`;

            pageBox.appendChild(label);
        }

        /*
          Important: no fixed height and no internal vertical scrolling.
        */

        el.style.height = "auto";
        container.style.height = "auto";
        container.style.overflow = "visible";

        updateWorkspaceSize();
        scheduleSave();

    } catch (error) {
        console.error(error);

        container.innerHTML = "";

        const message = document.createElement("div");
        message.className = "pdf-message";
        message.textContent = "PDF लोड नहीं हो सकी: " + error.message;

        container.appendChild(message);
    }
}

function enablePdfResize(el, obj) {
    let lastWidth = el.offsetWidth;
    let timer = null;

    const observer = new ResizeObserver(() => {
        const width = el.clientWidth;

        if (!width || Math.abs(width - lastWidth) < 8) return;

        lastWidth = width;

        clearTimeout(timer);

        timer = setTimeout(() => {
            const pages = el.querySelector(".pdf-pages");

            if (pages) {
                loadPdf(obj, el, pages);
            }
        }, 450);
    });

    observer.observe(el);
}

/* =====================================================
   RENDER OBJECTS
   ===================================================== */

function renderObjects(page) {
    workspace.querySelectorAll(".object, .mindmap").forEach(
        element => element.remove()
    );

    page.objects = page.objects || [];

    page.objects.forEach(obj => {
        workspace.appendChild(createObject(obj));
    });

    renderMindMap(page);

    requestAnimationFrame(() => {
        autoGrowMainWriting();
        updateWorkspaceSize();
    });
}

/* =====================================================
   RICH TEXT FORMATTING
   ===================================================== */

/*
  Keep the selected editor active so the toolbar applies formatting
  to the current selection in the main page or a text panel.
*/

let lastEditor = mainWritingBody;

document.addEventListener("selectionchange", () => {
    const selection = window.getSelection();

    if (!selection || !selection.rangeCount) return;

    let node = selection.anchorNode;

    if (!node) return;

    if (node.nodeType === Node.TEXT_NODE) {
        node = node.parentElement;
    }

    if (!node || !node.closest) return;

    const editor = node.closest(
        "#mainWritingBody, .text-body"
    );

    if (editor) {
        lastEditor = editor;
    }
});

function focusLastEditor() {
    if (!lastEditor || !document.contains(lastEditor)) {
        lastEditor = mainWritingBody;
    }

    lastEditor.focus();
}

function exec(command, value = null) {
    focusLastEditor();

    try {
        document.execCommand(command, false, value);
    } catch (error) {
        console.warn(error);
    }

    updateMainBorder();
    scheduleSave();
}

document.querySelectorAll("[data-command]").forEach(button => {
    button.addEventListener("mousedown", e => {
        /*
          Prevent toolbar buttons from destroying the selection
          before the formatting command runs.
        */
        e.preventDefault();
    });

    button.addEventListener("click", () => {
        exec(button.dataset.command);
    });
});

document.getElementById("fontFamily").addEventListener("change", e => {
    exec("fontName", e.target.value);
});

document.getElementById("fontSize").addEventListener("change", e => {
    exec("fontSize", e.target.value);
});

document.getElementById("fontColor").addEventListener("input", e => {
    exec("foreColor", e.target.value);
});

document.getElementById("highlightColor").addEventListener("input", e => {
    /*
      hiliteColor works in most browsers; backColor is a fallback.
    */
    focusLastEditor();

    const ok = document.execCommand(
        "hiliteColor",
        false,
        e.target.value
    );

    if (!ok) {
        document.execCommand(
            "backColor",
            false,
            e.target.value
        );
    }

    scheduleSave();
});

document.getElementById("blockFormat").addEventListener("change", e => {
    exec("formatBlock", "<" + e.target.value + ">");
});

document.getElementById("undoBtn").onclick = () => exec("undo");
document.getElementById("redoBtn").onclick = () => exec("redo");

document.getElementById("clearFormatBtn").onclick = () => {
    exec("removeFormat");
};

document.getElementById("linkBtn").onclick = () => {
    const url = prompt("Link URL लिखें:");

    if (!url) return;

    exec("createLink", url);
};

document.getElementById("tableBtn").onclick = () => {
    const rows = Math.min(
        20,
        Math.max(1, Number(prompt("कितनी rows?", "3")) || 3)
    );

    const cols = Math.min(
        12,
        Math.max(1, Number(prompt("कितने columns?", "3")) || 3)
    );

    let html = "<table><tbody>";

    for (let r = 0; r < rows; r++) {
        html += "<tr>";

        for (let c = 0; c < cols; c++) {
            html += "<td>&nbsp;</td>";
        }

        html += "</tr>";
    }

    html += "</tbody></table><p><br></p>";

    focusLastEditor();

    document.execCommand("insertHTML", false, html);

    scheduleSave();
};

/* =====================================================
   MIND MAP
   ===================================================== */

function renderMindMap(page) {
    const existing = workspace.querySelector(".mindmap");

    if (existing) existing.remove();

    if (!page.mindmap || !page.mindmap.length) return;

    const box = document.createElement("div");
    box.className = "mindmap";
    box.style.left = "900px";
    box.style.top = "30px";

    const title = document.createElement("h3");
    title.textContent = "Mind Map";

    const input = document.createElement("input");
    input.placeholder = "New idea — press Enter";
    input.style.width = "100%";
    input.style.padding = "7px";

    const list = document.createElement("div");

    function refresh() {
        list.innerHTML = "";

        page.mindmap.forEach((text, index) => {
            const node = document.createElement("div");
            node.className = "mind-node";
            node.textContent = text;

            node.onclick = () => {
                if (!confirm("इस आइडिया को हटाएँ?")) return;

                page.mindmap.splice(index, 1);

                if (!page.mindmap.length) {
                    box.remove();
                } else {
                    refresh();
                }

                scheduleSave();
            };

            list.appendChild(node);
        });

        updateWorkspaceSize();
    }

    input.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;

        const value = input.value.trim();

        if (!value) return;

        page.mindmap.push(value);

        input.value = "";

        refresh();
        scheduleSave();
    });

    box.append(title, input, list);

    workspace.appendChild(box);

    refresh();
}

document.getElementById("addMindBtn").onclick = () => {
    const page = activePage();

    if (!page) return;

    if (!page.mindmap) page.mindmap = [];

    if (workspace.querySelector(".mindmap")) {
        workspace.querySelector(".mindmap").remove();
        scheduleSave();
        return;
    }

    if (!page.mindmap.length) {
        page.mindmap.push("Main Idea");
    }

    renderMindMap(page);
    scheduleSave();
};

/* =====================================================
   BACKUP / RESTORE
   ===================================================== */

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
            resolve(String(reader.result).split(",")[1]);
        };

        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(blob);
    });
}

function base64ToBlob(base64, type) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new Blob([bytes], {
        type: type || "application/octet-stream"
    });
}

async function backup() {
    saveNow();

    try {
        const data = {
            app: "OneNote Infinity Pro",
            version: 2,
            state,
            assets: []
        };

        const assetIds = new Set();

        for (const page of allPages()) {
            for (const obj of page.objects || []) {
                if (obj.assetId) assetIds.add(obj.assetId);
            }
        }

        for (const id of assetIds) {
            const record = await getAsset(id);

            if (!record || !record.blob) continue;

            data.assets.push({
                id: record.id,
                name: record.name,
                type: record.type,
                base64: await blobToBase64(record.blob)
            });
        }

        const blob = new Blob(
            [JSON.stringify(data)],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = "onenote-infinity-backup.json";

        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1500);

    } catch (error) {
        console.error(error);

        alert("Backup नहीं बन पाया।");
    }
}

document.getElementById("backupBtn").onclick = backup;

document.getElementById("restoreBtn").onclick = () => {
    document.getElementById("restoreInput").click();
};

document.getElementById("restoreInput").addEventListener("change", async e => {
    const file = e.target.files[0];

    e.target.value = "";

    if (!file) return;

    if (!confirm("Restore करने से वर्तमान डेटा बदल सकता है। जारी रखें?")) {
        return;
    }

    try {
        const backupData = JSON.parse(await file.text());

        if (
            !backupData.state ||
            !Array.isArray(backupData.state.notebooks)
        ) {
            throw new Error("Invalid backup");
        }

        for (const asset of backupData.assets || []) {
            await putAsset(
                asset.id,
                base64ToBlob(asset.base64, asset.type),
                asset.name,
                asset.type
            );
        }

        state = backupData.state;

        if (!allPages().length) state = defaultState();

        activePageId = allPages().some(
            page => page.id === state.lastPageId
        )
            ? state.lastPageId
            : allPages()[0].id;

        saveNow();
        renderTree();
        openPage(activePageId);

        alert("Restore सफल हुआ।");

    } catch (error) {
        console.error(error);

        alert("Restore नहीं हो पाया। सही backup JSON फ़ाइल चुनें।");
    }
});

/* =====================================================
   START
   ===================================================== */

async function startApp() {
    try {
        await openAssetDB();
    } catch (error) {
        console.warn("Asset storage unavailable:", error);
    }

    loadState();

    renderTree();
    openPage(activePageId);

    setStatus("Ready");
}

startApp();
