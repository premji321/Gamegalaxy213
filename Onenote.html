<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>OneNote Infinity Pro</title>

<style>
:root {
    --primary: #6750a4;
    --primary-dark: #4f378b;
    --bg: #f4f5f9;
    --panel: #ffffff;
    --text: #252535;
    --border: #dedee8;
    --selected: #dcd2ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

/* TOP HEADER */

.app-header {
    position: sticky;
    top: 0;
    z-index: 1000;
    min-height: 58px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    box-shadow: 0 2px 8px #0002;
}

.app-title {
    font-size: 18px;
    font-weight: bold;
    flex: 1;
}

.header-btn {
    background: #ffffff20;
    color: white;
    border: 1px solid #ffffff40;
    border-radius: 7px;
    padding: 8px 10px;
}

.header-btn:hover {
    background: #ffffff35;
}

#saveStatus {
    font-size: 12px;
    white-space: nowrap;
}

/* APPLICATION LAYOUT */

.app-layout {
    display: flex;
    min-height: calc(100vh - 58px);
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
}

.sidebar-heading {
    font-weight: bold;
    margin: 8px 0 12px;
}

.sidebar button {
    border: none;
    background: transparent;
    border-radius: 7px;
    padding: 9px;
    text-align: left;
    width: 100%;
    color: var(--text);
}

.sidebar button:hover {
    background: #f0ecfa;
}

.sidebar .tree-item.active {
    background: var(--selected);
    font-weight: bold;
}

.tree-item {
    margin: 3px 0;
    overflow-wrap: anywhere;
}

.tree-page {
    padding-left: 26px !important;
}

.sidebar-actions {
    display: flex;
    gap: 6px;
    margin: 8px 0;
}

.sidebar-actions button {
    text-align: center;
    border: 1px solid var(--border);
}

/* MAIN CONTENT */

.main-content {
    flex: 1;
    min-width: 0;
    padding: 16px;
}

.page-heading {
    margin: 0 0 12px;
}

.page-title-input {
    width: 100%;
    max-width: 900px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    background: transparent;
    padding: 8px 2px;
    color: var(--text);
}

.page-title-input:focus {
    outline: none;
    border-bottom: 2px solid var(--primary);
}

/* TOOLBAR */

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px;
    margin-bottom: 12px;
}

.toolbar button,
.toolbar select,
.toolbar input[type="color"] {
    min-height: 36px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 6px;
    padding: 6px 9px;
}

.toolbar button:hover {
    background: #f0ecfa;
}

.toolbar .active-tool {
    background: var(--selected);
    border-color: var(--primary);
}

.toolbar .separator {
    width: 1px;
    background: var(--border);
    margin: 2px 3px;
}

/* WRITING AREA */

.writing-area {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 65vh;
    padding: 24px;
    overflow: auto;
    box-shadow: 0 2px 8px #00000008;
}

.writing-body {
    min-height: 60vh;
    outline: none;
    font-size: 17px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.writing-body:empty::before {
    content: "यहाँ लिखना शुरू करें...";
    color: #999;
    pointer-events: none;
}

.writing-body h1,
.writing-body h2,
.writing-body h3 {
    line-height: 1.4;
}

/* INLINE IMAGE */

.writing-body img.inline-movable {
    display: inline-block;
    max-width: 100%;
    height: auto;
    cursor: grab;
    vertical-align: middle;

    /*
       Touch-action none lets the user drag an image
       without the browser stealing the gesture.
    */
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;

    /*
       left/top and transform are controlled by JavaScript.
    */
    position: relative;
    box-sizing: border-box;
}

.writing-body img.inline-movable.image-selected {
    outline: 2px solid #6750a4;
    outline-offset: 2px;
}

/* IMAGE SELECTION PANEL */

.image-edit-panel {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: #f0ecfa;
    border: 1px solid #c9b8ff;
    border-radius: 8px;
}

.image-edit-panel.visible {
    display: flex;
}

.image-edit-panel button,
.image-edit-panel input {
    min-height: 35px;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: white;
}

.image-edit-panel label {
    font-size: 13px;
}

/*
   A selection frame is displayed around the active image.
   Resize handles are real DOM elements, so they also work
   on touch screens.
*/

.image-selection-frame {
    display: none;
    position: absolute;
    z-index: 500;
    border: 2px solid #6750a4;
    pointer-events: none;
    box-sizing: border-box;
}

.image-selection-frame.visible {
    display: block;
}

.resize-handle {
    position: absolute;
    width: 15px;
    height: 15px;
    border: 2px solid white;
    background: #6750a4;
    border-radius: 50%;
    pointer-events: auto;
    touch-action: none;
    z-index: 510;
}

.resize-handle.nw {
    top: -8px;
    left: -8px;
    cursor: nwse-resize;
}

.resize-handle.ne {
    top: -8px;
    right: -8px;
    cursor: nesw-resize;
}

.resize-handle.sw {
    bottom: -8px;
    left: -8px;
    cursor: nesw-resize;
}

.resize-handle.se {
    bottom: -8px;
    right: -8px;
    cursor: nwse-resize;
}

/* PDF */

.pdf-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin: 12px 0;
    background: #fff;
}

.pdf-card iframe {
    width: 100%;
    height: 600px;
    border: 1px solid var(--border);
    border-radius: 5px;
}

.pdf-card a {
    color: var(--primary-dark);
    overflow-wrap: anywhere;
}

/* FOOTER */

.app-footer {
    font-size: 12px;
    color: #777;
    margin-top: 12px;
}

/* MOBILE */

@media (max-width: 760px) {
    .app-header {
        flex-wrap: wrap;
    }

    .app-title {
        min-width: 150px;
    }

    #saveStatus {
        display: none;
    }

    .app-layout {
        display: block;
    }

    .sidebar {
        width: 100%;
        min-width: 0;
        max-height: 220px;
        border-right: none;
        border-bottom: 1px solid var(--border);
    }

    .main-content {
        padding: 10px;
    }

    .writing-area {
        padding: 14px;
        min-height: 55vh;
    }

    .writing-body {
        font-size: 16px;
    }

    .page-title-input {
        font-size: 21px;
    }

    .toolbar {
        gap: 5px;
    }

    .toolbar button,
    .toolbar select {
        padding: 7px;
        font-size: 13px;
    }

    .pdf-card iframe {
        height: 450px;
    }

    .resize-handle {
        width: 19px;
        height: 19px;
    }
}
</style>
</head>

<body>

<header class="app-header">
    <div class="app-title">📒 OneNote Infinity Pro</div>

    <button class="header-btn" id="newPageBtn">
        ＋ New Page
    </button>

    <button class="header-btn" id="exportBtn">
        Export
    </button>

    <button class="header-btn" id="importBtn">
        Import
    </button>

    <button class="header-btn" id="clearBtn">
        Clear
    </button>

    <span id="saveStatus">Saved</span>
</header>

<div class="app-layout">

    <aside class="sidebar">

        <div class="sidebar-heading">📚 My Notebook</div>

        <div class="sidebar-actions">
            <button id="addSectionBtn">＋ Section</button>
            <button id="renameSectionBtn">Rename</button>
        </div>

        <div id="pageTree"></div>

        <div class="app-footer">
            आपकी नोटबुक इस ब्राउज़र में सेव होती है।
        </div>

    </aside>

    <main class="main-content">

        <div class="page-heading">
            <input
                type="text"
                id="pageTitle"
                class="page-title-input"
                placeholder="Page Title">
        </div>

        <div class="toolbar">

            <button data-command="bold" title="Bold">
                <b>B</b>
            </button>

            <button data-command="italic" title="Italic">
                <i>I</i>
            </button>

            <button data-command="underline" title="Underline">
                <u>U</u>
            </button>

            <span class="separator"></span>

            <select id="fontName" title="Font">
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Verdana">Verdana</option>
                <option value="'Times New Roman'">Times New Roman</option>
                <option value="'Noto Sans Devanagari'">
                    Noto Sans Devanagari
                </option>
            </select>

            <select id="fontSize" title="Font Size">
                <option value="3">Normal</option>
                <option value="1">Small</option>
                <option value="2">Medium</option>
                <option value="4">Large</option>
                <option value="5">Extra Large</option>
                <option value="6">Huge</option>
                <option value="7">Very Huge</option>
            </select>

            <label title="Text Color">
                Text
                <input type="color" id="textColor" value="#252535">
            </label>

            <label title="Highlight Color">
                Highlight
                <input type="color" id="highlightColor" value="#fff176">
            </label>

            <span class="separator"></span>

            <button data-command="insertUnorderedList">
                • List
            </button>

            <button data-command="insertOrderedList">
                1. List
            </button>

            <button data-command="justifyLeft">
                ⇤
            </button>

            <button data-command="justifyCenter">
                ↔
            </button>

            <button data-command="justifyRight">
                ⇥
            </button>

            <span class="separator"></span>

            <button id="insertImageBtn">
                🖼️ Insert Image
            </button>

            <button id="insertPdfBtn">
                📄 Insert PDF
            </button>

            <button id="removeImageBtn">
                🗑️ Remove Selected Image
            </button>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden>

            <input
                type="file"
                id="pdfInput"
                accept="application/pdf,.pdf"
                hidden>

        </div>

        <!-- IMAGE EDITING PANEL -->

        <div id="imageEditPanel" class="image-edit-panel">

            <strong>Selected Image</strong>

            <button id="moveModeBtn">
                ↔ Move Image
            </button>

            <label>
                Width:
                <input
                    type="number"
                    id="imageWidth"
                    min="20"
                    max="3000"
                    step="10"
                    style="width:85px">
                px
            </label>

            <button id="applyImageWidthBtn">
                Apply Width
            </button>

            <button id="resetImageBtn">
                Reset Position
            </button>

            <button id="deselectImageBtn">
                Deselect
            </button>

        </div>

        <!-- RESIZE FRAME -->

        <div id="imageSelectionFrame" class="image-selection-frame">

            <div class="resize-handle nw" data-corner="nw"></div>
            <div class="resize-handle ne" data-corner="ne"></div>
            <div class="resize-handle sw" data-corner="sw"></div>
            <div class="resize-handle se" data-corner="se"></div>

        </div>

        <section class="writing-area" id="writingArea">

            <div
                id="writingBody"
                class="writing-body"
                contenteditable="true"
                spellcheck="true"
                aria-label="Writing Area">

            </div>

        </section>

        <div class="app-footer">
            Tip: फोटो को चुनने के बाद उसे खिसकाएँ।
            कोनों पर बने बैंगनी हैंडल पकड़कर उसका आकार बदलें।
        </div>

    </main>

</div>

<script>
"use strict";

/* ==========================================================
   ONE NOTE INFINITY PRO
   Local notebook storage + inline image move/resize
   ========================================================== */

const STORAGE_KEY = "onenote_infinity_pro_v3";

const pageTree = document.getElementById("pageTree");
const pageTitle = document.getElementById("pageTitle");
const writingArea = document.getElementById("writingArea");
const writingBody = document.getElementById("writingBody");
const saveStatus = document.getElementById("saveStatus");

const imageInput = document.getElementById("imageInput");
const pdfInput = document.getElementById("pdfInput");

const imageEditPanel = document.getElementById("imageEditPanel");
const imageSelectionFrame = document.getElementById("imageSelectionFrame");
const imageWidthInput = document.getElementById("imageWidth");

let activeImage = null;
let activePageId = null;
let activeSectionId = null;
let saveTimer = null;

let moveState = null;
let resizeState = null;
let selectionTimer = null;
let pendingImage = null;

let movingEnabled = true;

/* ==========================================================
   INITIAL DATA
   ========================================================== */

function makeId() {
    return "id_" + Date.now().toString(36) +
        "_" + Math.random().toString(36).slice(2, 9);
}

function createPage(title = "New Page") {
    return {
        id: makeId(),
        title,
        html: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
    };
}

function createSection(title = "New Section") {
    const page = createPage("Welcome Page");

    return {
        id: makeId(),
        title,
        pages: [page]
    };
}

function initialData() {
    const section = createSection("General");

    section.pages[0].title = "Welcome to OneNote";

    section.pages[0].html = `
        <h2>Welcome to OneNote Infinity Pro</h2>
        <p>यहाँ अपने नोट्स लिखें।</p>
        <p>आप फोटो डाल सकते हैं, उन्हें खिसका सकते हैं और उनका आकार बदल सकते हैं।</p>
        <p>फोटो चुनें और उसके कोनों पर बने हैंडल खींचकर छोटा-बड़ा करें।</p>
    `;

    return {
        sections: [section],
        activeSectionId: section.id,
        activePageId: section.pages[0].id
    };
}

function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            const parsed = JSON.parse(saved);

            if (
                parsed &&
                Array.isArray(parsed.sections) &&
                parsed.sections.length
            ) {
                parsed.sections.forEach(section => {
                    if (!Array.isArray(section.pages)) {
                        section.pages = [];
                    }

                    if (section.pages.length === 0) {
                        section.pages.push(createPage());
                    }
                });

                return parsed;
            }
        }
    } catch (error) {
        console.error("Unable to load notebook:", error);
    }

    return initialData();
}

let appData = loadData();

function getActiveSection() {
    return appData.sections.find(
        section => section.id === appData.activeSectionId
    ) || appData.sections[0];
}

function getActivePage() {
    const section = getActiveSection();

    if (!section) {
        return null;
    }

    return section.pages.find(
        page => page.id === appData.activePageId
    ) || section.pages[0];
}

/* ==========================================================
   SAVE AND RESTORE
   ========================================================== */

function setSaveStatus(text) {
    saveStatus.textContent = text;
}

function scheduleSave() {
    setSaveStatus("Saving...");

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveCurrentPage();

        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(appData)
            );

            setSaveStatus("Saved ✓");
        } catch (error) {
            console.error(error);
            setSaveStatus("Storage full");
        }
    }, 400);
}

function saveCurrentPage() {
    const page = getActivePage();

    if (!page) return;

    page.title = pageTitle.value.trim() || "Untitled Page";
    page.html = writingBody.innerHTML;
    page.updatedAt = new Date().toISOString();
}

function saveImmediately() {
    saveCurrentPage();

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(appData)
        );

        setSaveStatus("Saved ✓");
    } catch (error) {
        console.error(error);
        setSaveStatus("Storage full");
    }
}

/* ==========================================================
   NOTEBOOK TREE
   ========================================================== */

function renderTree() {
    pageTree.innerHTML = "";

    appData.sections.forEach(section => {
        const sectionButton = document.createElement("button");

        sectionButton.className =
            "tree-item" +
            (section.id === appData.activeSectionId ? " active" : "");

        sectionButton.textContent = "📁 " + section.title;

        sectionButton.addEventListener("click", () => {
            saveImmediately();

            appData.activeSectionId = section.id;

            if (section.pages.length) {
                appData.activePageId = section.pages[0].id;
            }

            renderTree();
            loadActivePage();
            scheduleSave();
        });

        pageTree.appendChild(sectionButton);

        section.pages.forEach(page => {
            const pageButton = document.createElement("button");

            pageButton.className =
                "tree-item tree-page" +
                (page.id === appData.activePageId ? " active" : "");

            pageButton.textContent = "📄 " + page.title;

            pageButton.addEventListener("click", () => {
                saveImmediately();

                appData.activeSectionId = section.id;
                appData.activePageId = page.id;

                renderTree();
                loadActivePage();
                scheduleSave();
            });

            pageTree.appendChild(pageButton);
        });
    });
}

function loadActivePage() {
    const page = getActivePage();

    if (!page) return;

    deselectImage();

    pageTitle.value = page.title || "Untitled Page";
    writingBody.innerHTML = page.html || "";

    /*
       Reconnect image behavior after HTML is restored.
    */
    prepareAllImages();

    /*
       Existing image transforms are retained in the saved HTML.
    */
}

/* ==========================================================
   PAGE AND SECTION CONTROLS
   ========================================================== */

document.getElementById("newPageBtn").addEventListener("click", () => {
    saveImmediately();

    const section = getActiveSection();

    if (!section) return;

    const page = createPage("New Page");

    section.pages.push(page);

    appData.activePageId = page.id;

    renderTree();
    loadActivePage();
    pageTitle.focus();

    scheduleSave();
});

document.getElementById("addSectionBtn").addEventListener("click", () => {
    saveImmediately();

    const name = prompt("Section का नाम लिखें:");

    if (!name || !name.trim()) return;

    const section = createSection(name.trim());

    appData.sections.push(section);

    appData.activeSectionId = section.id;
    appData.activePageId = section.pages[0].id;

    renderTree();
    loadActivePage();
    scheduleSave();
});

document.getElementById("renameSectionBtn").addEventListener("click", () => {
    const section = getActiveSection();

    if (!section) return;

    const name = prompt("नया Section नाम:", section.title);

    if (!name || !name.trim()) return;

    section.title = name.trim();

    renderTree();
    scheduleSave();
});

pageTitle.addEventListener("input", () => {
    const page = getActivePage();

    if (page) {
        page.title = pageTitle.value || "Untitled Page";
    }

    renderTree();
    scheduleSave();
});

/* ==========================================================
   TEXT FORMATTING
   ========================================================== */

document.querySelectorAll("[data-command]").forEach(button => {
    button.addEventListener("mousedown", event => {
        /*
           Keep the editor selection when toolbar buttons are clicked.
        */
        event.preventDefault();
    });

    button.addEventListener("click", () => {
        const command = button.dataset.command;

        writingBody.focus();

        document.execCommand(command, false, null);

        scheduleSave();
    });
});

document.getElementById("fontName").addEventListener("change", event => {
    writingBody.focus();

    document.execCommand(
        "fontName",
        false,
        event.target.value
    );

    scheduleSave();
});

document.getElementById("fontSize").addEventListener("change", event => {
    writingBody.focus();

    document.execCommand(
        "fontSize",
        false,
        event.target.value
    );

    scheduleSave();
});

document.getElementById("textColor").addEventListener("input", event => {
    writingBody.focus();

    document.execCommand(
        "foreColor",
        false,
        event.target.value
    );

    scheduleSave();
});

document.getElementById("highlightColor").addEventListener("input", event => {
    writingBody.focus();

    document.execCommand(
        "hiliteColor",
        false,
        event.target.value
    );

    scheduleSave();
});

writingBody.addEventListener("input", scheduleSave);

/* ==========================================================
   INSERT IMAGE
   ========================================================== */

document.getElementById("insertImageBtn").addEventListener("click", () => {
    imageInput.click();
});

imageInput.addEventListener("change", async event => {
    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("कृपया सही image file चुनें।");
        imageInput.value = "";
        return;
    }

    try {
        const dataUrl = await readFileAsDataURL(file);

        writingBody.focus();

        const img = document.createElement("img");

        img.src = dataUrl;
        img.alt = file.name;
        img.className = "inline-movable";

        img.style.width = "300px";
        img.style.maxWidth = "100%";
        img.style.height = "auto";
        img.style.transform = "translate(0px, 0px)";

        img.dataset.dx = "0";
        img.dataset.dy = "0";
        img.dataset.originalWidth = "300";

        img.draggable = false;

        const selection = window.getSelection();

        if (
            selection &&
            selection.rangeCount &&
            writingBody.contains(selection.anchorNode)
        ) {
            const range = selection.getRangeAt(0);

            range.deleteContents();
            range.insertNode(img);

            const after = document.createRange();

            after.setStartAfter(img);
            after.collapse(true);

            selection.removeAllRanges();
            selection.addRange(after);
        } else {
            writingBody.appendChild(document.createElement("br"));
            writingBody.appendChild(img);
            writingBody.appendChild(document.createElement("br"));
        }

        prepareImage(img);

        selectImage(img);

        scheduleSave();

    } catch (error) {
        console.error(error);
        alert("फोटो insert नहीं हो सका।");
    }

    imageInput.value = "";
});

function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}

/* ==========================================================
   IMAGE PREPARATION
   ========================================================== */

function prepareAllImages() {
    writingBody.querySelectorAll("img").forEach(img => {
        /*
           Images inserted in earlier versions also become movable.
        */
        img.classList.add("inline-movable");
        img.draggable = false;

        if (img.dataset.dx === undefined) {
            img.dataset.dx = "0";
        }

        if (img.dataset.dy === undefined) {
            img.dataset.dy = "0";
        }

        if (!img.style.transform) {
            applyImageTranslation(img);
        }

        prepareImage(img);
    });
}

function prepareImage(img) {
    if (img.dataset.moveResizeReady === "yes") return;

    img.dataset.moveResizeReady = "yes";

    img.classList.add("inline-movable");

    img.addEventListener("contextmenu", event => {
        event.preventDefault();
    });

    img.addEventListener("dragstart", event => {
        event.preventDefault();
    });

    /*
       Mouse: select and drag.
       Touch: long press to activate movement.
    */
    img.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) {
            return;
        }

        if (event.target !== img) return;

        if (event.pointerType === "touch") {
            clearTimeout(selectionTimer);

            pendingImage = {
                img,
                x: event.clientX,
                y: event.clientY,
                pointerId: event.pointerId
            };

            selectionTimer = setTimeout(() => {
                if (!pendingImage || pendingImage.img !== img) {
                    return;
                }

                selectImage(img);
                beginImageMove(event, img, true);
            }, 300);

            return;
        }

        selectImage(img);

        beginImageMove(event, img, false);
    });

    /*
       Touch scrolling should cancel a pending long press.
    */
    img.addEventListener("pointermove", event => {
        if (!pendingImage || pendingImage.img !== img) return;

        const dx = event.clientX - pendingImage.x;
        const dy = event.clientY - pendingImage.y;

        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            /*
               Small movement is allowed while long press is pending.
               Once the finger moves substantially, cancel the timer.
            */
            clearTimeout(selectionTimer);
            pendingImage = null;
        }
    });

    img.addEventListener("pointerup", () => {
        clearTimeout(selectionTimer);
        pendingImage = null;
    });

    img.addEventListener("pointercancel", () => {
        clearTimeout(selectionTimer);
        pendingImage = null;
    });

    img.addEventListener("load", () => {
        if (activeImage === img) {
            updateSelectionFrame();
        }
    });
}

/* ==========================================================
   IMAGE SELECT / DESELECT
   ========================================================== */

function selectImage(img) {
    if (!img || !writingBody.contains(img)) return;

    if (activeImage && activeImage !== img) {
        activeImage.classList.remove("image-selected");
    }

    activeImage = img;

    activeImage.classList.add("image-selected");

    imageEditPanel.classList.add("visible");

    imageWidthInput.value = Math.round(
        activeImage.getBoundingClientRect().width
    );

    updateSelectionFrame();
}

function deselectImage() {
    if (activeImage) {
        activeImage.classList.remove("image-selected");
    }

    activeImage = null;

    imageEditPanel.classList.remove("visible");
    imageSelectionFrame.classList.remove("visible");
}

function updateSelectionFrame() {
    if (!activeImage || !writingBody.contains(activeImage)) {
        imageSelectionFrame.classList.remove("visible");
        return;
    }

    const imageRect = activeImage.getBoundingClientRect();

    /*
       The frame is fixed-positioned so it can accurately follow
       an image inside a scrollable writing area.
    */
    imageSelectionFrame.style.position = "fixed";

    imageSelectionFrame.style.left = imageRect.left + "px";
    imageSelectionFrame.style.top = imageRect.top + "px";
    imageSelectionFrame.style.width = imageRect.width + "px";
    imageSelectionFrame.style.height = imageRect.height + "px";

    imageSelectionFrame.classList.add("visible");
}

/* ==========================================================
   MOVE IMAGE
   ========================================================== */

function beginImageMove(event, img, fromTouchLongPress) {
    if (!img || !writingBody.contains(img)) return;

    if (!movingEnabled) return;

    event.preventDefault();

    selectImage(img);

    const dx = Number(img.dataset.dx || 0);
    const dy = Number(img.dataset.dy || 0);

    moveState = {
        img,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        originalX: dx,
        originalY: dy,
        fromTouchLongPress
    };

    /*
       Pointer capture makes dragging more reliable when the
       pointer moves outside the image itself.
    */
    try {
        img.setPointerCapture(event.pointerId);
    } catch (_) {}

    img.style.cursor = "grabbing";
}

document.addEventListener("pointermove", event => {
    if (!moveState) return;

    if (event.pointerId !== moveState.pointerId) return;

    event.preventDefault();

    const dx = event.clientX - moveState.startX;
    const dy = event.clientY - moveState.startY;

    const img = moveState.img;

    img.dataset.dx = String(moveState.originalX + dx);
    img.dataset.dy = String(moveState.originalY + dy);

    applyImageTranslation(img);

    updateSelectionFrame();
}, { passive: false });

document.addEventListener("pointerup", event => {
    if (!moveState) return;

    if (event.pointerId !== moveState.pointerId) return;

    moveState.img.style.cursor = "grab";

    moveState = null;

    scheduleSave();
});

document.addEventListener("pointercancel", event => {
    if (!moveState) return;

    if (event.pointerId !== moveState.pointerId) return;

    moveState.img.style.cursor = "grab";

    moveState = null;
});

function applyImageTranslation(img) {
    const dx = Number(img.dataset.dx || 0);
    const dy = Number(img.dataset.dy || 0);

    img.style.transform =
        "translate(" + dx + "px, " + dy + "px)";
}

/* ==========================================================
   RESIZE IMAGE USING CORNER HANDLES
   ========================================================== */

document.querySelectorAll(".resize-handle").forEach(handle => {
    handle.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();

        if (!activeImage) return;

        const rect = activeImage.getBoundingClientRect();

        resizeState = {
            pointerId: event.pointerId,
            corner: handle.dataset.corner,
            img: activeImage,
            startX: event.clientX,
            startY: event.clientY,
            startWidth: rect.width,
            startHeight: rect.height,
            startLeft: rect.left,
            startTop: rect.top,
            aspect: rect.width / Math.max(rect.height, 1),
            originalCssWidth: activeImage.style.width,
            originalCssHeight: activeImage.style.height
        };

        try {
            handle.setPointerCapture(event.pointerId);
        } catch (_) {}
    });
});

document.addEventListener("pointermove", event => {
    if (!resizeState) return;

    if (event.pointerId !== resizeState.pointerId) return;

    event.preventDefault();

    const state = resizeState;
    const img = state.img;

    let deltaX = event.clientX - state.startX;
    let deltaY = event.clientY - state.startY;

    /*
       Each corner adjusts the dimensions from its own direction.
       Width and height are changed together to preserve aspect ratio.
    */
    let delta;

    if (state.corner === "se") {
        delta = Math.abs(deltaX) >= Math.abs(deltaY)
            ? deltaX
            : deltaY * state.aspect;
    } else if (state.corner === "nw") {
        delta = Math.abs(deltaX) >= Math.abs(deltaY)
            ? -deltaX
            : -deltaY * state.aspect;
    } else if (state.corner === "ne") {
        delta = Math.abs(deltaX) >= Math.abs(deltaY)
            ? deltaX
            : -deltaY * state.aspect;
    } else {
        delta = Math.abs(deltaX) >= Math.abs(deltaY)
            ? -deltaX
            : deltaY * state.aspect;
    }

    const newWidth = Math.max(
        40,
        Math.min(2000, state.startWidth + delta)
    );

    img.style.width = newWidth + "px";
    img.style.height = "auto";
    img.style.maxWidth = "none";

    /*
       Keep the image inside the available writing area
       when it is larger than the content width.
    */
    const areaWidth = writingBody.clientWidth;

    if (newWidth > areaWidth) {
        img.style.maxWidth = "100%";
        img.style.width = newWidth + "px";
    }

    updateSelectionFrame();
}, { passive: false });

document.addEventListener("pointerup", event => {
    if (!resizeState) return;

    if (event.pointerId !== resizeState.pointerId) return;

    resizeState = null;

    if (activeImage) {
        imageWidthInput.value = Math.round(
            activeImage.getBoundingClientRect().width
        );
    }

    scheduleSave();
});

document.addEventListener("pointercancel", event => {
    if (!resizeState) return;

    if (event.pointerId !== resizeState.pointerId) return;

    resizeState = null;
});

/* ==========================================================
   IMAGE TOOLBAR CONTROLS
   ========================================================== */

document.getElementById("removeImageBtn").addEventListener("click", () => {
    if (!activeImage) {
        alert("पहले किसी फोटो को select करें।");
        return;
    }

    if (!confirm("क्या आप यह फोटो हटाना चाहते हैं?")) return;

    activeImage.remove();

    deselectImage();

    scheduleSave();
});

document.getElementById("deselectImageBtn").addEventListener("click", () => {
    deselectImage();
});

document.getElementById("moveModeBtn").addEventListener("click", () => {
    movingEnabled = !movingEnabled;

    const button = document.getElementById("moveModeBtn");

    button.classList.toggle("active-tool", movingEnabled);

    button.textContent = movingEnabled
        ? "↔ Move Image: ON"
        : "↔ Move Image: OFF";
});

document.getElementById("applyImageWidthBtn").addEventListener("click", () => {
    if (!activeImage) {
        alert("पहले फोटो select करें।");
        return;
    }

    const width = Number(imageWidthInput.value);

    if (!Number.isFinite(width) || width < 20) {
        alert("कृपया 20 या उससे अधिक की width डालें।");
        return;
    }

    activeImage.style.width = Math.min(width, 3000) + "px";
    activeImage.style.height = "auto";
    activeImage.style.maxWidth = "100%";

    updateSelectionFrame();

    scheduleSave();
});

document.getElementById("resetImageBtn").addEventListener("click", () => {
    if (!activeImage) {
        alert("पहले फोटो select करें।");
        return;
    }

    activeImage.dataset.dx = "0";
    activeImage.dataset.dy = "0";

    applyImageTranslation(activeImage);

    updateSelectionFrame();

    scheduleSave();
});

/*
   If the user scrolls the page, the selection frame follows the image.
*/
writingArea.addEventListener("scroll", updateSelectionFrame);
window.addEventListener("resize", updateSelectionFrame);

window.addEventListener("scroll", updateSelectionFrame, true);

/*
   Clicking elsewhere in the writing area deselects the active image.
   Clicking on an image or resize handle keeps it selected.
*/
document.addEventListener("pointerdown", event => {
    const clickedImage = event.target.closest &&
        event.target.closest("img.inline-movable");

    const clickedPanel = event.target.closest &&
        event.target.closest("#imageEditPanel");

    const clickedFrame = event.target.closest &&
        event.target.closest("#imageSelectionFrame");

    if (clickedImage || clickedPanel || clickedFrame) {
        return;
    }

    deselectImage();
});

/* ==========================================================
   INSERT PDF
   ========================================================== */

document.getElementById("insertPdfBtn").addEventListener("click", () => {
    pdfInput.click();
});

pdfInput.addEventListener("change", async event => {
    const file = event.target.files[0];

    if (!file) return;

    if (
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ) {
        alert("कृपया PDF फाइल चुनें।");
        pdfInput.value = "";
        return;
    }

    try {
        const dataUrl = await readFileAsDataURL(file);

        const card = document.createElement("div");
        card.className = "pdf-card";

        const title = document.createElement("strong");
        title.textContent = "📄 " + file.name;

        const info = document.createElement("p");
        info.textContent =
            "PDF preview. यदि PDF में selectable text है, " +
            "तो browser PDF viewer में उसे select करने का प्रयास करें।";

        const openLink = document.createElement("a");
        openLink.href = dataUrl;
        openLink.target = "_blank";
        openLink.rel = "noopener";
        openLink.textContent = "PDF को नए टैब में खोलें";

        const frame = document.createElement("iframe");
        frame.src = dataUrl;
        frame.title = file.name;

        card.appendChild(title);
        card.appendChild(info);
        card.appendChild(openLink);
        card.appendChild(frame);

        writingBody.appendChild(document.createElement("br"));
        writingBody.appendChild(card);
        writingBody.appendChild(document.createElement("br"));

        scheduleSave();

    } catch (error) {
        console.error(error);
        alert("PDF insert नहीं हो सकी।");
    }

    pdfInput.value = "";
});

/* ==========================================================
   EXPORT NOTEBOOK
   ========================================================== */

document.getElementById("exportBtn").addEventListener("click", () => {
    saveImmediately();

    const blob = new Blob(
        [JSON.stringify(appData, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "onenote-infinity-backup.json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
});

/* ==========================================================
   IMPORT NOTEBOOK BACKUP
   ========================================================== */

document.getElementById("importBtn").addEventListener("click", () => {
    const input = document.createElement("input");

    input.type = "file";
    input.accept = ".json,application/json";

    input.addEventListener("change", async () => {
        const file = input.files[0];

        if (!file) return;

        try {
            const text = await file.text();
            const imported = JSON.parse(text);

            if (
                !imported ||
                !Array.isArray(imported.sections) ||
                imported.sections.length === 0
            ) {
                throw new Error("Invalid notebook backup");
            }

            const confirmed = confirm(
                "Import करने से वर्तमान नोटबुक बदल जाएगी। " +
                "क्या आप जारी रखना चाहते हैं?"
            );

            if (!confirmed) return;

            imported.sections.forEach(section => {
                if (!Array.isArray(section.pages)) {
                    section.pages = [];
                }

                if (section.pages.length === 0) {
                    section.pages.push(createPage());
                }
            });

            appData = imported;

            if (!getActiveSection()) {
                appData.activeSectionId = appData.sections[0].id;
            }

            const section = getActiveSection();

            if (
                !section.pages.some(
                    page => page.id === appData.activePageId
                )
            ) {
                appData.activePageId = section.pages[0].id;
            }

            renderTree();
            loadActivePage();
            saveImmediately();

            alert("Backup सफलतापूर्वक import हो गया।");

        } catch (error) {
            console.error(error);
            alert("Backup फाइल सही नहीं है या पढ़ी नहीं जा सकी।");
        }
    });

    input.click();
});

/* ==========================================================
   CLEAR CURRENT PAGE
   ========================================================== */

document.getElementById("clearBtn").addEventListener("click", () => {
    if (!confirm("क्या आप इस पेज के सभी नोट्स हटाना चाहते हैं?")) {
        return;
    }

    writingBody.innerHTML = "";

    pageTitle.value = "New Page";

    deselectImage();

    scheduleSave();
});

/* ==========================================================
   SAFETY: SAVE WHEN LEAVING
   ========================================================== */

window.addEventListener("beforeunload", () => {
    saveImmediately();
});

/* ==========================================================
   START APPLICATION
   ========================================================== */

renderTree();
loadActivePage();
prepareAllImages();

setSaveStatus("Ready");

/*
   Reposition selection frame after images load and after layout changes.
*/
writingBody.addEventListener("load", updateSelectionFrame, true);

</script>
