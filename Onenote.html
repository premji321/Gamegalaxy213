<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>OneNote Infinity Pro</title>

<style>
:root{
  --accent:#7654c9;
  --border:#dedede;
  --hover:#f1edfb;
  --text:#252525;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  color:var(--text);background:#fff
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  height:100dvh;display:flex;flex-direction:column;
  overflow:hidden;background:#fff
}
.topbar{
  display:flex;align-items:center;gap:8px;padding:6px 9px;
  min-height:48px;border-bottom:1px solid var(--border);
  background:#fff;flex-shrink:0
}
.brand{font-weight:bold;font-size:16px;white-space:nowrap}
.brand span{color:var(--accent)}
.top-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.btn{
  border:1px solid var(--border);border-radius:5px;background:#fff;
  padding:7px 9px;font-size:12px
}
.btn:hover,.tool:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:white}
.main{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{
  width:260px;flex-shrink:0;display:flex;flex-direction:column;
  min-height:0;border-right:1px solid var(--border);background:#fff;
  transition:width .15s
}
.sidebar.collapsed{width:0;overflow:hidden;border:0}
.side-head{padding:9px;border-bottom:1px solid #eee}
.side-head-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:5px;margin-bottom:8px;font-size:13px;font-weight:bold
}
.side-actions{display:flex;flex-wrap:wrap;gap:4px}
.small-btn{
  font-size:11px;padding:6px;border:1px solid #ddd;
  background:#fff;border-radius:4px
}
.tree{flex:1;min-height:0;overflow:auto;padding:5px}
.tree-row{
  display:flex;align-items:center;gap:2px;min-height:30px;
  padding:2px;border-radius:4px;font-size:12px
}
.tree-row:hover{background:#f6f6f6}
.tree-row.active{background:#eee8ff;color:#51349b}
.tree-toggle,.tree-menu{
  flex-shrink:0;width:25px;height:27px;border:0;
  border-radius:4px;background:transparent;color:#555
}
.tree-label{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:pointer
}
.tree-children{margin-left:10px;padding-left:5px;border-left:1px solid #eee}
.dropdown{
  position:fixed;z-index:200;min-width:155px;background:#fff;
  border:1px solid #ddd;border-radius:6px;box-shadow:0 5px 20px #0002;
  padding:4px
}
.dropdown button{
  display:block;width:100%;text-align:left;border:0;border-radius:4px;
  background:#fff;padding:9px;font-size:12px
}
.dropdown button:hover{background:var(--hover)}
.dropdown .danger{color:#c62828}
.side-footer{padding:8px;border-top:1px solid #eee;color:#777;font-size:10px}
.editor{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.page-head{padding:7px 12px 4px;flex-shrink:0}
#pageTitle{
  width:100%;border:0;outline:none;padding:5px 0;font-size:22px;
  font-weight:bold;background:#fff
}
.status{min-height:13px;font-size:10px;color:#777}
.toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px;
  border-top:1px solid #eee;border-bottom:1px solid #ddd;
  background:#fff;flex-shrink:0
}
.group{
  display:flex;align-items:center;gap:3px;padding-right:5px;
  margin-right:2px;border-right:1px solid #eee
}
.tool{
  min-height:30px;min-width:29px;padding:4px 7px;
  border:1px solid transparent;border-radius:4px;background:#fff;font-size:12px
}
.tool-select{
  height:30px;max-width:130px;padding:3px;border:1px solid #ddd;
  border-radius:4px;background:#fff;font-size:11px
}
.color-input{
  width:30px;height:30px;padding:2px;border:1px solid #ddd;
  border-radius:4px;background:#fff
}
.workspace-scroll{
  position:relative;flex:1;min-height:0;overflow:auto;
  background:#fff!important;overscroll-behavior:contain
}
.workspace{
  position:relative;min-width:100%;min-height:100%;
  width:1400px;height:1000px;background:#fff!important
}
.main-writing{
  position:absolute;left:20px;top:15px;width:794px;min-height:500px;
  border:1px solid transparent;background:#fff!important
}
.main-writing.has-content{border-color:#e3e3e3}
.writing-body{
  min-height:480px;padding:24px 28px;outline:none;overflow-wrap:anywhere;
  line-height:1.65;font-size:15px;background:#fff!important
}
.writing-body:empty::before{
  content:"यहाँ क्लिक करके लिखें...";color:#aaa;pointer-events:none
}
.writing-body img,.text-body img{
  display:inline-block;max-width:100%;height:auto;vertical-align:middle
}
.writing-body table,.text-body table{border-collapse:collapse;max-width:100%}
.writing-body td,.writing-body th,.text-body td,.text-body th{
  border:1px solid #aaa;padding:5px
}
.object{
  position:absolute;left:100px;top:100px;background:#fff!important;
  border:1px solid transparent;overflow:visible
}
.object.has-content{border-color:#d9d9d9}
.object-head{
  display:flex;align-items:center;gap:5px;min-height:27px;padding:3px 6px;
  background:#fff;border-bottom:1px solid transparent;cursor:move;
  user-select:none;touch-action:none
}
.object.has-content .object-head{border-bottom-color:#eee}
.object-title{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:11px;color:#777
}
.object-close{border:0;background:transparent;font-size:17px;color:#666}
.object-body{background:#fff!important}
.text-object{
  width:240px;min-width:100px;min-height:32px;height:auto;
  resize:both;overflow:hidden
}
.text-body{
  min-height:24px;padding:4px 7px;outline:none;
  overflow-wrap:anywhere;line-height:1.6;background:#fff!important
}
.text-object:not(.has-content){border-color:transparent}
.text-object:not(.has-content) .object-head{border-bottom-color:transparent}
.text-object.has-content{border:1px solid #d9d9d9}
.text-object.has-content .object-head{border-bottom:1px solid #eee}
.image-object{
  width:330px;min-width:120px;resize:both;overflow:hidden;border:1px solid #ddd
}
.image-object img{display:block;width:100%;height:auto;object-fit:contain}
.image-object .object-body{padding:4px}
.pdf-object{
  width:794px;min-width:260px;height:auto!important;
  resize:horizontal;overflow:visible!important;border:1px solid #ddd
}
.pdf-object .object-body{height:auto!important;max-height:none!important;overflow:visible!important}
.pdf-pages{
  display:flex;flex-direction:column;gap:10px;width:100%;
  height:auto!important;overflow:visible!important
}
.pdf-page{
  position:relative;width:100%;min-height:80px;
  border:1px solid #eee;background:#fff
}
.pdf-canvas{display:block;width:100%;height:auto}
.pdf-placeholder{
  min-height:140px;display:flex;align-items:center;justify-content:center;
  background:#fafafa;color:#777;font-size:12px;padding:10px
}
.pdf-message{padding:12px;font-size:12px;color:#666}
.mindmap{
  position:absolute;left:900px;top:30px;width:320px;padding:10px;
  border:1px solid #ddd;background:#fff
}
.mindmap h3{font-size:14px;margin:0 0 8px}
.mindmap input{width:100%;padding:7px;border:1px solid #ddd}
.mind-node{padding:7px;margin-top:5px;border:1px solid #ddd;font-size:12px}
.backdrop{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:500;background:#0005;padding:15px
}
.dialog{
  width:min(420px,100%);padding:18px;border-radius:8px;background:#fff;
  box-shadow:0 10px 35px #0002
}
.dialog input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(max-width:700px){
  .topbar{gap:4px;padding:5px}.brand{font-size:12px}
  .top-actions{gap:3px}.top-actions .btn{padding:6px;font-size:10px}
  .sidebar{width:155px}.side-head{padding:6px}
  .side-actions{gap:3px}.small-btn{font-size:10px;padding:5px}
  .tree-row{font-size:11px}#pageTitle{font-size:19px}
  .toolbar{gap:3px;padding:4px}.group{padding-right:3px}
  .tool{padding:3px 5px;min-width:26px}.tool-select{max-width:105px}
  .main-writing{width:794px;left:12px;top:12px}
  .writing-body{padding:18px}
}
@media(max-width:420px){.sidebar{width:125px}}
</style>
</head>

<body>
<div class="app">
<header class="topbar">
  <button class="btn" id="sidebarToggle" title="Show/Hide Notebook">☰</button>
  <div class="brand">OneNote <span>Infinity Pro</span></div>
  <div class="top-actions">
    <button class="btn" id="saveBtn">Save</button>
    <button class="btn" id="backupBtn">Backup</button>
    <button class="btn" id="restoreBtn">Restore</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="side-head-row">
        <span>📚 Notebooks</span>

<input type="file" id="imageInput" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";

const KEY="onenoteInfinityV3";
const DBNAME="onenoteInfinityAssetsV3";
const STORE="assets";
const $=id=>document.getElementById(id);

let state,activePageId,assetDB,saveTimer,dialogAction=null;
let lastEditor=$("writingBody"),lastRange=null;
let pendingEmptyPanel=null,menuElement=null;
let isRestoring=false;
const objectUrls=new Set();

/* PDF loading registry. */
const pdfTasks=new Map();
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ================= DATABASE ================= */

function openDB(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){
      reject(new Error("IndexedDB उपलब्ध नहीं है"));
      return;
    }
    const req=indexedDB.open(DBNAME,1);
    req.onupgradeneeded=()=>{
      if(!req.result.objectStoreNames.contains(STORE)){
        req.result.createObjectStore(STORE,{keyPath:"id"});
      }
    };
    req.onsuccess=()=>{assetDB=req.result;resolve(assetDB)};
    req.onerror=()=>reject(req.error);
  });
}

async function putAsset(id,blob,name,type){
  if(!assetDB) await openDB();
  return new Promise((resolve,reject)=>{
    const tx=assetDB.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put({
      id,blob,name,type,updatedAt:Date.now()
    });
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error||new Error("Asset save aborted"));
  });
}

async function getAsset(id){
  if(!assetDB) await openDB();
  return new Promise((resolve,reject)=>{
    const tx=assetDB.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}

function makeObjectURL(blob){
  const url=URL.createObjectURL(blob);
  objectUrls.add(url);
  return url;
}
function revokeObjectURL(url){
  if(url&&objectUrls.has(url)){
    URL.revokeObjectURL(url);
    objectUrls.delete(url);
  }
}

/* ================= DATA MODEL ================= */

function uid(){
  return "id_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}
function makePage(title="New Page"){
  return {id:uid(),type:"page",title,content:"",objects:[],mindmap:[],updatedAt:Date.now()};
}
function makeSection(title="New Section"){
  return {id:uid(),type:"section",title,expanded:true,children:[makePage("Page 1")]};
}
function makeNotebook(title="My Notebook"){
  return {id:uid(),type:"notebook",title,expanded:true,children:[makeSection("General")]};
}
function defaults(){
  const n=makeNotebook();
  return {version:3,notebooks:[n],lastPageId:n.children[0].children[0].id};
}
function walk(node,callback){
  callback(node);
  (node.children||[]).forEach(child=>walk(child,callback));
}
function allPages(){
  const result=[];
  (state.notebooks||[]).forEach(n=>walk(n,node=>{
    if(node.type==="page") result.push(node);
  }));
  return result;
}
function findNode(id){
  let found=null;
  (state.notebooks||[]).forEach(n=>walk(n,node=>{if(node.id===id)found=node}));
  return found;
}
function findParent(id){
  let result=null;
  (state.notebooks||[]).forEach(n=>walk(n,node=>{
    if((node.children||[]).some(c=>c.id===id))result=node;
  }));
  return result;
}
function activePage(){
  return allPages().find(p=>p.id===activePageId)||null;
}
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed&&Array.isArray(parsed.notebooks)) state=parsed;
    }
  }catch(e){console.warn("State read error",e)}
  if(!state||!state.notebooks.length) state=defaults();
  if(!allPages().length) state=defaults();
  const pages=allPages();
  activePageId=pages.some(p=>p.id===state.lastPageId)
    ?state.lastPageId:pages[0].id;
}

/* ================= SAVE ================= */

function setStatus(text){$("status").textContent=text}

function saveCurrentPage(){
  const p=activePage();
  if(!p)return;
  p.title=$("pageTitle").value.trim()||"Untitled Page";
  p.content=$("writingBody").innerHTML;
  p.objects=p.objects||[];

  $("workspace").querySelectorAll(".object").forEach(el=>{
    const obj=p.objects.find(o=>o.id===el.dataset.objectId);
    if(!obj)return;
    obj.x=parseFloat(el.style.left)||0;
    obj.y=parseFloat(el.style.top)||0;
    obj.w=el.offsetWidth||obj.w||240;
    obj.h=el.offsetHeight||obj.h||32;
    if(obj.type==="text"){
      const body=el.querySelector(".text-body");
      if(body)obj.html=body.innerHTML;
      obj.userWidth=el.dataset.userWidth==="1";
      obj.userHeight=el.dataset.userHeight==="1";
    }
  });
}

function saveNow(){
  clearTimeout(saveTimer);
  saveCurrentPage();
  try{
    state.lastPageId=activePageId;
    localStorage.setItem(KEY,JSON.stringify(state));
    setStatus("✓ Saved");
    return true;
  }catch(e){
    console.error(e);
    setStatus("Save error");
    alert("नोट्स सेव नहीं हो सके। जगह खाली करें या Backup बनाएँ।");
    return false;
  }
}
function scheduleSave(){
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,600);
}
$("saveBtn").onclick=saveNow;
window.addEventListener("beforeunload",()=>{
  try{
    saveCurrentPage();
    state.lastPageId=activePageId;
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){}
});

/* ================= DIALOG ================= */

function showDialog(title,placeholder,callback){
  $("dialogTitle").textContent=title;
  $("dialogInput").value="";
  $("dialogInput").placeholder=placeholder||"Name";
  dialogAction=callback;
  $("backdrop").style.display="flex";
  setTimeout(()=>$("dialogInput").focus(),50);
}
function closeDialog(){
  $("backdrop").style.display="none";
  dialogAction=null;
}
$("cancelDialog").onclick=closeDialog;
$("confirmDialog").onclick=()=>{
  const value=$("dialogInput").value.trim();
  if(!value){alert("नाम लिखें।");return}
  const fn=dialogAction;
  closeDialog();
  if(fn)fn(value);
};
$("dialogInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")$("confirmDialog").click();
});
$("backdrop").addEventListener("click",e=>{
  if(e.target===$("backdrop"))closeDialog();
});

/* ================= TREE ================= */

function renderTree(){
  $("tree").innerHTML="";
  state.notebooks.forEach(n=>$("tree").appendChild(renderNode(n)));
}
function renderNode(node){
  const wrap=document.createElement("div");
  const row=document.createElement("div");
  row.className="tree-row";
  if(node.id===activePageId)row.classList.add("active");

  const hasChildren=(node.children||[]).length>0;
  const toggle=document.createElement("button");
  toggle.className="tree-toggle";
  toggle.textContent=hasChildren?(node.expanded===false?"▸":"▾"):"";

  const label=document.createElement("span");
  label.className="tree-label";
  label.textContent=(node.type==="notebook"?"📚 ":node.type==="section"?"📁 ":"📄 ")+node.title;

  const menu=document.createElement("button");
  menu.className="tree-menu";
  menu.textContent="⋮";
  menu.title="Create / Rename / Delete";
  row.append(toggle,label,menu);
  wrap.appendChild(row);

  toggle.onclick=e=>{
    e.stopPropagation();
    if(!hasChildren)return;
    node.expanded=node.expanded===false;
    renderTree();scheduleSave();
  };
  label.onclick=()=>{
    if(node.type==="page")openPage(node.id);
    else{node.expanded=node.expanded===false;renderTree();scheduleSave()}
  };
  menu.onclick=e=>{e.stopPropagation();showNodeDropdown(menu,node)};

  if(hasChildren&&node.expanded!==false){
    const children=document.createElement("div");
    children.className="tree-children";
    node.children.forEach(child=>children.appendChild(renderNode(child)));
    wrap.appendChild(children);
  }
  return wrap;
}
function closeNodeDropdown(){
  if(menuElement){menuElement.remove();menuElement=null}
}
document.addEventListener("click",e=>{
  if(menuElement&&!menuElement.contains(e.target))closeNodeDropdown();
});
function showNodeDropdown(button,node){

/* ================= SELECTION / FORMATTING ================= */

function rememberEditor(editor){
  lastEditor=editor;
  const sel=window.getSelection();
  if(sel&&sel.rangeCount)lastRange=sel.getRangeAt(0).cloneRange();
}
function rememberCurrentSelection(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  let node=range.commonAncestorContainer;
  if(node.nodeType===3)node=node.parentElement;
  const editor=node.closest&&node.closest("#writingBody,.text-body");
  if(editor){lastEditor=editor;lastRange=range.cloneRange()}
}
document.addEventListener("selectionchange",()=>{
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  let node=sel.anchorNode;
  if(node&&node.nodeType===3)node=node.parentElement;
  if(!node||!node.closest)return;
  const editor=node.closest("#writingBody,.text-body");
  if(editor)rememberEditor(editor);
});
function restoreEditorSelection(){
  if(!lastEditor||!document.contains(lastEditor))lastEditor=$("writingBody");
  lastEditor.focus();
  if(lastRange){
    try{
      const sel=window.getSelection();
      sel.removeAllRanges();sel.addRange(lastRange);
    }catch(e){}
  }
}
function exec(command,value=null){
  restoreEditorSelection();
  document.execCommand(command,false,value);
  if(lastEditor===$("writingBody")){updateMainBorder();autoGrowMain()}
  else{
    const box=lastEditor.closest(".text-object");
    if(box){updateTextBorder(box);autoGrowText(box)}
  }
  scheduleSave();
}

/* ================= EMPTY TEXT PANELS ================= */

function panelHasContent(el){
  const body=el.querySelector(".text-body");
  return !!body&&(body.textContent.trim().length>0||
    !!body.querySelector("img,table,video,iframe,a"));
}
function removeIfEmpty(el){
  if(!el||!el.isConnected)return;
  if(el.classList.contains("text-object")&&!panelHasContent(el)){
    const p=activePage();
    if(p)p.objects=p.objects.filter(o=>o.id!==el.dataset.objectId);
    el.remove();
    if(pendingEmptyPanel===el)pendingEmptyPanel=null;
    scheduleSave();updateWorkspaceSize();
  }
}
function addTextPanel(x,y,focus=true){
  const p=activePage();if(!p)return null;
  const obj={id:uid(),type:"text",title:"Text",x:Math.max(0,x),y:Math.max(0,y),
    w:240,h:32,html:"",userWidth:false,userHeight:false};
  p.objects.push(obj);
  const el=createObject(obj);
  $("workspace").appendChild(el);
  pendingEmptyPanel=el;
  const body=el.querySelector(".text-body");
  if(focus&&body){
    body.focus();
    const range=document.createRange();
    range.selectNodeContents(body);range.collapse(false);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
    rememberEditor(body);
  }
  scheduleSave();updateWorkspaceSize();return el;
}
$("workspace").addEventListener("click",e=>{
  if(e.target.closest(".object,.main-writing,.mindmap"))return;
  if(pendingEmptyPanel&&!panelHasContent(pendingEmptyPanel))removeIfEmpty(pendingEmptyPanel);

  addTextPanel(e.clientX-r.left,e.clientY-r.top,true);
});

/* ================= OBJECT CREATION ================= */

function createObject(obj){
  const el=document.createElement("div");
  el.className="object "+obj.type+"-object";
  el.dataset.objectId=obj.id;
  el.style.left=(obj.x||0)+"px";
  el.style.top=(obj.y||0)+"px";
  if(obj.w)el.style.width=obj.w+"px";
  if(obj.type==="image"&&obj.h)el.style.height=obj.h+"px";
  if(obj.type==="text"&&obj.userWidth)el.dataset.userWidth="1";
  if(obj.type==="text"&&obj.userHeight)el.dataset.userHeight="1";

  const head=document.createElement("div");
  head.className="object-head";
  const title=document.createElement("span");
  title.className="object-title";
  title.textContent=obj.type==="text"?"Text":obj.name||(obj.type==="pdf"?"PDF":"Image");
  const close=document.createElement("button");
  close.className="object-close";close.textContent="×";close.title="Delete panel";
  head.append(title,close);el.appendChild(head);
  const body=document.createElement("div");body.className="object-body";el.appendChild(body);

  if(obj.type==="text"){
    const text=document.createElement("div");
    text.className="text-body";text.contentEditable="true";text.spellcheck=true;
    text.innerHTML=obj.html||"";body.appendChild(text);
    updateTextBorder(el);
    text.addEventListener("focus",()=>rememberEditor(text));
    text.addEventListener("input",()=>{
      updateTextBorder(el);autoGrowText(el);rememberEditor(text);scheduleSave();
    });
    text.addEventListener("paste",()=>setTimeout(()=>{
      updateTextBorder(el);autoGrowText(el);scheduleSave();
    },150));
    text.addEventListener("blur",()=>setTimeout(()=>removeIfEmpty(el),180));
    requestAnimationFrame(()=>autoGrowText(el));
  }else if(obj.type==="image"){
    const img=document.createElement("img");
    img.alt=obj.name||"Image";body.appendChild(img);loadImage(obj,img);
  }else if(obj.type==="pdf"){
    const pages=document.createElement("div");pages.className="pdf-pages";
    body.appendChild(pages);loadPDF(obj,el,pages);
  }

  close.onclick=()=>{
    if(!confirm("इस पैनल को हटाएँ?"))return;
    if(obj.type==="pdf")cancelPDFTask(obj.id);
    const p=activePage();
    if(p)p.objects=p.objects.filter(o=>o.id!==obj.id);
    el.remove();scheduleSave();updateWorkspaceSize();
  };
  makeDraggable(el,head);
  if(obj.type==="text"||obj.type==="image")enableResize(el,obj);
  if(obj.type==="pdf")enablePDFResize(el,obj);
  return el;
}
function updateTextBorder(el){
  el.classList.toggle("has-content",panelHasContent(el));
}
function autoGrowText(el){
  const body=el.querySelector(".text-body");if(!body)return;
  if(panelHasContent(el)&&!el.dataset.userWidth)el.style.width="794px";
  if(!el.dataset.userHeight){
    body.style.height="auto";
    body.style.height=Math.max(24,body.scrollHeight+8)+"px";
    el.style.height="auto";
  }
  updateTextBorder(el);updateWorkspaceSize();
}

/* ================= DRAG / RESIZE ================= */

function makeDraggable(el,handle){
  let moving=false,sx=0,sy=0,ox=0,oy=0;
  handle.addEventListener("pointerdown",e=>{
    if(e.target.closest(".object-close"))return;
    const r=el.getBoundingClientRect();
    if(r.right-e.clientX<18||r.bottom-e.clientY<18)return;
    moving=true;sx=e.clientX;sy=e.clientY;
    ox=parseFloat(el.style.left)||0;oy=parseFloat(el.style.top)||0;
    try{handle.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  handle.addEventListener("pointermove",e=>{
    if(!moving)return;
    el.style.left=Math.max(0,ox+e.clientX-sx)+"px";
    el.style.top=Math.max(0,oy+e.clientY-sy)+"px";
    updateWorkspaceSize();
  });
  const stop=()=>{
    if(!moving)return;
    moving=false;scheduleSave();updateWorkspaceSize();
  };
  handle.addEventListener("pointerup",stop);
  handle.addEventListener("pointercancel",stop);
}
function enableResize(el,obj){
  let oldW=el.offsetWidth,oldH=el.offsetHeight;
  if("ResizeObserver" in window){
    const observer=new ResizeObserver(()=>{
      const w=el.offsetWidth,h=el.offsetHeight;
      if(el.dataset.userResizing==="1"){
        if(w!==oldW)el.dataset.userWidth="1";
        if(h!==oldH)el.dataset.userHeight="1";
      }
      oldW=w;oldH=h;
    });
    observer.observe(el);
  }
  el.addEventListener("pointerdown",e=>{
    const r=el.getBoundingClientRect();
    if(r.right-e.clientX<22||r.bottom-e.clientY<22)el.dataset.userResizing="1";
  });
  el.addEventListener("pointerup",()=>{
    if(el.dataset.userResizing){
      delete el.dataset.userResizing;scheduleSave();
    }
  });
}

function insertAtSavedRange(node){
  if(!lastEditor||!document.contains(lastEditor))lastEditor=$("writingBody");
  lastEditor.focus();
  const sel=window.getSelection();
  if(lastRange){
    try{sel.removeAllRanges();sel.addRange(lastRange)}catch(e){}
  }
  let range;
  if(sel.rangeCount)range=sel.getRangeAt(0);
  else{range=document.createRange();range.selectNodeContents(lastEditor);range.collapse(false)}
  if(!lastEditor.contains(range.commonAncestorContainer)){
    range=document.createRange();range.selectNodeContents(lastEditor);range.collapse(false);
  }
  range.deleteContents();range.insertNode(node);
  const spacer=document.createTextNode(" ");
  node.parentNode.insertBefore(spacer,node.nextSibling);
  range.setStartAfter(spacer);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);lastRange=range.cloneRange();
  if(lastEditor===$("writingBody")){updateMainBorder();autoGrowMain()}
  else{
    const box=lastEditor.closest(".text-object");
    if(box){updateTextBorder(box);autoGrowText(box)}
  }
  scheduleSave();
}

/* Reconnect saved inline images and attachment URLs after reopening. */
async function rehydrateInlineAssets(root){
  if(!root||!assetDB)return;
  for(const img of root.querySelectorAll("img[data-asset-id]")){
    const id=img.dataset.assetId;
    if(!id)continue;
    try{
      const record=await getAsset(id);
      if(!record||!record.blob){img.alt="इमेज उपलब्ध नहीं है";continue}
      if(img.dataset.objectUrl)revokeObjectURL(img.dataset.objectUrl);
      const url=makeObjectURL(record.blob);
      img.src=url;img.dataset.objectUrl=url;
    }catch(err){console.error("Image restore:",err)}
  }
}
async function rehydrateAttachments(root){
  if(!root||!assetDB)return;
  for(const link of root.querySelectorAll("a[data-asset-id]")){
    const id=link.dataset.assetId;
    if(!id)continue;
    try{
      const record=await getAsset(id);
      if(!record||!record.blob){link.textContent="📎 फ़ाइल उपलब्ध नहीं है";continue}
      if(link.dataset.objectUrl)revokeObjectURL(link.dataset.objectUrl);
      const url=makeObjectURL(record.blob);
      link.href=url;link.download=record.name||link.textContent;
      link.dataset.objectUrl=url;
    }catch(err){console.error("Attachment restore:",err)}
  }
}

/* ================= PDF: LAZY RENDER + MEMORY MANAGEMENT ================= */

function cancelPDFTask(id){
  const task=pdfTasks.get(id);
  if(!task)return;
  task.cancelled=true;
  if(task.observer)task.observer.disconnect();
  for(const render of task.rendering.values()){
    try{if(render.cancel)render.cancel()}catch(e){}
  }
  if(task.pdf){
    try{task.pdf.destroy()}catch(e){}
  }
  if(task.loadingTask){
    try{task.loadingTask.destroy()}catch(e){}
  }
  pdfTasks.delete(id);
}

$("pdfInput").addEventListener("change",async e=>{

async function loadPDF(obj,el,container){
  cancelPDFTask(obj.id);
  container.innerHTML='<div class="pdf-message">PDF तैयार हो रही है...</div>';

  let taskInfo=null;

  try{
    if(!window.pdfjsLib)throw new Error("PDF.js लोड नहीं हुई");
    const record=await getAsset(obj.assetId);
    if(!record||!record.blob)throw new Error("सेव की गई PDF नहीं मिली");

    /*
      ArrayBuffer की कॉपी पढ़ें। IndexedDB की मूल Blob सुरक्षित रहती है।
    */
    const data=await record.blob.arrayBuffer();
    const loadingTask=pdfjsLib.getDocument({
      data:new Uint8Array(data),
      isEvalSupported:false
    });

    taskInfo={
      loadingTask,pdf:null,observer:null,cancelled:false,
      rendering:new Map(),items:[],lastWidth:0
    };
    pdfTasks.set(obj.id,taskInfo);

    const pdf=await loadingTask.promise;
    if(taskInfo.cancelled||pdfTasks.get(obj.id)!==taskInfo)return;
    taskInfo.pdf=pdf;
    container.innerHTML="";

    /*
      पहले हल्के placeholders बनाएँ। Canvas केवल viewport के पास
      वाले पेजों के लिए बनाएँगे।
    */
    for(let n=1;n<=pdf.numPages;n++){
      const box=document.createElement("div");
      box.className="pdf-page";
      box.dataset.pageNumber=n;
      const ph=document.createElement("div");
      ph.className="pdf-placeholder";
      ph.textContent="PDF पेज "+n+" — लोड होने की प्रतीक्षा में";
      box.appendChild(ph);
      container.appendChild(box);
      taskInfo.items.push({number:n,box,rendered:false,rendering:false});
    }

    async function renderPage(item){
      if(taskInfo.cancelled||item.rendered||item.rendering)return;
      item.rendering=true;

      try{
        const page=await pdf.getPage(item.number);
        if(taskInfo.cancelled)return;

        const base=page.getViewport({scale:1});
        const width=Math.max(260,Math.min(1100,el.clientWidth-2));
        let scale=width/base.width;
        const dpr=Math.min(window.devicePixelRatio||1,1.25);
        const maxPixels=2200000;
        const pixels=base.width*scale*base.height*scale*dpr*dpr;
        if(pixels>maxPixels)scale*=Math.sqrt(maxPixels/pixels);

        const viewport=page.getViewport({scale});
        const canvas=document.createElement("canvas");
        canvas.className="pdf-canvas";
        canvas.width=Math.max(1,Math.floor(viewport.width*dpr));
        canvas.height=Math.max(1,Math.floor(viewport.height*dpr));
        canvas.style.width="100%";
        canvas.style.height="auto";

        item.box.replaceChildren(canvas);
        const label=document.createElement("span");
        label.textContent=item.number+" / "+pdf.numPages;
        label.style.cssText="position:absolute;right:6px;bottom:5px;font-size:10px;background:#ffffffdd;padding:3px 5px";
        item.box.appendChild(label);

        const ctx=canvas.getContext("2d",{alpha:false});
        const renderTask=page.render({
          canvasContext:ctx,viewport,
          transform:dpr!==1?[dpr,0,0,dpr,0,0]:null
        });
        taskInfo.rendering.set(item.number,renderTask);
        await renderTask.promise;
        item.rendered=true;
        item.canvas=canvas;
        taskInfo.rendering.delete(item.number);
        page.cleanup();
      }catch(err){
        taskInfo.rendering.delete(item.number);
        if(!taskInfo.cancelled){
          console.warn("PDF page render failed",item.number,err);
          const ph=document.createElement("div");
          ph.className="pdf-message";
          ph.textContent="पेज "+item.number+" लोड नहीं हुआ।";
          item.box.replaceChildren(ph);
        }
      }finally{
        item.rendering=false;
        updateWorkspaceSize();
      }
    }

    function unloadPage(item){
      if(!item.rendered||taskInfo.cancelled)return;
      const renderTask=taskInfo.rendering.get(item.number);
      if(renderTask){
        try{renderTask.cancel()}catch(e){}
      }
      item.box.replaceChildren();
      const ph=document.createElement("div");
      ph.className="pdf-placeholder";
      ph.textContent="PDF पेज "+item.number+" — दोबारा देखने पर लोड होगा";
      item.box.appendChild(ph);
      item.rendered=false;
      item.canvas=null;
      try{pdf.cleanup()}catch(e){}
    }

    if("IntersectionObserver" in window){
      const observer=new IntersectionObserver(entries=>{
        for(const entry of entries){
          const item=taskInfo.items.find(x=>x.box===entry.target);
          if(!item)continue;
          if(entry.isIntersecting){
            renderPage(item);
          }else{
            /*
              स्क्रीन से दूर पेजों की Canvas हटाएँ।
              इससे लंबी PDF में मेमोरी की खपत घटती है।
            */
            unloadPage(item);
          }
        }
      },{
        root:$("workspaceScroll"),
        rootMargin:"500px 0px",
        threshold:0
      });
      taskInfo.observer=observer;
      taskInfo.items.forEach(item=>observer.observe(item.box));
    }else{
      // पुराने ब्राउज़र में सीमित बैचों में रेंडर करें।
      let index=0;
      async function next(){
        if(taskInfo.cancelled||index>=taskInfo.items.length)return;
        await renderPage(taskInfo.items[index++]);
        setTimeout(next,60);
      }
      next();
    }

    container.style.height="auto";
    container.style.overflow="visible";
    updateWorkspaceSize();
  }catch(err){
    console.error("PDF loading error:",err);
    if(taskInfo&&pdfTasks.get(obj.id)===taskInfo)cancelPDFTask(obj.id);
    container.innerHTML="";
    const msg=document.createElement("div");
    msg.className="pdf-message";
    msg.textContent="PDF लोड नहीं हुई: "+(err.message||"अज्ञात त्रुटि");
    container.appendChild(msg);
  }
}

function enablePDFResize(el,obj){
  let lastWidth=0,timer=null;
  if(!("ResizeObserver" in window))return;
  const observer=new ResizeObserver(()=>{
    const width=el.clientWidth;
    if(!width||Math.abs(width-lastWidth)<24)return;
    lastWidth=width;
    clearTimeout(timer);
    timer=setTimeout(()=>{
      const container=el.querySelector(".pdf-pages");
      if(container)loadPDF(obj,el,container);
    },900);
  });
  observer.observe(el);
}

/* ================= RENDER OBJECTS ================= */

function renderObjects(p){
  $("workspace").querySelectorAll(".object,.mindmap").forEach(el=>{
    if(el.classList.contains("pdf-object"))cancelPDFTask(el.dataset.objectId);
    el.remove();
  });
  p.objects=p.objects||[];
  p.objects.filter(o=>["text","image","pdf"].includes(o.type)).forEach(obj=>{
    $("workspace").appendChild(createObject(obj));
  });
  renderMindMap(p);
  requestAnimationFrame(()=>{autoGrowMain();updateWorkspaceSize()});
}

/* ================= MIND MAP ================= */

function renderMindMap(p){
  const old=$("workspace").querySelector(".mindmap");
  if(old)old.remove();
  if(!p.mindmap||!p.mindmap.length)return;

  const box=document.createElement("div");
  box.className="mindmap";box.style.left="900px";box.style.top="30px";
  const h=document.createElement("h3");h.textContent="Mind Map";
  const input=document.createElement("input");input.placeholder="New idea — Enter दबाएँ";
  const list=document.createElement("div");

  function refresh(){
    list.innerHTML="";
    p.mindmap.forEach((value,index)=>{
      const n=document.createElement("div");
      n.className="mind-node";n.textContent=value;
      n.onclick=()=>{
        if(!confirm("इस आइडिया को हटाएँ?"))return;
        p.mindmap.splice(index,1);refresh();scheduleSave();
      };
      list.appendChild(n);
    });
    updateWorkspaceSize();
  }
  input.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;
    const value=input.value.trim();if(!value)return;
    p.mindmap.push(value);input.value="";refresh();scheduleSave();
  });
  box.append(h,input,list);$("workspace").appendChild(box);refresh();
}
$("addMindMap").onclick=()=>{
  const p=activePage();if(!p)return;
  p.mindmap=p.mindmap||[];
  if(!p.mindmap.length)p.mindmap.push("Main Idea");
  renderMindMap(p);scheduleSave();
};

/* ================= BACKUP / RESTORE ================= */

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(",")[1]);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
function base64ToBlob(base64,type){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:type||"application/octet-stream"});
}
$("backupBtn").onclick=async()=>{
  saveNow();
  try{
    if(!assetDB)await openDB();
    const backupData={app:"OneNote Infinity Pro",version:3,state,assets:[]};
    const ids=new Set();
    allPages().forEach(p=>{
      (p.objects||[]).forEach(o=>{if(o.assetId)ids.add(o.assetId)});
      const temp=document.createElement("div");
      temp.innerHTML=p.content||"";
      temp.querySelectorAll("[data-asset-id]").forEach(el=>{
        if(el.dataset.assetId)ids.add(el.dataset.assetId);
      });
    });
    let count=0;
    for(const id of ids){
      const record=await getAsset(id);
      if(!record||!record.blob)continue;
      backupData.assets.push({
        id:record.id,name:record.name,type:record.type,
        base64:await blobToBase64(record.blob)
      });
      count++;
      setStatus("Backup तैयार हो रहा है: "+count+"/"+ids.size);
    }
    const blob=new Blob([JSON.stringify(backupData)],{type:"application/json"});
    const url=makeObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="onenote-infinity-backup.json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>revokeObjectURL(url),3000);
    setStatus("Backup डाउनलोड हो गया");
  }catch(err){
    console.error(err);
    alert("Backup नहीं बन पाया। बड़ी फाइलों के लिए पर्याप्त जगह की जाँच करें।");
  }
};
$("restoreBtn").onclick=()=>$("restoreInput").click();
$("restoreInput").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";
  if(!file)return;
  if(!confirm("Restore से मौजूदा डेटा बदल सकता है। पहले मौजूदा डेटा का Backup लें। जारी रखें?"))return;
  try{
    isRestoring=true;
    if(!assetDB)await openDB();
    const data=JSON.parse(await file.text());
    if(!data.state||!Array.isArray(data.state.notebooks))throw new Error("Invalid backup");
    for(const asset of data.assets||[]){
      await putAsset(asset.id,base64ToBlob(asset.base64,asset.type),asset.name,asset.type);
    }
    state=data.state;
    if(!allPages().length)state=defaults();
    activePageId=allPages().some(p=>p.id===state.lastPageId)?state.lastPageId:allPages()[0].id;
    saveNow();renderTree();openPage(activePageId);
    alert("Backup Restore हो गया।");
  }catch(err){
    console.error(err);
    alert("Restore नहीं हो पाया। सही Backup JSON चुनें।");
  }finally{isRestoring=false}
});

/* ================= START ================= */

async function start(){
  try{await openDB()}
  catch(err){
    console.warn("Asset storage unavailable",err);
    setStatus("फ़ाइल स्टोरेज उपलब्ध नहीं है");
  }
  loadState();
  renderTree();
  openPage(activePageId);
  setStatus("Ready");
}
window.addEventListener("resize",updateWorkspaceSize);
start();
</script>
