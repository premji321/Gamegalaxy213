<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6750a4">

<title>OneNote Pro - Advanced Notes</title>

<style>
:root {
    --primary: #6750a4;
    --primary-light: #eee8ff;
    --bg: #f5f5fa;
    --surface: #ffffff;
    --surface2: #f0eff6;
    --text: #24232b;
    --muted: #777582;
    --border: #e5e2ec;
    --danger: #d9364f;
    --shadow: 0 5px 24px rgba(30,20,60,.07);
}

body.dark {
    --primary: #b8a5ff;
    --primary-light: #33294f;
    --bg: #14131b;
    --surface: #201f29;
    --surface2: #2a2935;
    --text: #f3f1fa;
    --muted: #aaa7b8;
    --border: #393744;
    --danger: #ff8294;
    --shadow: 0 5px 24px rgba(0,0,0,.18);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* TOP HEADER */

.topbar {
    height: 62px;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: 800;
    white-space: nowrap;
}

.logo-icon {
    background: var(--primary);
    color: white;
    padding: 8px;
    border-radius: 9px;
}

.top-search {
    flex: 1;
    max-width: 570px;
    margin: auto;
}

.top-search input {
    width: 100%;
    padding: 11px 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
}

.top-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
}

.icon-btn:hover {
    background: var(--surface2);
}

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    min-width: 210px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-heading {
    padding: 20px 15px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-weight: 800;
    letter-spacing: .7px;
}

.small-btn {
    background: transparent;
    border: none;
    color: var(--primary);
    font-size: 19px;
}

.nav {
    padding: 5px 9px 12px;
    border-bottom: 1px solid var(--border);
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin: 2px 0;
}

.nav-item:hover {
    background: var(--surface2);
}

.nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
}

.tree {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
}

.notebook {
    margin-bottom: 8px;
}

.notebook-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
}

.notebook-head:hover,
.section-item:hover,
.page-item:hover {
    background: var(--surface2);
}

.notebook-head .nb-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.section-list {
    margin-left: 15px;
    border-left: 2px solid var(--border);
    padding-left: 6px;
}

.section-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}

.section-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
}

.page-list {
    margin-left: 12px;
}

.page-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
}

.page-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
}

.page-item .page-name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
}

.sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
}

/* PAGE PANEL */

.page-panel {
    width: 260px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.panel-header {
    padding: 18px 15px 10px;
}

.panel-header h3 {
    margin: 0 0 6px;
    font-size: 16px;
}

.panel-header p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
}

.new-page-btn {
    margin: 10px 12px;
    border: 1px dashed var(--primary);
    background: var(--primary-light);
    color: var(--primary);
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
}

.page-results {
    overflow-y: auto;
    flex: 1;
    padding: 5px 9px;
}

.page-card {
    padding: 12px;
    margin-bottom: 6px;
    border: 1px solid transparent;
    border-radius: 9px;
    cursor: pointer;
}

.page-card:hover {
    background: var(--surface2);
}

.page-card.active {
    background: var(--primary-light);
    border-color: var(--primary);
}

.page-card-title {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.page-card-preview {
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    line-height: 1.5;
}

.page-card-time {
    margin-top: 8px;
    font-size: 10px;
    color: var(--muted);
}

/* EDITOR */

.editor-area {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 26px;
}

.editor-container {
    max-width: 920px;
    margin: 0 auto;
    min-height: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 30px 42px;
}

.editor-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.breadcrumb {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.status {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
}

.title-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 32px;
    font-weight: 800;
    margin: 10px 0;
    padding: 5px 0;
}

.meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
}

.tag-input {
    width: 130px;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
    position: sticky;
    top: -26px;
    background: var(--surface);
    z-index: 5;
}

.tool-btn {
    min-width: 33px;
    height: 34px;
    padding: 0 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
}

.tool-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
}

.tool-select {
    max-width: 130px;
    height: 34px;
    padding: 0 5px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
}

.color-tool {
    width: 35px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    padding: 4px;
}

.editor {
    min-height: 420px;
    outline: none;
    font-size: 16px;
    line-height: 1.85;
    overflow-wrap: anywhere;
}

.editor:empty::before {
    content: "Start writing your notes here...";
    color: var(--muted);
    pointer-events: none;
}

.editor h1,
.editor h2,
.editor h3 {
    line-height: 1.35;
}

.editor blockquote {
    border-left: 4px solid var(--primary);
    padding: 8px 15px;
    margin-left: 0;
    background: var(--surface2);
}

.editor img {
    max-width: 100%;
    border-radius: 8px;
}

.editor table {
    border-collapse: collapse;
    width: 100%;
}

.editor td,
.editor th {
    border: 1px solid var(--border);
    padding: 8px;
}

.editor pre {
    background: var(--surface2);
    padding: 15px;
    overflow: auto;
    border-radius: 8px;
}

.editor input[type="checkbox"] {
    width: 16px;
    height: 16px;
    margin-right: 8px;
}

.editor-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
    padding-top: 15px;
    color: var(--muted);
    font-size: 11px;
}

.bottom-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.btn {
    padding: 9px 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 7px;
    font-size: 12px;
}

.btn.primary {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

.btn.danger {
    color: var(--danger);
}

.empty-state {
    text-align: center;
    padding: 40px 15px;
    color: var(--muted);
    font-size: 13px;
}

/* DIALOGS */

dialog {
    width: min(430px, calc(100% - 30px));
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    color: var(--text);
    padding: 24px;
    box-shadow: var(--shadow);
}

dialog::backdrop {
    background: rgba(0,0,0,.45);
}

dialog h3 {
    margin-top: 0;
}

.dialog-input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    margin: 8px 0 15px;
}

.dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.mobile-menu {
    display: none;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #25232f;
    color: white;
    padding: 12px 18px;
    border-radius: 9px;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 100;
    font-size: 13px;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.mobile-backdrop {
    display: none;
}

@media(max-width: 1000px) {
    .page-panel {
        width: 220px;
        min-width: 190px;
    }

    .sidebar {
        width: 220px;
        min-width: 190px;
    }

    .editor-container {
        padding: 25px;
    }
}

@media(max-width: 720px) {
    body {
        overflow: hidden;
    }

    .topbar {
        height: 56px;
        padding: 0 9px;
        gap: 8px;
    }

    .logo {
        font-size: 15px;
        gap: 6px;
    }

    .logo-icon {
        padding: 6px;
    }

    .top-search {
        min-width: 0;
    }

    .top-search input {
        padding: 9px;
        font-size: 12px;
    }

    .top-actions {
        gap: 4px;
    }

    .icon-btn {
        width: 32px;
        height: 34px;
    }

    .mobile-menu {
        display: block;
    }

    .sidebar,
    .page-panel {
        position: fixed;
        top: 56px;
        bottom: 0;
        z-index: 20;
        height: calc(100vh - 56px);
        transition: transform .2s;
        box-shadow: var(--shadow);
    }

    .sidebar {
        left: 0;
        transform: translateX(-110%);
    }

    .page-panel {
        left: 0;
        width: 270px;
        transform: translateX(-110%);
    }

    body.show-sidebar .sidebar {
        transform: translateX(0);
    }

    body.show-pages .page-panel {
        transform: translateX(0);
    }

    .mobile-backdrop {
        position: fixed;
        inset: 56px 0 0;
        z-index: 15;
        background: rgba(0,0,0,.3);
    }

    body.show-sidebar .mobile-backdrop,
    body.show-pages .mobile-backdrop {
        display: block;
    }

    .editor-area {
        padding: 10px;
        width: 100%;
    }

    .editor-container {
        padding: 17px;
        border-radius: 9px;
    }

    .title-input {
        font-size: 26px;
    }

    .editor {
        font-size: 15px;
        min-height: 350px;
    }

    .toolbar {
        top: -17px;
    }

    .editor-topline {
        align-items: flex-start;
    }

    .breadcrumb {
        white-space: normal;
    }
}

@media print {
    body {
        height: auto;
        overflow: visible;
        background: white;
        color: black;
    }

    .topbar,
    .sidebar,
    .page-panel,
    .toolbar,
    .editor-topline,
    .editor-bottom,
    .meta-row,
    .mobile-backdrop {
        display: none !important;
    }

    .main,
    .editor-area {
        display: block;
        height: auto;
        overflow: visible;
        padding: 0;
    }

    .editor-container {
        border: none;
        box-shadow: none;
        padding: 0;
    }

    .title-input {
        color: black;
    }

    .editor {
        color: black;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="topbar">

        <button class="icon-btn mobile-menu"
                onclick="toggleSidebar()"
                title="Open notebooks">☰</button>

        <div class="logo">
            <span class="logo-icon">▤</span>
            <span>OneNote Pro</span>
        </div>

        <div class="top-search">
            <input type="search"
                   id="searchInput"
                   placeholder="🔍 Search all notes..."
                   oninput="searchNotes(this.value)">
        </div>

        <div class="top-actions">
            <button class="icon-btn"
                    onclick="newNotebook()"
                    title="New notebook">📚</button>

            <button class="icon-btn"
                    onclick="toggleTheme()"
                    title="Toggle theme">🌙</button>

            <button class="icon-btn"
                    onclick="exportBackup()"
                    title="Backup">💾</button>
        </div>

    </header>

    <div class="main">

        <!-- NOTEBOOK SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-heading">
                <span>WORKSPACE</span>
                <button class="small-btn"
                        onclick="newNotebook()">+</button>
            </div>

            <nav class="nav">

                <div class="nav-item active"
                     id="navAll"
                     onclick="showAllNotes()">
                    📝 <span>All Notes</span>
                </div>

                <div class="nav-item"
                     id="navFavorites"
                     onclick="showFavorites()">
                    ⭐ <span>Favourites</span>
                </div>

                <div class="nav-item"
                     onclick="document.getElementById('importFile').click()">
                    📥 <span>Import Backup</span>
                </div>

                <div class="nav-item"
                     onclick="exportBackup()">
                    📤 <span>Export Backup</span>
                </div>

            </nav>

            <div class="sidebar-heading">
                <span>MY NOTEBOOKS</span>
                <button class="small-btn"
                        onclick="newNotebook()">+</button>
            </div>

            <div class="tree" id="notebookTree"></div>

            <div class="sidebar-footer">
                Personal Workspace · Local Storage
            </div>

        </aside>

        <!-- PAGE LIST -->

        <aside class="page-panel">

            <div class="panel-header">
                <h3 id="sectionTitle">My Pages</h3>
                <p id="sectionSubtitle">Organise your ideas</p>
            </div>

            <button class="new-page-btn"
                    onclick="newPage()">＋ Create New Page</button>

            <div class="page-results" id="pageResults"></div>

        </aside>

        <!-- EDITOR -->

        <main class="editor-area" id="editorArea">

            <div class="editor-container" id="editorContainer">

                <div class="editor-topline">

                    <div class="breadcrumb" id="breadcrumb">
                        My Notebook / General / Welcome
                    </div>

                    <div class="status" id="saveStatus">
                        ✓ Ready
                    </div>

                </div>

                <input type="text"
                       class="title-input"
                       id="pageTitle"
                       placeholder="Untitled Page"
                       maxlength="250"
                       autocomplete="off">

                <div class="meta-row">

                    <span id="createdTime">Created today</span>

                    <span>•</span>

                    <span id="wordCount">0 words</span>

                    <input class="tag-input"
                           id="tagInput"
                           placeholder="🏷 Add a tag"
                           maxlength="60">

                    <button class="btn"
                            onclick="toggleFavorite()"
                            id="favoriteButton">☆ Favourite</button>

                </div>

                <!-- TOOLBAR -->

                <div class="toolbar">

                    <button class="tool-btn"
                            onclick="exec('undo')"
                            title="Undo">↶</button>

                    <button class="tool-btn"
                            onclick="exec('redo')"
                            title="Redo">↷</button>

                    <button class="tool-btn"
                            onclick="exec('bold')"
                            title="Bold"><b>B</b></button>

                    <button class="tool-btn"
                            onclick="exec('italic')"
                            title="Italic"><i>I</i></button>

                    <button class="tool-btn"
                            onclick="exec('underline')"
                            title="Underline"><u>U</u></button>

                    <button class="tool-btn"
                            onclick="exec('strikeThrough')"
                            title="Strike through"><s>S</s></button>

                    <select class="tool-select"
                            onchange="formatBlock(this.value); this.selectedIndex=0"
                            title="Text style">

                        <option value="">Paragraph</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="blockquote">Quote</option>
                        <option value="pre">Code block</option>

                    </select>

                    <select class="tool-select"
                            onchange="exec('fontName',this.value); this.selectedIndex=0"
                            title="Font">

                        <option value="">Font</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Courier New">Courier New</option>

                    </select>

                    <button class="tool-btn"
                            onclick="exec('justifyLeft')"
                            title="Align left">☰</button>

                    <button class="tool-btn"
                            onclick="exec('justifyCenter')"
                            title="Align center">≡</button>

                    <button class="tool-btn"
                            onclick="exec('justifyRight')"
                            title="Align right">☷</button>

                    <button class="tool-btn"
                            onclick="exec('insertUnorderedList')"
                            title="Bullet list">• List</button>

                    <button class="tool-btn"
                            onclick="exec('insertOrderedList')"
                            title="Numbered list">1. List</button>

                    <button class="tool-btn"
                            onclick="insertChecklist()"
                            title="Checklist">☑</button>

                    <button class="tool-btn"
                            onclick="insertLink()"
                            title="Insert link">🔗</button>

                    <button class="tool-btn"
                            onclick="insertTable()"
                            title="Insert table">▦</button>

                    <button class="tool-btn"
                            onclick="insertHorizontalRule()"
                            title="Divider">―</button>

                    <label class="color-tool"
                           title="Text colour">
                        <span style="font-size:10px">A</span>
                        <input type="color"
                               value="#6750a4"
                               onchange="exec('foreColor',this.value)"
                               style="width:20px;height:15px;border:none;padding:0">
                    </label>

                    <label class="color-tool"
                           title="Highlight">
                        <span style="font-size:10px">🖍</span>
                        <input type="color"
                               value="#fff19c"
                               onchange="highlightText(this.value)"
                               style="width:20px;height:15px;border:none;padding:0">
                    </label>

                    <button class="tool-btn"
                            onclick="document.getElementById('imageFile').click()"
                            title="Insert image">🖼</button>

                    <button class="tool-btn"
                            onclick="clearFormatting()"
                            title="Clear formatting">Tx</button>

                </div>

                <!-- EDITABLE NOTE -->

                <div id="editor"
                     class="editor"
                     contenteditable="true"
                     spellcheck="true"
                     role="textbox"
                     aria-label="Note content"
                     aria-multiline="true"></div>

                <div class="editor-bottom">

                    <div>
                        <span id="bottomSaveStatus">All changes saved locally</span>
                    </div>

                    <div class="bottom-actions">

                        <button class="btn"
                                onclick="downloadText()">⬇ TXT</button>

                        <button class="btn"
                                onclick="exportCurrentPage()">⬇ HTML</button>

                        <button class="btn"
                                onclick="window.print()">🖨 Print</button>

                        <button class="btn"
                                onclick="duplicatePage()">⧉ Duplicate</button>

                        <button class="btn danger"
                                onclick="deleteCurrentPage()">🗑 Delete</button>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<div class="mobile-backdrop" onclick="closeMobilePanels()"></div>

<div class="toast" id="toast"></div>

<input type="file"
       id="importFile"
       accept=".json,application/json"
       hidden
       onchange="importBackup(event)">

<input type="file"
       id="imageFile"
       accept="image/*"
       hidden
       onchange="insertImage(event)">

<!-- GENERAL DIALOG -->

<dialog id="actionDialog">

    <h3 id="dialogTitle">Create new item</h3>

    <label id="dialogLabel" for="dialogInput">Name</label>

    <input id="dialogInput"
           class="dialog-input"
           type="text"
           maxlength="250"
           placeholder="Enter name">

    <div class="dialog-actions">

        <button class="btn"
                onclick="closeDialog()">Cancel</button>

        <button class="btn primary"
                onclick="confirmDialog()">Create</button>

    </div>

</dialog>

<script>
"use strict";

/* =========================================
   ONENOTE PRO APPLICATION ENGINE
========================================= */

const STORAGE_KEY = "onenote_pro_advanced_v1";

let db;
let currentNotebookId = null;
let currentSectionId = null;
let currentPageId = null;

let currentView = "all";
let searchQuery = "";
let dialogAction = null;
let saveTimer = null;
let isLoadingPage = false;

const $ = id => document.getElementById(id);

function uid() {
    return Date.now().toString(36) +
           Math.random().toString(36).slice(2, 10);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function makeDefaultDatabase() {
    const notebookId = uid();
    const sectionId = uid();
    const pageId = uid();
    const now = new Date().toISOString();

    return {
        version: 1,
        notebooks: [
            {
                id: notebookId,
                name: "My Notebook",
                collapsed: false,
                createdAt: now,
                sections: [
                    {
                        id: sectionId,
                        name: "General",
                        collapsed: false,
                        pages: [
                            {
                                id: pageId,
                                title: "Welcome to OneNote Pro",
                                content: `
                                    <h1>Welcome to OneNote Pro! 🎉</h1>
                                    <p>Your personal digital notebook is ready.</p>
                                    <h2>What can you do?</h2>
                                    <ul>
                                        <li>Create multiple notebooks and sections.</li>
                                        <li>Write formatted notes with headings and lists.</li>
                                        <li>Use checklists to track your tasks.</li>
                                        <li>Search your notes instantly.</li>
                                        <li>Export and import your notes as backups.</li>
                                    </ul>
                                    <blockquote>
                                        Great ideas deserve a well-organised home.
                                    </blockquote>
                                    <h2>Getting started</h2>
                                    <p>Click the title above to rename this page and start writing.</p>
                                `,
                                tag: "Getting Started",
                                favorite: true,
                                createdAt: now,
                                updatedAt: now
                            }
                        ]
                    }
                ]
            }
        ]
    };
}

/* =========================================
   DATA VALIDATION AND STORAGE
========================================= */

function normalizeDatabase(data) {
    if (!data || !Array.isArray(data.notebooks)) {
        throw new Error("Invalid notebook backup.");
    }

    const notebookIds = new Set();
    const sectionIds = new Set();
    const pageIds = new Set();

    for (const notebook of data.notebooks) {
        if (!notebook || typeof notebook.name !== "string" ||
            !Array.isArray(notebook.sections)) {
            throw new Error("Invalid notebook structure.");
        }

        notebook.id = String(notebook.id || uid());

        if (notebookIds.has(notebook.id)) {
            notebook.id = uid();
        }

        notebookIds.add(notebook.id);

        for (const section of notebook.sections) {
            if (!section || typeof section.name !== "string" ||
                !Array.isArray(section.pages)) {
                throw new Error("Invalid section structure.");
            }

            section.id = String(section.id || uid());

            if (sectionIds.has(section.id)) {
                section.id = uid();
            }

            sectionIds.add(section.id);

            for (const page of section.pages) {
                if (!page || typeof page.title !== "string") {
                    throw new Error("Invalid page structure.");
                }

                page.id = String(page.id || uid());

                if (pageIds.has(page.id)) {
                    page.id = uid();
                }

                pageIds.add(page.id);

                page.content = typeof page.content === "string"
                    ? page.content : "";

                page.tag = typeof page.tag === "string"
                    ? page.tag : "";

                page.favorite = Boolean(page.favorite);

                page.createdAt = page.createdAt ||
                    new Date().toISOString();

                page.updatedAt = page.updatedAt ||
                    page.createdAt;
            }
        }
    }

    data.version = 1;
    return data;
}

function loadDatabase() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (raw) {
            db = normalizeDatabase(JSON.parse(raw));
            return;
        }
    } catch (error) {
        console.error("Unable to load notes:", error);
    }

    db = makeDefaultDatabase();
    persistDatabase();
}

function persistDatabase() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

        $("saveStatus").textContent = "✓ Saved";
        $("bottomSaveStatus").textContent =
            "All changes saved locally";

        return true;

    } catch (error) {
        console.error(error);

        $("saveStatus").textContent = "Save failed";
        $("bottomSaveStatus").textContent =
            "Storage full or unavailable. Export a backup.";

        toast("Could not save. Export your notes to avoid losing changes.");
        return false;
    }
}

function scheduleSave() {
    $("saveStatus").textContent = "Saving...";
    $("bottomSaveStatus").textContent = "Saving changes...";

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
        saveCurrentPageToDatabase();
        persistDatabase();
        renderPageLists();
    }, 350);
}

function saveCurrentPageToDatabase() {
    if (isLoadingPage || !currentPageId) return;

    const page = getCurrentPage();
    if (!page) return;

    page.title = $("pageTitle").value.trim() || "Untitled Page";
    page.content = $("editor").innerHTML;
    page.tag = $("tagInput").value.trim();
    page.updatedAt = new Date().toISOString();
}

function flushSave() {
    clearTimeout(saveTimer);
    saveCurrentPageToDatabase();
    persistDatabase();
}

/* =========================================
   FIND NOTEBOOK / SECTION / PAGE
========================================= */

function getNotebook(id = currentNotebookId) {
    return db.notebooks.find(n => n.id === id) || null;
}

function getSection(id = currentSectionId) {
    for (const notebook of db.notebooks) {
        const section = notebook.sections.find(s => s.id === id);
        if (section) return section;
    }
    return null;
}

function getPageLocation(id = currentPageId) {
    for (const notebook of db.notebooks) {
        for (const section of notebook.sections) {
            const page = section.pages.find(p => p.id === id);

            if (page) {
                return { notebook, section, page };
            }
        }
    }
    return null;
}

function getCurrentPage() {
    const location = getPageLocation();
    return location ? location.page : null;
}

function allPages() {
    const result = [];

    for (const notebook of db.notebooks) {
        for (const section of notebook.sections) {
            for (const page of section.pages) {
                result.push({
                    notebook,
                    section,
                    page
                });
            }
        }
    }

    return result;
}

function firstAvailablePage() {
    for (const notebook of db.notebooks) {
        for (const section of notebook.sections) {
            if (section.pages.length) {
                return {
                    notebook,
                    section,
                    page: section.pages[0]
                };
            }
        }
    }

    return null;
}

/* =========================================
   NOTEBOOK TREE
========================================= */

function renderTree() {
    const root = $("notebookTree");
    root.innerHTML = "";

    if (!db.notebooks.length) {
        root.innerHTML =
            '<div class="empty-state">No notebooks yet.<br>Create one to begin.</div>';
        return;
    }

    for (const notebook of db.notebooks) {
        const notebookEl = document.createElement("div");
        notebookEl.className = "notebook";

        const head = document.createElement("div");
        head.className = "notebook-head";

        const arrow = document.createElement("span");
        arrow.textContent = notebook.collapsed ? "▸" : "▾";

        const icon = document.createElement("span");
        icon.textContent = "📚";

        const name = document.createElement("span");
        name.className = "nb-name";
        name.textContent = notebook.name;
        name.title = notebook.name;

        const addSectionButton = document.createElement("button");
        addSectionButton.className = "small-btn";
        addSectionButton.textContent = "+";
        addSectionButton.title = "Add section";

        addSectionButton.onclick = event => {
            event.stopPropagation();
            newSection(notebook.id);
        };

        head.append(arrow, icon, name, addSectionButton);

        head.onclick = () => {
            notebook.collapsed = !notebook.collapsed;
            currentNotebookId = notebook.id;
            currentView = "section";
            persistDatabase();
            renderTree();
            renderPageLists();
        };

        notebookEl.appendChild(head);

        if (!notebook.collapsed) {
            const sectionList = document.createElement("div");
            sectionList.className = "section-list";

            for (const section of notebook.sections) {
                const sectionWrap = document.createElement("div");

                const sectionEl = document.createElement("div");
                sectionEl.className =
                    "section-item" +
                    (section.id === currentSectionId ? " active" : "");

                const sectionIcon = document.createElement("span");
                sectionIcon.textContent = "📂";

                const sectionName = document.createElement("span");
                sectionName.textContent = section.name;
                sectionName.style.flex = "1";
                sectionName.style.overflow = "hidden";
                sectionName.style.textOverflow = "ellipsis";

                const sectionAdd = document.createElement("button");
                sectionAdd.className = "small-btn";
                sectionAdd.textContent = "+";
                sectionAdd.title = "Add page";

                sectionAdd.onclick = event => {
                    event.stopPropagation();
                    newPage(section.id);
                };

                sectionEl.append(sectionIcon, sectionName, sectionAdd);

                sectionEl.onclick = () => {
                    flushSave();
                    currentNotebookId = notebook.id;
                    currentSectionId = section.id;
                    currentView = "section";

                    if (section.pages.length) {
                        openPage(section.pages[0].id);
                    } else {
                        currentPageId = null;
                        renderTree();
                        renderPageLists();
                        renderEmptyEditor();
                    }
                };

                sectionWrap.appendChild(sectionEl);

                if (!section.collapsed) {
                    const pageList = document.createElement("div");
                    pageList.className = "page-list";

                    for (const page of section.pages) {
                        const pageEl = document.createElement("div");

                        pageEl.className =
                            "page-item" +
                            (page.id === currentPageId ? " active" : "");

                        const pageIcon = document.createElement("span");
                        pageIcon.textContent = page.favorite ? "⭐" : "📄";

                        const pageName = document.createElement("span");
                        pageName.className = "page-name";
                        pageName.textContent = page.title || "Untitled Page";

                        pageEl.append(pageIcon, pageName);

                        pageEl.onclick = () => openPage(page.id);

                        pageList.appendChild(pageEl);
                    }

                    sectionWrap.appendChild(pageList);
                }

                sectionList.appendChild(sectionWrap);
            }

            notebookEl.appendChild(sectionList);
        }

        root.appendChild(notebookEl);
    }
}

/* =========================================
   PAGE LIST PANEL
========================================= */

function renderPageLists() {
    const list = $("pageResults");
    list.innerHTML = "";

    const section = getSection();
    const notebook = getNotebook();

    if (currentView === "search") {
        $("sectionTitle").textContent = "Search Results";
        $("sectionSubtitle").textContent =
            searchQuery ? `Results for "${searchQuery}"` : "All pages";

    } else if (currentView === "favorites") {
        $("sectionTitle").textContent = "Favourites";
        $("sectionSubtitle").textContent = "Your starred notes";

    } else if (currentView === "all") {
        $("sectionTitle").textContent = "All Notes";
        $("sectionSubtitle").textContent = `${allPages().length} pages`;

    } else {
        $("sectionTitle").textContent =
            section ? section.name : "My Pages";

        $("sectionSubtitle").textContent =
            notebook ? notebook.name : "Organise your ideas";
    }

    let items = [];

    if (currentView === "search") {
        const query = searchQuery.toLowerCase();

        items = allPages().filter(item =>
            item.page.title.toLowerCase().includes(query) ||
            stripHTML(item.page.content).toLowerCase().includes(query) ||
            item.page.tag.toLowerCase().includes(query) ||
            item.section.name.toLowerCase().includes(query) ||
            item.notebook.name.toLowerCase().includes(query)
        );

    } else if (currentView === "favorites") {
        items = allPages().filter(item => item.page.favorite);

    } else if (currentView === "all") {
        items = allPages();

    } else {
        items = section
            ? section.pages.map(page => ({
                notebook: notebook,
                section: section,
                page: page
            }))
            : [];
    }

    items.sort((a, b) =>
        new Date(b.page.updatedAt) - new Date(a.page.updatedAt)
    );

    if (!items.length) {
        list.innerHTML =
            '<div class="empty-state">No pages found.<br>Create a new page to begin.</div>';
        return;
    }

    for (const item of items) {
        const card = document.createElement("div");

        card.className = "page-card" +
            (item.page.id === currentPageId ? " active" : "");

        const title = document.createElement("div");
        title.className = "page-card-title";

        const icon = document.createElement("span");
        icon.textContent = item.page.favorite ? "⭐" : "📄";

        const name = document.createElement("span");
        name.textContent = item.page.title || "Untitled Page";

        title.append(icon, name);

        const preview = document.createElement("div");
        preview.className = "page-card-preview";

        const contentPreview = stripHTML(item.page.content);
        preview.textContent =
            contentPreview || "No content yet...";

        const time = document.createElement("div");
        time.className = "page-card-time";
        time.textContent = formatDate(item.page.updatedAt);

        card.append(title, preview, time);

        card.onclick = () => {
            openPage(item.page.id);
            closeMobilePanels();
        };

        list.appendChild(card);
    }
}

/* =========================================
   PAGE EDITOR
========================================= */

function openPage(pageId) {
    flushSave();

    const location = getPageLocation(pageId);

    if (!location) return;

    currentNotebookId = location.notebook.id;
    currentSectionId = location.section.id;
    currentPageId = location.page.id;

    currentView = "section";
    searchQuery = "";

    $("searchInput").value = "";

    isLoadingPage = true;

    $("pageTitle").value = location.page.title || "";
    $("editor").innerHTML = sanitizeNoteHTML(location.page.content);
    $("tagInput").value = location.page.tag || "";

    $("createdTime").textContent =
        "Edited " + formatDate(location.page.updatedAt);

    $("favoriteButton").textContent =
        location.page.favorite ? "★ Favourited" : "☆ Favourite";

    $("breadcrumb").textContent =
        location.notebook.name + " / " +
        location.section.name + " / " +
        (location.page.title || "Untitled Page");

    $("saveStatus").textContent = "✓ Saved";
    $("bottomSaveStatus").textContent = "All changes saved locally";

    isLoadingPage = false;

    updateWordCount();
    renderTree();
    renderPageLists();

    $("editorArea").scrollTop = 0;
}

function renderEmptyEditor() {
    isLoadingPage = true;

    $("pageTitle").value = "";
    $("editor").innerHTML = "";
    $("tagInput").value = "";

    $("breadcrumb").textContent = "No page selected";
    $("createdTime").textContent = "Create a new page";
    $("favoriteButton").textContent = "☆ Favourite";

    $("saveStatus").textContent = "Ready";
    $("bottomSaveStatus").textContent = "Create a page to begin";

    isLoadingPage = false;
    updateWordCount();
}

function updateWordCount() {
    const text = $("editor").innerText.trim();
    const words = text ? text.split(/\s+/).length : 0;
    const chars = text.length;

    $("wordCount").textContent =
        `${words} words · ${chars} characters`;
}

function stripHTML(html) {
    const element = document.createElement("div");
    element.innerHTML = html || "";
    return element.innerText || element.textContent || "";
}

function formatDate(value) {
    if (!value) return "Just now";

    const date = new Date(value);

    if (isNaN(date.getTime())) return "Just now";

    return date.toLocaleString(undefined, {
        day: "numeric",
        month: "short",
        hour: "2-digit",
        minute: "2-digit"
    });
}

/* =========================================
   CREATE NOTEBOOKS / SECTIONS / PAGES
========================================= */

function openNameDialog(title, label, action) {
    dialogAction = action;

    $("dialogTitle").textContent = title;
    $("dialogLabel").textContent = label;
    $("dialogInput").value = "";

    $("actionDialog").showModal();

    setTimeout(() => $("dialogInput").focus(), 50);
}

function closeDialog() {
    $("actionDialog").close();
    dialogAction = null;
}

function confirmDialog() {
    const name = $("dialogInput").value.trim();

    if (!name) {
        toast("Please enter a name.");
        $("dialogInput").focus();
        return;
    }

    if (dialogAction) {
        const action = dialogAction;
        closeDialog();
        action(name);
    }
}

$("dialogInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        event.preventDefault();
        confirmDialog();
    }
});

function newNotebook() {
    openNameDialog(
        "Create Notebook",
        "Notebook name",
        name => {
            flushSave();

            const notebook = {
                id: uid(),
                name,
                collapsed: false,
                createdAt: new Date().toISOString(),
                sections: []
            };

            db.notebooks.push(notebook);

            currentNotebookId = notebook.id;
            currentSectionId = null;
            currentPageId = null;
            currentView = "section";

            persistDatabase();
            renderTree();
            renderPageLists();
            renderEmptyEditor();

            newSection(notebook.id);
        }
    );
}

function newSection(notebookId = currentNotebookId) {
    const notebook = getNotebook(notebookId);

    if (!notebook) {
        toast("Create a notebook first.");
        return;
    }

    openNameDialog(
        "Create Section",
        "Section name",
        name => {
            flushSave();

            const section = {
                id: uid(),
                name,
                collapsed: false,
                pages: []
            };

            notebook.sections.push(section);

            currentNotebookId = notebook.id;
            currentSectionId = section.id;
            currentPageId = null;
            currentView = "section";

            persistDatabase();
            renderTree();
            renderPageLists();
            renderEmptyEditor();

            newPage(section.id);
        }
    );
}

function newPage(sectionId = currentSectionId) {
    let section = getSection(sectionId);

    if (!section) {
        const notebook = getNotebook();

        if (!notebook) {
            toast("Create a notebook first.");
            return;
        }

        if (!notebook.sections.length) {
            newSection(notebook.id);
            return;
        }

        section = notebook.sections[0];
        currentNotebookId = notebook.id;
        currentSectionId = section.id;
    }

    openNameDialog(
        "Create Page",
        "Page title",
        name => {
            flushSave();

            const page = {
                id: uid(),
                title: name,
                content: "",
                tag: "",
                favorite: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            section.pages.unshift(page);

            currentPageId = page.id;
            currentView = "section";

            persistDatabase();
            renderTree();
            renderPageLists();
            openPage(page.id);
            closeMobilePanels();
        }
    );
}

/* =========================================
   EDITOR TOOLS
========================================= */

function exec(command, value = null) {
    $("editor").focus();

    try {
        document.execCommand(command, false, value);
    } catch (error) {
        console.error(error);
    }

    scheduleSave();
}

function formatBlock(tag) {
    if (!tag) return;

    $("editor").focus();

    document.execCommand("formatBlock", false, tag);

    scheduleSave();
}

function highlightText(color) {
    $("editor").focus();

    let success = false;

    try {
        success = document.execCommand(
            "hiliteColor", false, color
        );
    } catch (error) {
        console.error(error);
    }

    if (!success) {
        document.execCommand("backColor", false, color);
    }

    scheduleSave();
}

function clearFormatting() {
    $("editor").focus();

    document.execCommand("removeFormat", false, null);

    scheduleSave();
}

function insertChecklist() {
    $("editor").focus();

    const row = document.createElement("div");
    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";

    row.appendChild(checkbox);
    row.appendChild(document.createTextNode(" New task"));

    $("editor").appendChild(row);

    const br = document.createElement("br");
    $("editor").appendChild(br);

    scheduleSave();
}

function insertLink() {
    const url = prompt("Enter a web address (https://...)");

    if (!url) return;

    let parsed;

    try {
        parsed = new URL(url);
    } catch {
        toast("Please enter a valid web address.");
        return;
    }

    if (!["http:", "https:", "mailto:"].includes(parsed.protocol)) {
        toast("Only web links and email links are supported.");
        return;
    }

    $("editor").focus();

    document.execCommand("createLink", false, parsed.href);

    scheduleSave();
}

function insertHorizontalRule() {
    $("editor").focus();

    document.execCommand("insertHorizontalRule", false, null);

    scheduleSave();
}

function insertTable() {
    const rows = Number(prompt("Number of rows (1–20)", "3"));
    const cols = Number(prompt("Number of columns (1–10)", "3"));

    if (!Number.isInteger(rows) || !Number.isInteger(cols) ||
        rows < 1 || rows > 20 || cols < 1 || cols > 10) {
        toast("Enter valid table dimensions.");
        return;
    }

    const table = document.createElement("table");
    const tbody = document.createElement("tbody");

    for (let r = 0; r < rows; r++) {
        const tr = document.createElement("tr");

        for (let c = 0; c < cols; c++) {
            const cell = document.createElement(r === 0 ? "th" : "td");
            cell.textContent = r === 0 ? `Heading ${c + 1}` : "";
            tr.appendChild(cell);
        }

        tbody.appendChild(tr);
    }

    table.appendChild(tbody);

    $("editor").focus();
    $("editor").appendChild(table);
    $("editor").appendChild(document.createElement("p"));

    scheduleSave();
}

function insertImage(event) {
    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        toast("Please select an image.");
        event.target.value = "";
        return;
    }

    if (file.size > 1.5 * 1024 * 1024) {
        toast("Image is too large. Choose an image below 1.5 MB.");
        event.target.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        const img = document.createElement("img");

        img.src = reader.result;
        img.alt = file.name;

        $("editor").focus();
        $("editor").appendChild(img);
        $("editor").appendChild(document.createElement("p"));

        scheduleSave();
        event.target.value = "";
    };

    reader.readAsDataURL(file);
}

/* =========================================
   AUTOMATIC EDITOR SAVE
========================================= */

$("pageTitle").addEventListener("input", () => {
    scheduleSave();

    const location = getPageLocation();

    if (location) {
        $("breadcrumb").textContent =
            location.notebook.name + " / " +
            location.section.name + " / " +
            ($("pageTitle").value || "Untitled Page");
    }
});

$("editor").addEventListener("input", () => {
    updateWordCount();
    scheduleSave();
});

$("tagInput").addEventListener("input", scheduleSave);

$("editor").addEventListener("click", event => {
    if (event.target.matches('input[type="checkbox"]')) {
        scheduleSave();
    }
});

/* =========================================
   FAVOURITES
========================================= */

function toggleFavorite() {
    const page = getCurrentPage();

    if (!page) {
        toast("Select a page first.");
        return;
    }

    page.favorite = !page.favorite;

    $("favoriteButton").textContent =
        page.favorite ? "★ Favourited" : "☆ Favourite";

    persistDatabase();
    renderTree();
    renderPageLists();

    toast(page.favorite
        ? "Added to favourites."
        : "Removed from favourites.");
}

/* =========================================
   SEARCH AND FILTERS
========================================= */

function searchNotes(value) {
    flushSave();

    searchQuery = value.trim();

    if (searchQuery) {
        currentView = "search";
    } else {
        currentView = "all";
    }

    setActiveNavigation();
    renderPageLists();
}

function showAllNotes() {
    flushSave();

    currentView = "all";
    searchQuery = "";

    $("searchInput").value = "";

    setActiveNavigation();
    renderPageLists();
}

function showFavorites() {
    flushSave();

    currentView = "favorites";
    searchQuery = "";

    $("searchInput").value = "";

    setActiveNavigation();
    renderPageLists();
}

function setActiveNavigation() {
    $("navAll").classList.toggle(
        "active", currentView === "all"
    );

    $("navFavorites").classList.toggle(
        "active", currentView === "favorites"
    );
}

/* =========================================
   DUPLICATE AND DELETE
========================================= */

function duplicatePage() {
    flushSave();

    const location = getPageLocation();

    if (!location) {
        toast("Select a page first.");
        return;
    }

    const copy = JSON.parse(JSON.stringify(location.page));

    copy.id = uid();
    copy.title = (copy.title || "Untitled Page") + " (Copy)";
    copy.favorite = false;
    copy.createdAt = new Date().toISOString();
    copy.updatedAt = new Date().toISOString();

    const index = location.section.pages.findIndex(
        p => p.id === location.page.id
    );

    location.section.pages.splice(index + 1, 0, copy);

    persistDatabase();
    openPage(copy.id);

    toast("Page duplicated.");
}

function deleteCurrentPage() {
    const location = getPageLocation();

    if (!location) {
        toast("No page selected.");
        return;
    }

    if (!confirm(
        `Delete "${location.page.title}"?\n\nThis action cannot be undone.`
    )) {
        return;
    }

    clearTimeout(saveTimer);

    location.section.pages =
        location.section.pages.filter(
            p => p.id !== location.page.id
        );

    currentNotebookId = location.notebook.id;
    currentSectionId = location.section.id;

    const nextPage = location.section.pages[0];

    if (nextPage) {
        currentPageId = nextPage.id;
    } else {
        currentPageId = null;
    }

    persistDatabase();
    renderTree();
    renderPageLists();

    if (nextPage) {
        openPage(nextPage.id);
    } else {
        renderEmptyEditor();
    }

    toast("Page deleted.");
}

/* =========================================
   DOWNLOAD / EXPORT
========================================= */

function downloadBlob(filename, content, type) {
    const blob = new Blob([content], { type });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFilename(name) {
    return (name || "note")
        .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
        .slice(0, 100);
}

function downloadText() {
    flushSave();

    const page = getCurrentPage();

    if (!page) {
        toast("Select a page first.");
        return;
    }

    const text =
        page.title + "\n" +
        "=".repeat(Math.min(page.title.length, 60)) +
        "\n\n" +
        stripHTML(page.content) +
        "\n\nTag: " + page.tag;

    downloadBlob(
        safeFilename(page.title) + ".txt",
        text,
        "text/plain;charset=utf-8"
    );

    toast("Text file downloaded.");
}

function exportCurrentPage() {
    flushSave();

    const page = getCurrentPage();

    if (!page) {
        toast("Select a page first.");
        return;
    }

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHTML(page.title)}</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;
margin:40px auto;padding:20px;line-height:1.8;color:#222}
img{max-width:100%;height:auto}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ccc;padding:8px}
</style>
</head>
<body>
<h1>${escapeHTML(page.title)}</h1>
<p><small>Tag: ${escapeHTML(page.tag)}</small></p>
<article>${sanitizeNoteHTML(page.content)}</article>
</body>
</html>`;

    downloadBlob(
        safeFilename(page.title) + ".html",
        html,
        "text/html;charset=utf-8"
    );

    toast("HTML file downloaded.");
}

function exportBackup() {
    flushSave();

    const json = JSON.stringify(db, null, 2);

    downloadBlob(
        "OneNotePro-Backup-" +
        new Date().toISOString().slice(0, 10) +
        ".json",
        json,
        "application/json;charset=utf-8"
    );

    toast("Backup exported successfully.");
}

/* =========================================
   IMPORT BACKUP
========================================= */

function importBackup(event) {
    const file = event.target.files[0];

    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
        toast("Backup is too large. Maximum size is 20 MB.");
        event.target.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        try {
            const imported = normalizeDatabase(
                JSON.parse(reader.result)
            );

            if (!confirm(
                "Importing this backup will replace the notes currently stored in this browser. Continue?"
            )) {
                event.target.value = "";
                return;
            }

            flushSave();

            db = imported;

            const first = firstAvailablePage();

            currentNotebookId = first ? first.notebook.id : null;
            currentSectionId = first ? first.section.id : null;
            currentPageId = first ? first.page.id : null;

            currentView = "all";

            persistDatabase();
            renderTree();
            renderPageLists();

            if (first) {
                openPage(first.page.id);
            } else {
                renderEmptyEditor();
            }

            toast("Backup imported successfully.");

        } catch (error) {
            console.error(error);
            toast("Invalid or damaged backup file.");
        }

        event.target.value = "";
    };

    reader.onerror = () => {
        toast("Unable to read this file.");
        event.target.value = "";
    };

    reader.readAsText(file);
}

/* =========================================
   BASIC HTML SANITIZATION
========================================= */

/*
  This editor stores rich HTML. Content imported from backups
  must be restricted to a safe subset before being displayed.
*/

function sanitizeNoteHTML(html) {
    const template = document.createElement("template");
    template.innerHTML = html || "";

    const allowedTags = new Set([
        "P", "DIV", "BR",
        "H1", "H2", "H3", "H4",
        "B", "STRONG", "I", "EM",
        "U", "S", "STRIKE",
        "UL", "OL", "LI",
        "BLOCKQUOTE", "PRE", "CODE",
        "A", "IMG", "HR",
        "TABLE", "THEAD", "TBODY",
        "TR", "TD", "TH",
        "SPAN", "SUB", "SUP",
        "INPUT"
    ]);

    const allowedStyles = new Set([
        "color",
        "background-color",
        "font-weight",
        "font-style",
        "text-decoration",
        "text-align",
        "font-family"
    ]);

    const elements = [
        ...template.content.querySelectorAll("*")
    ];

    for (const element of elements) {
        if (!element.parentNode) continue;

        if (!allowedTags.has(element.tagName)) {
            element.replaceWith(
                document.createTextNode(element.textContent || "")
            );
            continue;
        }

        for (const attr of [...element.attributes]) {
            const name = attr.name.toLowerCase();
            const value = attr.value;

            if (name.startsWith("on") ||
                name === "srcdoc" ||
                name === "contenteditable") {
                element.removeAttribute(attr.name);
                continue;
            }

            if (name === "style") {
                const declarations = [];

                for (const rule of value.split(";")) {
                    const index = rule.indexOf(":");
                    if (index < 1) continue;

                    const property = rule.slice(0, index)
                        .trim().toLowerCase();

                    const val = rule.slice(index + 1).trim();

                    if (allowedStyles.has(property) &&
                        !/url\s*\(|expression\s*\(|javascript:/i.test(val)) {
                        declarations.push(property + ":" + val);
                    }
                }

                if (declarations.length) {
                    element.setAttribute("style", declarations.join(";"));
                } else {
                    element.removeAttribute("style");
                }

                continue;
            }

            if (name === "href" && element.tagName === "A") {
                try {
                    const url = new URL(value, location.href);

                    if (!["http:", "https:", "mailto:"].includes(url.protocol)) {
                        element.removeAttribute("href");
                    } else {
                        element.setAttribute("href", url.href);
                        element.setAttribute("rel", "noopener noreferrer");
                    }
                } catch {
                    element.removeAttribute("href");
                }

                continue;
            }

            if (name === "src" && element.tagName === "IMG") {
                const safeImage =
                    /^data:image\/(?:png|jpeg|gif|webp|avif);base64,/i.test(value) ||
                    /^blob:/i.test(value) ||
                    /^https?:\/\//i.test(value);

                if (!safeImage) {
                    element.removeAttribute("src");
                }

                continue;
            }

            if (element.tagName === "INPUT" &&
                ["type", "checked", "disabled"].includes(name)) {
                if (name === "type" && value !== "checkbox") {
                    element.removeAttribute(name);
                }

                continue;
            }

            if (name === "alt" && element.tagName === "IMG") {
                continue;
            }

            if (name === "colspan" || name === "rowspan") {
                if (/^\d{1,2}$/.test(value)) continue;
            }

            element.removeAttribute(attr.name);
        }

        if (element.tagName === "INPUT") {
            element.setAttribute("type", "checkbox");
        }
    }

    return template.innerHTML;
}

/* =========================================
   THEME
========================================= */

function toggleTheme() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");

    localStorage.setItem("onenote_pro_theme", dark ? "dark" : "light");

    toast(dark ? "Dark mode enabled." : "Light mode enabled.");
}

function loadTheme() {
    const theme = localStorage.getItem("onenote_pro_theme");

    if (theme === "dark") {
        document.body.classList.add("dark");
    }
}

/* =========================================
   MOBILE NAVIGATION
========================================= */

function toggleSidebar() {
    const sidebarOpen =
        document.body.classList.contains("show-sidebar");

    closeMobilePanels();

    document.body.classList.toggle("show-sidebar", !sidebarOpen);
}

function closeMobilePanels() {
    document.body.classList.remove("show-sidebar");
    document.body.classList.remove("show-pages");
}

/* =========================================
   NOTIFICATIONS
========================================= */

let toastTimer;

function toast(message) {
    const element = $("toast");

    element.textContent = message;
    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        element.classList.remove("show");
    }, 2600);
}

/* =========================================
   KEYBOARD SHORTCUTS
========================================= */

document.addEventListener("keydown", event => {
    const modifier = event.ctrlKey || event.metaKey;

    if (modifier && event.key.toLowerCase() === "s") {
        event.preventDefault();
        flushSave();
        toast("Notes saved.");
    }

    if (modifier && event.key.toLowerCase() === "n") {
        event.preventDefault();
        newPage();
    }

    if (modifier && event.key.toLowerCase() === "f") {
        event.preventDefault();
        $("searchInput").focus();
        $("searchInput").select();
    }

    if (event.key === "Escape") {
        closeMobilePanels();
    }
});

/* =========================================
   INITIALIZE APP
========================================= */

function initializeApp() {
    loadTheme();
    loadDatabase();

    const first = firstAvailablePage();

    if (first) {
        currentNotebookId = first.notebook.id;
        currentSectionId = first.section.id;
        currentPageId = first.page.id;
    } else if (db.notebooks.length) {
        currentNotebookId = db.notebooks[0].id;

        if (db.notebooks[0].sections.length) {
            currentSectionId = db.notebooks[0].sections[0].id;
        }
    }

    renderTree();
    renderPageLists();

    if (first) {
        openPage(first.page.id);
    } else {
        renderEmptyEditor();
    }

    setActiveNavigation();
}

window.addEventListener("beforeunload", () => {
    clearTimeout(saveTimer);
    saveCurrentPageToDatabase();
    persistDatabase();
});

initializeApp();

</script>
