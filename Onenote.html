<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>OneNote Infinity Pro - Infinite Workspace</title>

<style>
:root {
  --primary: #4f46e5;
  --primary-light: #eef2ff;
  --background: #f4f6fc;
  --panel: #ffffff;
  --text: #20243a;
  --muted: #7b8298;
  --border: #dfe4ef;
  --shadow: 0 4px 18px rgba(25, 35, 70, .12);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
  background: var(--background);
  color: var(--text);
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  padding: 9px 12px;
}

button:hover {
  background: var(--primary-light);
}

button.primary {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

button.danger {
  color: #dc2626;
}

.topbar {
  height: 58px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  white-space: nowrap;
  position: relative;
  z-index: 100;
}

.brand {
  font-size: 15px;
  font-weight: 800;
  margin-right: 8px;
}

.brand span {
  color: var(--primary);
}

#saveState {
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}

.workspace-shell {
  position: relative;
  width: 100%;
  height: calc(100dvh - 58px);
  overflow: hidden;
}

#viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background-color: #f8f9ff;
  background-image: radial-gradient(#cbd3e9 1px, transparent 1px);
  background-size: 22px 22px;
  touch-action: none;
  cursor: grab;
}

#viewport.panning {
  cursor: grabbing;
}

#world {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 1px;
  transform-origin: 0 0;
}

/* All workspace objects use world coordinates. */

.workspace-object {
  position: absolute;
  user-select: none;
  touch-action: none;
}

.text-panel {
  width: 320px;
  min-width: 180px;
  min-height: 145px;
  background: var(--panel);
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.text-panel.selected,
.image-panel.selected,
.pdf-panel.selected {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.object-header {
  min-height: 38px;
  padding: 5px 7px;
  display: flex;
  align-items: center;
  gap: 5px;
  background: #f8faff;
  border-bottom: 1px solid var(--border);
  cursor: grab;
  touch-action: none;
}

.object-header:active {
  cursor: grabbing;
}

.object-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: bold;
  color: #38415c;
}

.object-header button {
  padding: 5px 7px;
  font-size: 12px;
}

.text-editor {
  min-height: 100px;
  padding: 13px;
  outline: none;
  overflow-wrap: anywhere;
  line-height: 1.65;
  font-size: 15px;
  user-select: text;
  -webkit-user-select: text;
  touch-action: auto;
}

.text-editor:empty::before {
  content: "Write your notes here...";
  color: #a0a7ba;
}

.text-editor img {
  max-width: 100%;
  height: auto;
}

.text-editor table {
  border-collapse: collapse;
  width: 100%;
}

.text-editor td,
.text-editor th {
  border: 1px solid var(--border);
  padding: 5px;
}

.object-tools {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 5px;
  background: #fafbff;
  border-top: 1px solid var(--border);
}

.object-tools button {
  font-size: 11px;
  padding: 5px 7px;
}

.resize-handle {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 22px;
  height: 22px;
  background: var(--primary);
  border-radius: 8px 0 8px 0;
  cursor: nwse-resize;
  touch-action: none;
}

.resize-handle::after {
  content: "↘";
  color: white;
  font-size: 14px;
  position: absolute;
  left: 5px;
  top: 2px;
}

/* IMAGE */

.image-panel {
  min-width: 120px;
  min-height: 100px;
  width: 300px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.image-panel img {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
}

.image-caption {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 0;
  border-top: 1px solid var(--border);
  padding: 8px;
  color: #20243a;
  background: white;
}

/* PDF */

.pdf-panel {
  width: 620px;
  height: 720px;
  min-width: 260px;
  min-height: 250px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pdf-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: #e8eaf0;
  padding: 10px;
  touch-action: pan-x pan-y;
}

.pdf-page {
  position: relative;
  width: max-content;
  max-width: 100%;
  background: white;
  margin: 0 auto 12px;
  box-shadow: 0 2px 8px #0002;
}

.pdf-page canvas {
  display: block;
  max-width: 100%;
  height: auto;
}

.pdf-overlay {
  position: absolute;
  left: 0;
  top: 0;
  max-width: none !important;
  touch-action: none;
}

.pdf-status {
  font-size: 11px;
  color: var(--muted);
  padding: 6px 9px;
  border-top: 1px solid var(--border);
}

.pdf-tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px;
  background: #fafbff;
  border-bottom: 1px solid var(--border);
}

.pdf-tools button {
  padding: 5px 7px;
  font-size: 11px;
}

.pdf-tools input[type=color] {
  width: 34px;
  height: 30px;
  padding: 2px;
}

.pdf-empty {
  text-align: center;
  padding: 35px 15px;
  color: #647087;
}

/* FLOATING HELP */

.help {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 20;
  max-width: 92%;
  padding: 9px 12px;
  background: #ffffffed;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 11px;
  color: #47516c;
  pointer-events: none;
}

.zoom-tools {
  position: absolute;
  bottom: 12px;
  right: 12px;
  z-index: 20;
  display: flex;
  gap: 5px;
}

.toast {
  position: fixed;
  z-index: 500;
  bottom: 65px;
  left: 50%;
  transform: translateX(-50%);
  background: #20243a;
  color: white;
  padding: 12px 16px;
  border-radius: 9px;
  max-width: 90%;
  display: none;
  font-size: 13px;
}

.toast.show {
  display: block;
}

.hidden {
  display: none !important;
}

@media(max-width:760px) {
  .topbar {
    height: 56px;
    padding: 4px;
    gap: 4px;
  }

  .workspace-shell {
    height: calc(100dvh - 56px);
  }

  .brand {
    font-size: 13px;
  }

  .topbar button {
    padding: 7px 8px;
    font-size: 12px;
  }

  .text-panel {
    width: 280px;
  }

  .pdf-panel {
    width: 340px;
    height: 600px;
  }

  .image-panel {
    width: 250px;
  }

  .help {
    font-size: 10px;
    bottom: 60px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">OneNote <span>Infinity Pro</span></div>

  <button class="primary" id="addTextBtn">＋ Text</button>
  <button id="addImageBtn">🖼 Photo</button>
  <button id="addPdfBtn">📄 PDF</button>
  <button id="saveBtn">💾 Save</button>
  <button id="backupBtn">⬇ Backup</button>
  <button id="restoreBtn">📂 Open</button>
  <button id="zoomOutBtn">−</button>
  <button id="zoomInBtn">＋</button>
  <button id="fitBtn">Fit</button>

  <span id="saveState">Ready</span>
</header>

<div class="workspace-shell">
  <div id="viewport">
    <div id="world"></div>
  </div>

  <div class="help">
    Tap empty space to create a text panel · Drag panel headers to move · Pinch to zoom
  </div>

  <div class="zoom-tools">
    <button id="resetBtn">100%</button>
  </div>
</div>

<input id="imageInput" type="file" accept="image/*" hidden>
<input id="pdfInput" type="file" accept=".pdf,application/pdf" hidden>
<input id="backupInput" type="file" accept=".json,application/json" hidden>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";

/* =====================================================
   ONE NOTE INFINITY PRO
   Single shared infinite workspace.
===================================================== */

const DB_KEY = "onenote_infinity_workspace_v1";

const $ = id => document.getElementById(id);

const uid = () =>
  crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);

const viewport = $("viewport");
const world = $("world");

let db = {
  version: 1,
  objects: []
};

let camera = {
  x: 250,
  y: 160,
  scale: 1
};

let selectedObjectId = null;
let saveTimer = null;

let activeDrag = null;
let activeResize = null;

const pointers = new Map();

let panGesture = null;
let pinchGesture = null;

let drawEnabled = false;

let pdfLibraryReady = false;

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  pdfLibraryReady = true;
}

/* ------------------------------
   TOAST
------------------------------ */

function toast(message) {
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    el.classList.remove("show");
  }, 2800);
}

/* ------------------------------
   DATABASE
------------------------------ */

function safeStore() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));

    $("saveState").textContent = "✓ Saved";

    return true;
  } catch (error) {
    console.error(error);

    $("saveState").textContent = "Storage full";

    toast(
      "Storage full. Download a backup or use smaller images."
    );

    return false;
  }
}

function scheduleSave() {
  $("saveState").textContent = "Saving...";

  clearTimeout(saveTimer);

  saveTimer = setTimeout(() => {
    safeStore();
  }, 350);
}

function loadDatabase() {
  try {
    const raw = localStorage.getItem(DB_KEY);

    if (raw) {
      const parsed = JSON.parse(raw);

      if (
        parsed &&
        Array.isArray(parsed.objects)
      ) {
        db = parsed;
      }
    }
  } catch (error) {
    console.error(error);
    toast("Saved workspace could not be read.");
  }
}

/* ------------------------------
   WORLD CAMERA
------------------------------ */

function updateCamera() {
  world.style.transform =
    `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;

  $("resetBtn").textContent =
    Math.round(camera.scale * 100) + "%";
}

function screenToWorld(clientX, clientY) {
  const rect = viewport.getBoundingClientRect();

  return {
    x: (clientX - rect.left - camera.x) / camera.scale,
    y: (clientY - rect.top - camera.y) / camera.scale
  };
}

function worldToScreen(x, y) {
  return {
    x: x * camera.scale + camera.x,
    y: y * camera.scale + camera.y
  };
}

function zoomAt(newScale, clientX, clientY) {
  const rect = viewport.getBoundingClientRect();

  const px = clientX - rect.left;
  const py = clientY - rect.top;

  const wx = (px - camera.x) / camera.scale;
  const wy = (py - camera.y) / camera.scale;

  camera.scale = Math.max(0.2, Math.min(3, newScale));

  camera.x = px - wx * camera.scale;
  camera.y = py - wy * camera.scale;

  updateCamera();
}

function resetZoom() {
  camera.scale = 1;
  updateCamera();
}

function fitWorkspace() {
  if (!db.objects.length) {
    camera = {
      x: viewport.clientWidth / 2,
      y: viewport.clientHeight / 2,
      scale: 1
    };

    updateCamera();

    return;
  }

  const minX = Math.min(...db.objects.map(o => o.x));
  const minY = Math.min(...db.objects.map(o => o.y));

  const maxX = Math.max(...db.objects.map(o =>
    o.x + (o.width || 300)
  ));

  const maxY = Math.max(...db.objects.map(o =>
    o.y + (o.height || 200)
  ));

  const width = Math.max(1, maxX - minX);
  const height = Math.max(1, maxY - minY);

  camera.scale = Math.max(
    0.2,
    Math.min(
      1.2,
      (viewport.clientWidth - 50) / width,
      (viewport.clientHeight - 50) / height
    )
  );

  camera.x =
    (viewport.clientWidth - width * camera.scale) / 2 -
    minX * camera.scale;

  camera.y =
    (viewport.clientHeight - height * camera.scale) / 2 -
    minY * camera.scale;

  updateCamera();
}

/* ------------------------------
   CREATE OBJECTS
------------------------------ */

function makeObject(type, x, y, extra = {}) {
  return {
    id: uid(),
    type,
    x,
    y,
    width: extra.width || 320,
    height: extra.height || 200,
    title: extra.title || "",
    content: extra.content || "",
    data: extra.data || null,
    fileName: extra.fileName || "",
    annotations: extra.annotations || {},
    createdAt: new Date().toISOString()
  };
}

function createTextPanel(x, y, focus = true) {
  const object = makeObject("text", x, y, {
    title: "Notes",
    width: 320,
    height: 200,
    content: ""
  });

  db.objects.push(object);

  renderObject(object);

  selectObject(object.id);

  scheduleSave();

  if (focus) {
    setTimeout(() => {
      const editor = document.querySelector(
        `[data-id="${object.id}"] .text-editor`
      );

      if (editor) editor.focus();
    }, 50);
  }

  return object;
}

function createImagePanel(dataUrl, fileName, x, y) {
  const object = makeObject("image", x, y, {
    title: fileName || "Image",
    width: 300,
    height: 220,
    data: dataUrl,
    fileName
  });

  db.objects.push(object);

  renderObject(object);

  selectObject(object.id);

  scheduleSave();

  return object;
}

function createPdfPanel(fileName, x, y) {
  const object = makeObject("pdf", x, y, {
    title: fileName || "PDF Document",
    width: 620,
    height: 720,
    fileName,
    annotations: {}
  });

  db.objects.push(object);

  renderObject(object);

  selectObject(object.id);

  scheduleSave();

  return object;
}

function selectObject(id) {
  selectedObjectId = id;

  document.querySelectorAll(".workspace-object").forEach(el => {
    el.classList.toggle(
      "selected",
      el.dataset.id === id
    );
  });
}

function getObject(id) {
  return db.objects.find(o => o.id === id);
}

/* ------------------------------
   RENDER OBJECT
------------------------------ */

function renderObject(object) {
  const old = world.querySelector(
    `[data-id="${object.id}"]`
  );

  if (old) old.remove();

  let element;

  if (object.type === "text") {
    element = renderTextPanel(object);
  } else if (object.type === "image") {
    element = renderImagePanel(object);
  } else if (object.type === "pdf") {
    element = renderPdfPanel(object);
  }

  if (!element) return;

  element.classList.add("workspace-object");

  element.dataset.id = object.id;

  element.style.left = object.x + "px";
  element.style.top = object.y + "px";
  element.style.width = object.width + "px";

  if (object.height) {
    element.style.height = object.height + "px";
  }

  world.appendChild(element);

  selectObject(object.id);
}

function makeHeader(object, title) {
  const header = document.createElement("div");

  header.className = "object-header";

  const label = document.createElement("span");

  label.className = "object-name";
  label.textContent = title || "Untitled";

  const rename = document.createElement("button");

  rename.textContent = "✏";
  rename.title = "Rename panel";

  rename.addEventListener("pointerdown", e => {
    e.stopPropagation();
  });

  rename.onclick = () => {
    const name = prompt("Panel name", object.title || "");

    if (name !== null) {
      object.title = name.trim() || "Untitled";
      renderObject(object);
      scheduleSave();
    }
  };

  const remove = document.createElement("button");

  remove.textContent = "×";
  remove.title = "Delete panel";
  remove.className = "danger";

  remove.addEventListener("pointerdown", e => {
    e.stopPropagation();
  });

  remove.onclick = () => {
    if (!confirm("Delete this panel?")) return;

    db.objects = db.objects.filter(o => o.id !== object.id);

    const el = world.querySelector(
      `[data-id="${object.id}"]`
    );

    if (el) el.remove();

    selectedObjectId = null;

    safeStore();
  };

  header.append(label, rename, remove);

  header.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;

    event.preventDefault();
    event.stopPropagation();

    selectObject(object.id);

    activeDrag = {
      id: object.id,
      startX: event.clientX,
      startY: event.clientY,
      originalX: object.x,
      originalY: object.y
    };

    header.setPointerCapture(event.pointerId);
  });

  header.addEventListener("pointermove", event => {
    if (!activeDrag || activeDrag.id !== object.id) return;

    const dx =
      (event.clientX - activeDrag.startX) / camera.scale;

    const dy =
      (event.clientY - activeDrag.startY) / camera.scale;

    object.x = activeDrag.originalX + dx;
    object.y = activeDrag.originalY + dy;

    const el = world.querySelector(
      `[data-id="${object.id}"]`
    );

    if (el) {
      el.style.left = object.x + "px";
      el.style.top = object.y + "px";
    }
  });

  function finishDrag() {
    if (activeDrag && activeDrag.id === object.id) {
      activeDrag = null;
      scheduleSave();
    }
  }

  header.addEventListener("pointerup", finishDrag);
  header.addEventListener("pointercancel", finishDrag);

  return header;
}

function addResizeHandle(element, object) {
  const handle = document.createElement("div");

  handle.className = "resize-handle";

  handle.addEventListener("pointerdown", event => {
    event.preventDefault();
    event.stopPropagation();

    activeResize = {
      id: object.id,
      startX: event.clientX,
      startY: event.clientY,
      width: object.width,
      height: object.height
    };

    handle.setPointerCapture(event.pointerId);
  });

  handle.addEventListener("pointermove", event => {
    if (!activeResize || activeResize.id !== object.id) return;

    const dx =
      (event.clientX - activeResize.startX) / camera.scale;

    const dy =
      (event.clientY - activeResize.startY) / camera.scale;

    object.width = Math.max(180, activeResize.width + dx);
    object.height = Math.max(120, activeResize.height + dy);

    element.style.width = object.width + "px";
    element.style.height = object.height + "px";

    if (object.type === "pdf") {
      const body = element.querySelector(".pdf-body");

      if (body) body.dataset.needsResize = "1";
    }
  });

  function finishResize() {
    if (activeResize && activeResize.id === object.id) {
      activeResize = null;
      scheduleSave();
    }
  }

  handle.addEventListener("pointerup", finishResize);
  handle.addEventListener("pointercancel", finishResize);

  element.appendChild(handle);
}

/* ------------------------------
   TEXT PANELS
------------------------------ */

function renderTextPanel(object) {
  const panel = document.createElement("div");

  panel.className = "text-panel";

  const header = makeHeader(object, object.title);

  const editor = document.createElement("div");

  editor.className = "text-editor";
  editor.contentEditable = "true";
  editor.spellcheck = true;
  editor.innerHTML = sanitizeHTML(object.content || "");

  editor.addEventListener("input", () => {
    object.content = editor.innerHTML;
    scheduleSave();
  });

  editor.addEventListener("pointerdown", e => {
    e.stopPropagation();
    selectObject(object.id);
  });

  const tools = document.createElement("div");

  tools.className = "object-tools";

  const formats = [
    ["B", "bold"],
    ["I", "italic"],
    ["U", "underline"],
    ["H1", "h1"],
    ["• List", "insertUnorderedList"]
  ];

  formats.forEach(([label, command]) => {
    const button = document.createElement("button");

    button.textContent = label;

    button.onpointerdown = e => e.preventDefault();

    button.onclick = () => {
      editor.focus();

      if (command === "h1") {
        document.execCommand("formatBlock", false, "h1");
      } else {
        document.execCommand(command, false, null);
      }

      object.content = editor.innerHTML;

      scheduleSave();
    };

    tools.appendChild(button);
  });

  panel.append(header, editor, tools);

  addResizeHandle(panel, object);

  return panel;
}

/* ------------------------------
   IMAGE PANELS
------------------------------ */

function renderImagePanel(object) {
  const panel = document.createElement("div");

  panel.className = "image-panel";

  const header = makeHeader(object, object.title);

  const img = document.createElement("img");

  img.src = object.data || "";
  img.alt = object.fileName || "Workspace image";

  const caption = document.createElement("input");

  caption.className = "image-caption";
  caption.placeholder = "Write a caption...";
  caption.value = object.content || "";

  caption.addEventListener("input", () => {
    object.content = caption.value;
    scheduleSave();
  });

  panel.append(header, img, caption);

  addResizeHandle(panel, object);

  return panel;
}

/* ------------------------------
   PDF PANELS
------------------------------ */

function renderPdfPanel(object) {
  const panel = document.createElement("div");

  panel.className = "pdf-panel";

  const header = makeHeader(object, object.title);

  const tools = document.createElement("div");

  tools.className = "pdf-tools";

  const reopen = document.createElement("button");

  reopen.textContent = "📂 Reopen PDF";

  reopen.onclick = () => {
    pendingPdfObjectId = object.id;
    $("pdfInput").click();
  };

  const print = document.createElement("button");

  print.textContent = "🖨 Print";

  print.onclick = () => printPdfPanel(object.id);

  const note = document.createElement("button");

  note.textContent = "＋ Notes Beside";

  note.onclick = () => {
    createTextPanel(object.x + object.width + 30, object.y);
  };

  const marker = document.createElement("button");

  marker.textContent = "🖍 Highlight";

  marker.onclick = () => {
    drawEnabled = !drawEnabled;

    marker.textContent =
      drawEnabled ? "🖍 Highlight ON" : "🖍 Highlight";

    const body = panel.querySelector(".pdf-body");

    body.querySelectorAll(".pdf-overlay").forEach(c => {
      c.style.pointerEvents = drawEnabled ? "auto" : "none";
    });
  };

  const color = document.createElement("input");

  color.type = "color";
  color.value = "#fff000";
  color.title = "Highlighter color";

  const size = document.createElement("input");

  size.type = "range";
  size.min = "4";
  size.max = "40";
  size.value = "18";
  size.title = "Highlighter size";

  tools.append(reopen, print, note, marker, color, size);

  const body = document.createElement("div");

  body.className = "pdf-body";

  const status = document.createElement("div");

  status.className = "pdf-status";
  status.textContent = object.fileName
    ? object.fileName + " — reopen the PDF to view it"
    : "Choose a PDF file";

  panel.append(header, tools, body, status);

  addResizeHandle(panel, object);

  if (object.fileName) {
    const choose = document.createElement("div");

    choose.className = "pdf-empty";

    choose.innerHTML =
      "<p>PDF reference saved.</p><p>Reopen the original file to display it.</p>";

    const btn = document.createElement("button");

    btn.textContent = "Open PDF";
    btn.className = "primary";

    btn.onclick = () => {
      pendingPdfObjectId = object.id;
      $("pdfInput").click();
    };

    choose.appendChild(btn);
    body.appendChild(choose);
  } else {
    const choose = document.createElement("div");

    choose.className = "pdf-empty";

    choose.innerHTML =
      "<p>Insert a PDF directly into your workspace.</p>";

    const btn = document.createElement("button");

    btn.className = "primary";
    btn.textContent = "Choose PDF";

    btn.onclick = () => {
      pendingPdfObjectId = object.id;
      $("pdfInput").click();
    };

    choose.appendChild(btn);
    body.appendChild(choose);
  }

  return panel;
}

let pendingPdfObjectId = null;

/* ------------------------------
   PDF LOADING AND HIGHLIGHTING
------------------------------ */

$("pdfInput").addEventListener("change", async event => {
  const file = event.target.files[0];

  if (!file) return;

  if (!pdfLibraryReady) {
    toast("PDF library unavailable. Check your internet connection.");
    event.target.value = "";
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    toast("Please use a PDF under 20 MB.");
    event.target.value = "";
    return;
  }

  try {
    const bytes = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: new Uint8Array(bytes.slice(0))
    }).promise;

    let object = getObject(pendingPdfObjectId);

    if (!object || object.type !== "pdf") {
      const center = screenToWorld(
        viewport.getBoundingClientRect().left +
          viewport.clientWidth / 2,
        viewport.getBoundingClientRect().top +
          viewport.clientHeight / 2
      );

      object = createPdfPanel(file.name, center.x, center.y);
    }

    object.title = file.name;
    object.fileName = file.name;

    /*
      PDF bytes are stored as Base64 in the workspace database.
      This works for small files, but browser storage limits still apply.
    */

    object.data = await fileToBase64(file);

    object.content = "";

    object.annotations = object.annotations || {};

    renderObject(object);

    const panel = world.querySelector(
      `[data-id="${object.id}"]`
    );

    if (panel) {
      await renderPdfIntoPanel(panel, object, pdf);
    }

    safeStore();

    toast("PDF inserted into the workspace.");

  } catch (error) {
    console.error(error);

    toast("PDF could not be opened.");
  }

  pendingPdfObjectId = null;

  event.target.value = "";
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const result = String(reader.result);
      resolve(result);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

async function renderPdfIntoPanel(panel, object, pdf) {
  const body = panel.querySelector(".pdf-body");

  body.replaceChildren();

  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);

    const availableWidth = Math.max(
      200,
      body.clientWidth - 25
    );

    const scale = Math.min(
      1.3,
      availableWidth / page.view[2]
    );

    const pdfViewport = page.getViewport({ scale });

    const wrap = document.createElement("div");

    wrap.className = "pdf-page";
    wrap.style.width = pdfViewport.width + "px";

    const canvas = document.createElement("canvas");

    canvas.width = Math.ceil(pdfViewport.width);
    canvas.height = Math.ceil(pdfViewport.height);

    canvas.style.width = pdfViewport.width + "px";
    canvas.style.height = pdfViewport.height + "px";

    const overlay = document.createElement("canvas");

    overlay.className = "pdf-overlay";

    overlay.width = canvas.width;
    overlay.height = canvas.height;

    overlay.style.width = pdfViewport.width + "px";
    overlay.style.height = pdfViewport.height + "px";

    wrap.append(canvas, overlay);

    body.appendChild(wrap);

    await page.render({
      canvasContext: canvas.getContext("2d"),
      viewport: pdfViewport
    }).promise;

    const entry = {
      pageNumber: n,
      canvas,
      overlay,
      context: overlay.getContext("2d"),
      object
    };

    attachPdfMarker(entry, panel);

    redrawPdfMarks(entry);
  }

  const status = panel.querySelector(".pdf-status");

  if (status) {
    status.textContent =
      object.fileName + " · " + pdf.numPages + " pages";
  }
}

function attachPdfMarker(entry, panel) {
  const canvas = entry.overlay;

  canvas.style.pointerEvents = drawEnabled ? "auto" : "none";

  const colorInput = panel.querySelector('input[type="color"]');
  const sizeInput = panel.querySelector('input[type="range"]');

  let drawing = false;

  function pos(event) {
    const r = canvas.getBoundingClientRect();

    return {
      x: (event.clientX - r.left) * canvas.width / r.width,
      y: (event.clientY - r.top) * canvas.height / r.height
    };
  }

  canvas.addEventListener("pointerdown", event => {
    if (!drawEnabled) return;

    event.preventDefault();

    drawing = true;

    canvas.setPointerCapture(event.pointerId);

    const point = pos(event);

    const mark = {
      color: colorInput.value,
      size: Number(sizeInput.value),
      points: [point]
    };

    entry.object.annotations[entry.pageNumber] =
      entry.object.annotations[entry.pageNumber] || [];

    entry.object.annotations[entry.pageNumber].push(mark);

    paintPdfSegment(entry, mark, point, point);

    scheduleSave();
  });

  canvas.addEventListener("pointermove", event => {
    if (!drawing || !drawEnabled) return;

    event.preventDefault();

    const list =
      entry.object.annotations[entry.pageNumber] || [];

    const mark = list[list.length - 1];

    if (!mark) return;

    const point = pos(event);

    const previous = mark.points[mark.points.length - 1];

    mark.points.push(point);

    paintPdfSegment(entry, mark, previous, point);

    scheduleSave();
  });

  canvas.addEventListener("pointerup", () => {
    drawing = false;
  });

  canvas.addEventListener("pointercancel", () => {
    drawing = false;
  });
}

function paintPdfSegment(entry, mark, a, b) {
  const ctx = entry.context;

  ctx.save();

  ctx.globalAlpha = 0.38;
  ctx.strokeStyle = mark.color;
  ctx.lineWidth = mark.size;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();

  ctx.restore();
}

function redrawPdfMarks(entry) {
  const ctx = entry.context;

  ctx.clearRect(
    0,
    0,
    entry.overlay.width,
    entry.overlay.height
  );

  const marks =
    entry.object.annotations[entry.pageNumber] || [];

  marks.forEach(mark => {
    for (let i = 0; i < mark.points.length; i++) {
      const a = mark.points[i];
      const b = mark.points[i + 1] || a;

      paintPdfSegment(entry, mark, a, b);
    }
  });
}

function printPdfPanel(id) {
  const panel = world.querySelector(`[data-id="${id}"]`);

  if (!panel) return;

  const canvases = panel.querySelectorAll(".pdf-page");

  if (!canvases.length) {
    toast("Open the PDF first.");
    return;
  }

  const w = window.open("", "_blank");

  if (!w) {
    toast("Allow pop-ups to print.");
    return;
  }

  const images = [...canvases].map(page => {
    const base = page.querySelector("canvas:not(.pdf-overlay)");
    const overlay = page.querySelector(".pdf-overlay");

    const merged = document.createElement("canvas");

    merged.width = base.width;
    merged.height = base.height;

    const ctx = merged.getContext("2d");

    ctx.drawImage(base, 0, 0);

    if (overlay) {
      ctx.drawImage(overlay, 0, 0);
    }

    return merged.toDataURL("image/png");
  });

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Print PDF</title>
      <style>
        @page { margin: 0; }
        body { margin: 0; }
        img {
          display: block;
          width: 100%;
          page-break-after: always;
        }
      </style>
    </head>
    <body>
      ${images.map(src => `<img src="${src}">`).join("")}
      <script>
        window.onload = () => setTimeout(() => window.print(), 500);
      <\/script>
    </body>
    </html>
  `);

  w.document.close();
}

/* ------------------------------
   ADD IMAGE
------------------------------ */

$("imageInput").addEventListener("change", event => {
  const file = event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    toast("Choose an image.");
    event.target.value = "";
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    toast("Please use an image under 2 MB.");
    event.target.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const center = screenToWorld(
      viewport.getBoundingClientRect().left +
        viewport.clientWidth / 2,
      viewport.getBoundingClientRect().top +
        viewport.clientHeight / 2
    );

    createImagePanel(
      reader.result,
      file.name,
      center.x,
      center.y
    );

    toast("Image inserted.");
  };

  reader.readAsDataURL(file);

  event.target.value = "";
});

/* ------------------------------
   EMPTY SPACE: CREATE TEXT PANEL
------------------------------ */

viewport.addEventListener("dblclick", event => {
  if (event.target.closest(".workspace-object")) return;

  const point = screenToWorld(
    event.clientX,
    event.clientY
  );

  createTextPanel(point.x, point.y);
});

/*
  Mobile double-tap support.
  A single touch on the workspace pans the canvas.
  Double-tap on empty space creates a text panel.
*/

let lastTap = 0;

viewport.addEventListener("pointerup", event => {
  if (event.pointerType !== "touch") return;

  if (event.target.closest(".workspace-object")) return;

  const now = Date.now();

  if (now - lastTap < 350) {
    const point = screenToWorld(
      event.clientX,
      event.clientY
    );

    createTextPanel(point.x, point.y);

    lastTap = 0;
  } else {
    lastTap = now;
  }
});

/* ------------------------------
   PAN / PINCH ZOOM
------------------------------ */

viewport.addEventListener("pointerdown", event => {
  if (event.target.closest(".workspace-object")) return;

  viewport.setPointerCapture(event.pointerId);

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 1) {
    panGesture = {
      x: event.clientX,
      y: event.clientY,
      cameraX: camera.x,
      cameraY: camera.y
    };
  }

  if (pointers.size === 2) {
    const points = [...pointers.values()];

    pinchGesture = {
      distance: Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
      ),
      scale: camera.scale
    };

    panGesture = null;
  }
});

viewport.addEventListener("pointermove", event => {
  if (!pointers.has(event.pointerId)) return;

  pointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (pointers.size === 2 && pinchGesture) {
    const points = [...pointers.values()];

    const distance = Math.hypot(
      points[0].x - points[1].x,
      points[0].y - points[1].y
    );

    zoomAt(
      pinchGesture.scale * distance / pinchGesture.distance,
      (points[0].x + points[1].x) / 2,
      (points[0].y + points[1].y) / 2
    );
  } else if (panGesture) {
    camera.x =
      panGesture.cameraX + event.clientX - panGesture.x;

    camera.y =
      panGesture.cameraY + event.clientY - panGesture.y;

    updateCamera();
  }
});

function releasePointer(event) {
  pointers.delete(event.pointerId);

  if (pointers.size === 0) {
    panGesture = null;
    pinchGesture = null;
  } else if (pointers.size === 1) {
    const point = [...pointers.values()][0];

    panGesture = {
      x: point.x,
      y: point.y,
      cameraX: camera.x,
      cameraY: camera.y
    };

    pinchGesture = null;
  }
}

viewport.addEventListener("pointerup", releasePointer);
viewport.addEventListener("pointercancel", releasePointer);

viewport.addEventListener("wheel", event => {
  event.preventDefault();

  zoomAt(
    camera.scale * (event.deltaY < 0 ? 1.1 : 0.9),
    event.clientX,
    event.clientY
  );
}, { passive: false });

------------------------------ */

$("addTextBtn").onclick = () => {

$("saveBtn").onclick = () => {

};

$("restoreBtn").onclick = () => $("backupInput").click();

$("zoomInBtn").onclick = () => {

    viewport.getBoundingClientRect().left + viewport.clientWidth / 2,
    viewport.getBoundingClientRect().top + viewport.clientHeight / 2
  );

$("zoomOutBtn").onclick = () => {
  zoomAt(
    camera.scale / 1.2,
    viewport.getBoundingClientRect().left + viewport.clientWidth / 2,
    viewport.getBoundingClientRect().top + viewport.clientHeight / 2
  );
};

$("resetBtn").onclick = resetZoom;
$("fitBtn").onclick = fitWorkspace;

/* ------------------------------
   BACKUP
------------------------------ */

function downloadBackup() {
  const ok = safeStore();

  const blob = new Blob(
    [JSON.stringify(db, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = "OneNote-Infinity-Workspace.json";

  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 2000);

  toast(ok
    ? "Backup downloaded."
    : "Backup download started. Browser storage is full."
  );
}

$("backupInput").addEventListener("change", async event => {
  const file = event.target.files[0];

  if (!file) return;

  try {
    if (file.size > 40 * 1024 * 1024) {
      throw new Error("File too large");
    }

    const imported = JSON.parse(await file.text());

    if (!imported || !Array.isArray(imported.objects)) {
      throw new Error("Invalid backup");
    }

    if (!confirm("Replace your current workspace with this backup?")) {
      return;
    }

    db = imported;

    safeStore();

    renderAll();

    toast("Workspace restored.");
  } catch (error) {
    console.error(error);

    toast("Invalid backup file.");
  }

  event.target.value = "";
});

/* ------------------------------
   HTML SANITIZATION
------------------------------ */

function sanitizeHTML(html) {
  const template = document.createElement("template");

  template.innerHTML = html;

  const allowed = new Set([
    "P", "DIV", "BR", "H1", "H2", "H3",
    "B", "STRONG", "I", "EM", "U", "S",
    "UL", "OL", "LI", "BLOCKQUOTE",
    "PRE", "CODE", "A", "IMG", "HR",
    "TABLE", "TBODY", "THEAD", "TR",
    "TD", "TH", "SPAN"
  ]);

  template.content.querySelectorAll("*").forEach(element => {
    if (!allowed.has(element.tagName)) {
      element.replaceWith(
        document.createTextNode(element.textContent || "")
      );

      return;
    }

    [...element.attributes].forEach(attribute => {
      const name = attribute.name.toLowerCase();
      const value = attribute.value;

      if (name.startsWith("on") || name === "srcdoc") {
        element.removeAttribute(attribute.name);
      } else if (
        name === "href" &&
        element.tagName === "A"
      ) {
        try {
          const url = new URL(value, location.href);

          if (!["http:", "https:", "mailto:"].includes(url.protocol)) {
            element.removeAttribute("href");
          }
        } catch {
          element.removeAttribute("href");
        }
      } else if (
        name === "src" &&
        element.tagName === "IMG"
      ) {
        if (!/^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(value)) {
          element.removeAttribute("src");
        }
      } else if (
        !["href", "src", "alt", "style", "colspan", "rowspan"].includes(name)
      ) {
        element.removeAttribute(attribute.name);
      }
    });
  });

  return template.innerHTML;
}

/* ------------------------------
   RENDER ALL SAVED OBJECTS
------------------------------ */

function renderAll() {
  world.replaceChildren();

  db.objects.forEach(object => {
    renderObject(object);
  });

  updateCamera();
}

/* ------------------------------
   AUTOSAVE ON PAGE LEAVE
------------------------------ */

document.addEventListener("visibilitychange", () => {
  if (document.hidden) safeStore();
});

window.addEventListener("pagehide", safeStore);

window.addEventListener("beforeunload", safeStore);

/* ------------------------------
   STARTUP
------------------------------ */

function initialize() {
  loadDatabase();

  renderAll();

  if (db.objects.length === 0) {
    createTextPanel(0, 0, false);

    const object = db.objects[0];

    object.title = "Welcome";

    object.content =
      "<h2>Welcome to OneNote Infinity Pro</h2>" +
      "<p>Double-tap or double-click on empty space to create a text panel.</p>" +
      "<p>Use the toolbar to insert PDF documents and photos.</p>";

    renderObject(object);

    safeStore();
  }

  camera.x = 100;
  camera.y = 80;

  updateCamera();
}

initialize();
</script>
